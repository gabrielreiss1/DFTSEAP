/* ============================================================
   Módulo alocação — onde lotar as vagas do concurso
   ============================================================ */
function telaPlanoAlocacao() {
  const s = st();
  const c = Plano.config(s);
  subnavPlano('alocacao');
  const escopo = escopoAtual(s);
  const sim = Plano.simular(s, escopo, c);
  const plano = Plano.planoConcurso(s, escopo, c, sim);
  const aloc = Plano.alocar(s, escopo, plano, sim);
  const todas = aloc.anos.flatMap(a => a.alocacoes);

  // a recomendação segue o GAP DE PRODUTIVIDADE da unidade: un/h atual × un/h alvo
  const porLinha = new Map(sim.linhas.map(l => [l.unidadeId + ':' + l.cargoId, l]));
  const porUnidade = new Map();
  todas.forEach(al => {
    const k = al.unidadeId + ':' + al.cargoId;
    const l = porLinha.get(k);
    const r = porUnidade.get(k) || {
      unidade: al.unidade, cargoId: al.cargoId, vagas: 0, gapAntes: al.gapAntes, custo: 0,
      prodAtual: l ? (l.prodAtualPlano != null ? l.prodAtualPlano : l.prodAtual) : null,
      prodAlvo: l ? (l.prodAlvoPlano != null ? l.prodAlvoPlano : l.prodAlvo) : null
    };
    r.vagas += al.vagas; r.custo += al.custoFolhaAnual;
    r.gapAntes = Math.max(r.gapAntes, al.gapAntes);
    porUnidade.set(k, r);
  });
  const linhas = [...porUnidade.values()].sort((a, b) => b.vagas - a.vagas);
  const fmtProd = v => v == null ? '—' : fmtN(v, v < 1 ? 2 : 1);

  app().innerHTML = `
  ${cabecalhoPagina('Módulo alocação',
    'Lotação sugerida para cada vaga do concurso, conforme o <strong>gap de produtividade</strong> de cada unidade. ' +
    tipInfo('O gap de pessoas É o gap de produtividade — a relação é exata: necessários ÷ atuais = un/h ATUAL ÷ un/h ALVO. Uma unidade que entrega ACIMA do ritmo de referência do cargo está absorvendo a demanda com gente demais na conta de cada hora: é ela que precisa de vaga. A cada vaga o sistema procura a unidade com o MAIOR gap remanescente daquele cargo, lota ali e recalcula. Só entram unidades com dimensionamento concluído.'),
    null, 'Plano de Adequação')}
  ${barraEscopo(s)}
  <div class="banner ok" style="margin-bottom:16px">
    <strong>Critério da recomendação:</strong> o ritmo <strong>atual</strong> de entrega da unidade (un/h efetiva)
    comparado ao ritmo <strong>alvo</strong> do cargo — a referência do método de dimensionamento, já com o ganho de
    produtividade do plano. Quem entrega acima do alvo está sobrecarregado e entra na frente da fila. A relação é exata:
    <span class="mono">necessários ÷ atuais = un/h atual ÷ un/h alvo</span>.
  </div>
  <div class="kpi-grid">
    <div class="kpi"><span class="kpi-ico">${ICO('pessoas')}</span>
      <span><span class="kpi-valor">${fmtN(plano.totais.vagas)}</span>
      <span class="kpi-rotulo">Vagas a lotar</span>
      <span class="kpi-sub">certame de ${plano.anoEdital} · nomeações ${plano.anosNomeacao[0]}–${plano.anosNomeacao[plano.anosNomeacao.length - 1]}</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('predio')}</span>
      <span><span class="kpi-valor">${fmtN(new Set(todas.map(a => a.unidadeId)).size)}</span>
      <span class="kpi-rotulo">Unidades atendidas</span>
      <span class="kpi-sub">de ${fmtN(new Set(sim.linhas.map(l => l.unidadeId)).size)} dimensionadas no escopo</span></span></div>
    <div class="kpi kpi-verde"><span class="kpi-ico">${ICO('grafico')}</span>
      <span><span class="kpi-valor">${fmtN(Calc.sum(linhas.map(l => Math.min(l.vagas, Math.max(0, l.gapAntes)))), 1)}</span>
      <span class="kpi-rotulo">Gap coberto</span>
      <span class="kpi-sub">déficit residual absorvido pelas vagas</span></span></div>
    <div class="kpi kpi-alerta"><span class="kpi-ico">${ICO('dinheiro')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(Calc.sum(linhas.map(l => l.custo)))}</span>
      <span class="kpi-rotulo">Folha anual das lotações</span>
      <span class="kpi-sub">13 folhas · plano completo</span></span></div>
  </div>
  <div class="card card-larga">
    <h3 class="card-titulo">Unidades que mais recebem vagas</h3>
    <div id="al-gr"></div>
  </div>
  <div class="card card-larga">
    <h3 class="card-titulo">Lotação sugerida por unidade e cargo ${tipInfo('un/h = unidades entregues por hora efetiva de trabalho (já descontado o ITP). O ALVO é a produtividade de referência do método de dimensionamento da unidade — comparação entre pares, esforço por entrega ou direcionador histórico —, com o ganho de produtividade do plano já aplicado. O ATUAL é a demanda mensal dividida pela capacidade efetiva do quadro de hoje.')}</h3>
    ${linhas.length ? `<div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>Órgão</th><th>Unidade</th><th>Cargo</th>
        <th class="num">un/h atual</th><th class="num">un/h alvo</th><th class="num">Ritmo vs alvo</th>
        <th class="num">Gap de pessoas</th><th class="num">Vagas</th>
        <th class="num">Gap depois</th><th class="num">Folha anual</th><th>Nomeações</th></tr></thead>
      <tbody>${linhas.map(l => {
        const anos = todas.filter(a => a.unidadeId === l.unidade.id && a.cargoId === l.cargoId)
          .map(a => `${a.ano}${a.vagas > 1 ? ` (${a.vagas})` : ''}`).join(', ');
        const depois = l.gapAntes - l.vagas;
        const gapProd = l.prodAtual && l.prodAlvo ? (l.prodAtual / l.prodAlvo - 1) * 100 : null;
        return `<tr>
          <td>${E(l.unidade.orgao)}</td>
          <td><strong>${E(l.unidade.sigla)}</strong> <span class="muted mini">${E(l.unidade.nome)}</span></td>
          <td>${E(nomeCargo(l.cargoId))}</td>
          <td class="num mono">${fmtProd(l.prodAtual)}</td>
          <td class="num mono">${fmtProd(l.prodAlvo)}</td>
          <td class="num mono ${gapProd != null && gapProd > 0 ? 'neg' : 'pos'}"
            title="${gapProd == null ? '' : gapProd > 0 ? 'entrega acima do ritmo de referência — sobrecarga' : 'entrega abaixo do ritmo de referência — folga'}">${gapProd == null ? '—' : (gapProd >= 0 ? '+' : '') + fmtN(gapProd, 0) + '%'}</td>
          <td class="num mono neg">${fmtN(Math.max(0, l.gapAntes), 1)}</td>
          <td class="num mono"><strong>${fmtN(l.vagas)}</strong></td>
          <td class="num mono ${depois > 0.05 ? 'neg' : 'pos'}">${fmtN(depois, 1)}</td>
          <td class="num mono">${fmtBRLcomp(l.custo)}</td>
          <td class="mono mini">${E(anos)}</td></tr>`;
      }).join('')}</tbody></table></div>
      <p class="muted mini" style="margin-top:10px"><strong>Ritmo acima do alvo (+)</strong> = a equipe entrega mais
      por hora efetiva do que a referência do cargo — está sobrecarregada e precisa de gente para voltar ao ritmo padrão.
      <strong>Abaixo do alvo (−)</strong> = há folga. É esse gap que ordena a fila das vagas: quanto maior a sobrecarga,
      antes a unidade é atendida.</p>`
      : '<p class="vazio">Sem vagas a alocar: ajuste o teto, a cobertura-alvo ou o escopo no módulo concurso.</p>'}
  </div>`;

  ligaBarraEscopo(s, telaPlanoAlocacao);

  // o gráfico agrega por UNIDADE (a abertura por cargo fica na tabela abaixo)
  const porUni = new Map();
  linhas.forEach(l => {
    const r = porUni.get(l.unidade.id) ||
      { unidade: l.unidade, vagas: 0, cargos: [], prodAtual: l.prodAtual, prodAlvo: l.prodAlvo };
    r.vagas += l.vagas; r.cargos.push(`${nomeCargo(l.cargoId)} (${l.vagas})`);
    porUni.set(l.unidade.id, r);
  });
  const top = [...porUni.values()].sort((a, b) => b.vagas - a.vagas).slice(0, 12);
  if (top.length) {
    Charts.barH(document.getElementById('al-gr'), {
      categorias: top.map(r => ({
        label: `${r.unidade.orgao}/${r.unidade.sigla}`, valor: r.vagas,
        sub: r.cargos.join(' · ') + (r.prodAtual && r.prodAlvo
          ? ` · un/h ${fmtProd(r.prodAtual)} vs alvo ${fmtProd(r.prodAlvo)}` : '')
      })),
      fmt: v => Charts.fmtBR(v, 0), unidadeY: 'vagas'
    });
  } else {
    document.getElementById('al-gr').innerHTML = '<p class="vazio">Nada a exibir.</p>';
  }
}


/* ===== painel.js ===== */
/* ============================================================
   DFT — Painel Visual · Estado do Paraná
   Leitura executiva do Estado: onde falta gente, onde se perde
   gente (absenteísmo e cessão), quanto custa a folha paga sem
   entrega correspondente e quanto custa, ano a ano, o plano de
   adequação.
   ============================================================ */

const PAINEL_TOP = 10;

/* ---------- Natureza da ausência (nomes formais usados em todo o sistema) ----------
   A separação existe porque só metade da conta é decisão de gestão: licença é direito,
   falta injustificada é comportamento. Misturar as duas produz meta impossível de bater. */
const NATUREZA_AUSENCIA = {
  total: {
    curto: 'Total', nome: 'Absenteísmo total', cor: '#1360d8',
    desc: 'todas as ausências do período, amparadas ou não.',
    dica: 'Soma das duas naturezas. Serve para dimensionar a capacidade real (é o que entra no ITP), mas não serve como meta de gestão — parte dela é direito do servidor.'
  },
  amparada: {
    curto: 'Amparado', nome: 'Absenteísmo amparado', cor: '#4a3aa7',
    desc: 'ausências com respaldo legal — licenças, afastamentos e concessões previstos em lei ou no estatuto.',
    dica: 'Ausência legalmente amparada: licença para tratamento de saúde, licença-maternidade/paternidade, licença especial, licença por motivo de doença em pessoa da família, convocações legais e demais concessões previstas no Estatuto. É DIREITO do servidor — a chefia não decide sobre ela e não cabe cobrar redução. Entra no dimensionamento como capacidade que simplesmente não existe.'
  },
  gerenciavel: {
    curto: 'Gerenciável', nome: 'Absenteísmo gerenciável', cor: '#e34948',
    desc: 'faltas e atrasos sem amparo legal — a parcela sobre a qual a gestão pode atuar.',
    dica: 'Ausência injustificada: faltas e atrasos sem amparo legal ou sem justificativa aceita. É a ÚNICA parcela sobre a qual a gestão pode efetivamente atuar — e, portanto, a única que faz sentido virar meta. No sistema real a classificação vem do código da ocorrência do relatório Meta4 "19 - Relatório de Ocorrência de Frequência".'
  }
};
const NATUREZAS = ['total', 'amparada', 'gerenciavel'];

function telaPainel() {
  const s = st();
  const p = perfilAtual();
  const ano = s.anoReferencia;
  const pendentes = (s.solicitacoes || []).filter(x => x.status === 'pendente').length;
  setSubnav('Visão geral', [
    { id: 'geral', rotulo: 'Dashboard executivo', ico: 'grafico', hash: '#/inicio' },
    { id: 'painel', rotulo: 'Painel Visual — Estado do Paraná', ico: 'predio', ativo: true, hash: '#/painel' },
    { id: 'otimizacao', rotulo: 'Oportunidades de otimização', ico: 'robo', hash: '#/cargos/otimizacao' },
    ...(p.id === 'seap' ? [{ id: 'aut', rotulo: 'Autorizações', ico: 'docok', hash: '#/autorizacoes', badge: pendentes || null }] : []),
    { id: 'rel', rotulo: 'Relatórios', ico: 'relatorios', desabilitado: true }
  ]);

  const permitidas = new Set(escopoUnidades(s, p).map(u => u.id));
  const escopo = { nivel: 'estado', orgao: p.orgao || null, unidadeId: p.unidadeId || null, cargoId: '', permitidas };
  const unidades = Plano.unidadesEscopo(s, escopo);
  const idsEscopo = new Set(unidades.map(u => u.id));
  const orgaosEscopo = [...new Set(unidades.map(u => u.orgao))];
  const unidadesDoOrgao = o => unidades.filter(u => u.orgao === o).map(u => u.id);
  const ativos = s.servidores.filter(x => idsEscopo.has(x.unidadeId) && !Calc.cedido(x));
  const dims = Plano.linhasBase(s).filter(x => idsEscopo.has(x.unidadeId));

  /* ---------- 1 e 2 · necessidade (déficit) por cargo e por secretaria ---------- */
  const deficitPorCargo = new Map();
  const deficitPorOrgao = new Map();
  dims.forEach(x => {
    const def = Math.max(0, -x.d.saldo);
    const rc = deficitPorCargo.get(x.cargoId) || { deficit: 0, nec: 0, atuais: 0 };
    rc.deficit += def; rc.nec += x.d.necessarios; rc.atuais += x.d.atuais;
    deficitPorCargo.set(x.cargoId, rc);
    const ro = deficitPorOrgao.get(x.unidade.orgao) || { deficit: 0, nec: 0, atuais: 0, unidades: new Set() };
    ro.deficit += def; ro.nec += x.d.necessarios; ro.atuais += x.d.atuais; ro.unidades.add(x.unidadeId);
    deficitPorOrgao.set(x.unidade.orgao, ro);
  });
  // cobertura = necessidade efetivamente atendida (o superávit de uma unidade
  // não cobre a falta de outra) — mesma métrica do módulo concurso
  const cob = r => r.nec > 0 ? fmtN((r.nec - r.deficit) / r.nec * 100, 0) + '%' : '—';
  const rkCargoNec = [...deficitPorCargo.entries()]
    .map(([cId, r]) => ({ label: nomeCargo(cId), valor: r.deficit, sub: `cobertura ${cob(r)}` }))
    .filter(x => x.valor > 0.05).sort((a, b) => b.valor - a.valor).slice(0, PAINEL_TOP);
  const rkOrgaoNec = [...deficitPorOrgao.entries()]
    .map(([o, r]) => ({ label: o, valor: r.deficit, sub: `${r.unidades.size} unidade(s) · cobertura ${cob(r)}` }))
    .filter(x => x.valor > 0.05).sort((a, b) => b.valor - a.valor).slice(0, PAINEL_TOP);

  /* ---------- 3 · cedidos em exercício por secretaria ---------- */
  const porOrgaoPessoal = orgaosEscopo.map(o => {
    const ids = new Set(unidadesDoOrgao(o));
    const doOrgao = s.servidores.filter(x => ids.has(x.unidadeId));
    const ativosO = doOrgao.filter(x => !Calc.cedido(x));
    return {
      orgao: o, quadro: ativosO.length,
      recebidos: doOrgao.filter(Calc.recebido).length,
      cedidos: doOrgao.filter(Calc.cedido).length
    };
  });
  const pctDe = (n, d) => d > 0 ? fmtN(n / d * 100, 1) + '% do quadro' : '—';
  const rkOrgaoReceb = porOrgaoPessoal.filter(x => x.recebidos > 0)
    .map(x => ({ label: x.orgao, valor: x.recebidos, sub: pctDe(x.recebidos, x.quadro) }))
    .sort((a, b) => b.valor - a.valor).slice(0, PAINEL_TOP);

  /* ---------- 4 a 7 · absenteísmo e custo com afastado, POR NATUREZA DA AUSÊNCIA ----------
     O gestor escolhe se quer ver o total, só o amparado (direito, não gerenciável) ou
     só o gerenciável (faltas e atrasos sem amparo) — os quatro rankings seguem a escolha. */
  const idsTodas = [...idsEscopo];
  const natSel = NATUREZAS.includes(telaPainel._natureza) ? telaPainel._natureza : 'total';
  telaPainel._natureza = natSel;
  const natArg = natSel === 'total' ? null : natSel;
  const NAT = NATUREZA_AUSENCIA[natSel];

  const rkOrgaoAbs = orgaosEscopo.map(o => {
    const a = Calc.absenteismoAgregado(s, unidadesDoOrgao(o), null, ano, natArg);
    return a ? { label: o, valor: a.taxa * 100, sub: `${fmtN(a.dias, 1)} dia(s)/mês · ${fmtN(a.pessoas)} servidores` } : null;
  }).filter(Boolean).sort((a, b) => b.valor - a.valor).slice(0, PAINEL_TOP);
  const rkCargoAbs = s.cargos.map(c => {
    const a = Calc.absenteismoAgregado(s, idsTodas, c.id, ano, natArg);
    return a ? { label: c.nome, valor: a.taxa * 100, sub: `${fmtN(a.dias, 1)} dia(s)/mês · ${fmtN(a.pessoas)} servidores` } : null;
  }).filter(Boolean).sort((a, b) => b.valor - a.valor).slice(0, PAINEL_TOP);

  // custo = taxa de ausência do cargo × folha daquele cargo, unidade a unidade, ×13 folhas
  const rkOrgaoCustoAbs = orgaosEscopo.map(o => {
    const c = Calc.custoAbsenteismo(s, new Set(unidadesDoOrgao(o)), null, ano, natArg);
    return c ? {
      label: o, valor: c.anual,
      sub: `${fmtBRLcomp(c.mensal)}/mês · ${fmtN(c.taxa * 100, 1)}% da jornada · ≈ ${fmtN(c.fte, 1)} servidor(es)`
    } : null;
  }).filter(Boolean).sort((a, b) => b.valor - a.valor).slice(0, PAINEL_TOP);
  const rkCargoCustoAbs = s.cargos.map(c => {
    const r = Calc.custoAbsenteismo(s, idsEscopo, c.id, ano, natArg);
    return r ? {
      label: c.nome, valor: r.anual,
      sub: `${fmtBRLcomp(r.mensal)}/mês · ${fmtN(r.taxa * 100, 1)}% da jornada · ≈ ${fmtN(r.fte, 1)} servidor(es)`
    } : null;
  }).filter(Boolean).sort((a, b) => b.valor - a.valor).slice(0, PAINEL_TOP);

  // as três naturezas juntas, para a faixa comparativa acima dos rankings
  const porNatureza = {};
  NATUREZAS.forEach(n => {
    porNatureza[n] = {
      abs: Calc.absenteismoAgregado(s, idsTodas, null, ano, n === 'total' ? null : n),
      custo: Calc.custoAbsenteismo(s, idsEscopo, null, ano, n === 'total' ? null : n)
    };
  });
  const custoAbsEstado = porNatureza.total.custo;
  const custoGerenciavel = porNatureza.gerenciavel.custo;

  /* ---------- 7 · cessão por cargo ---------- */
  const rkCargoCessao = s.cargos.map(c => {
    const doCargo = s.servidores.filter(x => idsEscopo.has(x.unidadeId) && x.cargoId === c.id);
    const ced = doCargo.filter(Calc.cedido).length;
    const rec = doCargo.filter(Calc.recebido).length;
    return { label: c.nome, valor: ced, sub: `${pctDe(ced, doCargo.length)} · ${fmtN(rec)} recebido(s)` };
  }).filter(x => x.valor > 0).sort((a, b) => b.valor - a.valor).slice(0, PAINEL_TOP);

  /* ---------- 8 e 9 · impacto financeiro do plano, ano a ano ---------- */
  const cfg = Plano.config(s);
  const sim = Plano.simular(s, escopo, cfg);
  const plano = Plano.planoConcurso(s, escopo, cfg, sim);
  const aloc = Plano.alocar(s, escopo, plano, sim);
  const anosPlano = plano.anos.map(a => a.ano);
  const totalPorOrgao = {};
  const totalPorCargo = {};
  anosPlano.forEach(a => {
    Object.entries(aloc.porOrgaoAno[a] || {}).forEach(([o, v]) => { totalPorOrgao[o] = Math.max(totalPorOrgao[o] || 0, v); });
    Object.entries(aloc.porCargoAno[a] || {}).forEach(([c, v]) => { totalPorCargo[c] = Math.max(totalPorCargo[c] || 0, v); });
  });
  const topOrgaos = Object.entries(totalPorOrgao).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
  const topCargos = Object.entries(totalPorCargo).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const catsOrgao = anosPlano.map(a => {
    const doAno = aloc.porOrgaoAno[a] || {};
    const outros = Object.entries(doAno).filter(([o]) => !topOrgaos.includes(o)).reduce((x, y) => x + y[1], 0);
    return {
      label: String(a),
      partes: topOrgaos.map(o => ({ nome: o, valor: doAno[o] || 0 })).concat(outros > 0 ? [{ nome: 'Demais', valor: outros }] : [])
    };
  });
  const catsCargo = anosPlano.map(a => {
    const doAno = aloc.porCargoAno[a] || {};
    return { label: String(a), partes: topCargos.map(c => ({ nome: nomeCargo(c), valor: doAno[c] || 0 })) };
  });

  /* ---------- KPIs de topo ---------- */
  const totalDeficit = Calc.sum([...deficitPorOrgao.values()].map(r => r.deficit));
  const absEstado = Calc.absenteismoAgregado(s, idsTodas, null, ano);
  const totCedidos = s.servidores.filter(x => idsEscopo.has(x.unidadeId) && Calc.cedido(x)).length;
  const totRecebidos = s.servidores.filter(x => idsEscopo.has(x.unidadeId) && Calc.recebido(x)).length;
  const folhaAtivos = Calc.sum(ativos.map(x => Calc.custoServidor(s, x)));

  const bloco = (titulo, dica, id, sub) => `<div class="card">
    <h3 class="card-titulo">${titulo} ${dica ? tipInfo(dica) : ''}</h3>
    ${sub ? `<p class="card-sub">${sub}</p>` : ''}
    <div id="${id}"></div></div>`;

  app().innerHTML = `
  ${cabecalhoPagina('Painel Visual — Estado do Paraná',
    `Rankings do Estado e impacto financeiro do plano de adequação — ano de referência ${ano}.`,
    null, 'Visão geral')}
  <div class="kpi-grid">
    <div class="kpi kpi-alerta"><span class="kpi-ico">${ICO('pessoas')}</span>
      <span><span class="kpi-valor">${fmtN(totalDeficit, 1)}</span>
      <span class="kpi-rotulo">Necessidade do Estado ${tipInfo('Soma dos déficits de todas as unidades dimensionadas do escopo.')}</span>
      <span class="kpi-sub">${fmtN(dims.length)} pares unidade/cargo dimensionados</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('itp')}</span>
      <span><span class="kpi-valor">${absEstado ? fmtN(absEstado.taxa * 100, 1) + '%' : '—'}</span>
      <span class="kpi-rotulo">Absenteísmo médio ${tipInfo('Horas de ausência por servidor ÷ horário legal mensal, ponderado pelo quadro ativo. Considera só ausências — treinamentos e projetos entram no ITP, não aqui.')}</span>
      <span class="kpi-sub">${absEstado ? fmtN(absEstado.dias, 1) + ' dia(s)/mês por servidor' : 'sem lançamentos'}</span></span></div>
    <div class="kpi kpi-alerta"><span class="kpi-ico">${ICO('dinheiro')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${custoAbsEstado ? fmtBRLcomp(custoAbsEstado.anual) : '—'}</span>
      <span class="kpi-rotulo">Custo com afastado ${tipInfo('Folha paga sem entrega correspondente: para cada cargo de cada unidade, a taxa de ausência multiplica a folha daquele cargo (remuneração + encargos + benefícios). O valor anual usa 13 folhas. Só ausências — treinamentos e projetos externos entram no ITP, não aqui.')}</span>
      <span class="kpi-sub">${custoAbsEstado
      ? `${fmtBRLcomp(custoAbsEstado.mensal)}/mês · ${custoGerenciavel ? fmtBRLcomp(custoGerenciavel.anual) + '/ano é gerenciável' : 'sem parcela gerenciável'}`
      : 'sem lançamentos de afastamento'}</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('seta')}</span>
      <span><span class="kpi-valor">${fmtN(totCedidos)}</span>
      <span class="kpi-rotulo">Cedidos a outros órgãos</span>
      <span class="kpi-sub">${fmtN(totRecebidos)} cedido(s) em exercício aqui</span></span></div>
  </div>

  <div class="grid-2col">
    ${bloco('Cargos com maior necessidade', 'Déficit (necessários − atuais) somado em todas as unidades dimensionadas do escopo. A cobertura é a parcela da necessidade já atendida.', 'pn-cargo-nec', 'servidores em falta')}
    ${bloco('Secretarias com maior necessidade de adequação', 'Déficit somado por órgão, unidade a unidade — o superávit de uma unidade não cobre a falta de outra.', 'pn-orgao-nec', 'servidores em falta')}
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Absenteísmo — natureza da ausência
      ${tipInfo('Nem toda ausência é gerenciável. AMPARADO: ' + NATUREZA_AUSENCIA.amparada.dica + ' GERENCIÁVEL: ' + NATUREZA_AUSENCIA.gerenciavel.dica)}</h3>
    <p class="card-sub">Escolha a natureza e os quatro rankings abaixo se ajustam. Ano de referência ${ano}.</p>
    <div class="filtros" style="margin-top:10px">
      <div class="vista-sel" style="display:flex;gap:7px">
        ${NATUREZAS.map(n => `<button class="btn-toggle ${n === natSel ? 'ativo' : ''}" data-nat="${n}">${NATUREZA_AUSENCIA[n].nome}</button>`).join('')}
      </div>
    </div>
    <p class="muted mini" style="margin:8px 0 2px">Em exibição: <strong style="color:${NAT.cor}">${NAT.nome}</strong> — ${NAT.desc}</p>
    <div class="grid-stats" style="margin-top:12px">
      ${NATUREZAS.map(n => {
      const r = porNatureza[n];
      const meta = NATUREZA_AUSENCIA[n];
      const share = n !== 'total' && porNatureza.total.abs && porNatureza.total.abs.taxa > 0
        ? fmtN((r.abs ? r.abs.taxa : 0) / porNatureza.total.abs.taxa * 100, 0) + '% do absenteísmo'
        : 'todas as ausências';
      return `<div class="stat" style="${n === natSel ? 'outline:2px solid ' + meta.cor + ';outline-offset:-2px' : ''}">
        <span class="stat-label" style="color:${meta.cor}">${meta.nome} ${tipInfo(meta.dica)}</span>
        <span class="stat-valor">${r.abs ? fmtN(r.abs.taxa * 100, 1) + '%' : '—'}</span>
        <span class="stat-sub">${r.abs ? fmtN(r.abs.dias, 1) + ' dia(s)/mês · ' : ''}${r.custo ? fmtBRLcomp(r.custo.anual) + '/ano' : '—'} · ${share}</span></div>`;
    }).join('')}
    </div>
    <p class="nota-calculo">Meta de gestão só faz sentido sobre o <strong>absenteísmo gerenciável</strong>: o amparado é
    direito do servidor e entra no dimensionamento como capacidade que não existe, não como desempenho a cobrar.</p>
  </div>

  <div class="grid-2col">
    ${bloco(`Secretarias com maior custo — ${NAT.nome.toLowerCase()}`, 'Taxa de ausência × folha do quadro, cargo a cargo, dentro de cada órgão. Anualizado em 13 folhas. É a folha que o Estado paga sem entrega correspondente. Segue a natureza selecionada acima.', 'pn-orgao-custo-abs', 'R$/ano de folha paga sem entrega')}
    ${bloco(`Cargos com maior custo — ${NAT.nome.toLowerCase()}`, 'Mesma conta, agregada por cargo em todo o escopo — mostra onde a ausência custa mais caro, não apenas onde ela é mais frequente.', 'pn-cargo-custo-abs', 'R$/ano de folha paga sem entrega')}
    ${bloco(`Secretarias com maior ${NAT.nome.toLowerCase()}`, 'Todos os cargos, ponderado pelo quadro ativo. Percentual do horário legal perdido em ausências da natureza selecionada.', 'pn-orgao-abs', '% do horário legal')}
    ${bloco(`Cargos com maior ${NAT.nome.toLowerCase()}`, 'Mesma medida, agregada por cargo em todo o escopo.', 'pn-cargo-abs', '% do horário legal')}
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Secretarias com mais cedidos em exercício ${tipInfo('Servidores de outros órgãos hoje em exercício no órgão (cessão recebida).')}</h3>
    <p class="card-sub">pessoas · o sub-rótulo mostra a participação no quadro do órgão</p>
    <div id="pn-orgao-receb"></div>
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Cargos com maior cessão ${tipInfo('Servidores do cargo hoje cedidos a outros órgãos, independentemente de a cessão ser com ou sem ônus — o mérito do custo não entra neste ranking.')}</h3>
    <p class="card-sub">pessoas cedidas · o sub-rótulo mostra a participação no quadro do cargo</p>
    <div id="pn-cargo-cessao"></div>
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Impacto financeiro do plano de adequação por secretaria ${tipInfo('Folha anual acumulada (13 folhas) das vagas do concurso lotadas em cada órgão pelo módulo de alocação, seguindo o cronograma de nomeações. A folha é recorrente: o valor de cada ano inclui as levas anteriores. O ano do edital aparece zerado porque ainda não há posse — o custo do certame é acompanhado no módulo concurso.')}</h3>
    <p class="card-sub">R$/ano · modo ${plano.modo === 'teto' ? 'teto financeiro do ciclo' : 'demanda'} · alvo de ${fmtN(plano.pctAlvo)}% de cobertura
      · ${fmtN(plano.totais.vagas)} vagas · edital ${plano.anoEdital}, nomeações ${plano.anosNomeacao[0]}–${plano.anosNomeacao[plano.anosNomeacao.length - 1]}</p>
    <div id="pn-fin-orgao"></div>
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Impacto financeiro do plano de adequação por cargo ${tipInfo('Mesma folha acumulada, aberta por cargo provido.')}</h3>
    <p class="card-sub">R$/ano · 13 folhas · sem o custo dos certames</p>
    <div id="pn-fin-cargo"></div>
  </div>

  <p class="muted mini">Os rankings de necessidade cobrem apenas unidades com dimensionamento concluído.
  Absenteísmo, custo com afastado e cessões cobrem todo o quadro cadastrado do escopo.</p>`;

  app().querySelectorAll('[data-nat]').forEach(b => b.addEventListener('click', () => {
    telaPainel._natureza = b.dataset.nat; telaPainel();
  }));

  const desenha = (id, dados, fmt, unidade) => {
    const el = document.getElementById(id);
    if (!dados.length) { el.innerHTML = '<p class="vazio">Sem lançamentos desta natureza no escopo.</p>'; return; }
    Charts.barH(el, { categorias: dados, fmt, unidadeY: unidade });
  };
  const f1 = v => Charts.fmtBR(v, 1);
  const f0 = v => Charts.fmtBR(v, 0);
  const fpc = v => Charts.fmtBR(v, 1) + '%';
  const fbrl = v => fmtBRLcomp(v);

  desenha('pn-cargo-nec', rkCargoNec, f1, 'servidores');
  desenha('pn-orgao-nec', rkOrgaoNec, f1, 'servidores');
  desenha('pn-orgao-custo-abs', rkOrgaoCustoAbs, fbrl, 'R$/ano');
  desenha('pn-cargo-custo-abs', rkCargoCustoAbs, fbrl, 'R$/ano');
  desenha('pn-orgao-receb', rkOrgaoReceb, f0, 'pessoas');
  desenha('pn-orgao-abs', rkOrgaoAbs, fpc, 'do horário legal');
  desenha('pn-cargo-abs', rkCargoAbs, fpc, 'do horário legal');
  desenha('pn-cargo-cessao', rkCargoCessao, f0, 'pessoas cedidas');

  const semVagas = !plano.totais.vagas;
  if (semVagas) {
    document.getElementById('pn-fin-orgao').innerHTML =
      '<p class="vazio">O plano de concurso não gerou vagas com as premissas atuais — ajuste o teto ou a adequação-alvo no <a href="#/plano/concurso">módulo concurso</a>.</p>';
    document.getElementById('pn-fin-cargo').innerHTML = '<p class="vazio">Sem vagas no plano.</p>';
  } else {
    Charts.barStack(document.getElementById('pn-fin-orgao'), {
      categorias: catsOrgao, series: topOrgaos.concat(catsOrgao.some(c => c.partes.some(p => p.nome === 'Demais')) ? ['Demais'] : []),
      fmt: v => fmtBRLcomp(v), unidadeY: 'R$/ano', altura: 320
    });
    Charts.barStack(document.getElementById('pn-fin-cargo'), {
      categorias: catsCargo, series: topCargos.map(nomeCargo),
      fmt: v => fmtBRLcomp(v), unidadeY: 'R$/ano', altura: 320
    });
  }
}


/* ===== mapeamento.js ===== */
/* ============================================================
   DFT — Mapeamento de entregas por IA
   Cruza duas camadas de evidência para propor as entregas de uma unidade:
     (1) o que a NORMA diz que a unidade faz  — normativo, planejamento
         estratégico e documento avulso (PDF);
     (2) o que a unidade REALMENTE processa   — extrato do e-Protocolo
         (assunto x órgão, em xlsx/csv/pdf).
   O corte entre "assunto" e "entrega" é a regra central e está no prompt.
   Nada aqui é persistido: a chave da API e os arquivos vivem só em memória.
   ============================================================ */

const DFT_IA_MODELO = 'claude-sonnet-4-6';
const DFT_IA_URL = 'https://api.anthropic.com/v1/messages';
const DFT_IA_MAX_LINHAS = 600;   // linhas do e-Protocolo enviadas por vez
const DFT_IA_MAX_MB = 28;        // limite prático de PDF da API

/* ---------- normativo que define a competência da unidade ----------
   Os núcleos setoriais não seguem o regulamento do órgão onde estão lotados, e
   sim o do órgão dono do sistema — é o que diz o art. 28 do Regulamento da SEJU
   (Decreto 8.807/2025): NPS pela SEPL, NICS pela CGE, NCS pela SECOM, NAS e
   NRHS pela SEAP, NFS pela SEFA. As demais unidades seguem o regulamento do
   próprio órgão. Com isso, 13 documentos cobrem as 303 unidades.

   'arquivo' aponta para a pasta normativos/, ao lado do index.html: havendo o
   PDF lá, a aba já abre com ele anexado e não é preciso subir nada. Sem o
   arquivo, a aba mostra qual ato buscar e onde. O levantamento completo está em
   docs/base-normativa.md. */
const DFT_NUCLEO_SISTEMICO = {
  NPS: 'SEPL', NICS: 'CGE', NCS: 'SECOM', NAS: 'SEAP', NRHS: 'SEAP', NFS: 'SEFA'
};

const DFT_NORMATIVOS = {
  AMEP:     { ato: 'Decreto 12.038, de 28/11/2025',
              onde: 'https://www.amep.pr.gov.br/Pagina/Apresentacao',
              ressalva: 'não localizado no Sistema Legislação: o Decreto 12.038/2025 que consta lá é de crédito suplementar' },
  CEP:      { ato: 'Regimento Escolar do CEP (2022)', arquivo: 'CEP_regimento_escolar_2022.pdf',
              onde: 'https://www.cep.pr.gov.br/Pagina/Documentos-oficiais' },
  CGE:      { ato: 'Decreto 2.741, de 19/09/2019', arquivo: 'CGE_decreto_2741_2019.txt' },
  FUNDEPAR: { ato: 'Decreto 8.362, de 16/12/2024', arquivo: 'FUNDEPAR_decreto_8362_2024.pdf' },
  IPARDES:  { ato: 'Decreto 3.203, de 22/08/2023', arquivo: 'IPARDES_decreto_3203_2023.pdf' },
  SEAP:     { ato: 'Decreto 3.888, de 21/01/2020', arquivo: 'SEAP_decreto_3888_2020.pdf' },
  SECOM:    { ato: 'Decreto 4.276/2023', onde: 'https://www.comunicacao.pr.gov.br/Pagina/Legislacao' },
  SEED:     { ato: 'Decreto 8.425, de 07/12/2017', arquivo: 'SEED_decreto_8425_2017.pdf',
              ressalva: 'anterior à Lei 21.352/2023 — confirmar vigência' },
  SEFA:     { ato: 'Decreto 12.279, de 16/12/2025', arquivo: 'SEFA_decreto_12279_2025.pdf',
              ressalva: 'texto consolidado, já com a alteração do Decreto 12.317, de 18/12/2025' },
  SEJU:     { ato: 'Decreto 8.807, de 30/01/2025', arquivo: 'SEJU_decreto_8807_2025.pdf' },
  SEPL:     { ato: 'Decreto de 16/09/2025', arquivo: 'SEPL_decreto_8657_2018.pdf',
              ressalva: 'o arquivo é o Decreto 8.657/2018, superado: não traz DDI, DAG nem UTEC' },
  SESA:     { ato: 'Decreto 9.921, de 23/01/2014', arquivo: 'SESA_decreto_9921_2014.pdf',
              ressalva: 'anterior à Lei 21.352/2023 — confirmar vigência' },
  SETU:     { ato: 'Decreto 11.974/2022, alterado pelo Decreto 7.042, de 12/08/2024',
              arquivo: 'SETU_decreto_11974_2022_consolidado.pdf',
              ressalva: 'texto consolidado: o Regulamento vem do Decreto 11.974/2022, que o 7.042/2024 alterou' }
};

function normativoDaUnidade(u) {
  const sistemica = DFT_NUCLEO_SISTEMICO[u.sigla];
  const fonte = sistemica || u.orgao;
  const n = DFT_NORMATIVOS[fonte];
  return n ? Object.assign({ fonte, sistemica: !!sistemica }, n) : null;
}

// o PDF é lido uma vez por sessão e reaproveitado entre unidades do mesmo órgão
const IA_NORM_CACHE = {};

function iaBaixaNormativo(arquivo) {
  if (IA_NORM_CACHE[arquivo]) return IA_NORM_CACHE[arquivo];
  const ehTexto = /\.(txt|md)$/i.test(arquivo);
  IA_NORM_CACHE[arquivo] = fetch('normativos/' + encodeURIComponent(arquivo))
    .then(r => { if (!r.ok) throw new Error('sem o arquivo'); return ehTexto ? r.text() : r.blob(); })
    .then(d => ehTexto
      // regulamento que só existe como documento de texto vai como texto mesmo:
      // a API lê direto, sem o custo de converter para PDF
      ? { texto: d, tamanho: d.length }
      : new Promise((ok, err) => {
        const fr = new FileReader();
        fr.onload = () => ok({ base64: String(fr.result).split(',')[1], tamanho: d.size });
        fr.onerror = () => err(new Error('não foi possível ler ' + arquivo));
        fr.readAsDataURL(d);
      }))
    .catch(e => { IA_NORM_CACHE[arquivo] = null; throw e; });
  return IA_NORM_CACHE[arquivo];
}

/* Anexa o regulamento da unidade ao contexto, se houver arquivo na pasta.
   Roda ao abrir a aba. Só repinta a tela quando de fato anexou algo, para não
   entrar em laço com o próprio render. */
async function iaAnexaNormativo(u, uId) {
  const n = normativoDaUnidade(u);
  if (!n || !n.arquivo) return;
  if (IA.ctx.some(a => a.normativo === n.arquivo)) return;   // já anexado
  if (IA.semNormativo[n.arquivo]) return;                    // já falhou antes
  try {
    const { base64, texto, tamanho } = await iaBaixaNormativo(n.arquivo);
    if (IA.ctx.some(a => a.normativo === n.arquivo)) return;  // corrida entre renders
    IA.ctx.unshift(Object.assign(
      { nome: n.arquivo, tamanho, papel: 'Normativo', fonte: 'unidade', normativo: n.arquivo },
      texto != null ? { texto } : { base64 }
    ));
    if (document.getElementById('ia-drop-ctx')) telaUnidade(uId, 'mapeamento');
  } catch (e) {
    IA.semNormativo[n.arquivo] = true;
    if (document.getElementById('ia-drop-ctx')) telaUnidade(uId, 'mapeamento');
  }
}

/* ---------- de onde vem a chave da API ----------
   O DFT é uma página estática que fala direto com a Anthropic, então qualquer
   chave escrita aqui dentro seria lida por quem abrisse o arquivo. A chave
   nunca entra no repositório; ela chega por um destes caminhos, nesta ordem:

     1. chave-local.js — arquivo ao lado do index.html, fora do git, que define
        window.DFT_CHAVE_IA (veja chave-local.exemplo.js);
     2. armazenamento do navegador — quando o usuário marca "lembrar";
     3. digitada na aba — vale só enquanto a página estiver aberta.

   Em todos eles a chave fica na máquina de quem usa, nunca no repositório. */
const DFT_IA_CHAVE_LS = 'dft.ia.chave';

function iaChaveDoArquivo() {
  const v = String((typeof window !== 'undefined' && window.DFT_CHAVE_IA) || '').trim();
  // o modelo em chave-local.exemplo.js traz um valor de enfeite — não vale como chave
  return /^sk-ant-/.test(v) && !/COLE-AQUI/i.test(v) ? v : '';
}
function iaChaveSalva() {
  try { return localStorage.getItem(DFT_IA_CHAVE_LS) || ''; }
  catch (e) { return ''; }              // navegador com armazenamento bloqueado
}
function iaGuardaChave(chave) {
  try { localStorage.setItem(DFT_IA_CHAVE_LS, chave); return true; }
  catch (e) { return false; }
}
function iaEsqueceChave() {
  try { localStorage.removeItem(DFT_IA_CHAVE_LS); } catch (e) { /* nada a fazer */ }
}

// estado volátil da aba (os arquivos somem ao recarregar — de propósito)
const IA = {
  chave: iaChaveDoArquivo() || iaChaveSalva(),
  lembrar: !!iaChaveSalva(),
  ctx: [],          // [{nome, tipo, tamanho, base64|texto, papel}]
  proto: null,      // {nome, colunas:[...], linhas:[[...]], selecionadas:Set}
  propostas: null,  // resposta da IA já parseada
  descartados: null,
  erro: '',
  ocupado: false,
  unidadeId: null,   // de quem é o contexto atual (ver iaTrocaUnidade)
  semNormativo: {}   // arquivos de regulamento ausentes da pasta normativos/
};

/* Os arquivos são evidência SOBRE uma unidade: levá-los para outra faria a IA
   propor entregas a partir do documento errado. Ao abrir a aba de outra
   unidade, o contexto recomeça. A chave da API não é evidência e permanece. */
function iaTrocaUnidade(uId) {
  if (IA.unidadeId === uId) return;
  IA.unidadeId = uId;
  IA.ctx = []; IA.proto = null;
  IA.propostas = null; IA.descartados = null; IA.erro = '';
}

const iaKB = n => n < 1024 ? n + ' B'
  : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

/* ---------- leitura de arquivos ---------- */
function iaLerBase64(file) {
  return new Promise((ok, err) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1]);
    r.onerror = () => err(new Error('Não foi possível ler ' + file.name));
    r.readAsDataURL(file);
  });
}
function iaLerTexto(file) {
  return new Promise((ok, err) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result));
    r.onerror = () => err(new Error('Não foi possível ler ' + file.name));
    r.readAsText(file, 'utf-8');
  });
}

// CSV/TSV simples com suporte a aspas e separador detectado pelo cabeçalho
function iaParseCSV(txt) {
  const bruto = txt.replace(/^\uFEFF/, '');
  const primeira = (bruto.split(/\r?\n/)[0] || '');
  const sep = [';', '\t', ','].sort((a, b) =>
    primeira.split(b).length - primeira.split(a).length)[0];
  const linhas = [];
  let campo = '', linha = [], aspas = false;
  for (let i = 0; i < bruto.length; i++) {
    const c = bruto[i];
    if (aspas) {
      if (c === '"' && bruto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') aspas = false;
      else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ''; }
    else if (c === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else if (c !== '\r') campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(c => String(c).trim()));
}

// SheetJS só é baixado quando um .xlsx aparece — o resto do sistema segue offline
// Carrega um script com prazo: sem o prazo, uma rede que engole a requisição em
// vez de recusá-la deixa a promessa pendente para sempre — e a tela presa no
// "lendo a planilha".
function iaCarregaScript(src, ms = 20000) {
  return new Promise((ok, err) => {
    const el = document.createElement('script');
    let encerrado = false;
    const fim = (fn, arg) => { if (encerrado) return; encerrado = true; clearTimeout(t); fn(arg); };
    const t = setTimeout(() => { el.remove(); fim(err, new Error('tempo esgotado em ' + src)); }, ms);
    el.src = src;
    el.onload = () => fim(ok);
    el.onerror = () => { el.remove(); fim(err, new Error('não carregou ' + src)); };
    document.head.appendChild(el);
  });
}

// O leitor de planilhas vem de uma cópia local, quando houver uma ao lado do
// index.html, e só então do CDN. É o que permite usar xlsx em rede que bloqueia
// CDN: basta baixar o arquivo uma vez e deixá-lo na pasta.
function iaCarregaSheetJS() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (window._iaSheetJS) return window._iaSheetJS;
  const fontes = ['xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
  window._iaSheetJS = fontes
    .reduce((p, src) => p.catch(() => iaCarregaScript(src)), Promise.reject(new Error('início')))
    .then(() => {
      if (!window.XLSX) throw new Error('sem XLSX');
      return window.XLSX;
    })
    .catch(() => {
      window._iaSheetJS = null;   // permite nova tentativa
      throw new Error('Não foi possível carregar o leitor de planilhas. Salve o arquivo como CSV, ' +
        'ou baixe xlsx.full.min.js e deixe-o na mesma pasta do DFT.');
    });
  return window._iaSheetJS;
}

async function iaLerPlanilha(file) {
  const nome = file.name.toLowerCase();
  if (nome.endsWith('.csv') || nome.endsWith('.txt') || nome.endsWith('.tsv')) {
    return iaParseCSV(await iaLerTexto(file));
  }
  const XLSX = await iaCarregaSheetJS();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const aba = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(aba, { header: 1, blankrows: false, defval: '' })
    .filter(l => l.some(c => String(c).trim()));
}

/* ---------- o prompt: onde mora o critério de corte ---------- */
function iaPromptSistema(u) {
  return `Você apoia o Dimensionamento da Força de Trabalho (DFT) do Estado do Paraná.
Sua tarefa é propor as ENTREGAS da unidade ${u.sigla} — ${u.nome}, do órgão ${u.orgao},
a partir dos documentos e do extrato do e-Protocolo fornecidos.

O QUE É UMA ENTREGA NO DFT
Entrega é um produto ou serviço que a unidade gera de forma recorrente, que consome
força de trabalho e que pode ser CONTADO num período (por mês ou por ano). É o que sai
da unidade para alguém — outra unidade, outro órgão, o cidadão ou um ato publicado.

Toda entrega passa nos quatro testes:
1. Sai da unidade  — há um produto identificável, não é uma etapa interna de outra coisa.
2. Se repete       — acontece de novo a cada ciclo (mês, exercício, demanda).
3. Dá para contar  — faz sentido dizer "foram N no mês/ano".
4. Consome equipe  — alguém gasta horas de trabalho nisso.

O QUE NÃO É ENTREGA
- Inciso de competência normativa. A norma descreve ESCOPO, não entrega. Uma unidade com
  oito incisos de competência costuma ter três a cinco entregas: vários incisos descrevem
  a mesma entrega por ângulos diferentes, e outros são cláusulas genéricas
  ("outras atividades correlatas"). NUNCA converta inciso em entrega um a um.
- Assunto do e-Protocolo que é meio ou administrativo interno: férias, licença, diária,
  ofício, memorando, requerimento de servidor, abertura de protocolo, encaminhamento.
  Esses assuntos tramitam MUITO e sempre aparecem no topo do volume — volume alto não
  torna um assunto uma entrega.
- Etapa de um processo maior ("analisar documentação", "conferir dados", "assinar").
- Objetivo ou diretriz do planejamento estratégico ("aprimorar a gestão fiscal").

COMO USAR CADA FONTE
- Normativo e planejamento estratégico: dizem o que a unidade DEVERIA fazer. Servem para
  nomear e delimitar a entrega.
- e-Protocolo: diz o que a unidade REALMENTE processa e em que volume. Serve para
  confirmar a entrega e estimar volume. Um assunto do e-Protocolo pode agrupar várias
  entregas, e uma entrega pode não aparecer no e-Protocolo (ex.: elaboração de peça
  orçamentária, que tramita fora dele). As duas coisas são normais.
- Quando a norma prevê algo que o e-Protocolo não confirma, a entrega ainda pode existir —
  marque confiança "baixa" e diga isso na justificativa.

EXEMPLOS DE ENTREGAS BEM FORMADAS, DE DOMÍNIOS VARIADOS
- RH setorial: "Folhas de pagamento processadas"; "Atos de pessoal publicados";
  "Atendimentos ao servidor".
- Contratações: "Editais de licitação publicados"; "Contratos formalizados";
  "Pareceres técnicos emitidos".
- Arquivo público: "Documentos arquivados"; "Digitalizações realizadas";
  "Atendimentos a pesquisas".
- Transporte oficial: "Viagens oficiais atendidas"; "Ordens de manutenção concluídas";
  "Abastecimentos processados".
- Escola de governo: "Turmas de capacitação realizadas"; "Servidores certificados";
  "Cursos EAD produzidos".

Dois padrões de nome funcionam: produto no particípio e no plural ("Documentos
arquivados") ou verbo de ação + objeto ("Elaborar o relatório de execução"). Escolha o que
combinar com a unidade. Use SEMPRE o vocabulário do domínio da PRÓPRIA unidade, com as
siglas e os nomes que aparecem nos documentos dela — não presuma a área de atuação.

CALIBRAGEM DE GRANULARIDADE (referência de fora deste dimensionamento)
Numa coordenação de orçamento examinada em outro trabalho, oito incisos de competência
normativa correspondiam a apenas quatro entregas: abertura do exercício, encerramento do
exercício, acompanhamento de receitas e despesas e alteração orçamentária. Use esse caso
só para calibrar o nível de agregação — nunca para emprestar vocabulário orçamentário a
uma unidade de outra área. Nessa mesma família de unidades havia a entrega "Assessoria ao
Diretor-Geral", prova de que atribuição contínua sem produto discreto TAMBÉM é entrega,
desde que consuma carga de trabalho de forma estável.

CALIBRAGEM
Proponha entre 3 e 12 entregas. Prefira poucas e bem delimitadas a muitas e fragmentadas.
Se duas candidatas compartilham o mesmo produto, funda em uma só. Se não houver evidência
suficiente para uma entrega, não invente: é melhor devolver menos.

FORMATO DA RESPOSTA
Responda SOMENTE com um objeto JSON válido, sem crases, sem markdown, sem texto antes ou
depois. Este é o formato exato:

{
  "entregas": [
    {
      "titulo": "verbo + objeto, no estilo dos exemplos",
      "descricao": "uma a duas frases sobre o que a unidade produz nesta entrega",
      "tipo": "finalistica" ou "apoio",
      "periodicidade": "mensal" ou "anual",
      "volumeEstimado": número ou null,
      "unidadeVolume": "o que está sendo contado (ex.: decretos, processos, relatórios)",
      "confianca": "alta" ou "media" ou "baixa",
      "fonte": "onde a evidência apareceu (documento e/ou assunto do e-Protocolo)",
      "justificativa": "por que isto passa nos quatro testes de entrega"
    }
  ],
  "descartados": [
    { "assunto": "candidato que você NÃO considerou entrega", "motivo": "razão curta" }
  ]
}

Em "descartados", liste de 5 a 15 candidatos recusados — principalmente assuntos de alto
volume do e-Protocolo e incisos de competência que você não converteu. Essa lista é o que
permite auditar o critério de corte, então ela importa tanto quanto as entregas.
Preencha "volumeEstimado" apenas quando o e-Protocolo der base numérica; caso contrário, null.`;
}

function iaBlocosConteudo(u, s) {
  const blocos = [];
  IA.ctx.forEach(a => {
    if (a.base64) {
      blocos.push({
        type: 'document',
        source: { type: 'base64', media_type: 'application/pdf', data: a.base64 },
        title: `${a.papel} — ${a.nome}`
      });
    } else {
      blocos.push({ type: 'text', text: `--- ${a.papel} — ${a.nome} ---\n${a.texto}` });
    }
  });

  if (IA.proto) {
    const idx = [...IA.proto.selecionadas].sort((a, b) => a - b);
    const cab = idx.map(i => IA.proto.colunas[i]).join('\t');
    const corpo = IA.proto.linhas.slice(0, DFT_IA_MAX_LINHAS)
      .map(l => idx.map(i => String(l[i] == null ? '' : l[i]).replace(/\s+/g, ' ').trim()).join('\t'))
      .join('\n');
    const total = IA.proto.linhas.length;
    blocos.push({
      type: 'text',
      text: `--- Extrato do e-Protocolo (${IA.proto.nome}) ---
${total} linhas no arquivo${total > DFT_IA_MAX_LINHAS ? `, ${DFT_IA_MAX_LINHAS} enviadas abaixo` : ''}.
Colunas separadas por tabulação:
${cab}
${corpo}`
    });
  }

  const ents = Calc.entregasUnidade(s, u.id);
  if (ents.length) {
    blocos.push({
      type: 'text',
      text: `--- Entregas já cadastradas para ${u.sigla} (não repita, não proponha equivalentes) ---\n` +
        ents.map(e => `- ${e.titulo}`).join('\n')
    });
  }

  blocos.push({
    type: 'text',
    text: `Proponha agora as entregas da unidade ${u.sigla} — ${u.nome} (${u.orgao}). Responda só o JSON.`
  });
  return blocos;
}

async function iaChamar(u, s) {
  const resp = await fetch(DFT_IA_URL, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': IA.chave,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: DFT_IA_MODELO,
      max_tokens: 4000,
      system: iaPromptSistema(u),
      messages: [{ role: 'user', content: iaBlocosConteudo(u, s) }]
    })
  });

  if (!resp.ok) {
    let detalhe = '';
    try { const j = await resp.json(); detalhe = (j.error && j.error.message) || ''; }
    catch (e) { /* corpo não era JSON */ }
    if (resp.status === 401) throw new Error('Chave da API recusada. Confira se ela foi copiada inteira e se não foi revogada.');
    if (resp.status === 403) throw new Error('A chave não tem acesso a este modelo. Verifique as permissões dela no console da Anthropic.');
    // 429 é limite por minuto: passa sozinho. Não confundir com falta de crédito,
    // que é 400 e não passa com o tempo.
    if (resp.status === 429) throw new Error('Limite de requisições por minuto atingido. Espere alguns instantes e rode de novo.');
    if (resp.status === 400 && /credit|balance/i.test(detalhe)) {
      throw new Error('A conta da API está sem créditos. Os créditos da API são comprados à parte, ' +
        'no console da Anthropic em Plans & Billing — assinatura do Claude.ai (Pro ou Max) não cobre o uso da API.');
    }
    if (resp.status === 404) throw new Error(`O modelo ${DFT_IA_MODELO} não foi encontrado. ${detalhe}`);
    throw new Error(`A API respondeu ${resp.status}. ${detalhe}`);
  }

  const dados = await resp.json();
  const txt = (dados.content || [])
    .filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  const limpo = txt.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try {
    return JSON.parse(limpo);
  } catch (e) {
    const i = limpo.indexOf('{'), f = limpo.lastIndexOf('}');
    if (i >= 0 && f > i) return JSON.parse(limpo.slice(i, f + 1));
    throw new Error('A resposta não veio em JSON válido. Tente novamente.');
  }
}

/* ---------- a aba ---------- */
function abaMapeamento(alvo, uId) {
  const s = st();
  const u = Calc.unidade(s, uId);
  iaTrocaUnidade(uId);

  // IA.ctx guarda tudo o que vai como anexo para a IA, inclusive um extrato em
  // PDF. Na tela, porém, cada arquivo tem de aparecer sob o passo em que foi
  // enviado — por isso a lista é separada pela origem, e não pela ordem do array.
  const comIndice = IA.ctx.map((a, i) => ({ a, i }));
  const docsUnidade = comIndice.filter(x => x.a.fonte !== 'proto');
  const protoPdf = comIndice.find(x => x.a.fonte === 'proto');

  const itemArq = (a, i, medida) => `
    <li class="ia-arq">
      <span class="badge mini badge-azul">${E(a.papel)}</span>
      <span class="ia-arq-nome" title="${E(a.nome)}">${E(a.nome)}</span>
      <span class="ia-arq-tam">${medida || iaKB(a.tamanho)}</span>
      <button class="btn-x" data-tira-ctx="${i}" title="Remover">×</button>
    </li>`;

  const listaCtx = docsUnidade.length
    ? `<ul class="ia-arqs">${docsUnidade.map(x => itemArq(x.a, x.i)).join('')}</ul>` : '';

  const blocoProto = protoPdf ? `
    <ul class="ia-arqs">${itemArq(protoPdf.a, protoPdf.i)}</ul>
    <p class="nota-calculo">O extrato em PDF vai inteiro para a IA — não há colunas a escolher.
      Para filtrar colunas, envie o e-Protocolo como planilha.</p>`
    : IA.proto ? `
    <ul class="ia-arqs">
      <li class="ia-arq">
        <span class="badge mini badge-azul">e-Protocolo</span>
        <span class="ia-arq-nome">${E(IA.proto.nome)}</span>
        <span class="ia-arq-tam">${fmtN(IA.proto.linhas.length)} linhas</span>
        <button class="btn-x" id="ia-tira-proto" title="Remover">×</button>
      </li>
    </ul>
    <p class="nota-calculo">Marque as colunas que descrevem o assunto, o órgão e o volume.
      As demais ficam de fora para não gastar contexto à toa.</p>
    <div class="ia-cols">${IA.proto.colunas.map((c, i) => `
      <label class="check"><input type="checkbox" class="ia-col" data-col="${i}"
        ${IA.proto.selecionadas.has(i) ? 'checked' : ''}> ${E(c || 'coluna ' + (i + 1))}</label>`).join('')}
    </div>` : '';

  const podeRodar = IA.ctx.length > 0 || IA.proto;

  // o regulamento que define a competência desta unidade — anexado sozinho
  // quando o PDF está na pasta normativos/, indicado quando não está
  const norm = normativoDaUnidade(u);
  const normAnexado = norm && IA.ctx.some(a => a.normativo === norm.arquivo);
  const blocoNorm = !norm ? '' : `
    <div class="norm ${normAnexado ? 'ok' : IA.semNormativo[norm.arquivo] || !norm.arquivo ? 'falta' : 'lendo'}">
      <div class="norm-topo">
        <span class="norm-selo">${normAnexado ? 'anexado' : 'a anexar'}</span>
        <b>${E(norm.ato)}</b>
      </div>
      <p>${!norm.sistemica
          ? `Regulamento de ${E(norm.fonte)} — traz as competências das unidades do órgão.`
          : norm.fonte === u.orgao
            ? `${E(u.sigla)} é núcleo setorial, e ${E(norm.fonte)} é o órgão central do sistema:
               a competência sai do regulamento do próprio órgão — art. 28 do Regulamento da SEJU.`
            : `${E(u.sigla)} é núcleo setorial: a competência está no regulamento de
               <b>${E(norm.fonte)}</b>, órgão central do sistema, e não no de ${E(u.orgao)}
               — art. 28 do Regulamento da SEJU.`}</p>
      ${norm.ressalva ? `<p class="norm-ressalva">${E(norm.ressalva)}</p>` : ''}
      ${normAnexado ? '' : norm.arquivo
        ? `<p class="norm-ressalva">O arquivo <code>normativos/${E(norm.arquivo)}</code> não foi
           encontrado — sirva a pasta por um servidor local para que ele seja anexado sozinho.</p>`
        : `<p class="norm-ressalva">Ainda não reunido. Baixe o ato${norm.onde
             ? ` em <a href="${E(norm.onde)}" target="_blank" rel="noopener">${E(new URL(norm.onde).hostname)}</a>`
             : ' no <a href="https://www.legislacao.pr.gov.br" target="_blank" rel="noopener">Sistema Legislação</a>'},
           salve em <code>normativos/</code> e ele passa a vir anexado; ou suba abaixo, desta vez.</p>`}
    </div>`;

  // a chave só aparece como campo quando não veio pronta do arquivo local
  const chaveDeArquivo = !!iaChaveDoArquivo();
  const blocoChave = chaveDeArquivo ? `
    <p class="ia-chave-ok">Chave carregada de <code>chave-local.js</code> — nada a preencher.</p>`
    : `
    <div class="ia-chave">
      <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)">
        Chave da Anthropic
        <input type="password" id="ia-chave" class="input" placeholder="sk-ant-..."
          value="${E(IA.chave)}" autocomplete="off">
      </label>
    </div>
    <label class="check" style="margin-top:10px"><input type="checkbox" id="ia-lembrar"
      ${IA.lembrar ? 'checked' : ''}> Lembrar a chave neste navegador</label>
    <p class="nota-calculo">Marcada, a chave fica guardada só neste computador e a aba já abre
      preenchida. Desmarcada, ela vale enquanto a página estiver aberta. De um jeito ou de outro
      ela não entra no repositório — para deixá-la fixa na sua cópia local, use o
      <code>chave-local.js</code>.</p>`;

  alvo.innerHTML = `
  <div class="card card-larga">
    <h3>Mapear entregas ${tipInfo('A IA lê os documentos da unidade e o extrato do e-Protocolo e propõe entregas no padrão do DFT. Nada é cadastrado sem a sua confirmação.')}</h3>
    <p class="muted" style="font-size:13px">Duas camadas de evidência: o que a norma diz que a
      ${E(u.sigla)} faz e o que o e-Protocolo mostra que ela processa. A IA cruza as duas e
      devolve entregas candidatas — você revisa e escolhe o que entra.</p>
  </div>

  <div class="card card-larga">
    <div class="ia-passo"><span class="ia-num">1</span><b>Documentos da unidade</b>
      <span>normativo, planejamento estratégico, documento avulso · PDF</span></div>
    <div class="ia-drop" id="ia-drop-ctx">
      <p>Escolher arquivos PDF</p>
      <small>Portaria, decreto, lei, regimento, plano estratégico — até ${DFT_IA_MAX_MB} MB cada</small>
    </div>
    <input type="file" id="ia-file-ctx" accept=".pdf,application/pdf" multiple hidden>
    ${blocoNorm}
    ${listaCtx}
  </div>

  <div class="card card-larga">
    <div class="ia-passo"><span class="ia-num">2</span><b>Extrato do e-Protocolo</b>
      <span>relação de assunto × órgão · xlsx, csv ou pdf</span></div>
    <div class="ia-drop" id="ia-drop-proto">
      <p>Escolher o extrato</p>
      <small>Planilha com os assuntos que tramitam na unidade</small>
    </div>
    <input type="file" id="ia-file-proto" accept=".xlsx,.xls,.csv,.tsv,.txt,.pdf" hidden>
    ${blocoProto}
  </div>

  <div class="card card-larga">
    <div class="ia-passo"><span class="ia-num">3</span><b>Chave da API</b>
      <span>${chaveDeArquivo ? 'lida do chave-local.js' : 'fica neste computador — nunca no repositório'}</span></div>
    ${blocoChave}
    <div class="acoes">
      <button class="btn" id="ia-rodar" ${podeRodar ? '' : 'disabled'}>Analisar e propor entregas</button>
      ${IA.propostas ? '<button class="btn btn-sec" id="ia-limpar">Limpar resultado</button>' : ''}
    </div>
    <div id="ia-status"></div>
  </div>

  <div id="ia-resultado"></div>`;

  /* --- passo 1: documentos --- */
  const inCtx = document.getElementById('ia-file-ctx');
  const dropCtx = document.getElementById('ia-drop-ctx');
  dropCtx.addEventListener('click', () => inCtx.click());
  ['dragover', 'dragenter'].forEach(ev => dropCtx.addEventListener(ev, e => {
    e.preventDefault(); dropCtx.classList.add('sobre');
  }));
  ['dragleave', 'drop'].forEach(ev => dropCtx.addEventListener(ev, () => dropCtx.classList.remove('sobre')));
  dropCtx.addEventListener('drop', e => { e.preventDefault(); iaAddCtx(e.dataTransfer.files, uId); });
  inCtx.addEventListener('change', () => iaAddCtx(inCtx.files, uId));

  alvo.querySelectorAll('[data-tira-ctx]').forEach(b => b.addEventListener('click', () => {
    IA.ctx.splice(Number(b.dataset.tiraCtx), 1); telaUnidade(uId, 'mapeamento');
  }));

  /* --- passo 2: e-Protocolo --- */
  const inProto = document.getElementById('ia-file-proto');
  const dropProto = document.getElementById('ia-drop-proto');
  dropProto.addEventListener('click', () => inProto.click());
  ['dragover', 'dragenter'].forEach(ev => dropProto.addEventListener(ev, e => {
    e.preventDefault(); dropProto.classList.add('sobre');
  }));
  ['dragleave', 'drop'].forEach(ev => dropProto.addEventListener(ev, () => dropProto.classList.remove('sobre')));
  dropProto.addEventListener('drop', e => { e.preventDefault(); iaAddProto(e.dataTransfer.files[0], uId); });
  inProto.addEventListener('change', () => iaAddProto(inProto.files[0], uId));

  const tiraProto = document.getElementById('ia-tira-proto');
  if (tiraProto) tiraProto.addEventListener('click', () => { IA.proto = null; telaUnidade(uId, 'mapeamento'); });
  alvo.querySelectorAll('.ia-col').forEach(c => c.addEventListener('change', () => {
    const i = Number(c.dataset.col);
    if (c.checked) IA.proto.selecionadas.add(i); else IA.proto.selecionadas.delete(i);
  }));

  /* --- passo 3: rodar --- */
  const inChave = document.getElementById('ia-chave');
  if (inChave) inChave.addEventListener('input', () => {
    IA.chave = inChave.value.trim();
    if (IA.lembrar) IA.lembrar = iaGuardaChave(IA.chave);   // mantém o que está guardado em dia
  });

  const cbLembrar = document.getElementById('ia-lembrar');
  if (cbLembrar) cbLembrar.addEventListener('change', () => {
    if (!cbLembrar.checked) { IA.lembrar = false; iaEsqueceChave(); return; }
    IA.lembrar = iaGuardaChave(IA.chave);
    if (!IA.lembrar) {
      cbLembrar.checked = false;
      IA.erro = 'Este navegador não deixa guardar dados do site — a chave vale só nesta aba.';
      iaPintaStatus();
    }
  });

  document.getElementById('ia-rodar').addEventListener('click', () => iaRodar(uId));
  const btnLimpar = document.getElementById('ia-limpar');
  if (btnLimpar) btnLimpar.addEventListener('click', () => {
    IA.propostas = null; IA.descartados = null; IA.erro = ''; telaUnidade(uId, 'mapeamento');
  });

  iaPintaStatus();
  if (IA.propostas) iaPintaPropostas(uId);
  iaAnexaNormativo(u, uId);
}

async function iaAddCtx(files, uId) {
  const papel = p => /planej|estrat|pe\b/i.test(p) ? 'Planejamento'
    : /portaria|decreto|lei|resolu|regiment|norma/i.test(p) ? 'Normativo' : 'Documento';
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name)) { IA.erro = `${f.name} não é PDF.`; continue; }
    if (f.size > DFT_IA_MAX_MB * 1048576) {
      IA.erro = `${f.name} tem ${iaKB(f.size)} — o limite é ${DFT_IA_MAX_MB} MB.`; continue;
    }
    IA.ctx.push({
      nome: f.name, tamanho: f.size, papel: papel(f.name), fonte: 'unidade',
      base64: await iaLerBase64(f)
    });
  }
  telaUnidade(uId, 'mapeamento');
}

// tira do payload o extrato em PDF que estiver lá, sem tocar nos documentos da unidade
function iaTiraProtoDoCtx() {
  const i = IA.ctx.findIndex(a => a.fonte === 'proto');
  if (i >= 0) IA.ctx.splice(i, 1);
}

async function iaAddProto(file, uId) {
  if (!file) return;
  IA.erro = '';
  try {
    if (/\.pdf$/i.test(file.name)) {
      if (file.size > DFT_IA_MAX_MB * 1048576) {
        throw new Error(`${file.name} tem ${iaKB(file.size)} — o limite é ${DFT_IA_MAX_MB} MB.`);
      }
      // o passo 2 aceita um extrato por vez: o novo toma o lugar do anterior
      iaTiraProtoDoCtx();
      IA.ctx.push({
        nome: file.name, tamanho: file.size, papel: 'e-Protocolo', fonte: 'proto',
        base64: await iaLerBase64(file)
      });
      IA.proto = null;
    } else {
      const linhas = await iaLerPlanilha(file);
      if (!linhas.length) throw new Error('A planilha veio vazia.');
      const colunas = linhas[0].map(c => String(c).trim());
      const corpo = linhas.slice(1);
      // pré-seleciona o que parece assunto, órgão, unidade ou contagem
      const sel = new Set();
      colunas.forEach((c, i) => {
        if (/assunto|órg|orgao|unidade|setor|descri|quant|total|volume|qtd/i.test(c)) sel.add(i);
      });
      if (!sel.size) colunas.forEach((c, i) => sel.add(i));
      iaTiraProtoDoCtx();   // a planilha substitui um extrato em PDF anterior
      IA.proto = { nome: file.name, colunas, linhas: corpo, selecionadas: sel };
    }
  } catch (e) {
    IA.erro = e.message;
  }
  telaUnidade(uId, 'mapeamento');
}

function iaPintaStatus() {
  const box = document.getElementById('ia-status');
  if (!box) return;
  if (IA.ocupado) {
    box.innerHTML = `<div class="ia-status"><span class="ia-girando"></span>
      Lendo os documentos e cruzando com o e-Protocolo. Costuma levar de 20 a 60 segundos.</div>`;
  } else if (IA.erro) {
    box.innerHTML = `<div class="banner erro" style="margin:12px 0 0">${E(IA.erro)}</div>`;
  } else {
    box.innerHTML = '';
  }
}

async function iaRodar(uId) {
  const s = st();
  const u = Calc.unidade(s, uId);
  IA.erro = '';
  IA.chave = iaChaveDoArquivo() || IA.chave;
  if (!IA.chave) { IA.erro = 'Informe a chave da API para continuar.'; iaPintaStatus(); return; }
  if (IA.proto && !IA.proto.selecionadas.size) {
    IA.erro = 'Marque ao menos uma coluna do e-Protocolo.'; iaPintaStatus(); return;
  }

  IA.ocupado = true; IA.propostas = null; IA.descartados = null;
  document.getElementById('ia-rodar').disabled = true;
  document.getElementById('ia-resultado').innerHTML = '';
  iaPintaStatus();

  try {
    const r = await iaChamar(u, s);
    IA.propostas = (r.entregas || []).map(e => Object.assign({ _marcada: true }, e));
    IA.descartados = r.descartados || [];
    if (!IA.propostas.length) IA.erro = 'A IA não encontrou entregas com evidência suficiente. Tente incluir mais documentos.';
  } catch (e) {
    // A chamada nem chegou à API: o erro é do navegador, não da Anthropic. Como
    // ele não diz o motivo (por segurança), a mensagem lista o que costuma ser.
    IA.erro = /Failed to fetch|NetworkError|Load failed/i.test(e.message)
      ? 'O navegador não conseguiu chamar a API — a requisição não chegou a sair. As causas comuns, nesta ordem: ' +
        'a página foi aberta direto do disco (file://), e aí é preciso servir a pasta, por exemplo com ' +
        'python3 -m http.server; alguma extensão, antivírus ou proxy da rede bloqueou a chamada; ou a máquina está sem internet.'
      : e.message;
  }
  IA.ocupado = false;
  telaUnidade(uId, 'mapeamento');
}

function iaPintaPropostas(uId) {
  const box = document.getElementById('ia-resultado');
  if (!box || !IA.propostas) return;
  const s = st();
  const u = Calc.unidade(s, uId);
  const perfil = perfilAtual();
  // o destino respeita o perfil: gestor de órgão não escreve fora do próprio órgão
  const orgaosDisp = perfil.id === 'seap' ? s.orgaos : s.orgaos.filter(o => o.id === perfil.orgao);
  const pendentes = IA.propostas.filter(p => !p._importada);
  const jaImp = IA.propostas.length - pendentes.length;

  const cards = IA.propostas.map((p, i) => {
    const conf = (p.confianca || 'media').toLowerCase();
    if (p._importada) {
      return `<div class="card prop-card importada" data-prop="${i}">
        <div class="prop-topo">
          <span class="prop-ok">${ICO('docok', 'ico mini-ico')}</span>
          <h4>${E(p.titulo || 'Sem título')}</h4>
        </div>
        <p class="prop-desc">Importada para ${E(p._destino)}.</p>
      </div>`;
    }
    return `<div class="card prop-card ${p._marcada ? '' : 'desmarcada'}" data-prop="${i}">
      <div class="prop-topo">
        <input type="checkbox" class="prop-chk" data-i="${i}" ${p._marcada ? 'checked' : ''}
          title="Selecionar esta entrega para importar">
        <h4>${E(p.titulo || 'Sem título')}</h4>
      </div>
      <p class="prop-desc">${E(p.descricao || '')}</p>
      <div class="prop-just">
        <b>Por que é entrega:</b> ${E(p.justificativa || '—')}<br>
        <b>Evidência:</b> ${E(p.fonte || '—')}
      </div>
      <div class="prop-meta">
        <span class="badge mini badge-conf-${conf}">confiança ${E(conf)}</span>
        <span class="badge mini badge-azul">${p.tipo === 'apoio' ? 'apoio' : 'finalística'}</span>
        ${p.unidadeVolume ? `<span class="badge mini badge-azul">conta: ${E(p.unidadeVolume)}</span>` : ''}
      </div>
      <div class="prop-edit">
        <input type="text" class="input prop-titulo" data-i="${i}" value="${E(p.titulo || '')}"
          title="Título que será cadastrado">
        <input type="number" class="input prop-vol" data-i="${i}" min="0"
          value="${p.volumeEstimado == null ? '' : p.volumeEstimado}" placeholder="volume">
        <select class="input prop-per" data-i="${i}">
          <option value="mensal" ${p.periodicidade !== 'anual' ? 'selected' : ''}>por mês</option>
          <option value="anual" ${p.periodicidade === 'anual' ? 'selected' : ''}>por ano</option>
        </select>
      </div>
    </div>`;
  }).join('');

  const desc = (IA.descartados && IA.descartados.length) ? `
    <div class="card card-larga">
      <details class="ia-descartados">
        <summary>${IA.descartados.length} candidatos que a IA descartou — vale conferir o critério</summary>
        <ul>${IA.descartados.map(d =>
          `<li><b>${E(d.assunto || '')}</b> — ${E(d.motivo || '')}</li>`).join('')}</ul>
      </details>
    </div>` : '';

  box.innerHTML = `
    <div class="card card-larga">
      <h3>${pendentes.length} entregas propostas ${jaImp ? `· ${jaImp} já importada(s)` : ''}</h3>
      <p class="muted" style="font-size:13px">Nada foi gravado ainda. Marque as que quiser,
        ajuste título e volume, escolha a unidade de destino e importe. As propostas ficam
        aqui até você sair da aba, então dá para importar em levas.</p>
      <div class="form-grid" style="margin-top:12px">
        <label>Órgão de destino
          <select id="ia-orgao" class="input">${orgaosDisp.map(o =>
            `<option value="${E(o.id)}" ${o.id === u.orgao ? 'selected' : ''}>${E(o.nome)}</option>`).join('')}</select></label>
        <label>Unidade de destino ${tipInfo('A entrega é um ativo do Estado, não da unidade — por isso o destino é escolhido aqui e pode ser diferente da unidade analisada.')}
          <select id="ia-unidade" class="input"></select></label>
      </div>
      <div class="acoes">
        <button class="btn" id="ia-cadastrar">Importar selecionadas</button>
        <button class="btn btn-sec" id="ia-alterna">Marcar / desmarcar todas</button>
      </div>
      <p class="nota-calculo" id="ia-resumo-imp"></p>
    </div>
    <div class="grid-cards">${cards}</div>
    ${desc}`;

  box.querySelectorAll('.prop-chk').forEach(c => c.addEventListener('change', () => {
    IA.propostas[Number(c.dataset.i)]._marcada = c.checked;
    c.closest('.prop-card').classList.toggle('desmarcada', !c.checked);
  }));
  box.querySelectorAll('.prop-titulo').forEach(t => t.addEventListener('input', () => {
    IA.propostas[Number(t.dataset.i)].titulo = t.value;
  }));
  box.querySelectorAll('.prop-vol').forEach(t => t.addEventListener('input', () => {
    IA.propostas[Number(t.dataset.i)].volumeEstimado = t.value === '' ? null : Number(t.value);
  }));
  box.querySelectorAll('.prop-per').forEach(t => t.addEventListener('change', () => {
    IA.propostas[Number(t.dataset.i)].periodicidade = t.value;
  }));

  // órgão → unidade em cascata, no mesmo padrão do vínculo de entregas
  const selO = document.getElementById('ia-orgao');
  const selU = document.getElementById('ia-unidade');
  const preencheU = () => {
    const us = s.unidades.filter(x => x.orgao === selO.value &&
      (!perfil.unidadeId || x.id === perfil.unidadeId));
    selU.innerHTML = us.map(x =>
      `<option value="${x.id}" ${x.id === uId ? 'selected' : ''}>${E(x.sigla)} — ${E(x.nome)}</option>`
    ).join('') || '<option value="">— sem unidade disponível —</option>';
    selU.dispatchEvent(new Event('change', { bubbles: true }));
  };
  selO.addEventListener('change', preencheU);
  preencheU();

  const resumo = () => {
    const n = IA.propostas.filter(p => p._marcada && !p._importada).length;
    document.getElementById('ia-resumo-imp').textContent = n
      ? `${n} entrega(s) selecionada(s) para importar.`
      : 'Nenhuma entrega selecionada.';
  };
  resumo();
  box.querySelectorAll('.prop-chk').forEach(c => c.addEventListener('change', resumo));

  document.getElementById('ia-alterna').addEventListener('click', () => {
    const alvos = IA.propostas.filter(p => !p._importada);
    const todas = alvos.every(p => p._marcada);
    alvos.forEach(p => { p._marcada = !todas; });
    iaPintaPropostas(uId);
  });
  document.getElementById('ia-cadastrar').addEventListener('click', () => iaCadastrar(uId));
}

function iaCadastrar(uId) {
  const s = st();
  const destinoId = document.getElementById('ia-unidade').value;
  if (!destinoId) { alert('Escolha a unidade de destino.'); return; }
  const destino = Calc.unidade(s, destinoId);

  const escolhidas = IA.propostas.filter(p =>
    p._marcada && !p._importada && String(p.titulo || '').trim());
  if (!escolhidas.length) { alert('Marque ao menos uma entrega para importar.'); return; }

  // o sistema já sabe reconhecer entrega equivalente pelo título — não duplica
  const repetidas = escolhidas.filter(p =>
    Calc.entregaEquivalente(s, destinoId, { titulo: p.titulo }));
  if (repetidas.length && !confirm(
    `${repetidas.length} entrega(s) com título equivalente já existem em ${destino.sigla}: ` +
    repetidas.map(p => '"' + p.titulo + '"').join(', ') +
    '.\n\nImportar assim mesmo? Elas ficarão duplicadas.')) return;

  if (!confirm(`Importar ${escolhidas.length} entrega(s) para ${destino.orgao} / ${destino.sigla}?`)) return;

  escolhidas.forEach(p => {
    const v = Number(p.volumeEstimado) || 0;
    const anual = p.periodicidade === 'anual';
    s.entregas.push({
      id: Store.novoId('e', s.entregas),
      unidadeId: destinoId,
      titulo: String(p.titulo).trim(),
      descricao: String(p.descricao || '').trim(),
      cargos: [],
      volumeMensal: anual ? v / 12 : v,
      periodicidade: anual ? 'anual' : 'mensal',
      volumeInformado: v,
      demandaReprimida: 0,
      mesRef: `${s.anoReferencia}-01`,
      percentualManual: null,
      categoriasAtividade: null,
      automacao: { horizonteAnos: 5 }
    });
    p._importada = true;
    p._marcada = false;
    p._destino = `${destino.orgao} / ${destino.sigla}`;
  });
  Store.salvar();
  iaPintaPropostas(uId);   // as propostas restantes continuam na tela
}

}
