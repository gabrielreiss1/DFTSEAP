/* ===== plano.js ===== */
/* ============================================================
   DFT — Plano de Adequação (motor)
   Etapa 1 · gestão do tempo — redução do absenteísmo e ganho de produtividade
   Etapa 2 · remanejamento interno (excesso → falta, mesmo cargo)
   Etapa 3 · retorno de cedidos
   + medidas com impacto financeiro (tela própria), concurso do ciclo e alocação das vagas.

   Todo o motor trabalha sobre o dimensionamento já existente (Calc.dimensionar):
   o plano NÃO redefine o cálculo, ele desloca as variáveis que o alimentam
   (ITP, horas necessárias e quadro ativo) e mostra quanto do gap isso resolve.
   ============================================================ */

const Plano = (() => {
  const ANOS_PLANO = 5;
  const ITP_TETO = 0.98; // nenhuma gestão zera ausências: teto de aproveitamento

  /* ---------- base: dimensionamento de todas as unidades com dados ---------- */
  let cache = null;
  function linhasBase(s) {
    if (cache && cache.rev === Store.rev && cache.ano === s.anoReferencia) return cache.dados;
    const dados = [];
    const comDados = new Set([...s.producao.map(p => p.unidadeId), ...s.historico.map(h => h.unidadeId)]);
    [...comDados].forEach(uId => {
      const u = Calc.unidade(s, uId);
      if (!u) return;
      const modo = u.metodo === 'Comparação entre Pares' ? 'pares'
        : u.metodo.includes('Esforço') ? 'esforco' : 'historico';
      Calc.lotacaoUnidade(s, uId).forEach(l => {
        try {
          const d = Calc.dimensionar(s, uId, l.cargoId, { criterio: 'mediana', ano: s.anoReferencia, modo });
          if (d.necessarios > 0) dados.push({ unidade: u, unidadeId: uId, cargoId: l.cargoId, d });
        } catch (e) { /* cargo sem dados suficientes */ }
      });
    });
    cache = { rev: Store.rev, ano: s.anoReferencia, dados };
    return dados;
  }

  /* ---------- escopo ---------- */
  // escopo = { nivel:'estado'|'orgao'|'unidade', orgao, unidadeId, cargoId, permitidas:Set }
  function unidadesEscopo(s, escopo) {
    let us = s.unidades;
    if (escopo.permitidas) us = us.filter(u => escopo.permitidas.has(u.id));
    if (escopo.orgao) us = us.filter(u => u.orgao === escopo.orgao);
    if (escopo.unidadeId) us = us.filter(u => u.id === escopo.unidadeId);
    return us;
  }
  function linhasEscopo(s, escopo) {
    const ids = new Set(unidadesEscopo(s, escopo).map(u => u.id));
    return linhasBase(s).filter(x => ids.has(x.unidadeId) && (!escopo.cargoId || x.cargoId === escopo.cargoId));
  }
  function rotuloEscopo(s, escopo) {
    if (escopo.unidadeId) {
      const u = Calc.unidade(s, escopo.unidadeId);
      return u ? `${u.orgao} / ${u.sigla}` : 'Unidade';
    }
    if (escopo.orgao) return escopo.orgao;
    return 'Estado do Paraná';
  }

  /* ---------- totais de um conjunto de linhas ---------- */
  function totaliza(linhas, campoAtuais, campoNec) {
    const a = campoAtuais || 'atuais', n = campoNec || 'necessarios';
    let atuais = 0, nec = 0, deficit = 0, superavit = 0;
    linhas.forEach(l => {
      atuais += l[a]; nec += l[n];
      const saldo = l[a] - l[n];
      if (saldo < 0) deficit += -saldo; else superavit += saldo;
    });
    return {
      atuais, necessarios: nec, deficit, superavit, saldo: atuais - nec,
      adequacao: nec > 0 ? atuais / nec * 100 : null
    };
  }
  const deficitDe = linhas => linhas.reduce((a, l) => a + Math.max(0, l.necAtual - l.atuaisAtual), 0);

  /* ---------- cessões, temporários e aposentadorias do escopo ---------- */
  function pessoalEscopo(s, escopo) {
    const us = unidadesEscopo(s, escopo);
    const ids = new Set(us.map(u => u.id));
    const noEscopo = x => ids.has(x.unidadeId) && (!escopo.cargoId || x.cargoId === escopo.cargoId);
    const todos = s.servidores.filter(noEscopo);
    return {
      unidades: us,
      cedidos: todos.filter(Calc.cedido),
      recebidos: todos.filter(Calc.recebido),
      temporarios: todos.filter(x => x.regime === 'Temporário' && !Calc.cedido(x)),
      ativos: todos.filter(x => !Calc.cedido(x))
    };
  }
  function aposentaveis(s, escopo, anos) {
    const p = pessoalEscopo(s, escopo);
    const limite = s.anoReferencia + (anos || ANOS_PLANO);
    return p.ativos.filter(x => {
      const a = Calc.aposEstimada(s, x);
      return a && a <= limite;
    });
  }

  /* ---------- distribuição do retorno de cedidos ----------
     Prioriza quem tem mais falta: a cada pessoa devolvida, escolhe o par
     unidade/cargo com o maior déficit que ainda tenha cedido disponível. */
  function distribuiRetorno(s, linhas, qtd) {
    const mapa = {};
    if (!qtd || qtd <= 0) return { mapa, aplicados: 0, disponiveis: 0 };
    const pool = linhas.map(l => ({
      chave: l.unidadeId + ':' + l.cargoId,
      disp: Calc.cedidosCargo(s, l.unidadeId, l.cargoId).length,
      gap: l.necAtual - l.atuaisAtual, usados: 0
    })).filter(p => p.disp > 0);
    const disponiveis = pool.reduce((a, p) => a + p.disp, 0);
    let restante = Math.min(qtd, disponiveis);
    const aplicados = restante;
    while (restante > 0) {
      const cand = pool.filter(p => p.usados < p.disp);
      if (!cand.length) break;
      cand.sort((a, b) => (b.gap - b.usados) - (a.gap - a.usados));
      cand[0].usados++;
      restante--;
    }
    pool.forEach(p => { if (p.usados) mapa[p.chave] = p.usados; });
    return { mapa, aplicados, disponiveis };
  }

  /* ---------- Parte 3: remanejamento interno ----------
     Premissa automática: tira do par unidade/cargo com MAIOR excesso e leva
     para o de MAIOR falta do mesmo cargo, até equilibrar (ou até o limite de X pessoas). */
  // `aplicar = false` roda o mesmo algoritmo sem gravar nada nas linhas (simulação seca):
  // é assim que a tela mostra QUANTAS movimentações seriam possíveis sem o limite.
  function remanejar(linhas, cfg, aplicar) {
    const movimentos = [];
    if (!cfg || !cfg.ativo) return { movimentos, total: 0, ganho: 0 };
    const limite = cfg.maxPessoas == null ? Infinity : Math.max(0, cfg.maxPessoas);
    let restante = limite, ganho = 0;
    // agrupa por cargo (+ órgão, quando o remanejamento não pode cruzar órgãos)
    const grupos = {};
    linhas.forEach(l => {
      const k = l.cargoId + (cfg.mesmoOrgao ? '|' + l.unidade.orgao : '');
      (grupos[k] = grupos[k] || []).push(l);
    });
    Object.values(grupos).forEach(g => {
      if (g.length < 2) return;
      const est = g.map(l => ({ l, saldo: l.atuaisAtual - l.necAtual, movido: 0 }));
      for (let i = 0; i < 500 && restante > 0; i++) {
        const doadores = est.filter(e => e.saldo >= 1).sort((a, b) => b.saldo - a.saldo);
        const receptores = est.filter(e => e.saldo <= -0.5).sort((a, b) => a.saldo - b.saldo);
        if (!doadores.length || !receptores.length) break;
        const d = doadores[0], r = receptores[0];
        const n = Math.min(Math.floor(d.saldo), Math.ceil(-r.saldo), restante);
        if (n <= 0) break;
        ganho += Math.min(n, -r.saldo);
        d.saldo -= n; r.saldo += n; d.movido -= n; r.movido += n;
        restante -= n;
        const ja = movimentos.find(m => m.cargoId === d.l.cargoId && m.origemId === d.l.unidadeId && m.destinoId === r.l.unidadeId);
        if (ja) ja.qtd += n;
        else movimentos.push({
          cargoId: d.l.cargoId, origem: d.l.unidade, origemId: d.l.unidadeId,
          destino: r.l.unidade, destinoId: r.l.unidadeId, qtd: n
        });
      }
      if (aplicar !== false) est.forEach(e => { e.l.remanejado = (e.l.remanejado || 0) + e.movido; });
    });
    return { movimentos, total: movimentos.reduce((a, m) => a + m.qtd, 0), ganho };
  }

  // Teto físico do remanejamento no escopo: quantas pessoas seria possível movimentar
  // ignorando o limite manual (mas respeitando a regra de não cruzar órgãos, se ligada).
  function remanejamentoPossivel(linhas, cfg) {
    if (!cfg || !cfg.ativo) return { movimentos: [], total: 0, ganho: 0 };
    return remanejar(linhas, { ...cfg, maxPessoas: null }, false);
  }

  /* ---------- Parte 1 + 3: simulação completa ---------- */
  function simular(s, escopo, cfg) {
    const alav = cfg.alavancas || {};
    const base = linhasEscopo(s, escopo);
    const ano = s.anoReferencia;

    // 1) estado inicial de cada par unidade/cargo
    const linhas = base.map(x => {
      const d = x.d;
      const abs = Calc.absenteismoCargo(s, x.unidadeId, x.cargoId, ano);
      // Produtividade em unidades por hora efetiva. A relação é exata:
      //   necessários ÷ atuais = un/h ALVO ÷ un/h ATUAL — ou seja, o gap de pessoas
      //   É o gap de produtividade. É essa leitura que orienta a alocação das vagas.
      const capacidadeAtual = d.atuais * d.horasMensais * d.itp.itp;
      return {
        unidade: x.unidade, unidadeId: x.unidadeId, cargoId: x.cargoId, d,
        atuais: d.atuais, necessarios: d.necessarios, saldo: d.saldo,
        horas: d.horasNecessarias, hm: d.horasMensais, itp: d.itp.itp,
        demandaMensal: d.demandaMensal,
        prodAtual: capacidadeAtual > 0 ? d.demandaMensal / capacidadeAtual : null,
        prodAlvo: d.horasNecessarias > 0 ? d.demandaMensal / d.horasNecessarias : null,
        taxaAbs: abs ? abs.taxa : 0, diasAbs: abs ? abs.dias : null,
        cedidos: Calc.cedidosCargo(s, x.unidadeId, x.cargoId).length,
        custoMedio: d.atuais > 0 ? d.custoMensal / d.atuais : Calc.custoMedioCargo(s, x.cargoId),
        atuaisAtual: d.atuais, necAtual: d.necessarios, remanejado: 0
      };
    });

    const passo0 = deficitDe(linhas);
    const totaisBase = totaliza(linhas.map(l => ({ atuais: l.atuais, necessarios: l.necessarios })));

    // 2) alavanca A — redução do absenteísmo (devolve horário disponível → sobe o ITP)
    const redAbs = Math.max(0, Math.min(100, alav.absenteismoPct || 0));
    linhas.forEach(l => {
      l.itpNovo = Math.min(ITP_TETO, l.itp + l.taxaAbs * redAbs / 100);
      l.necAtual = l.hm * l.itpNovo > 0 ? l.horas / (l.hm * l.itpNovo) : l.necAtual;
    });
    const passoAbs = deficitDe(linhas);

    // 3) alavanca B — ganho de produtividade (menos horas para a mesma entrega)
    const redProd = Math.max(0, Math.min(100, alav.produtividadePct || 0));
    linhas.forEach(l => {
      l.horasNovas = l.horas / (1 + redProd / 100);
      l.necAtual = l.hm * l.itpNovo > 0 ? l.horasNovas / (l.hm * l.itpNovo) : l.necAtual;
    });
    const passoProd = deficitDe(linhas);

    // 4) Parte 2 — remanejamento interno (excesso → falta, mesmo cargo)
    //    Antes de aplicar, mede o TETO: quantas pessoas caberiam sem o limite manual.
    //    É a diferença entre o que o plano fez e o que ainda seria possível fazer.
    const remPossivel = remanejamentoPossivel(linhas, cfg.remanejamento);
    const rem = remanejar(linhas, cfg.remanejamento);
    linhas.forEach(l => { l.atuaisAtual = l.atuais + (l.remanejado || 0); });
    const passoRem = deficitDe(linhas);

    // 5) Parte 3 — retorno de cedidos (voltam ao quadro ativo da própria unidade,
    //    já considerando o que o remanejamento resolveu)
    const ret = distribuiRetorno(s, linhas, alav.retornoCedidos || 0);
    linhas.forEach(l => {
      l.retorno = ret.mapa[l.unidadeId + ':' + l.cargoId] || 0;
      l.atuaisAtual = l.atuais + (l.remanejado || 0) + l.retorno;
    });
    const passoRet = deficitDe(linhas);

    linhas.forEach(l => {
      l.necessariosNovos = l.necAtual;
      l.atuaisNovos = l.atuaisAtual;
      l.saldoNovo = l.atuaisAtual - l.necAtual;
      l.fatorNec = l.necessarios > 0 ? l.necAtual / l.necessarios : 1;
      // alvo de produtividade DEPOIS do plano (a alavanca de produtividade sobe o alvo)
      l.prodAlvoPlano = l.horasNovas > 0 ? l.demandaMensal / l.horasNovas : l.prodAlvo;
      const capNova = l.atuaisNovos * l.hm * (l.itpNovo || l.itp);
      l.prodAtualPlano = capNova > 0 ? l.demandaMensal / capNova : null;
    });
    const totaisFinais = totaliza(linhas.map(l => ({ atuais: l.atuaisNovos, necessarios: l.necessariosNovos })));

    // cascata em 5 barras: a etapa 1 é aberta nas suas duas dimensões
    const waterfall = [
      { label: 'Necessidade atual', valor: passo0, tipo: 'inicio', nota: 'soma dos déficits de cada unidade/cargo' },
      {
        label: 'Etapa 1 · Gestão do tempo', valor: -(passo0 - passoProd), tipo: 'delta',
        nota: `absenteísmo −${redAbs}% · produtividade +${redProd}%`,
        partes: [
          { nome: 'Redução do absenteísmo', valor: passo0 - passoAbs },
          { nome: 'Ganho de produtividade', valor: passoAbs - passoProd }
        ]
      },
      { label: 'Etapa 2 · Remanejamento interno', valor: -(passoProd - passoRem), tipo: 'delta', nota: `${rem.total} de ${remPossivel.total} movimentação(ões) possível(is)` },
      { label: 'Etapa 3 · Retorno de cedidos', valor: -(passoRem - passoRet), tipo: 'delta', nota: `${ret.aplicados} de ${ret.disponiveis} cedidos com efeito no dimensionamento` },
      { label: 'Necessidade residual', valor: passoRet, tipo: 'fim', nota: 'o que ainda depende de provimento (concurso)' }
    ];

    return {
      linhas, escopo, waterfall, movimentos: rem.movimentos, remanejamentoTotal: rem.total,
      // teto do remanejamento no escopo (sem limite manual) — a tela mostra o quanto ainda cabe
      remanejamentoPossivel: remPossivel.total,
      remanejamentoGanhoPossivel: remPossivel.ganho,
      remanejamentoMovimentosPossiveis: remPossivel.movimentos.length,
      retorno: ret, totaisBase, totaisFinais,
      ganhos: {
        inicial: passo0,
        absenteismo: passo0 - passoAbs,
        produtividade: passoAbs - passoProd,
        etapa1: passo0 - passoProd,
        remanejamento: passoProd - passoRem,
        retorno: passoRem - passoRet,
        residual: passoRet,
        resolvidoPct: passo0 > 0 ? (passo0 - passoRet) / passo0 * 100 : null
      }
    };
  }

  /* ---------- Parte 2: medidas com impacto financeiro ---------- */
  // Todas comparam o cenário da medida com a alternativa de não fazer nada,
  // usando o custo médio automático do cargo (remuneração + encargos + benefícios).
  function medidasFinanceiras(s, escopo, cfg) {
    const cp = s.custoParams || {};
    const custoVaga = cp.custoVaga != null ? cp.custoVaga : 0;
    const abonoPct = cp.abonoPermanenciaPct != null ? cp.abonoPermanenciaPct : 14;
    const p = pessoalEscopo(s, escopo);
    // memo por cargo: sem isso o custo era recalculado servidor a servidor
    // (varredura do quadro inteiro do Estado a cada um) e a tela travava.
    // Toda substituição por EFETIVO abre vaga nova de concurso: o custo é o de
    // INGRESSO (salário inicial da carreira), não a média do quadro.
    const memoMedio = {};
    const medioDoCargo = cId => memoMedio[cId] != null ? memoMedio[cId]
      : (memoMedio[cId] = Calc.custoIngresso(s, cId));
    const cfgM = cfg.medidas || {};

    // Cada medida separa o que é RECORRENTE (folha, 13 folhas/ano) do que é ÚNICO
    // (certame), e o que ela EVITA nas duas naturezas — só assim o líquido faz sentido.
    const monta = (id, titulo, universo, calcula, extra) => {
      const conf = cfgM[id] || {};
      const total = universo.length;
      const qtd = Math.max(0, Math.min(total, conf.qtd == null ? total : conf.qtd));
      const alvos = universo.slice(0, qtd);
      const r = calcula(alvos);
      const folhaAnual = r.folhaMensal * 13;
      const evitadoAnual = r.evitadoAnual || 0;
      const liquidoAnual = folhaAnual - evitadoAnual;
      return {
        id, titulo, ativo: !!conf.ativo, total, qtd,
        folhaMensal: r.folhaMensal, folhaAnual,
        unico: r.unico, evitadoAnual, evitadoUnico: r.evitadoUnico || 0,
        liquidoAnual, primeiroAno: liquidoAnual + r.unico - (r.evitadoUnico || 0),
        detalhe: r.detalhe, ...(extra || {})
      };
    };

    // 4) substituição de cedidos por efetivos — quem está em exercício vindo de outro
    //    órgão volta à origem e a vaga é ocupada por servidor efetivo do próprio quadro.
    const mCedidos = monta('cedidosPorEfetivos', 'Substituição de cedidos por efetivos', p.recebidos, alvos => {
      const delta = Calc.sum(alvos.map(x => medioDoCargo(x.cargoId) - Calc.custoServidor(s, x)));
      return {
        folhaMensal: delta, unico: alvos.length * custoVaga,
        detalhe: 'Diferença entre a folha do efetivo ingressante (salário inicial da carreira) e a do cedido em exercício, mais o custo do certame por vaga. O quadro não muda de tamanho — muda o vínculo.'
      };
    });

    // 5) substituição de temporários por efetivos
    const mTemp = monta('temporariosPorEfetivos', 'Substituição de temporários por efetivos', p.temporarios, alvos => {
      const delta = Calc.sum(alvos.map(x => medioDoCargo(x.cargoId) - Calc.custoServidor(s, x)));
      return {
        folhaMensal: delta, unico: alvos.length * custoVaga,
        detalhe: 'Diferença de folha entre o efetivo ingressante (salário inicial da carreira) e o contrato temporário, mais o custo do certame por vaga. Troca vínculo precário por vínculo estável.'
      };
    });

    // 6) permanência de servidores aposentados — abono de permanência evita a saída
    //    (e evita o custo de suprir a vaga por concurso).
    const anosPerm = (cfgM.permanenciaAposentados && cfgM.permanenciaAposentados.anos) || ANOS_PLANO;
    const universoApos = aposentaveis(s, escopo, anosPerm);
    const mApos = monta('permanenciaAposentados', 'Permanência de servidores aposentados', universoApos, alvos => {
      const folha = Calc.sum(alvos.map(x => Calc.custoServidor(s, x)));
      const abono = Calc.sum(alvos.map(x => (x.remuneracao || 0) * abonoPct / 100));
      return {
        folhaMensal: folha + abono, unico: 0,
        evitadoAnual: Calc.sum(alvos.map(x => medioDoCargo(x.cargoId) * 13)),
        evitadoUnico: alvos.length * custoVaga,
        detalhe: `Folha mantida + abono de permanência (${abonoPct}% da remuneração). Evita a folha do ingressante (salário inicial da carreira) e o certame de suprir a mesma vaga por concurso.`
      };
    }, { anos: anosPerm, abonoPct });

    const itens = [mCedidos, mTemp, mApos];
    const ativos = itens.filter(x => x.ativo);
    return {
      itens, universo: p,
      totais: {
        pessoas: Calc.sum(ativos.map(x => x.qtd)),
        folhaAnual: Calc.sum(ativos.map(x => x.folhaAnual)),
        unico: Calc.sum(ativos.map(x => x.unico)),
        evitadoAnual: Calc.sum(ativos.map(x => x.evitadoAnual)),
        evitadoUnico: Calc.sum(ativos.map(x => x.evitadoUnico)),
        primeiroAno: Calc.sum(ativos.map(x => x.primeiroAno)),
        liquidoAnual: Calc.sum(ativos.map(x => x.liquidoAnual))
      }
    };
  }

  /* ---------- Módulo concurso: um certame para o ciclo ----------
     Premissa: provimento PERIÓDICO é melhor que pontual, e o ciclo é PLURIANUAL —
     um único certame (modelo CNU) dimensionado pela necessidade projetada ao FIM do
     horizonte, com as nomeações escalonadas: o edital sai num ano e as posses
     acontecem alguns anos depois, em levas (ex.: edital em 2026, nomeações de 2029 em diante).
     Dois modos:
      · 'teto'    — a SEAP fixa o valor do ciclo e o sistema diz quantas vagas cabem;
      · 'demanda' — o sistema calcula as vagas para atingir X% de cobertura e diz o valor.
     Em ambos, a distribuição sempre alimenta primeiro o cargo com a MENOR cobertura
     (tende à média) e nenhum cargo passa do percentual-alvo — ninguém é 100% resolvido. */
  function alocaVagas(cargos, teto, pctAlvo) {
    const vagas = {};
    let gasto = 0;
    // cobertura do cargo = quanto da necessidade já está atendida. Como o déficit é
    // somado unidade a unidade, o superávit de uma unidade não mascara a falta de outra.
    const adeq = c => c.necessarios > 0 ? (c.cobertos + (vagas[c.cargoId] || 0)) / c.necessarios * 100 : 1e9;
    for (let i = 0; i < 20000; i++) {
      const cands = cargos.filter(c => c.necessarios > 0 && adeq(c) < pctAlvo - 1e-9 &&
        (teto == null || gasto + c.custoUnit <= teto));
      if (!cands.length) break;
      cands.sort((a, b) => adeq(a) - adeq(b));
      const c = cands[0];
      vagas[c.cargoId] = (vagas[c.cargoId] || 0) + 1;
      gasto += c.custoUnit;
    }
    return { vagas, gasto };
  }

  function planoConcurso(s, escopo, cfg, sim) {
    const cc = cfg.concurso || {};
    const cp = s.custoParams || {};
    const custoVaga = cc.incluirCertame === false ? 0 : (cp.custoVaga != null ? cp.custoVaga : 0);
    const horizonte = Math.max(1, Math.min(ANOS_PLANO, cc.horizonte || ANOS_PLANO));
    const pctAlvo = Math.max(1, Math.min(100, cc.pctAdequacao || 90));
    const anoEdital = cc.anoEdital || (s.anoReferencia + 1);
    const defasagem = Math.max(0, cc.defasagemNomeacao != null ? cc.defasagemNomeacao : 2);
    const duracao = Math.max(1, cc.duracaoNomeacoes || 3);
    const idsEscopo = new Set(unidadesEscopo(s, escopo).map(u => u.id));
    const linhas = sim.linhas;
    const comAlavancas = cc.aplicarAlavancas !== false;
    const anual = cc.periodicidade !== 'ciclo'; // padrão: um certame POR ANO

    // Custo da VAGA NOVA = salário INICIAL da carreira (quem ingressa entra na primeira
    // referência), não a média do quadro — que embute progressões de quem já está na casa.
    // O custo médio continua calculado, mas só como comparação na tela.
    const cargosIds = [...new Set(linhas.map(l => l.cargoId))];
    const custoMedio = {}, custoIngressoCargo = {}, custoUnitario = {};
    cargosIds.forEach(c => {
      custoMedio[c] = Calc.custoMedioCargo(s, c, idsEscopo);
      custoIngressoCargo[c] = Calc.custoIngresso(s, c);
      custoUnitario[c] = custoIngressoCargo[c] * 13 + custoVaga;
    });

    // Necessidade e déficit por cargo em um HORIZONTE h (1 a 5 anos à frente).
    // No modo anual isto é recalculado a cada ano: o certame de cada exercício olha
    // para o déficit projetado do ano em que aquela turma toma posse.
    const estadoNoHorizonte = h => cargosIds.map(cId => {
      const doCargo = linhas.filter(l => l.cargoId === cId);
      let nec = 0, def = 0, apos = 0, necHoje = 0, defHoje = 0;
      doCargo.forEach(l => {
        const pj = l.d.projetado && l.d.projetado[h];
        const fatorLinha = comAlavancas && l.necessarios > 0 ? l.necessariosNovos / l.necessarios : 1;
        const necT = (pj && pj.necessarios ? pj.necessarios : l.necessarios) * fatorLinha;
        const aposT = pj ? (pj.aposentadorias || 0) : 0;
        const ajuste = comAlavancas ? l.atuaisNovos - l.atuais : 0;
        const baseAtuais = cc.considerarAposentadorias !== false && pj && pj.atuais != null ? pj.atuais : l.atuais;
        const atuaisT = Math.max(0, baseAtuais + ajuste);
        nec += necT; apos += aposT;
        necHoje += comAlavancas ? l.necessariosNovos : l.necessarios;
        defHoje += Math.max(0, comAlavancas ? l.necessariosNovos - l.atuaisNovos : l.necessarios - l.atuais);
        def += Math.max(0, necT - atuaisT); // déficit somado unidade a unidade
      });
      return {
        cargoId: cId, necessarios: nec, necessariosHoje: necHoje, deficit: def, deficitHoje: defHoje,
        cobertos: Math.max(0, nec - def), aposentadorias: apos,
        custoUnit: custoUnitario[cId], custoMedio: custoMedio[cId],
        custoIngresso: custoIngressoCargo[cId]
      };
    }).filter(e => e.necessarios > 0);

    const tetoCiclo = cc.modo === 'teto' ? Math.max(0, cc.tetoCiclo != null ? cc.tetoCiclo : 0) : null;
    const tetoAnual = cc.modo === 'teto' ? Math.max(0, cc.tetoAnual != null ? cc.tetoAnual : 0) : null;

    // ---------- vagas: um certame por ano (anual) ou um só para o ciclo ----------
    let editais = [];      // [{anoEdital, anoPosse, horizonte, porCargo:[{cargoId, vagas}], gasto}]
    let gastoTotal = 0;
    const vagasAcum = {};  // cargoId → vagas já abertas em editais anteriores

    if (anual) {
      // Um edital por exercício de POSSE. O horizonte define os anos em que se quer gente
      // nova trabalhando (anoRef+1 … anoRef+horizonte); o edital de cada um sai `defasagem`
      // anos antes. Se o edital cairia no passado, aquele ano simplesmente não dá tempo de
      // ser suprido por concurso — e é isso que a tela precisa mostrar, não um número falso.
      for (let h = 1; h <= horizonte; h++) {
        const anoPosse = s.anoReferencia + h;
        const ae = anoPosse - defasagem;
        if (ae < s.anoReferencia) continue; // não há como abrir edital retroativo
        // já providos pelos editais anteriores entram como cobertos: o certame do ano
        // só abre o que ainda falta para chegar ao alvo naquele exercício
        const est = estadoNoHorizonte(h).map(e => ({
          ...e, coberturaBase: e.cobertos,
          cobertos: e.cobertos + (vagasAcum[e.cargoId] || 0)
        }));
        const r = alocaVagas(est, tetoAnual, pctAlvo);
        const doAno = est.map(e => ({
          cargoId: e.cargoId, vagas: r.vagas[e.cargoId] || 0,
          necessarios: e.necessarios, deficit: e.deficit,
          cobertos: e.cobertos, aposentadorias: e.aposentadorias
        })).filter(x => x.vagas > 0);
        doAno.forEach(x => { vagasAcum[x.cargoId] = (vagasAcum[x.cargoId] || 0) + x.vagas; });
        gastoTotal += r.gasto;
        editais.push({
          anoEdital: ae, anoPosse, horizonte: h, porCargo: doAno, gasto: r.gasto,
          // totais do EXERCÍCIO, independentes de ter havido vaga — sem isso a tabela
          // mostraria déficit zero justamente nos anos em que nada foi aberto
          vagas: Calc.sum(doAno.map(x => x.vagas)),
          deficitTotal: Calc.sum(est.map(e => Math.max(0, e.deficit - (vagasAcum[e.cargoId] || 0)))),
          deficitBruto: Calc.sum(est.map(e => e.deficit)),
          comprometidoAntes: Calc.sum(est.map(e => (vagasAcum[e.cargoId] || 0))) - Calc.sum(doAno.map(x => x.vagas))
        });
      }
    } else {
      // Ciclo único (modelo CNU): um edital, nomeações escalonadas em levas.
      const est = estadoNoHorizonte(horizonte);
      const r = alocaVagas(est, tetoCiclo, pctAlvo);
      gastoTotal = r.gasto;
      const anosNomeacao = Array.from({ length: duracao }, (_, i) => anoEdital + defasagem + i);
      est.forEach(e => {
        const v = r.vagas[e.cargoId] || 0;
        if (v > 0) vagasAcum[e.cargoId] = v;
      });
      // as vagas do cargo entram em levas iguais ao longo da duração
      anosNomeacao.forEach((ap, i) => {
        const porCargo = est.map(e => {
          const v = r.vagas[e.cargoId] || 0;
          const base = Math.floor(v / duracao), resto = v - base * duracao;
          return {
            cargoId: e.cargoId, vagas: base + (i < resto ? 1 : 0),
            necessarios: e.necessarios, deficit: e.deficit,
            cobertos: e.cobertos, aposentadorias: e.aposentadorias
          };
        }).filter(x => x.vagas > 0);
        editais.push({ anoEdital, anoPosse: ap, horizonte, porCargo, gasto: i === 0 ? r.gasto : 0, leva: i });
      });
    }

    // ---------- consolidação por cargo ----------
    const estadoFinal = estadoNoHorizonte(horizonte);
    const porCargo = estadoFinal.map(e => {
      const vagas = vagasAcum[e.cargoId] || 0;
      return {
        ...e, vagas,
        adequacaoAntes: e.necessarios > 0 ? e.cobertos / e.necessarios * 100 : null,
        adequacaoDepois: e.necessarios > 0 ? (e.cobertos + vagas) / e.necessarios * 100 : null,
        custoFolhaAnual: vagas * e.custoIngresso * 13, // valores do ano-base, sem reajuste
        custoCertame: vagas * custoVaga
      };
    }).sort((a, b) => b.vagas - a.vagas);

    // ---------- cronograma ano a ano ----------
    // Os valores nascem no ano-base (salário inicial) e recebem o fator de reajuste do
    // ano — inclusive as turmas anteriores, que também são reajustadas.
    const anosLinha = [...new Set(editais.flatMap(e => [e.anoEdital, e.anoPosse]))].sort((a, b) => a - b);
    const acumPosse = {};
    const anos = anosLinha.map(ano => {
      const fator = Calc.fatorReajuste(s, ano);
      const posses = editais.filter(e => e.anoPosse === ano);
      const abertos = editais.filter(e => e.anoEdital === ano);
      const vagasDoAno = {};
      posses.forEach(e => e.porCargo.forEach(x => {
        vagasDoAno[x.cargoId] = (vagasDoAno[x.cargoId] || 0) + x.vagas;
      }));
      const cargosAno = porCargo.map(c => {
        const vagas = vagasDoAno[c.cargoId] || 0;
        acumPosse[c.cargoId] = (acumPosse[c.cargoId] || 0) + vagas;
        const custoUnitAno = c.custoIngresso * fator;
        return {
          cargoId: c.cargoId, vagas, custoMedio: c.custoMedio,
          custoIngresso: c.custoIngresso, custoUnitAno,
          necessarios: c.necessarios, cobertos: c.cobertos, deficit: c.deficit,
          aposentadorias: c.aposentadorias,
          adequacaoAntes: c.adequacaoAntes, adequacaoDepois: c.adequacaoDepois,
          custoFolhaAnual: vagas * custoUnitAno * 13,                              // entram neste ano
          folhaAcumuladaCargo: (acumPosse[c.cargoId] || 0) * custoUnitAno * 13,    // recorrente até aqui
          custoCertame: 0
        };
      });
      const vagasAbertas = Calc.sum(abertos.flatMap(e => e.porCargo.map(x => x.vagas)));
      const certame = vagasAbertas * custoVaga;
      const acum = Calc.sum(cargosAno.map(c => c.folhaAcumuladaCargo));
      const etapa = abertos.length && posses.length ? 'edital + posse'
        : abertos.length ? `edital (${fmtIntSeguro(vagasAbertas)} vaga(s))`
          : 'posse';
      return {
        ano, indice: ano - s.anoReferencia, cargos: cargosAno,
        vagas: Calc.sum(cargosAno.map(c => c.vagas)), vagasAbertas, fatorReajuste: fator,
        etapa, custoCertame: certame,
        custoFolhaAnual: Calc.sum(cargosAno.map(c => c.custoFolhaAnual)),
        folhaAcumulada: acum, impactoAno: acum + certame
      };
    });

    const totalVagas = {};
    porCargo.forEach(c => { totalVagas[c.cargoId] = c.vagas; });
    const necTot = Calc.sum(porCargo.map(c => c.necessarios));
    const cobTot = Calc.sum(porCargo.map(c => c.cobertos));
    const vagTot = Calc.sum(porCargo.map(c => c.vagas));
    const anosNomeacao = [...new Set(editais.map(e => e.anoPosse))].sort((a, b) => a - b);

    return {
      anos, porCargo, editais, custoVaga, pctAlvo, modo: cc.modo || 'teto', totalVagas, custoMedio,
      periodicidade: anual ? 'anual' : 'ciclo',
      horizonte, anoEdital: anual ? (editais[0] || {}).anoEdital || (s.anoReferencia + 1) : anoEdital,
      anosNomeacao: anosNomeacao.length ? anosNomeacao : [s.anoReferencia + 1],
      defasagem, duracao, teto: anual ? tetoAnual : tetoCiclo, tetoAnual, tetoCiclo,
      anoFim: s.anoReferencia + horizonte,
      coberturaAntes: necTot > 0 ? cobTot / necTot * 100 : null,
      coberturaDepois: necTot > 0 ? (cobTot + vagTot) / necTot * 100 : null,
      totais: {
        vagas: vagTot,
        deficit: Calc.sum(porCargo.map(c => c.deficit)),
        certame: Calc.sum(porCargo.map(c => c.custoCertame)),
        folhaAnualCheia: Calc.sum(porCargo.map(c => c.custoFolhaAnual)),
        comprometido: gastoTotal,
        impactoAcumulado: Calc.sum(anos.map(a => a.impactoAno))
      }
    };
  }
  // formatador local (o Plano não depende da camada de UI)
  const fmtIntSeguro = v => Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });

  /* ---------- Módulo alocação: onde lotar cada vaga ----------
     Premissa: cada vaga vai para a unidade com o MAIOR gap remanescente
     daquele cargo (water-filling) — o pior déficit é sempre o próximo atendido. */
  function alocar(s, escopo, plano, sim) {
    const porUnidade = {};
    const anos = plano.anos.map(a => {
      const alocacoes = [];
      a.cargos.forEach(c => {
        if (!c.vagas) return;
        const cand = sim.linhas.filter(l => l.cargoId === c.cargoId).map(l => ({
          l, gap: l.necessariosNovos - l.atuaisNovos - (porUnidade[l.unidadeId + ':' + l.cargoId] || 0), vagas: 0
        }));
        if (!cand.length) return;
        for (let i = 0; i < c.vagas; i++) {
          cand.sort((x, y) => (y.gap - y.vagas) - (x.gap - x.vagas));
          cand[0].vagas++;
        }
        cand.filter(x => x.vagas > 0).forEach(x => {
          const chave = x.l.unidadeId + ':' + x.l.cargoId;
          const antes = x.l.necessariosNovos - x.l.atuaisNovos - (porUnidade[chave] || 0);
          porUnidade[chave] = (porUnidade[chave] || 0) + x.vagas;
          // base = valores do ano de referência (salário inicial); o reajuste entra depois
          const base = x.vagas * (c.custoIngresso != null ? c.custoIngresso : c.custoMedio) * 13;
          alocacoes.push({
            ano: a.ano, cargoId: c.cargoId, unidade: x.l.unidade, unidadeId: x.l.unidadeId,
            vagas: x.vagas, gapAntes: antes, gapDepois: antes - x.vagas,
            custoFolhaAnualBase: base,
            custoFolhaAnual: base * Calc.fatorReajuste(s, a.ano)
          });
        });
      });
      return { ano: a.ano, indice: a.indice, alocacoes, vagas: a.vagas };
    });

    // consolidação por órgão e por cargo, ano a ano (base do Painel Visual).
    // Acumula em valores do ano-base e aplica o reajuste do ano na leitura: assim as
    // levas anteriores também são reajustadas, como acontece na folha real.
    const porOrgaoAno = {}, porCargoAno = {};
    let acumOrgao = {}, acumCargo = {};
    anos.forEach(a => {
      a.alocacoes.forEach(al => {
        acumOrgao[al.unidade.orgao] = (acumOrgao[al.unidade.orgao] || 0) + al.custoFolhaAnualBase;
        acumCargo[al.cargoId] = (acumCargo[al.cargoId] || 0) + al.custoFolhaAnualBase;
      });
      const f = Calc.fatorReajuste(s, a.ano);
      porOrgaoAno[a.ano] = {};
      porCargoAno[a.ano] = {};
      Object.entries(acumOrgao).forEach(([k, v]) => { porOrgaoAno[a.ano][k] = v * f; });
      Object.entries(acumCargo).forEach(([k, v]) => { porCargoAno[a.ano][k] = v * f; });
    });

    return { anos, porOrgaoAno, porCargoAno, totalPorUnidade: porUnidade };
  }

  /* ---------- configuração persistida ---------- */
  function config(s) {
    if (!s.planoAdequacao) {
      s.planoAdequacao = {
        escopo: { nivel: 'estado', orgao: null, unidadeId: null, cargoId: '' },
        alavancas: { absenteismoPct: 0, produtividadePct: 0, retornoCedidos: 0 },
        medidas: {
          cedidosPorEfetivos: { ativo: false, qtd: null },
          temporariosPorEfetivos: { ativo: false, qtd: null },
          permanenciaAposentados: { ativo: false, qtd: null, anos: ANOS_PLANO }
        },
        remanejamento: { ativo: true, maxPessoas: null, mesmoOrgao: true },
        concurso: concursoPadrao(s)
      };
    }
    const c = s.planoAdequacao;
    c.remanejamento = c.remanejamento || { ativo: true, maxPessoas: null, mesmoOrgao: true };
    if (c.remanejamento.mesmoOrgao == null) c.remanejamento.mesmoOrgao = true;
    // migração p/ o ciclo plurianual (antes era um certame por ano)
    c.concurso = Object.assign(concursoPadrao(s), c.concurso || {});
    if (c.concurso.horizonte == null) c.concurso.horizonte = ANOS_PLANO;
    if (c.concurso.tetoCiclo == null) c.concurso.tetoCiclo = c.concurso.tetoAnual || 100000000;
    return c;
  }
  function concursoPadrao(s) {
    return {
      periodicidade: 'anual',
      modo: 'teto', horizonte: ANOS_PLANO, tetoCiclo: 100000000, tetoAnual: 25000000, pctAdequacao: 90,
      anoEdital: (s.anoReferencia || 2026) + 1, defasagemNomeacao: 1, duracaoNomeacoes: 3,
      considerarAposentadorias: true, aplicarAlavancas: true, incluirCertame: true
    };
  }

  return {
    ANOS_PLANO, linhasBase, linhasEscopo, unidadesEscopo, rotuloEscopo, totaliza,
    pessoalEscopo, aposentaveis, simular, remanejar, medidasFinanceiras,
    planoConcurso, alocar, config
  };
})();


/* ===== plano-ui.js ===== */
/* ============================================================
   DFT — Plano de Adequação (telas)
   Aba da barra superior · três módulos:
     #/plano/simulador  — alavancas, waterfall, remanejamento e custo das medidas
     #/plano/concurso   — plano plurianual de provimento (teto ou demanda)
     #/plano/alocacao   — lotação das vagas do concurso pelo maior gap
   ============================================================ */

function subnavPlano(ativo) {
  const s = st();
  const c = Plano.config(s);
  setSubnav('Plano de Adequação', [
    { id: 'simulador', rotulo: 'Plano de Adequação', ico: 'config', ativo: ativo === 'simulador', hash: '#/plano/simulador' },
    { id: 'medidas', rotulo: 'Medidas financeiras', ico: 'dinheiro', ativo: ativo === 'medidas', hash: '#/plano/medidas' },
    { id: 'concurso', rotulo: 'Módulo concurso', ico: 'calend', ativo: ativo === 'concurso', hash: '#/plano/concurso' },
    { id: 'alocacao', rotulo: 'Módulo alocação', ico: 'predio', ativo: ativo === 'alocacao', hash: '#/plano/alocacao' }
  ], `<div class="sn-ajuda"><span><strong>Escopo atual</strong>${E(Plano.rotuloEscopo(s, c.escopo))}${c.escopo.cargoId ? ' · ' + E(nomeCargo(c.escopo.cargoId)) : ' · todos os cargos'}</span></div>`);
}

/* ---------- escopo compartilhado pelos três módulos ---------- */
function escopoAtual(s) {
  const c = Plano.config(s);
  const p = perfilAtual();
  const permitidas = new Set(escopoUnidades(s, p).map(u => u.id));
  const e = { ...c.escopo, permitidas };
  // o perfil manda: RH setorial e gestor de unidade não escolhem fora do seu escopo
  if (p.orgao) e.orgao = p.orgao;
  if (p.unidadeId) e.unidadeId = p.unidadeId;
  if (e.nivel === 'estado') { e.orgao = p.orgao || null; e.unidadeId = p.unidadeId || null; }
  if (e.nivel === 'orgao') e.unidadeId = p.unidadeId || null;
  return e;
}

function barraEscopo(s) {
  const c = Plano.config(s);
  const p = perfilAtual();
  const orgaos = p.orgao ? s.orgaos.filter(o => o.id === p.orgao) : s.orgaos;
  const orgaoSel = c.escopo.orgao || (p.orgao || '');
  const unidadesO = s.unidades.filter(u => !orgaoSel || u.orgao === orgaoSel)
    .filter(u => !p.unidadeId || u.id === p.unidadeId);
  const comDados = new Set(Plano.linhasBase(s).map(x => x.unidadeId));
  return `<div class="card card-larga pl-escopo">
    <div class="filtros">
      <label>Nível ${tipInfo('O plano pode ser montado para todo o Estado, para um órgão ou para uma unidade. Os cargos, as alavancas e o custo são recalculados no escopo escolhido.')}
        <select id="pl-nivel" class="input">
          <option value="estado" ${c.escopo.nivel === 'estado' ? 'selected' : ''}>Estado</option>
          <option value="orgao" ${c.escopo.nivel === 'orgao' ? 'selected' : ''}>Órgão / Secretaria</option>
          <option value="unidade" ${c.escopo.nivel === 'unidade' ? 'selected' : ''}>Unidade</option>
        </select></label>
      ${c.escopo.nivel !== 'estado' ? `<label>Órgão
        <select id="pl-orgao" class="input">${orgaos.map(o =>
          `<option value="${E(o.id)}" ${o.id === orgaoSel ? 'selected' : ''}>${E(o.nome)}</option>`).join('')}</select></label>` : ''}
      ${c.escopo.nivel === 'unidade' ? `<label>Unidade
        <select id="pl-unidade" class="input" style="max-width:280px">${unidadesO.map(u =>
          `<option value="${u.id}" ${u.id === c.escopo.unidadeId ? 'selected' : ''}>${E(u.sigla)} — ${E(u.nome)}${comDados.has(u.id) ? '' : ' (sem dimensionamento)'}</option>`).join('')}</select></label>` : ''}
      <label>Cargo
        <select id="pl-cargo" class="input">
          <option value="">Todos os cargos</option>
          ${s.cargos.map(x => `<option value="${x.id}" ${x.id === c.escopo.cargoId ? 'selected' : ''}>${E(x.nome)}</option>`).join('')}
        </select></label>
      <span class="pl-escopo-tag">${ICO('predio')} ${E(Plano.rotuloEscopo(s, escopoAtual(s)))}</span>
    </div>
  </div>`;
}

function ligaBarraEscopo(s, aoMudar) {
  const c = Plano.config(s);
  const set = (campo, valor) => {
    c.escopo[campo] = valor;
    if (campo === 'nivel') {
      if (valor === 'estado') { c.escopo.orgao = null; c.escopo.unidadeId = null; }
      if (valor === 'orgao') c.escopo.unidadeId = null;
      if (valor !== 'estado' && !c.escopo.orgao) c.escopo.orgao = (perfilAtual().orgao || s.orgaos[0].id);
      if (valor === 'unidade' && !c.escopo.unidadeId) {
        const u = s.unidades.find(x => x.orgao === c.escopo.orgao);
        c.escopo.unidadeId = u ? u.id : null;
      }
    }
    if (campo === 'orgao' && c.escopo.nivel === 'unidade') {
      const u = s.unidades.find(x => x.orgao === valor);
      c.escopo.unidadeId = u ? u.id : null;
    }
    Store.salvar();
    aoMudar();
  };
  const liga = (id, campo) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => set(campo, el.value || (campo === 'cargoId' ? '' : null)));
  };
  liga('pl-nivel', 'nivel'); liga('pl-orgao', 'orgao'); liga('pl-unidade', 'unidadeId'); liga('pl-cargo', 'cargoId');
}

/* ============================================================
   Simulador de adequação (partes 1, 2 e 3)
   ============================================================ */
function telaPlano(tab) {
  if (tab === 'medidas') return telaPlanoMedidas();
  if (tab === 'concurso') return telaPlanoConcurso();
  if (tab === 'alocacao') return telaPlanoAlocacao();
  telaPlanoSimulador();
}

function telaPlanoSimulador() {
  const s = st();
  const c = Plano.config(s);
  subnavPlano('simulador');
  const escopo = escopoAtual(s);
  const pess = Plano.pessoalEscopo(s, escopo);
  const cedidosTot = pess.cedidos.length;

  app().innerHTML = `
  ${cabecalhoPagina('Plano de Adequação',
    'Quanto da necessidade de pessoal o Estado resolve com gestão — antes de abrir concurso. ' +
    tipInfo('O plano parte do dimensionamento de cada unidade/cargo (déficit = necessários − atuais) e aplica alavancas de gestão. O gráfico em cascata mostra quanto de cada alavanca abate a necessidade e quanto sobra para provimento.'),
    null, 'Plano de Adequação')}
  ${barraEscopo(s)}
  <div id="pl-kpis"></div>

  <div class="card card-larga">
    <h3 class="card-titulo">Etapa 1 — Gestão do tempo ${tipInfo('Arraste de 0% a 100%. O absenteísmo evitado devolve horário disponível (sobe o ITP) e o ganho de produtividade reduz as horas necessárias para a mesma entrega. As duas dimensões aparecem abertas na primeira coluna do gráfico em cascata.')}</h3>
    <p class="card-sub">Movimente as alavancas para ver o efeito imediato no déficit de ${E(Plano.rotuloEscopo(s, escopo))}.</p>
    <div class="pl-alavancas">
      <div class="pl-alav">
        <div class="pl-alav-cab"><span class="pl-alav-num">1</span>
          <span><strong>Redução do absenteísmo</strong>
          <span class="muted mini">% das ausências evitadas ${tipInfo('A ausência média do cargo (lançada pelo RH setorial) vira horário disponível na proporção escolhida: ITP novo = ITP atual + taxa de absenteísmo × redução. Teto de 98% — nenhuma gestão zera ausências.')}</span></span>
          <output class="pl-alav-val" id="out-abs">${fmtN(c.alavancas.absenteismoPct)}%</output></div>
        <input type="range" class="slider" id="sl-abs" min="0" max="100" step="5" value="${c.alavancas.absenteismoPct || 0}">
      </div>
      <div class="pl-alav">
        <div class="pl-alav-cab"><span class="pl-alav-num">2</span>
          <span><strong>Ganho de produtividade</strong>
          <span class="muted mini">% a mais de entrega por hora ${tipInfo('Horas necessárias ÷ (1 + ganho). Um ganho de 20% significa entregar o mesmo volume com 1/1,2 das horas atuais — ou seja, subir o un/h de referência do cargo.')}</span></span>
          <output class="pl-alav-val" id="out-prod">${fmtN(c.alavancas.produtividadePct)}%</output></div>
        <input type="range" class="slider" id="sl-prod" min="0" max="100" step="5" value="${c.alavancas.produtividadePct || 0}">
      </div>
    </div>
    <div class="pl-acoes-alav">
      <button class="btn-toggle" id="pl-zerar">Zerar tudo</button>
      <button class="btn-toggle" id="pl-moderado">Cenário moderado (10 / 10 / metade dos cedidos)</button>
      <button class="btn-toggle" id="pl-ambicioso">Cenário ambicioso (30 / 25 / todos os cedidos)</button>
    </div>
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Etapa 2 — Remanejamento interno ${tipInfo('Premissa automática: retira do par unidade/cargo com o MAIOR excesso e leva para o de MAIOR falta do mesmo cargo, repetindo até equilibrar ou atingir o limite de pessoas informado.')}</h3>
    <div class="filtros">
      <label class="check"><input type="checkbox" id="pl-rem-ativo" ${c.remanejamento.ativo ? 'checked' : ''}> Aplicar remanejamento interno</label>
      <label>Limite de pessoas ${tipInfo('Em branco = até equilibrar tudo que for possível dentro do escopo.')}
        <input type="number" id="pl-rem-max" class="input num-in curta" min="0" placeholder="sem limite" value="${c.remanejamento.maxPessoas == null ? '' : c.remanejamento.maxPessoas}"></label>
      <label class="check"><input type="checkbox" id="pl-rem-orgao" ${c.remanejamento.mesmoOrgao ? 'checked' : ''}> Somente dentro do mesmo órgão</label>
    </div>
    <div id="pl-rem"></div>
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Etapa 3 — Retorno de cedidos ${tipInfo('Servidores do escopo hoje cedidos a outros órgãos. Ao retornarem, voltam ao quadro ativo da própria unidade de origem — o sistema prioriza quem ainda tem déficit depois do remanejamento.')}</h3>
    <div class="pl-alavancas">
      <div class="pl-alav">
        <div class="pl-alav-cab"><span class="pl-alav-num">3</span>
          <span><strong>Cedidos devolvidos</strong>
          <span class="muted mini">${fmtN(cedidosTot)} cedido(s) no escopo</span></span>
          <output class="pl-alav-val" id="out-ret">${fmtN(Math.min(c.alavancas.retornoCedidos || 0, cedidosTot))}</output></div>
        <input type="range" class="slider" id="sl-ret" min="0" max="${Math.max(1, cedidosTot)}" step="1" value="${Math.min(c.alavancas.retornoCedidos || 0, cedidosTot)}" ${cedidosTot ? '' : 'disabled'}>
      </div>
    </div>
    <p class="nota-calculo" id="pl-ret-nota"></p>
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Da necessidade atual à necessidade residual ${tipInfo('Cascata em cinco degraus: a primeira coluna é a necessidade atual (soma dos déficits); cada etapa abate um pedaço; a última coluna é o que sobra e precisa de provimento — é ela que alimenta o módulo concurso. A coluna da etapa 1 vem aberta nas suas duas dimensões.')}</h3>
    <p class="card-sub" id="pl-wf-sub"></p>
    <div id="pl-wf"></div>
  </div>

  <div class="card card-larga">
    <h3 class="card-titulo">Resultado do plano — déficit e superávit</h3>
    <div class="filtros">
      <div class="vista-sel" style="display:flex;gap:7px;align-items:center">
        <button class="btn-toggle ativo" data-vis="cargo">Por cargo</button>
        <button class="btn-toggle" data-vis="unidade">Por unidade</button>
        <button class="btn-toggle" data-vis="orgao">Por órgão</button>
      </div>
    </div>
    <div id="pl-tab"></div>
  </div>`;

  ligaBarraEscopo(s, telaPlanoSimulador);
  telaPlanoSimulador._vis = telaPlanoSimulador._vis || 'cargo';
  // as medidas da Parte 2 não dependem das alavancas: calcula uma vez por tela
  const fin = Plano.medidasFinanceiras(s, escopoAtual(s), c);

  const atualiza = () => {
    const cfg = Plano.config(s);
    const sim = Plano.simular(s, escopoAtual(s), cfg);
    telaPlanoSimulador._sim = sim;
    desenhaKpisPlano(sim, fin);
    desenhaWaterfall(sim);
    desenhaRemanejamento(sim);
    const nota = document.getElementById('pl-ret-nota');
    if (nota) nota.innerHTML = sim.retorno.aplicados
      ? `<strong>${fmtN(sim.retorno.aplicados)}</strong> cedido(s) devolvido(s) — abatem
         <strong>${fmtN(sim.ganhos.retorno, 1)}</strong> da necessidade. O restante volta para unidades
         que já estão equilibradas: devolver não é o mesmo que resolver falta.`
      : 'Nenhum cedido devolvido nesta simulação.';
    desenhaTabelaPlano(sim, telaPlanoSimulador._vis);
  };
  // arrastar dispara muitos eventos: colapsa os recálculos em um por quadro de vídeo
  let agendado = false;
  const atualizaSuave = () => {
    if (agendado) return;
    agendado = true;
    requestAnimationFrame(() => { agendado = false; atualiza(); });
  };

  // alavancas: recalcula ao arrastar, grava ao soltar (evita gravar 20× por gesto)
  const liga = (idSlider, idOut, campo, fmtOut) => {
    const el = document.getElementById(idSlider);
    if (!el) return;
    el.addEventListener('input', () => {
      c.alavancas[campo] = Number(el.value);
      document.getElementById(idOut).textContent = fmtOut(Number(el.value));
      atualizaSuave();
    });
    el.addEventListener('change', () => Store.salvar());
  };
  liga('sl-abs', 'out-abs', 'absenteismoPct', v => fmtN(v) + '%');
  liga('sl-prod', 'out-prod', 'produtividadePct', v => fmtN(v) + '%');
  liga('sl-ret', 'out-ret', 'retornoCedidos', v => fmtN(v));

  const cenario = (a, p, r) => {
    c.alavancas.absenteismoPct = a; c.alavancas.produtividadePct = p; c.alavancas.retornoCedidos = r;
    Store.salvar(); telaPlanoSimulador();
  };
  document.getElementById('pl-zerar').addEventListener('click', () => cenario(0, 0, 0));
  document.getElementById('pl-moderado').addEventListener('click', () => cenario(10, 10, Math.floor(cedidosTot / 2)));
  document.getElementById('pl-ambicioso').addEventListener('click', () => cenario(30, 25, cedidosTot));

  document.getElementById('pl-rem-ativo').addEventListener('change', e => {
    c.remanejamento.ativo = e.target.checked; Store.salvar(); atualiza();
  });
  document.getElementById('pl-rem-orgao').addEventListener('change', e => {
    c.remanejamento.mesmoOrgao = e.target.checked; Store.salvar(); atualiza();
  });
  document.getElementById('pl-rem-max').addEventListener('input', e => {
    c.remanejamento.maxPessoas = e.target.value === '' ? null : Math.max(0, Number(e.target.value));
    atualizaSuave();
  });
  document.getElementById('pl-rem-max').addEventListener('change', () => Store.salvar());

  app().querySelectorAll('[data-vis]').forEach(b => b.addEventListener('click', () => {
    telaPlanoSimulador._vis = b.dataset.vis;
    app().querySelectorAll('[data-vis]').forEach(x => x.classList.toggle('ativo', x === b));
    desenhaTabelaPlano(telaPlanoSimulador._sim, b.dataset.vis);
  }));

  atualiza();
}

// Cobertura = quanto da necessidade está atendida SEM deixar o superávit de uma
// unidade mascarar a falta de outra. É a métrica usada também no módulo concurso.
function coberturaDe(t) {
  return t && t.necessarios > 0 ? (t.necessarios - t.deficit) / t.necessarios * 100 : null;
}

function desenhaKpisPlano(sim, fin) {
  const g = sim.ganhos;
  const resolvido = g.resolvidoPct;
  const cobFim = coberturaDe(sim.totaisFinais), cobIni = coberturaDe(sim.totaisBase);
  document.getElementById('pl-kpis').innerHTML = `<div class="kpi-grid">
    <div class="kpi kpi-alerta"><span class="kpi-ico">${ICO('pessoas')}</span>
      <span><span class="kpi-valor">${fmtN(g.inicial, 1)}</span>
      <span class="kpi-rotulo">Necessidade atual ${tipInfo('Soma dos déficits de cada unidade/cargo do escopo (superávits de outras unidades não abatem — é justamente o que o remanejamento tenta resolver).')}</span>
      <span class="kpi-sub">servidores em falta · déficit bruto</span></span></div>
    <div class="kpi kpi-verde"><span class="kpi-ico">${ICO('grafico')}</span>
      <span><span class="kpi-valor">${fmtN(g.inicial - g.residual, 1)}</span>
      <span class="kpi-rotulo">Resolvido pelo plano</span>
      <span class="kpi-sub">${resolvido == null ? '—' : fmtN(resolvido, 0) + '% da necessidade'} · sem concurso</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('cargos')}</span>
      <span><span class="kpi-valor">${fmtN(g.residual, 1)}</span>
      <span class="kpi-rotulo">Necessidade residual</span>
      <span class="kpi-sub">vai para o módulo concurso</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('docok')}</span>
      <span><span class="kpi-valor">${cobFim == null ? '—' : fmtN(cobFim, 0) + '%'}</span>
      <span class="kpi-rotulo">Cobertura após o plano ${tipInfo('Parcela da necessidade efetivamente atendida, unidade a unidade — o superávit de uma unidade não cobre a falta de outra. É a mesma métrica que orienta o módulo concurso.')}</span>
      <span class="kpi-sub">era ${cobIni == null ? '—' : fmtN(cobIni, 0) + '%'} · superávit remanescente ${fmtN(sim.totaisFinais.superavit, 1)}</span></span></div>
    <div class="kpi kpi-alerta"><span class="kpi-ico">${ICO('dinheiro')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(fin.totais.primeiroAno)}</span>
      <span class="kpi-rotulo">Custo das medidas (1º ano) ${tipInfo('Soma das medidas da Parte 2 que estão ativas — folha, certames e custos evitados. Configure em "Medidas financeiras", no menu à esquerda.')}</span>
      <span class="kpi-sub">${fmtN(fin.totais.pessoas)} pessoa(s) ·
        <a href="#/plano/medidas">configurar medidas</a></span></span></div>
  </div>`;
}

function desenhaWaterfall(sim) {
  const g = sim.ganhos;
  document.getElementById('pl-wf-sub').innerHTML =
    `Necessidade de <strong>${fmtN(g.inicial, 1)}</strong> servidores · as três etapas resolvem <strong>${fmtN(g.inicial - g.residual, 1)}</strong>` +
    `${g.resolvidoPct != null ? ` (<strong>${fmtN(g.resolvidoPct, 0)}%</strong>)` : ''} e deixam <strong>${fmtN(g.residual, 1)}</strong> para provimento.`;
  Charts.waterfall(document.getElementById('pl-wf'), {
    passos: sim.waterfall, fmt: v => Charts.fmtBR(v, 1), unidadeY: 'servidores', altura: 340
  });
}

function desenhaRemanejamento(sim) {
  const alvo = document.getElementById('pl-rem');
  const cfgR = Plano.config(st()).remanejamento;
  const possivel = sim.remanejamentoPossivel || 0;
  const ganhoPossivel = sim.remanejamentoGanhoPossivel || 0;
  if (!sim.movimentos.length) {
    alvo.innerHTML = !cfgR.ativo
      ? `<p class="vazio">Remanejamento desligado — marque a opção acima para o plano redistribuir o excesso.
         ${possivel ? `Há <strong>${fmtN(possivel)}</strong> movimentação(ões) possível(is) no escopo.` : ''}</p>`
      : cfgR.maxPessoas === 0
        ? `<p class="vazio">O limite está em <strong>0 pessoa</strong>, mas o escopo comporta
           <strong>${fmtN(possivel)}</strong> movimentação(ões): aumente o limite (ou deixe em branco) para o sistema redistribuir.</p>`
        : `<p class="vazio">Nenhum movimento possível no escopo: não há, no mesmo cargo, unidade com excesso e unidade com falta ao mesmo tempo.
           ${cfgR.mesmoOrgao ? 'Desmarcar “somente dentro do mesmo órgão” amplia as combinações.' : ''}</p>`;
    return;
  }
  const sobra = Math.max(0, possivel - sim.remanejamentoTotal);
  alvo.innerHTML = `<div class="grid-stats" style="margin-bottom:14px">
    <div class="stat"><span class="stat-label">Movimentações aplicadas</span>
      <span class="stat-valor">${fmtN(sim.remanejamentoTotal)}</span>
      <span class="stat-sub">abate ${fmtN(sim.ganhos.remanejamento, 1)} da necessidade</span></div>
    <div class="stat"><span class="stat-label">Potencial do escopo ${tipInfo('Quantas pessoas o escopo comporta movimentar ignorando o limite manual, mantida a regra de órgão. É o teto físico: acabou quando não há mais, no mesmo cargo, unidade com excesso e unidade com falta ao mesmo tempo.')}</span>
      <span class="stat-valor" style="color:${sobra > 0 ? '#8a6410' : '#0b7a48'}">${fmtN(possivel)}</span>
      <span class="stat-sub">${sobra > 0

function desenhaTabelaPlano(sim, vista) {
  if (!sim) return;
  const grupos = new Map();
  const chave = l => vista === 'cargo' ? nomeCargo(l.cargoId)
    : vista === 'orgao' ? l.unidade.orgao : `${l.unidade.orgao} / ${l.unidade.sigla}`;
  sim.linhas.forEach(l => {
    const k = chave(l);
    const r = grupos.get(k) || { atuais: 0, nec: 0, atuaisN: 0, necN: 0, deficit: 0, deficitN: 0, superavitN: 0 };
    r.atuais += l.atuais; r.nec += l.necessarios;
    r.atuaisN += l.atuaisNovos; r.necN += l.necessariosNovos;
    r.deficit += Math.max(0, l.necessarios - l.atuais);
    if (l.saldoNovo < 0) r.deficitN += -l.saldoNovo; else r.superavitN += l.saldoNovo;
    grupos.set(k, r);
  });
  const linhas = [...grupos.entries()].sort((a, b) => b[1].deficitN - a[1].deficitN);
  const tag = v => v < -0.5 ? `<span class="tag-def">déficit</span>` : v > 0.5 ? `<span class="tag-sup">superávit</span>` : `<span class="tag-ok">equilíbrio</span>`;
  document.getElementById('pl-tab').innerHTML = `<div class="tabela-wrap"><table class="tabela">
    <thead><tr>
      <th>${vista === 'cargo' ? 'Cargo' : vista === 'orgao' ? 'Órgão' : 'Unidade'}</th>
      <th class="num">Quadro atual</th><th class="num">Necessários hoje</th><th class="num">Saldo hoje</th>
      <th class="num">Quadro c/ plano</th><th class="num">Necessários c/ plano</th><th class="num">Saldo c/ plano</th>
      <th class="num">Déficit residual</th><th>Situação</th>
    </tr></thead>
    <tbody>${linhas.map(([k, r]) => {
      const saldo = r.atuais - r.nec, saldoN = r.atuaisN - r.necN;
      return `<tr>
        <td><strong>${E(k)}</strong></td>
        <td class="num mono">${fmtN(r.atuais)}</td>
        <td class="num mono">${fmtN(r.nec, 1)}</td>
        <td class="num mono ${saldo < 0 ? 'neg' : 'pos'}">${saldo >= 0 ? '+' : ''}${fmtN(saldo, 1)}</td>
        <td class="num mono">${fmtN(r.atuaisN, 1)}</td>
        <td class="num mono">${fmtN(r.necN, 1)}</td>
        <td class="num mono ${saldoN < 0 ? 'neg' : 'pos'}">${saldoN >= 0 ? '+' : ''}${fmtN(saldoN, 1)}</td>
        <td class="num mono">${fmtN(r.deficitN, 1)}</td>
        <td>${tag(saldoN)}</td>
      </tr>`;
    }).join('')}
    <tr class="linha-total"><td><strong>Total</strong></td>
      <td class="num mono">${fmtN(sim.totaisBase.atuais)}</td>
      <td class="num mono">${fmtN(sim.totaisBase.necessarios, 1)}</td>
      <td class="num mono ${sim.totaisBase.saldo < 0 ? 'neg' : 'pos'}">${sim.totaisBase.saldo >= 0 ? '+' : ''}${fmtN(sim.totaisBase.saldo, 1)}</td>
      <td class="num mono">${fmtN(sim.totaisFinais.atuais, 1)}</td>
      <td class="num mono">${fmtN(sim.totaisFinais.necessarios, 1)}</td>
      <td class="num mono ${sim.totaisFinais.saldo < 0 ? 'neg' : 'pos'}">${sim.totaisFinais.saldo >= 0 ? '+' : ''}${fmtN(sim.totaisFinais.saldo, 1)}</td>
      <td class="num mono">${fmtN(sim.totaisFinais.deficit, 1)}</td><td></td></tr>
    </tbody></table></div>`;
}

    <p class="card-sub">um certame por exercício · vagas dimensionadas pelo déficit projetado do ano da posse</p>
    <div id="cc-tab-editais"></div>
  </div>` : ''}
  <div class="grid-2col">
    <div class="card"><h3 class="card-titulo">Vagas por cargo ${tipInfo('Soma de todos os editais do período.')}</h3>
      <p class="card-sub">Distribuição que tende à média entre os cargos</p><div id="cc-gr-vagas"></div></div>
    <div class="card"><h3 class="card-titulo">Impacto financeiro ano a ano ${tipInfo('A folha das vagas nomeadas é recorrente e se acumula a cada turma; o certame é despesa única do ano de cada edital.')}</h3>
      <p class="card-sub">Folha acumulada + certame</p><div id="cc-gr-custo"></div></div>
  </div>
  <div class="card card-larga"><h3 class="card-titulo">Vagas recomendadas por cargo</h3><div id="cc-tab-cargos"></div></div>

  document.getElementById('cc-periodicidade').addEventListener('change', e => {
    cc.periodicidade = e.target.value; Store.salvar(); telaPlanoConcurso();

  document.getElementById('cc-modo').addEventListener('change', e => {
    cc.modo = e.target.value; Store.salvar(); telaPlanoConcurso();

  const selEdital = document.getElementById('cc-edital');

  bind('cc-pct', 'change', el => { cc.pctAdequacao = Math.max(10, Math.min(100, Number(el.value) || 90)); });
  bind('cc-horizonte', 'change', el => { cc.horizonte = Number(el.value); });
  bind('cc-defasagem', 'change', el => { cc.defasagemNomeacao = Number(el.value); });
  bind('cc-duracao', 'change', el => { cc.duracaoNomeacoes = Number(el.value); });
  bind('cc-apos', 'change', el => { cc.considerarAposentadorias = el.checked; });
  bind('cc-alav', 'change', el => { cc.aplicarAlavancas = el.checked; });
  bind('cc-cert', 'change', el => { cc.incluirCertame = el.checked; });
  atualiza();
}

function desenhaConcurso(s, plano, sim) {
  const t = plano.totais;
  const cfgC = Plano.config(s).concurso;
  const anual = plano.periodicidade === 'anual';
  // no modo anual o teto é POR EXERCÍCIO: a sobra relevante é a do maior edital
  const gastoMax = anual ? Math.max(0, ...plano.editais.map(e => e.gasto)) : t.comprometido;
  const sobra = cfgC.modo === 'teto' ? Math.max(0, (plano.teto || 0) - gastoMax) : 0;
  // leitura honesta do que limitou o plano: a cobertura-alvo ou o dinheiro
  const aviso = !t.vagas
    ? `<div class="banner aviso">Nenhuma vaga recomendada: a cobertura dos cargos no escopo já está em ou acima da
       cobertura-alvo de <strong>${fmtN(plano.pctAlvo)}%</strong> em ${plano.anoFim}. Aumente o alvo para o plano indicar vagas.</div>`
    : cfgC.modo === 'teto' && sobra > 0
      ? `<div class="banner ok">O alvo de <strong>${fmtN(plano.pctAlvo)}%</strong> de cobertura foi atingido <strong>sem esgotar o teto</strong>
         — sobram ${fmtBRLcomp(sobra)} do valor autorizado ${anual ? 'no exercício mais caro' : 'no ciclo'}. Aumente o alvo (ou amplie o escopo) para usar tudo.</div>`
      : '';

  document.getElementById('cc-linha-tempo').innerHTML = anual
    ? `<strong>Provimento anual:</strong> ${fmtN(plano.editais.length)} edital(is), de
       <strong>${plano.editais[0] ? plano.editais[0].anoEdital : '—'}</strong> a
       <strong>${plano.editais.length ? plano.editais[plano.editais.length - 1].anoEdital : '—'}</strong>,
       com posses de <strong>${plano.editais[0] ? plano.editais[0].anoPosse : '—'}</strong> a
       <strong>${plano.editais.length ? plano.editais[plano.editais.length - 1].anoPosse : '—'}</strong> —
       cada edital dimensionado pelo déficit projetado do seu ano de posse, descontado o que os editais anteriores
       já entregam. Defasagem de ${plano.defasagem} ano${plano.defasagem === 1 ? '' : 's'} entre o edital e a posse.`
    : `<strong>Ciclo:</strong> edital em <strong>${plano.anoEdital}</strong> · primeira nomeação em
       <strong>${plano.anosNomeacao[0]}</strong> · última em <strong>${plano.anosNomeacao[plano.anosNomeacao.length - 1]}</strong>
       · necessidade de referência: <strong>${plano.anoFim}</strong> (${plano.horizonte} ano${plano.horizonte > 1 ? 's' : ''} à frente).`;

  // tabela de editais (só existe no modo anual)

  document.getElementById('cc-kpis').innerHTML = `${aviso}<div class="kpi-grid">

    <div class="kpi kpi-alerta"><span class="kpi-ico">${ICO('dinheiro')}</span>

    <div class="kpi"><span class="kpi-ico">${ICO('calend')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(t.certame)}</span>

    <div class="kpi kpi-verde"><span class="kpi-ico">${ICO('docok')}</span>
      <span><span class="kpi-valor">${plano.coberturaDepois == null ? '—' : fmtN(plano.coberturaDepois, 0) + '%'}</span>
      <span class="kpi-rotulo">Cobertura ao fim do ciclo ${tipInfo('Parcela da necessidade atendida em ' + plano.anoFim + ', somando os déficits unidade a unidade. Não chega a 100% por premissa: o alvo é o percentual definido acima.')}</span>
      <span class="kpi-sub">sem o concurso seria ${plano.coberturaAntes == null ? '—' : fmtN(plano.coberturaAntes, 0) + '%'}</span></span></div>

      categorias: comVaga.map(c => ({
        label: nomeCargo(c.cargoId), valor: c.vagas,
        sub: `cobertura ${fmtN(c.adequacaoAntes, 0)}% → ${fmtN(c.adequacaoDepois, 0)}%`
      })),
      fmt: v => Charts.fmtBR(v, 0), unidadeY: 'vagas'
    });
  } else {
    elVagas.innerHTML = '<p class="vazio">Sem vagas com as premissas atuais.</p>';
  }

  Charts.barStack(document.getElementById('cc-gr-custo'), {
    categorias: plano.anos.map(a => ({
      label: String(a.ano),
      partes: [{ nome: 'Folha acumulada', valor: a.folhaAcumulada }, { nome: 'Certame', valor: a.custoCertame }]
    })),
    series: ['Folha acumulada', 'Certame'], fmt: v => fmtBRLcomp(v), unidadeY: 'R$/ano', altura: 300
  });

  document.getElementById('cc-tab-cargos').innerHTML = `<div class="tabela-wrap"><table class="tabela">
    <thead><tr><th>Cargo</th><th class="num">Necessários ${plano.anoFim}</th><th class="num">Cobertos</th>
      <th class="num">Aposent. até lá</th><th class="num">Déficit</th><th class="num">Vagas</th>
      <th class="num">Cobertura</th>
      <th class="num">Custo de ingresso ${tipInfo('Salário INICIAL da carreira + encargos + benefícios do cargo, por mês. É o custo real de quem toma posse — o aprovado entra na primeira referência. Ao lado, entre parênteses, o custo médio do quadro atual do cargo, para comparação.')}</th>
      <th class="num">Folha anual</th><th class="num">Certame</th></tr></thead>
    <tbody>${plano.porCargo.map(x => `<tr${x.vagas ? '' : ' class="fraca"'}>
      <td>${E(nomeCargo(x.cargoId))}</td>
      <td class="num mono">${fmtN(x.necessarios, 1)}</td>
      <td class="num mono">${fmtN(x.cobertos, 1)}</td>
      <td class="num mono">${fmtN(x.aposentadorias)}</td>
      <td class="num mono ${x.deficit > 0 ? 'neg' : ''}">${fmtN(x.deficit, 1)}</td>
      <td class="num mono"><strong>${fmtN(x.vagas)}</strong></td>
      <td class="num mono">${x.adequacaoAntes == null ? '—' : fmtN(x.adequacaoAntes, 0) + '% → ' + fmtN(x.adequacaoDepois, 0) + '%'}</td>
      <td class="num mono" style="white-space:nowrap">${fmtBRLcomp(x.custoIngresso)}
        <span class="muted mini">(médio ${fmtBRLcomp(x.custoMedio)})</span></td>

  </table></div>
  <p class="muted mini" style="margin-top:10px">Cargos em cinza não recebem vaga: a cobertura deles já atingiu o alvo

  unidade não cobre a falta de outra. A folha anual custeia cada vaga pelo <strong>salário inicial</strong> da carreira,
  em reais de ${s.anoReferencia}; o reajuste ano a ano entra no cronograma abaixo.</p>`;

  document.getElementById('cc-tab').innerHTML = `<div class="tabela-wrap"><table class="tabela">
    <thead><tr><th>Ano</th><th>Etapa</th><th class="num">Nomeações</th><th class="num">Acumulado</th>
      <th class="num">Reajuste acum. ${tipInfo('Fator composto dos reajustes concedidos até o ano, definido na aba Cargos · Reajuste da folha (LRF). Ele corrige a folha das levas anteriores, não só das novas.')}</th>
      <th class="num">Certame</th><th class="num">Folha do ano</th><th class="num">Impacto no ano</th>
      <th>Cargos nomeados</th></tr></thead>

      : `O certame é despesa única do ano do edital — por isso abrir a vaga em ${plano.anoEdital} e nomear a partir de
