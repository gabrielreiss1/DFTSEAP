    container.innerHTML = '';
    const maxV = escala || Math.max(...itens.map(i => i.valor), referencia ? referencia.valor * 1.15 : 0) * 1.05;
    const wrap = document.createElement('div');
    wrap.className = 'prog-wrap';
    wrap.innerHTML = itens.map(i => {
      const cor = i.destaque ? 'linear-gradient(135deg,#1360d8,#0e9e6e)' : (i.cor || '#b8c8e0');
      return `<div class="prog-linha" title="${(i.label + ' · ' + fmt(i.valor) + ' ' + unidade).trim()}">
        <span class="prog-rotulo ${i.destaque ? 'destaque' : ''}">${i.label}</span>
        <span class="prog-trilha"><span class="prog-fill" style="width:${Math.min(100, i.valor / maxV * 100).toFixed(1)}%;background:${cor}"></span></span>
        <span class="prog-valor ${i.destaque ? 'destaque' : ''}">${i.rotulo != null ? i.rotulo : fmt(i.valor)}</span>
      </div>`;
    }).join('');
    if (referencia) {
      const ref = document.createElement('span');
      ref.className = 'prog-ref';
      ref.style.left = `calc(var(--prog-rotulo-w, 92px) + (100% - var(--prog-rotulo-w, 92px) - var(--prog-valor-w, 52px)) * ${(referencia.valor / maxV).toFixed(3)})`;
      ref.title = referencia.rotulo;
      wrap.appendChild(ref);
      const leg = document.createElement('p');
      leg.className = 'prog-legenda';
      leg.innerHTML = `<span class="prog-ref-chip"></span>${referencia.rotulo}`;
      container.appendChild(wrap);
      container.appendChild(leg);
    } else {
      container.appendChild(wrap);
    }
    visaoTabela(container, ['Item', unidade || 'Valor'], itens.map(i => [i.label, i.rotulo != null ? i.rotulo : fmt(i.valor)]));
  }

  // ---------- esforço necessário × capacidade disponível (barras comparáveis) ----------
  // segmentos: [{label, valor}] — horas necessárias por entrega (soma = esforço necessário total)
  // capacidade: horas disponíveis do cargo no período (atuais × horas mensais × ITP)
  // Implementado em HTML/CSS (não SVG): evita fontes/larguras fixas cortando rótulos longos
  // como "Capacidade disponível (N servidores)" — o texto usa a fonte normal da página e quebra
  // naturalmente. As trilhas ficam com a MESMA escala (0–maxV) para as barras serem comparáveis.
  function capacidade(container, { segmentos, capacidadeHoras, fmt = v => fmtBR(v, 0) + ' h', legendaCap = 'Capacidade disponível' }) {
    container.innerHTML = '';
    const necessarioTotal = segmentos.reduce((a, s) => a + s.valor, 0);
    const maxV = Math.max(necessarioTotal, capacidadeHoras, 1) * 1.06;
    const pct = v => Math.max(0, Math.min(100, v / maxV * 100));
    const cobre = capacidadeHoras >= necessarioTotal;
    const corCap = cobre ? '#0e9e6e' : '#e34948';
    const marcaPct = pct(necessarioTotal).toFixed(2);

    const trilhaSegmentos = segmentos.map((s, i) => {
      const cor = PALETA[i % PALETA.length];
      return `<span class="cap-seg" style="width:${pct(s.valor)}%;background:${cor}" data-idx="${i}"></span>`;
    }).join('');

    const wrap = document.createElement('div');
    wrap.className = 'cap-wrap';
    wrap.innerHTML = `
      <div class="cap-linha">
        <span class="cap-rotulo">Esforço necessário</span>
        <span class="cap-trilha">${trilhaSegmentos}<span class="cap-marca" style="left:${marcaPct}%"></span></span>
        <span class="cap-valor">${fmt(necessarioTotal)}</span>
      </div>
      <div class="cap-linha">
        <span class="cap-rotulo">${legendaCap}</span>
        <span class="cap-trilha"><span class="cap-seg" style="width:${pct(capacidadeHoras)}%;background:${corCap}" data-cap="1"></span><span class="cap-marca" style="left:${marcaPct}%"></span></span>
        <span class="cap-valor" style="color:${corCap}">${fmt(capacidadeHoras)}</span>
      </div>`;
    container.appendChild(wrap);

    // tooltips (hover) — segmentos do esforço necessário
    wrap.querySelectorAll('.cap-seg[data-idx]').forEach(el => {
      const s = segmentos[+el.dataset.idx];
      el.addEventListener('mousemove', ev => mostraTip(
        `<strong>${s.label}</strong><br>${fmt(s.valor)} · ${fmtBR(necessarioTotal ? s.valor / necessarioTotal * 100 : 0, 0)}% do esforço necessário`, ev));
      el.addEventListener('mouseleave', escondeTip);
    });
    const segCap = wrap.querySelector('.cap-seg[data-cap]');
    segCap.addEventListener('mousemove', ev => mostraTip(
      `<strong>${legendaCap}</strong><br>${fmt(capacidadeHoras)}${cobre ? ' · cobre o esforço necessário' : ' · abaixo do esforço necessário'}`, ev));
    segCap.addEventListener('mouseleave', escondeTip);

    // legenda (entregas + capacidade)
    const leg = document.createElement('div');
    leg.className = 'chart-legend';
    leg.innerHTML = segmentos.map((s, i) =>
      `<span><span class="chip" style="background:${PALETA[i % PALETA.length]}"></span>${s.label}</span>`).join('') +
      `<span><span class="chip" style="background:${corCap}"></span>${legendaCap}</span>`;
    container.appendChild(leg);

    // nota de ocupação
    const ocupacaoPct = capacidadeHoras > 0 ? necessarioTotal / capacidadeHoras * 100 : null;
    if (ocupacaoPct != null) {
      const nota = document.createElement('p');
      nota.className = cobre ? 'nota-ok' : 'nota-alerta';
      nota.innerHTML = cobre
        ? `✓ ${fmtBR(ocupacaoPct, 0)}% da capacidade disponível está ocupada com o esforço necessário — há folga de ${fmt(capacidadeHoras - necessarioTotal)}.`
        : `▲ O esforço necessário usa ${fmtBR(ocupacaoPct, 0)}% da capacidade disponível — faltam ${fmt(necessarioTotal - capacidadeHoras)} para cobrir a demanda.`;
      container.appendChild(nota);
    }

    visaoTabela(container, ['Entrega', 'Esforço necessário (h)'],
      [...segmentos.map(s => [s.label, fmt(s.valor)]), [legendaCap, fmt(capacidadeHoras)]]);
  }

  return {
    PALETA, bar, barH, barStack, waterfall, line, bubble, progresso, capacidade,
    fmtBR, fmtCompacto, visaoTabela, mostraTip, escondeTip
  };
})();


/* ===== resultados.js ===== */
/* ============================================================
   DFT — Aba Resultados (design Aurora)
   As opções de cálculo são determinadas pelo método definido
   para a unidade no cadastro (tela de Órgãos, Gestor SEAP).
   ============================================================ */

const NOME_METODO_PROJ = {
  auto: 'Recomendado pelo sistema', mediaMovel: 'Média móvel (12 meses)',
  regressaoLinear: 'Regressão linear', suavizacao: 'Suavização exponencial (Holt)',
  manual: 'Manual (taxa anual definida pelo gestor)'
};
const NOME_CRIT_ESFORCO = { propria: 'Própria unidade', cargos: 'Comparação entre cargos', benchmark: 'Outro (benchmark)' };

// caixa de benchmark: SEAP define direto; demais perfis SOLICITAM à SEAP
function caixaBenchmark(uId, cargoId, cfg) {
  const s = st();
  const p = perfilAtual();
  const chave = uId + ':' + cargoId;
  const bench = (s.benchmarks || {})[chave];
  const pend = (s.solicitacoes || []).find(x => x.tipo === 'benchmark' && x.status === 'pendente' &&
    x.unidadeId === uId && x.cargoId === cargoId);
  if (p.id === 'seap') {
    return `<div class="banner info" style="flex-wrap:wrap">
      <span><strong>Benchmark (referência externa)</strong> — defina o valor e a fundamentação:</span>
      <input type="number" id="bm-valor" class="input num-in" step="0.01" min="0" value="${bench ? bench.valor : ''}" placeholder="un/h">
      <input type="text" id="bm-fund" class="input" style="flex:1;min-width:220px" value="${bench ? E(bench.fundamentacao || '') : ''}" placeholder="Fundamentação (fonte, estudo, norma…)">
      <button class="btn btn-sec" id="bm-salvar">Salvar</button>
    </div>`;
  }
  return `<div class="banner info" style="flex-wrap:wrap">
    <span><strong>Benchmark</strong>: ${bench
      ? `${fmtN(bench.valor, 2)} un/h — ${E(bench.fundamentacao || 'sem fundamentação')}`
      : 'nenhum valor autorizado para esta unidade/cargo.'}
      ${pend ? '<span class="badge mini badge-fila">solicitação pendente na SEAP</span>' : ''}</span>
    ${pend ? '' : '<button class="btn btn-sec" id="bm-solicitar">Solicitar à SEAP</button>'}
  </div>`;
}
function ligaBenchmark(uId, cargoId) {
  const s = st();
  const chave = uId + ':' + cargoId;
  const btnS = document.getElementById('bm-salvar');
  if (btnS) btnS.addEventListener('click', () => {
    const valor = Number(document.getElementById('bm-valor').value);
    if (!valor) { alert('Informe o valor do benchmark (un/h).'); return; }
    s.benchmarks = s.benchmarks || {};
    s.benchmarks[chave] = { valor, fundamentacao: document.getElementById('bm-fund').value.trim(), autor: perfilAtual().nome, data: new Date().toISOString().slice(0, 10) };
    rerenderResultados(uId);
  });
  const btnP = document.getElementById('bm-solicitar');
  if (btnP) btnP.addEventListener('click', () => {
    const valor = Number(prompt('Valor proposto para o benchmark (un/h efetiva):'));
    if (!valor) return;
    const just = prompt('Justificativa / fundamentação (fonte, estudo, norma…):') || '';
    (s.solicitacoes = s.solicitacoes || []).push({
      id: Store.novoId('sol', s.solicitacoes), tipo: 'benchmark', status: 'pendente',
      data: new Date().toISOString().slice(0, 10), unidadeId: uId, cargoId,
      autor: perfilAtual().nome + ' — ' + perfilAtual().papel,
      payload: { valor }, justificativa: just
    });
    Store.salvar();
    alert('Solicitação enviada à SEAP. Acompanhe em Início → Autorizações (perfil Gestor SEAP).');
    rerenderResultados(uId);
  });
}
const NOME_CENARIO = { otimista: 'Alta demanda', base: 'Base', pessimista: 'Baixa demanda' };
const NOME_CRITERIO = { media: 'Média', mediana: 'Mediana', maximo: 'Valor máximo' };

function telaResultados(alvo, uId) {
  const s = st();
  const u = Calc.unidade(s, uId);
  const cfg = cfgResultado(uId);
  cfg.criterio = cfg.criterio || 'mediana';
  cfg.metodoProjecao = cfg.metodoProjecao || 'auto';
  cfg.cenario = cfg.cenario || 'base';
  cfg.horizonte = cfg.horizonte || 1;

  const dual = u.metodo === 'Direcionador Histórico ou Esforço por Entrega';
  if (dual && !cfg.vista) cfg.vista = 'esforco'; // prioridade: Esforço por Entrega

  let html = '';
  if (dual) {
    html += `<div class="filtros vista-sel">
      <span class="muted mini">Opção de cálculo ${tipInfo('Esta unidade possui dois métodos definidos no cadastro. O Esforço por Entrega é o prioritário.')}</span>
      <button class="btn-toggle ${cfg.vista === 'esforco' ? 'ativo' : ''}" data-vista="esforco">Esforço por Entrega <span class="mini">(prioritário)</span></button>
      <button class="btn-toggle ${cfg.vista === 'historico' ? 'ativo' : ''}" data-vista="historico">Direcionador Histórico</button>
    </div>`;
  }
  alvo.innerHTML = html + '<div id="res-corpo"></div>';
  alvo.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => {
    cfg.vista = b.dataset.vista; Store.salvar(); telaUnidade(uId, 'resultados');
  }));

  const corpo = document.getElementById('res-corpo');
  if (u.metodo === 'Comparação entre Pares') vistaPares(corpo, uId, cfg);
  else if (dual && cfg.vista === 'historico') vistaHistorico(corpo, uId, cfg);
  else vistaEsforco(corpo, uId, cfg);
}

const rerenderResultados = uId => { Store.salvar(); telaUnidade(uId, 'resultados'); };

/* ============ Comparação entre Pares ============ */
function vistaPares(corpo, uId, cfg) {
  const s = st();
  const ano = s.anoReferencia;
  const eu = Calc.unidade(s, uId);
  const ents = Calc.entregasUnidade(s, uId);
  const entSel = cfg.entregaId === '__todas__' || (cfg.entregaId && ents.some(e => e.id === cfg.entregaId))
    ? cfg.entregaId : ents[0].id;
  cfg.entregaId = entSel;
  const todas = entSel === '__todas__';
  const entrega = todas ? null : ents.find(e => e.id === entSel);
  const cargosEnt = todas
    ? [...new Set(ents.flatMap(e => e.cargos.map(c => c.cargoId)))]
    : entrega.cargos.map(c => c.cargoId);
  const cargoSel = cfg.cargoProdId && cargosEnt.includes(cfg.cargoProdId) ? cfg.cargoProdId : cargosEnt[0];
  cfg.cargoProdId = cargoSel;

  const pares = Calc.unidadesPares(s, uId);
  // produtividade agregada da unidade (todas as entregas do cargo): Σ volume ÷ Σ horas efetivas
  function prodAgregada(unidId, entsBase) {
    let vol = 0, horas = 0;
    entsBase.forEach(eBase => {
      const eq = unidId === uId ? eBase : Calc.entregaEquivalente(s, unidId, eBase);
      if (!eq) return;
      const he = Calc.horasEfetivas(s, unidId, eq.id, cargoSel, ano);
      const vm = Calc.volumeMedioMensal(s, unidId, eq.id, ano, cargoSel) ||
        Calc.volumeMedioMensal(s, unidId, eq.id, ano);
      if (he > 0 && vm > 0) { vol += vm; horas += he; }
    });
    return horas > 0 ? vol / horas : null;
  }
  let ref;
  if (todas) {
    const detalhe = [];
    [uId, ...pares.map(x => x.id)].forEach(unidId => {
      const pr = prodAgregada(unidId, ents.filter(e => e.cargos.some(c => c.cargoId === cargoSel)));
      if (pr != null) detalhe.push({ unidadeId: unidId, prod: pr });
    });
    const f = { media: Calc.mean, mediana: Calc.median, maximo: Calc.max }[cfg.criterio] || Calc.median;
    ref = { valor: detalhe.length ? f(detalhe.map(d => d.prod)) : null, detalhe };
  } else {
    ref = Calc.prodReferenciaPares(s, uId, entSel, cargoSel, cfg.criterio, ano);
  }
  const bench = (s.benchmarks || {})[uId + ':' + cargoSel];
  if (cfg.criterio === 'benchmark') ref = { valor: bench ? bench.valor : null, detalhe: ref.detalhe };
  const minha = ref.detalhe.find(d => d.unidadeId === uId);
  // eficiência relativa: produtividade da unidade ÷ referência do grupo
  const eficiencia = minha && ref.valor ? minha.prod / ref.valor * 100 : null;

  const paresSel = cfg.paresSel || [];
  const seriesVol = [{
    nome: `${eu.orgao}/${eu.sigla}`, cor: '#1360d8', area: true,
    pontos: Calc.serieVolume(s, uId, todas ? {} : { entregaId: entSel }).map(p => ({ x: p.mes, y: p.v }))
  }];
  pares.forEach((p, i) => {
    if (!paresSel.includes(p.id)) return;
    let filtro = {};
    if (!todas) {
      const eq = Calc.entregaEquivalente(s, p.id, entrega);
      if (!eq) return;
      filtro = { entregaId: eq.id };
    }
    seriesVol.push({
      nome: `${p.orgao}/${p.sigla}`, corIdx: (i + 1) % 8,
      pontos: Calc.serieVolume(s, p.id, filtro).map(q => ({ x: q.mes, y: q.v }))
    });
  });

  corpo.innerHTML = `
  <div class="grid-2col" style="grid-template-columns:1fr 1.4fr">
    <div class="card">
      <h3 class="card-titulo">Produtividade entre pares
        ${tipInfo('Produtividade = volume médio mensal ÷ horas efetivas (pessoas × % de tempo × horas mensais × ITP). A referência aplica o critério escolhido sobre as unidades comparáveis (mesmo código de pares).')}</h3>
      <p class="card-sub">un/h efetiva · unidades com o código "${E(Calc.codigoPares(s, uId))}"</p>
      <div class="filtros" style="margin:12px 0 14px">
        <label>Entrega <select id="cp-entrega" class="input" style="max-width:200px">
          <option value="__todas__" ${todas ? 'selected' : ''}>Todas as entregas</option>
          ${ents.map(e => `<option value="${e.id}" ${e.id === entSel ? 'selected' : ''}>${E(e.titulo)}</option>`).join('')}</select></label>
        <label>Cargo <select id="cp-cargo" class="input">${cargosEnt.map(c =>
          `<option value="${c}" ${c === cargoSel ? 'selected' : ''}>${E(nomeCargo(c))}</option>`).join('')}</select></label>
        <label>Referência <select id="cp-criterio" class="input">${Object.entries(NOME_CRITERIO).map(([v, n]) =>
          `<option value="${v}" ${v === cfg.criterio ? 'selected' : ''}>${n}</option>`).join('')}
          <option value="benchmark" ${cfg.criterio === 'benchmark' ? 'selected' : ''}>Outro (benchmark)</option></select></label>
      </div>
      ${cfg.criterio === 'benchmark' ? caixaBenchmark(uId, cargoSel, cfg) : ''}
      <div id="cp-grafico-prod"></div>
      ${eficiencia != null ? `<p class="destaque-ref" style="margin-top:14px">Eficiência relativa:
        <strong>${fmtN(eficiencia, 0)}%</strong> da ${NOME_CRITERIO[cfg.criterio].toLowerCase()} do grupo
        ${tipInfo('Produtividade desta unidade ÷ produtividade de referência do grupo de pares. Acima de 100% = mais produtiva que a referência.')}</p>` : ''}
    </div>
    <div class="card">
      <h3 class="card-titulo">Variação mensal do volume ${tipInfo('Volume mensal da entrega na unidade. Marque outras unidades pares para comparar no mesmo gráfico.')}</h3>
      <p class="card-sub">${todas ? 'Todas as entregas (volume total)' : E(entrega.titulo)} · ${E(eu.orgao)}/${E(eu.sigla)} × pares</p>
      <div class="filtros pares-check" style="margin:10px 0 4px">
        <span class="muted mini">Comparar com:</span>
        ${pares.map(p => `<label class="check"><input type="checkbox" data-par="${p.id}" ${paresSel.includes(p.id) ? 'checked' : ''}> ${E(p.orgao)}/${E(p.sigla)}</label>`).join('') || '<span class="muted mini">nenhuma unidade com o mesmo código</span>'}
      </div>
      <div id="cp-grafico-vol"></div>
    </div>
  </div>
  <div id="card-sazonalidade"></div>
  <div id="card-projecao"></div>
  <div id="card-dimensionamento"></div>`;

  const prodItens = ref.detalhe
    .map(d => { const un = Calc.unidade(s, d.unidadeId); return { un, prod: d.prod, self: d.unidadeId === uId }; })
    .sort((a, b) => b.prod - a.prod)
    .map(x => ({
      label: `${x.un.sigla} / ${x.un.orgao}`, valor: x.prod,
      rotulo: fmtN(x.prod, 2), destaque: x.self
    }));
  Charts.progresso(document.getElementById('cp-grafico-prod'), {
    itens: prodItens,
    referencia: ref.valor != null ? { valor: ref.valor, rotulo: `referência (${NOME_CRITERIO[cfg.criterio].toLowerCase()}) = ${fmtN(ref.valor, 2)} un/h` } : null,
    fmt: v => fmtN(v, 2), unidade: 'un/h efetiva'
  });
  Charts.line(document.getElementById('cp-grafico-vol'), {
    series: seriesVol, fmtX: Calc.fmtMes, unidadeY: 'un/mês', altura: 260
  });

  document.getElementById('cp-entrega').addEventListener('change', e => {
    cfg.entregaId = e.target.value; cfg.cargoProdId = null; rerenderResultados(uId);
  });
  document.getElementById('cp-cargo').addEventListener('change', e => {
    cfg.cargoProdId = e.target.value; rerenderResultados(uId);
  });
  document.getElementById('cp-criterio').addEventListener('change', e => {
    cfg.criterio = e.target.value; rerenderResultados(uId);
  });
  ligaBenchmark(uId, cargoSel);
  corpo.querySelectorAll('[data-par]').forEach(ch => ch.addEventListener('change', () => {
    cfg.paresSel = [...corpo.querySelectorAll('[data-par]:checked')].map(x => x.dataset.par);
    rerenderResultados(uId);
  }));

  cardSazonalidade(document.getElementById('card-sazonalidade'), uId);
  cardProjecao(document.getElementById('card-projecao'), uId, cfg);
  heroDimensionamento(document.getElementById('card-dimensionamento'), uId, cfg, { modo: 'pares' });
}

/* ============ Esforço por Entrega ============ */

  const s = st();
  const ano = s.anoReferencia;
  const esf = Calc.esforco(s, uId, ano);
  const sub = cfg.subEsforco || 'cargo';
  cfg.subEsforco = sub;

  corpo.innerHTML = `
  <div class="card card-larga">
    <h3>Esforço por Entrega ${tipInfo('Esforço = tempo por entrega × volume entregue, considerando a demanda não atendida relatada nos lançamentos. O dimensionamento divide o esforço total (em horas) pela disponibilidade do cargo: horário legal × ITP.')}</h3>
    <div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>Entrega</th><th class="num">% tempo</th><th class="num">Volume médio/mês</th>
        <th class="num">Demanda não atendida ${tipInfo('Média mensal da fila relatada nos lançamentos de Produção (ou o valor cadastrado na entrega, na falta de relatos).')}</th>
        <th class="num">Esforço</th><th class="num">Participação</th></tr></thead>
      <tbody>${esf.linhas.map(l => `<tr>
        <td>${E(l.entrega.titulo)}</td>
        <td class="num mono">${fmtN(l.pct, 1)}%</td>
        <td class="num mono">${fmtN(l.volume)}</td>
        <td class="num mono">${l.reprimida ? fmtN(l.reprimida) : '—'}</td>
        <td class="num mono"><strong>${fmtN(l.esforcoTotal, 1)}</strong></td>
        <td class="num mono">${fmtN(l.share, 1)}%</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="filtros" style="margin-top:14px">
      <label>Referência do dimensionamento ${tipInfo('Própria unidade: tempo por entrega observado na própria produção. Comparação entre cargos: quando mais de um cargo atua nas MESMAS entregas, a mediana entre os cargos vira a referência. Benchmark: valor externo autorizado pela SEAP com fundamentação.')}
        <select id="ea-criterio" class="input">${Object.entries(NOME_CRIT_ESFORCO).map(([v, n]) =>
          `<option value="${v}" ${(cfg.criterioEsforco || 'propria') === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    </div>
    ${(cfg.criterioEsforco || 'propria') === 'benchmark' ? caixaBenchmark(uId, cfg.cargoDimId || (Calc.lotacaoUnidade(s, uId)[0] || {}).cargoId, cfg) : ''}
    <div class="filtros vista-sel" style="margin-top:8px">
      ${[['cargo', 'Esforço por cargo'], ['volpct', 'Volume por entrega (%)'], ['voltot', 'Volume total por entrega'], ['volmes', 'Volume mensal']]
      .map(([id, nome]) => `<button class="btn-toggle ${sub === id ? 'ativo' : ''}" data-sub="${id}">${nome}</button>`).join('')}
    </div>
    <div id="ea-grafico"></div>
  </div>
  <div id="card-capacidade"></div>
  <div id="card-sazonalidade"></div>
  <div id="card-projecao"></div>
  <div id="card-dimensionamento"></div>`;

  corpo.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => {
    cfg.subEsforco = b.dataset.sub; rerenderResultados(uId);
  }));
  document.getElementById('ea-criterio').addEventListener('change', ev => {
    cfg.criterioEsforco = ev.target.value; rerenderResultados(uId);
  });
  ligaBenchmark(uId, cfg.cargoDimId || (Calc.lotacaoUnidade(s, uId)[0] || {}).cargoId);

  const alvoG = document.getElementById('ea-grafico');
  if (sub === 'cargo') {
    const porCargo = {};
    esf.linhas.forEach(l => l.porCargo.forEach(c => {
      porCargo[c.cargoId] = (porCargo[c.cargoId] || 0) + c.esforco;
    }));
    Charts.bar(alvoG, {
      categorias: Object.entries(porCargo).map(([cId, v]) => ({ label: nomeCargo(cId), valor: v, corIdx: 0 })),
      fmt: v => fmtN(v, 1), unidadeY: 'esforço (tempo × volume)', altura: 250
    });
  } else if (sub === 'volpct') {
    const totalVol = Calc.sum(esf.linhas.map(l => l.volume)) || 1;
    Charts.bar(alvoG, {
      categorias: esf.linhas.map(l => ({ label: l.entrega.titulo, valor: l.volume / totalVol * 100, corIdx: 0 })),
      fmt: v => fmtN(v, 1) + '%', unidadeY: '% do volume da unidade', altura: 250
    });
  } else if (sub === 'voltot') {
    Charts.bar(alvoG, {
      categorias: esf.linhas.map(l => ({
        label: l.entrega.titulo,
        valor: Calc.sum(Calc.serieVolume(s, uId, { entregaId: l.entrega.id }).filter(p => p.mes.startsWith(String(ano))).map(p => p.v)) || l.volume * 12,
        corIdx: 0
      })),
      fmt: v => fmtN(v), unidadeY: `volume total em ${ano}`, altura: 250
    });
  } else {
    Charts.line(alvoG, {
      series: [{ nome: 'Volume mensal da unidade', cor: '#1360d8', area: true, pontos: Calc.serieVolume(s, uId, {}).map(p => ({ x: p.mes, y: p.v })) }],
      fmtX: Calc.fmtMes, altura: 250
    });
  }

  const optsDim = {
    modo: 'esforco',
    criterio: { propria: 'mediana', cargos: 'cargos', benchmark: 'benchmark' }[cfg.criterioEsforco || 'propria']
  };
  cardCapacidade(document.getElementById('card-capacidade'), uId, cfg, optsDim);
  cardSazonalidade(document.getElementById('card-sazonalidade'), uId);
  cardProjecao(document.getElementById('card-projecao'), uId, cfg);
  heroDimensionamento(document.getElementById('card-dimensionamento'), uId, cfg, optsDim);
}
