/* ============ Sazonalidade (mês × entrega) ============ */
function cardSazonalidade(alvo, uId) {
  const s = st();
  const ents = Calc.entregasUnidade(s, uId);
  const MESES_PT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const RAMPA = ['#f3f8fe', '#e2eefb', '#c8def7', '#a3c8f0', '#78ade5', '#4b8cd6']; // azul, claro→escuro
  const linhas = ents.map(e => {
    const serie = Calc.serieVolume(s, uId, { entregaId: e.id });
    const porMes = Array.from({ length: 12 }, () => []);
    serie.forEach(p => porMes[Number(p.mes.slice(5)) - 1].push(p.v));
    const medias = porMes.map(v => v.length ? Calc.mean(v) : null);
    const vals = medias.filter(v => v != null);
    if (!vals.length) return null;
    const lo = Math.min(...vals), hi = Math.max(...vals);
    return { e, medias, lo, hi };
  }).filter(Boolean);
  if (!linhas.length) { alvo.innerHTML = ''; return; }

  alvo.innerHTML = `<div class="card card-larga">
    <h3>Sazonalidade das entregas ${tipInfo('Volume médio de cada mês do ano (média de todos os anos com dados). A intensidade da cor é relativa à própria entrega — meses de pico ajudam a planejar férias e reforços.')}</h3>
    <div class="heat-wrap"><table class="heat-tabela">
      <thead><tr><th style="min-width:180px"></th>${MESES_PT.map(m => `<th style="text-align:center">${m}</th>`).join('')}</tr></thead>
      <tbody>${linhas.map(l => `<tr>
        <th>${E(l.e.titulo)}</th>
        ${l.medias.map((v, i) => {
          if (v == null) return '<td class="heat vazia">—</td>';
          const t = l.hi > l.lo ? (v - l.lo) / (l.hi - l.lo) : .5;
          const cor = RAMPA[Math.min(RAMPA.length - 1, Math.floor(t * RAMPA.length))];
          return `<td class="heat" style="background:${cor};color:${t > .66 ? '#fff' : 'var(--ink)'}"
            title="${E(l.e.titulo)} · ${MESES_PT[i]}: ${fmtN(v)} un (média)">${Charts.fmtCompacto(v)}</td>`;
        }).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ============ Demanda Projetada ============ */
function cardProjecao(alvo, uId, cfg) {
  const s = st();
  const serie = Calc.serieVolume(s, uId, {});
  const rec = serie.length >= 3 ? Calc.recomendarMetodo(serie) : null;
  const metodo = cfg.metodoProjecao === 'auto' ? (rec ? rec.metodo : 'mediaMovel') : cfg.metodoProjecao;
  const proj = serie.length >= 3 ? Calc.projetar(serie, metodo, cfg.horizonte * 12, { taxaAnual: cfg.taxaManual }) : null;
  // fator de otimização da DEMANDA da unidade (média das entregas ponderada pelo volume)
  const entsU = Calc.entregasUnidade(s, uId);
  const pesosVol = entsU.map(e => Calc.volumeMedioMensal(s, uId, e.id, s.anoReferencia) || e.volumeMensal || 0);
  const somaVol = Calc.sum(pesosVol) || 1;
  const fDemUnidade = anos => Calc.sum(entsU.map((e, i) =>
    (pesosVol[i] / somaVol) * Calc.fatorAutomacao(s, e, anos, 'demanda'))) || 1;

  alvo.innerHTML = `<div class="card card-larga">
    <h3>Demanda Projetada ${tipInfo('Projeção do volume mensal da unidade com base no histórico das entregas. O sistema recomenda o método mais adequado conforme a qualidade, o volume, a regularidade e a consistência dos dados. Cenários: Base (tendência central), Alta demanda e Baixa demanda (~80% de confiança).')}</h3>
    <div class="filtros">
      <label>Horizonte <select id="pj-horizonte" class="input">
        ${[1, 2, 3, 4, 5].map(h => `<option value="${h}" ${h === cfg.horizonte ? 'selected' : ''}>${h} ano${h > 1 ? 's' : ''}</option>`).join('')}
      </select></label>
      <label>Método <select id="pj-metodo" class="input">
        ${Object.entries(NOME_METODO_PROJ).map(([v, n]) =>
          `<option value="${v}" ${v === cfg.metodoProjecao ? 'selected' : ''}>${n}</option>`).join('')}
      </select></label>
      <label>Cenário <select id="pj-cenario" class="input">
        ${Object.entries(NOME_CENARIO).map(([v, n]) =>
          `<option value="${v}" ${v === cfg.cenario ? 'selected' : ''}>${n}</option>`).join('')}
      </select></label>
      ${cfg.metodoProjecao === 'manual' ? `
      <label>Taxa anual (%) ${tipInfo('Crescimento anual da demanda definido pelo gestor. Registre a fundamentação ao lado.')}
        <input type="number" id="pj-taxa" class="input num-in curta" step="0.5" value="${cfg.taxaManual != null ? cfg.taxaManual : 0}"></label>
      <label style="flex:1;min-width:200px">Fundamentação
        <input type="text" id="pj-fund" class="input" value="${E(cfg.projecaoFund || '')}" placeholder="Ex.: plano de expansão, série do IBGE…"></label>` : ''}
      <button class="btn-toggle ${cfg.mostrarAuto ? 'ativo' : ''}" id="pj-btn-auto" style="align-self:end"
        title="Adiciona a linha da projeção considerando a redução de demanda esperada pelas oportunidades de otimização (categorias das entregas)">
        Impacto da otimização</button>
    </div>
    ${rec ? `<p class="recomendacao">Recomendação do sistema: <strong>${NOME_METODO_PROJ[rec.metodo]}</strong> — ${E(rec.motivo)}
      ${cfg.metodoProjecao === 'auto' ? '<span class="badge mini badge-esforco">em uso</span>' : ''}</p>` : ''}
    <div id="pj-grafico">${serie.length < 3 ? '<p class="vazio">Histórico insuficiente para projetar (mínimo de 3 meses). Lance produção ou histórico retroativo.</p>' : ''}</div>
  </div>`;

  if (proj) {
    const hist = serie.slice(-24);
    const ultimo = hist[hist.length - 1];
    const series = [
      { nome: 'Histórico', cor: '#1360d8', area: true, pontos: hist.map(p => ({ x: p.mes, y: p.v })) },
      {
        nome: `Projeção — ${NOME_CENARIO[cfg.cenario].toLowerCase()}`, cor: '#0e9e6e', tracejada: true,
        pontos: [{ x: ultimo.mes, y: ultimo.v }, ...proj.pontos.map(p => ({ x: p.mes, y: p[cfg.cenario] }))]
      }
    ];
    if (cfg.mostrarAuto) {
      series.push({
        nome: 'Cenário com otimização', cor: '#4a3aa7', tracejada: true,
        pontos: [{ x: ultimo.mes, y: ultimo.v }, ...proj.pontos.map((p, i) =>
          ({ x: p.mes, y: p[cfg.cenario] * fDemUnidade((i + 1) / 12) }))]
      });
    }
    Charts.line(document.getElementById('pj-grafico'), {
      series, fmtX: Calc.fmtMes, divisorX: ultimo.mes
    });
  }

  document.getElementById('pj-horizonte').addEventListener('change', e => {
    cfg.horizonte = Number(e.target.value); rerenderResultados(uId);
  });
  document.getElementById('pj-metodo').addEventListener('change', e => {
    cfg.metodoProjecao = e.target.value; rerenderResultados(uId);
  });
  document.getElementById('pj-cenario').addEventListener('change', e => {
    cfg.cenario = e.target.value; rerenderResultados(uId);
  });
  const btnAuto = document.getElementById('pj-btn-auto');
  if (btnAuto) btnAuto.addEventListener('click', () => {
    cfg.mostrarAuto = !cfg.mostrarAuto; rerenderResultados(uId);
  });
  const pjTaxa = document.getElementById('pj-taxa');
  if (pjTaxa) pjTaxa.addEventListener('change', e => {
    cfg.taxaManual = Number(e.target.value) || 0; rerenderResultados(uId);
  });
  const pjFund = document.getElementById('pj-fund');
  if (pjFund) pjFund.addEventListener('change', e => {
    cfg.projecaoFund = e.target.value; Store.salvar();
  });
}

/* ============ Resultados do Dimensionamento (hero + recortes + simulador) ============ */
// Texto do (?) explicando o cálculo — muda conforme o método (pares / esforço / histórico).
function explicaDimensionamento(opts, criterioUso, cfg) {
  const critNome = (NOME_CRITERIO[cfg.criterio] || 'mediana').toLowerCase();
  if (opts.modo === 'pares') {
    return 'Como é calculado (Comparação entre Pares): 1) a produtividade de cada unidade do grupo ' +
      '(inclusive a própria) = volume médio mensal ÷ horas efetivas (pessoas × % de tempo × horas mensais × ITP). ' +
      `2) a produtividade de referência é a ${critNome} dessas produtividades — o padrão do GRUPO, não o desempenho ` +
      'individual da sua unidade. 3) servidores necessários = demanda ÷ referência ÷ (horas mensais × ITP do cargo). ' +
      '4) déficit/superávit = atuais − necessários. Uma unidade mais produtiva que a referência tende a aparecer com ' +
      'folga; mas se o critério for média/mediana de um grupo heterogêneo, uma unidade muito acima do padrão pode ' +
      'ainda mostrar necessidade de reforço — isso reflete o padrão típico do grupo, não penaliza a eficiência própria. ' +
      'Para usar o melhor desempenho do grupo como régua, troque o critério para "Valor máximo".';
  }
  if (opts.modo === 'esforco') {
    return 'Como é calculado (Esforço por Entrega): esforço necessário (em horas) = Σ, por entrega, ' +
      'tempo por entrega × (volume + demanda não atendida). Capacidade disponível = servidores atuais × horário legal ' +
      'mensal × ITP do cargo. Servidores necessários = esforço necessário total ÷ (horário legal × ITP). ' +
      'Este método usa a produtividade da PRÓPRIA unidade (ou a comparação entre cargos/benchmark, se selecionado) ' +
      '— não depende de outras unidades.';
  }
  return 'Como é calculado (Direcionador Histórico): a produtividade de referência é a ' + critNome +
    ' da série histórica de produtividade do próprio cargo (volume ÷ horas efetivas, mês a mês). ' +
    'Servidores necessários = demanda ÷ referência ÷ (horas mensais × ITP). Por usar o histórico da própria unidade, ' +
    'uma melhora de produtividade ao longo do tempo eleva a referência e reduz os necessários no período seguinte.';
}

/* ============ Esforço necessário × capacidade disponível (card próprio) ============
   Fica ANTES da Sazonalidade. Não aparece em Comparação entre Pares — nesse método a
   referência é a produtividade de outras unidades, não faz sentido comparar horas
   "necessárias" da própria unidade contra a própria capacidade neste formato. */
function cardCapacidade(alvo, uId, cfg, opts) {
  const s = st();
  const ano = s.anoReferencia;
  const cargosUni = Calc.lotacaoUnidade(s, uId).map(l => l.cargoId);
  if (!cargosUni.length) { alvo.innerHTML = ''; return; }
  const cargoSel = cfg.cargoDimId && cargosUni.includes(cfg.cargoDimId) ? cfg.cargoDimId : cargosUni[0];
  cfg.cargoDimId = cargoSel;

  const d = Calc.dimensionar(s, uId, cargoSel, {
    criterio: opts.criterio || cfg.criterio, ano, modo: opts.modo,
    metodoProjecao: cfg.metodoProjecao, cenario: cfg.cenario, taxaManual: cfg.taxaManual
  });
  const segmentos = (d.linhas || []).filter(l => l.horas > 0).map(l => ({ label: l.entrega.titulo, valor: l.horas }));
  if (!segmentos.length) { alvo.innerHTML = ''; return; }

  alvo.innerHTML = `<div class="card card-larga">
    <h3>Esforço necessário × capacidade disponível ${tipInfo('Esforço necessário: soma das horas exigidas por cada entrega deste cargo. Capacidade disponível: servidores atuais × horário legal mensal × ITP do cargo. Quando a barra de capacidade não alcança a linha tracejada (esforço necessário), falta gente para cobrir a demanda — é a mesma conta por trás do déficit/superávit do card abaixo, mas em horas.')}</h3>
    <div class="filtros" style="margin-bottom:4px">
      <label>Cargo ${tipInfo('Situação atual (base mensal) — não muda com o recorte selecionado no card de Resultados do Dimensionamento.')}
        <select id="cap-cargo" class="input">${cargosUni.map(c =>
          `<option value="${c}" ${c === cargoSel ? 'selected' : ''}>${E(nomeCargo(c))}</option>`).join('')}</select></label>
    </div>
    <div id="cap-grafico" style="margin-top:10px"></div>
  </div>`;

  Charts.capacidade(document.getElementById('cap-grafico'), {
    segmentos,
    capacidadeHoras: d.horasMensais * d.itp.itp * d.atuais,
    fmt: v => fmtN(v, 0) + ' h',
    legendaCap: `Capacidade disponível (${fmtN(d.atuais)} servidor${d.atuais !== 1 ? 'es' : ''})`
  });

  document.getElementById('cap-cargo').addEventListener('change', e => {
    cfg.cargoDimId = e.target.value; rerenderResultados(uId);
  });
}

function heroDimensionamento(alvo, uId, cfg, opts) {
  const s = st();
  const ano = s.anoReferencia;
  const cargosUni = Calc.lotacaoUnidade(s, uId).map(l => l.cargoId);
  if (!cargosUni.length) {
    alvo.innerHTML = `<div class="card card-larga"><h3>Resultados do Dimensionamento</h3>
      <p class="vazio">Cadastre os servidores da unidade na tela <a href="#/cargos">Cargos</a> para calcular o dimensionamento.</p></div>`;
    return;
  }
  const cargoSel = cfg.cargoDimId && cargosUni.includes(cfg.cargoDimId) ? cfg.cargoDimId : cargosUni[0];
  cfg.cargoDimId = cargoSel;
  const modoEsforco = opts.modo === 'esforco';
  const visaoUnidade = cfg.visaoDim === 'unidade';
  const criterioUso = opts.criterio || cfg.criterio;

  const optsCalc = {
    criterio: criterioUso, ano, modo: opts.modo,
    metodoProjecao: cfg.metodoProjecao, cenario: cfg.cenario, taxaManual: cfg.taxaManual
  };
  const d = visaoUnidade
    ? Calc.dimensionarUnidade(s, uId, optsCalc)
    : Calc.dimensionar(s, uId, cargoSel, optsCalc);

  const recortes = [
    { id: 'mensal', rotulo: 'Mensal' },
    { id: 'anual', rotulo: 'Anual' },
    ...[1, 2, 3, 4, 5].map(h => ({ id: String(h), rotulo: String(ano + h), proj: h }))
  ];
  const sel = cfg.recorte && recortes.some(r => r.id === cfg.recorte) ? cfg.recorte : 'mensal';
  cfg.recorte = sel;
  const rSel = recortes.find(r => r.id === sel);

  let demanda, necessarios, atuais, saldo, apos = 0, fAuto = 1, unidadeDemanda = 'un/mês', obs;
  if (sel === 'mensal') {
    demanda = d.demandaMensal; necessarios = d.necessarios; atuais = d.atuais; saldo = d.saldo;
    obs = `média ${ano}`;
  } else if (sel === 'anual') {
    demanda = d.anual.demanda; necessarios = d.anual.necessarios; atuais = d.atuais; saldo = d.anual.saldo;
    unidadeDemanda = 'un/ano'; obs = `${ano} · 12 meses`;
  } else {
    const p = d.projetado[rSel.proj];
    if (p) {
      demanda = p.demanda; necessarios = p.necessarios; atuais = p.atuais; saldo = p.saldo;
      apos = p.aposentadorias; fAuto = p.fatorAutomacao;
      obs = `cenário ${NOME_CENARIO[cfg.cenario].toLowerCase()} · mensal`;
    } else obs = 'histórico insuficiente';
  }

  // impacto financeiro do saldo (custo médio do cargo)
  const remMedia = d.atuais > 0 ? d.custoMensal / d.atuais : 0;
  const custoSaldo = saldo != null && remMedia ? Math.abs(saldo) * remMedia : null;

  const saldoClasse = saldo == null || isNaN(saldo) ? 'equilibrio'
    : Math.abs(saldo) < 0.5 ? 'equilibrio' : saldo < 0 ? 'deficit' : 'superavit';
  const saldoIcone = saldoClasse === 'deficit' ? '▼' : saldoClasse === 'superavit' ? '▲' : '◆';
  const saldoTexto = saldoClasse === 'deficit' ? 'Déficit de<br>servidores'
    : saldoClasse === 'superavit' ? 'Superávit de<br>servidores' : 'Quadro em<br>equilíbrio';

  alvo.innerHTML = `<div class="hero-dim">
    <div class="hero-topo">
      <div>
        <div class="hero-eyebrow">Resultado do dimensionamento ${tipInfo(explicaDimensionamento(opts, criterioUso, cfg))}
          <span style="margin-left:10px">
            <button class="btn-recorte ${!visaoUnidade ? 'ativo' : ''}" data-visao-dim="cargo">Por cargo</button>
            <button class="btn-recorte ${visaoUnidade ? 'ativo' : ''}" data-visao-dim="unidade">Por unidade</button>
          </span></div>
        <h2>${visaoUnidade ? 'Unidade — todos os cargos' : E(nomeCargo(cargoSel))}</h2>
        <div class="hero-base">base: ${visaoUnidade ? 'agregado de todos os cargos da unidade' : modoEsforco
          ? 'esforço = tempo por entrega × volume (com demanda não atendida) ÷ disponibilidade'
          : (opts.modo === 'pares' ? 'produtividade de referência entre pares' : 'produtividade histórica da própria unidade') + ` (${criterioUso === 'benchmark' ? 'benchmark' : criterioUso === 'cargos' ? 'comparação entre cargos' : (NOME_CRITERIO[cfg.criterio] || '').toLowerCase()})`}
          ${visaoUnidade ? '' : `· ITP ${fmtN(d.itp.itp * 100, 1)}% · jornada ${fmtN(d.horasMensais, 0)} h/mês`}</div>
      </div>
      <div class="hero-saldo ${saldoClasse}">
        <strong>${saldoIcone} ${saldo != null && !isNaN(saldo) ? fmtN(Math.abs(saldo), 1) : '—'}</strong>
        <span>${saldoTexto}</span>
      </div>
    </div>
    <div class="hero-recortes">
      <span class="rotulo">Recorte ${tipInfo('Mensal: demanda média do ano de referência. Anual: acumulado em 12 meses. Anos futuros: demanda projetada no cenário selecionado, descontando as aposentadorias estimadas e aplicando a redução pelas oportunidades de otimização das categorias de atividade.')}</span>
      ${recortes.map(r => `<button class="btn-recorte ${r.id === sel ? 'ativo' : ''}" data-recorte="${r.id}">${r.rotulo}</button>`).join('')}
      ${visaoUnidade ? '' : `<label style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:rgba(255,255,255,.8)">Cargo
        <select id="dim-cargo" class="input">${cargosUni.map(c =>
          `<option value="${c}" ${c === cargoSel ? 'selected' : ''}>${E(nomeCargo(c))}</option>`).join('')}</select></label>`}
    </div>
    <div class="hero-tiles">
      <div class="hero-tile">
        <div class="v">${demanda != null ? fmtN(demanda) : '—'}</div>
        <div class="l">Demanda estimada</div>
        <div class="s">${unidadeDemanda} · ${obs}</div>
      </div>
      <div class="hero-tile">
        <div class="v">${visaoUnidade ? fmtN(d.horasNecessarias, 0)
          : modoEsforco
            ? (d.tempoUnitMedio != null ? fmtN(d.tempoUnitMedio, 2) : '—')
            : (d.prodRefMedia != null ? fmtN(d.prodRefMedia, 2) : '—')}</div>
        <div class="l">${visaoUnidade ? 'Esforço total' : modoEsforco ? 'Tempo por entrega' : 'Produtividade ref.'}</div>
        <div class="s">${visaoUnidade ? 'horas necessárias/mês' : modoEsforco ? 'h por unidade entregue' : 'un/h efetiva'}</div>
      </div>
      <div class="hero-tile">
        <div class="v">${fmtN(atuais)}</div>
        <div class="l">Servidores atuais</div>
        <div class="s">${apos ? `já descontadas ${fmtN(apos)} apos.` : (visaoUnidade ? 'todos os cargos' : E(nomeCargo(cargoSel)))}</div>
      </div>
      <div class="hero-tile realce">
        <div class="v">${necessarios != null ? fmtN(necessarios, 1) : '—'}</div>
        <div class="l">Servidores necessários</div>
        <div class="s">${fAuto < 0.999 ? `Otimização: −${fmtN((1 - fAuto) * 100, 0)}% na demanda` : 'estimativa'}</div>
      </div>
      <div class="hero-tile">
        <div class="v" style="font-size:19px">${custoSaldo != null && saldoClasse !== 'equilibrio' ? fmtBRLcomp(custoSaldo) : '—'}</div>
        <div class="l">${saldoClasse === 'deficit' ? 'Custo para suprir' : saldoClasse === 'superavit' ? 'Capacidade liberável' : 'Impacto financeiro'}</div>
        <div class="s">R$/mês · remuneração média do cargo</div>
      </div>
    </div>
  </div>

  <div class="card card-larga">
    <h3>Projeção do quadro ano a ano ${tipInfo('Três leituras do mesmo horizonte: o QUADRO TOTAL projetado (servidores que restam depois das aposentadorias estimadas, sem reposição), as APOSENTADORIAS ACUMULADAS até cada ano e os SERVIDORES NECESSÁRIOS pela demanda projetada, já com a redução prevista pelas categorias de atividade. A distância entre a linha do quadro e a dos necessários é o déficit a suprir em cada exercício.')}</h3>
    <p class="card-sub">${visaoUnidade ? 'unidade — todos os cargos' : E(nomeCargo(cargoSel))} · pessoas · aposentadoria estimada = entrada + 35 anos</p>
    <div id="dim-proj-quadro"></div>
  </div>

  <div class="sim-box">
    <div class="sim-titulo">Simulador — e se…? ${tipInfo('Simulação sobre o recorte selecionado: quantos servidores contratar (ou ceder) e um choque adicional de otimização além do previsto pelas categorias. Não altera os dados salvos.')}</div>
    <div class="sim-controles">
      <label>Contratar / ceder
        <input type="number" id="sim-contratar" class="input num-in curta" min="-10" max="30" step="1" value="0"> servidores</label>
      <label>Otimização adicional
        <input type="range" id="sim-auto" min="0" max="50" step="5" value="0">
        <span class="mono" id="sim-auto-val">0%</span></label>
      <span class="sim-resultado" id="sim-out"></span>
    </div>
  </div>

  ${visaoUnidade ? (() => {
    /* Detalhamento por cargo, seguindo o RECORTE selecionado: nos anos futuros as
       colunas mostram o quadro já projetado (aposentadorias descontadas) e ganham
       a coluna de aposentadorias acumuladas. A última linha fecha o TOTAL. */
    const proj = rSel.proj || null;
    const linhaCargo = x => {
      const pj = proj ? (x.d.projetado || {})[proj] : null;
      const custoUnit = x.d.atuais > 0 ? x.d.custoMensal / x.d.atuais : 0;
      const at = pj ? pj.atuais : x.d.atuais;
      return {
        cargoId: x.cargoId,
        atuais: at,
        apos: pj ? (pj.aposentadorias || 0) : null,
        necessarios: pj ? pj.necessarios : x.d.necessarios,
        saldo: pj ? pj.saldo : x.d.saldo,
        custo: pj ? at * custoUnit : x.d.custoMensal
      };
    };
    const ls = d.linhas.map(linhaCargo);
    const tot = campo => Calc.sum(ls.map(l => l[campo] || 0));
    const cel = v => `<td class="num">${v}</td>`;
    return `<details class="card-detalhe chart-table" open>
    <summary>Detalhamento por cargo — ${proj ? 'projeção ' + rSel.rotulo : rSel.rotulo.toLowerCase()}</summary>
    <table><thead><tr><th>Cargo</th><th class="num">Atuais</th>
      <th class="num">Aposentadorias${proj ? ' até ' + rSel.rotulo : ''}</th>
      <th class="num">Necessários</th><th class="num">Saldo</th><th class="num">Custo mensal</th></tr></thead>
    <tbody>${ls.map(l => `<tr>
      <td>${E(nomeCargo(l.cargoId))}</td>
      ${cel(fmtN(l.atuais, proj ? 1 : 0))}
      ${cel(l.apos == null ? '—' : fmtN(l.apos))}
      ${cel(fmtN(l.necessarios, 1))}
      ${cel(`<span style="font-weight:600;color:${l.saldo < -0.5 ? 'var(--vermelho-txt)' : l.saldo > 0.5 ? 'var(--verde-txt)' : 'inherit'}">${fmtN(l.saldo, 1)}</span>`)}
      ${cel(fmtBRLcomp(l.custo))}
    </tr>`).join('')}
    <tr style="border-top:2px solid #c3cfda;font-weight:700">
      <td>TOTAL da unidade</td>
      ${cel(fmtN(tot('atuais'), proj ? 1 : 0))}
      ${cel(proj ? fmtN(tot('apos')) : '—')}
      ${cel(fmtN(tot('necessarios'), 1))}
      ${cel(fmtN(tot('saldo'), 1))}
      ${cel(fmtBRLcomp(tot('custo')))}
    </tr></tbody></table>
    <p class="muted mini" style="margin-top:8px">${proj
        ? `Nos anos futuros a coluna <em>Atuais</em> já vem líquida das aposentadorias estimadas, e os <em>Necessários</em>
           incorporam a demanda projetada e a redução prevista pelas categorias de atividade. O custo mensal acompanha o
           quadro remanescente, ao custo médio de hoje.`
        : `Selecione um ano no recorte acima para ver o quadro projetado, com as aposentadorias estimadas descontadas.`}</p>
  </details>`;
  })() : `<details class="card-detalhe chart-table">
    <summary>Memória de cálculo por entrega ${modoEsforco ? '(esforço)' : ''}</summary>
    <table><thead><tr><th>Entrega</th><th class="num">Demanda mensal</th>
      <th class="num">${modoEsforco ? 'Tempo por entrega (h/un)' : 'Produtividade ref. (un/h)'}</th>
      <th class="num">Esforço (horas)</th></tr></thead>
    <tbody>${d.linhas.map(l => `<tr>
      <td>${E(l.entrega.titulo)}</td>
      <td class="num">${fmtN(l.demanda, 1)}</td>
      <td class="num">${modoEsforco
        ? (l.tempoUnit != null ? fmtN(l.tempoUnit, 2) : 'sem dados')
        : (l.prodRef != null ? fmtN(l.prodRef, 2) : 'sem referência')}</td>
      <td class="num">${fmtN(l.horas, 1)} h</td>
    </tr>`).join('')}
    <tr><td style="font-weight:800;color:var(--ink)">Total</td><td></td><td></td>
      <td class="num" style="font-weight:700">${fmtN(d.horasNecessarias, 1)} h ÷ (${fmtN(d.horasMensais, 0)} h × ITP ${fmtN(d.itp.itp * 100, 1)}%) = ${fmtN(d.necessarios, 1)} servidores</td></tr>
    </tbody></table>
  </details>`}`;

  /* ---------- projeção do quadro: total, aposentadorias e necessários ---------- */
  const alvoProj = document.getElementById('dim-proj-quadro');
  if (alvoProj) {
    const pontosAnos = [0, 1, 2, 3, 4, 5].map(h => {
      const pj = h === 0 ? null : (d.projetado || {})[h];
      return {
        x: String(ano + h),
        total: h === 0 ? d.atuais : (pj ? pj.atuais : null),
        apos: h === 0 ? 0 : (pj ? (pj.aposentadorias || 0) : null),
        nec: h === 0 ? d.necessarios : (pj ? pj.necessarios : null)
      };
    });
    const temProj = pontosAnos.some(p => p.total != null && p.x !== String(ano));
    if (!temProj) {
      alvoProj.innerHTML = `<p class="vazio">Histórico insuficiente para projetar o quadro
        (mínimo de 3 meses de produção ou histórico retroativo).</p>`;
    } else {
      const so = campo => pontosAnos.filter(p => p[campo] != null).map(p => ({ x: p.x, y: p[campo] }));
      Charts.line(alvoProj, {
        series: [
          { nome: 'Quadro total (sem reposição)', cor: '#1360d8', pontos: so('total') },
          { nome: 'Servidores necessários', cor: '#e34948', tracejada: true, pontos: so('nec') },
          { nome: 'Aposentadorias acumuladas', cor: '#eda100', tracejada: true, pontos: so('apos') }
        ],
        fmt: v => Charts.fmtBR(v, 1), fmtX: x => x, unidadeY: 'servidores', altura: 260
      });
    }
  }

  const selCargoDim = document.getElementById('dim-cargo');
  if (selCargoDim) selCargoDim.addEventListener('change', e => {
    cfg.cargoDimId = e.target.value; rerenderResultados(uId);
  });
  alvo.querySelectorAll('[data-visao-dim]').forEach(b => b.addEventListener('click', () => {
    cfg.visaoDim = b.dataset.visaoDim; rerenderResultados(uId);
  }));
  alvo.querySelectorAll('[data-recorte]').forEach(b => b.addEventListener('click', () => {
    cfg.recorte = b.dataset.recorte; rerenderResultados(uId);
  }));

  // simulador what-if (atualiza sem re-renderizar)
  const simContratar = document.getElementById('sim-contratar');
  const simAuto = document.getElementById('sim-auto');
  const simAutoVal = document.getElementById('sim-auto-val');
  const simOut = document.getElementById('sim-out');
  const atualizaSim = () => {
    if (necessarios == null || atuais == null) { simOut.innerHTML = '<span class="muted">sem dados para simular</span>'; return; }
    const n = Number(simContratar.value) || 0;
    const extra = Number(simAuto.value) || 0;
    simAutoVal.textContent = extra + '%';
    const necSim = necessarios * (1 - extra / 100);
    const saldoSim = (atuais + n) - necSim;
    const cls = Math.abs(saldoSim) < 0.5 ? 'equilibrio' : saldoSim < 0 ? 'deficit' : 'superavit';
    const custo = n > 0 ? ` · custo de contratação ≈ ${fmtBRLcomp(n * remMedia)}/mês` : '';
    simOut.innerHTML = `→ saldo simulado: <span class="saldo ${cls}">${cls === 'deficit' ? '▼ Déficit de ' + fmtN(-saldoSim, 1) : cls === 'superavit' ? '▲ Superávit de ' + fmtN(saldoSim, 1) : '◆ Equilíbrio (' + fmtN(saldoSim, 1) + ')'}</span>${custo}`;
  };
  simContratar.addEventListener('input', atualizaSim);
  simAuto.addEventListener('input', atualizaSim);
  atualizaSim();
}


/* ===== unidade.js ===== */
/* ============================================================
   DFT — Tela da Unidade: Entregas, Produção e Histórico Retroativo
   A aba Resultados é montada em resultados.js.
   ============================================================ */

const EM_CONSTRUCAO = ['Direcionador Referencial/Normativo', 'Capacidade e Consenso Técnico'];

function cfgResultado(uId) {
  const s = st();
  s.resultadoConfig[uId] = s.resultadoConfig[uId] || {};
  return s.resultadoConfig[uId];
}

function telaUnidade(uId, tab) {
  const s = st();
  const u = Calc.unidade(s, uId);
  if (!u) { navega('#/orgaos'); return; }
  const perfil = perfilAtual();
  const soProducao = perfil.id === 'servidor';
  if (soProducao) tab = 'producao';
  const voltar = soProducao || perfil.id === 'unidade' ? '#/inicio' : '#/orgaos/' + encodeURIComponent(u.orgao);
  const ano = s.anoReferencia;
  const pcts = Calc.percentuais(s, uId, ano);
  const temEntregas = Calc.entregasUnidade(s, uId).length > 0;
  const bloqueado = !temEntregas || pcts.soma <= 0;
  const emConstrucao = EM_CONSTRUCAO.includes(u.metodo);

  // detalhamento da unidade no menu lateral
  const itens = soProducao ? [['producao', 'Produção', 'relatorios']] : [
    ['entregas', 'Entregas', 'docok'], ['mapeamento', 'Mapear entregas', 'robo'],
    ['producao', 'Produção', 'relatorios'],
    ['historico', 'Histórico retroativo', 'calend'], ['resultados', 'Resultados', 'grafico']
  ];
  setSubnav(`${E(u.orgao)} / ${E(u.sigla)}`,
    emConstrucao ? [{ id: 'info', rotulo: 'Método em construção', ico: 'config', ativo: true, hash: `#/unidade/${uId}` }]
      : itens.map(([id, nome, ico]) => ({
        id, rotulo: nome + (id === 'resultados' && bloqueado ? ' 🔒' : ''), ico,
        ativo: tab === id,
        hash: id === 'resultados' && bloqueado ? '' : `#/unidade/${uId}/${id}`,
        desabilitado: id === 'resultados' && bloqueado
      })));

  const anos = [...new Set([2024, 2025, 2026,
    ...s.producao.map(p => +p.mes.slice(0, 4)), ...s.historico.map(h => +h.mes.slice(0, 4))])].sort();

  app().innerHTML = `
  ${cabecalhoPagina(`${E(u.sigla)} — ${E(u.nome)}`, null, voltar)}
  <div class="uni-sub">
    <span class="muted">${E(u.orgao)}</span>
    <span class="tag-funcao">${E(u.funcao)}</span>
    ${badge(u)}
    ${u.metodo === 'Comparação entre Pares' && !soProducao ? `<label class="cod-pares">Código de pares
      ${tipInfo('Unidades com o mesmo código são comparadas entre si (ex.: NRHS compara apenas com NRHS de outros órgãos). Definido no cadastro da unidade pelo Gestor SEAP.')}
      <input type="text" id="cod-pares" class="input" value="${E(Calc.codigoPares(s, uId))}"></label>` : ''}
    <label class="sel-ano">Ano de referência
      ${tipInfo('Os cálculos — medianas de tempo alocado, volumes médios, ITP e produtividade — consideram os lançamentos deste ano. O histórico completo continua alimentando os gráficos e as projeções.')}
      <select id="sel-ano" class="input">${anos.map(a =>
        `<option ${a === ano ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
  </div>
  ${bloqueado && !emConstrucao && !soProducao ? '' : ''}
  <div id="conteudo-aba"></div>`;

  document.getElementById('sel-ano').addEventListener('change', e => {
    s.anoReferencia = Number(e.target.value); Store.salvar(); telaUnidade(uId, tab);
  });
  const codIn = document.getElementById('cod-pares');
  if (codIn) codIn.addEventListener('change', () => {
    cfgResultado(uId).codigoPares = codIn.value.trim() || u.codigoPares;
    Store.salvar(); telaUnidade(uId, tab);
  });

  const alvo = document.getElementById('conteudo-aba');
  if (emConstrucao) return abaEmConstrucao(alvo, u);
  if (tab === 'mapeamento') return abaMapeamento(alvo, uId);
  if (tab === 'producao') return abaProducao(alvo, uId);
  if (tab === 'historico') return abaHistorico(alvo, uId);
  if (tab === 'resultados' && !bloqueado) return telaResultados(alvo, uId);
  abaEntregas(alvo, uId);
}

function abaEmConstrucao(alvo, u) {
  alvo.innerHTML = `<div class="card card-larga construcao">
    <h3>Método: ${E(u.metodo)}</h3>
    <p>A tela específica deste método de dimensionamento está <strong>em construção</strong>.</p>
    <p class="muted">As telas disponíveis nesta versão: Comparação entre Pares, Esforço por Entrega e Direcionador Histórico.</p>
  </div>`;
}

/* ---------- banner da regra dos 100% ---------- */
function bannerPercentuais(uId) {
  const s = st();
  const pcts = Calc.percentuais(s, uId, s.anoReferencia);
  if (!Calc.entregasUnidade(s, uId).length) return '';
  if (pcts.soma <= 0) {
    return `<div class="banner erro">A soma dos percentuais de tempo alocados é <strong>0%</strong> —
      informe os percentuais das entregas (ou lance produção) para liberar os Resultados. A soma deve fechar <strong>100%</strong>.</div>`;
  }
  if (pcts.ok) {
    return `<div class="banner ok">Soma dos percentuais de tempo alocados = <strong>100%</strong> ✓</div>`;
  }
  return `<div class="banner aviso">Soma dos percentuais informados = <strong>${fmtN(pcts.soma, 1)}%</strong>.
    Como a soma deve fechar 100%, o sistema <strong>normalizou automaticamente</strong> os percentuais
    (mediana normalizada) para os cálculos. ${tipInfo('O percentual de cada entrega é a mediana dos percentuais informados pelos usuários na tela Produção; a normalização redistribui proporcionalmente para a soma fechar exatamente 100%.')}</div>`;
}

/* ---------- aba Entregas (cards Aurora) ---------- */
function abaEntregas(alvo, uId) {
  const s = st();
  const u = Calc.unidade(s, uId);
  const ano = s.anoReferencia;
  const ents = Calc.entregasUnidade(s, uId);
  const pcts = Calc.percentuais(s, uId, ano);

  const cards = ents.map(e => {
    const p = pcts.porEntrega[e.id] || { valor: 0, normalizado: 0, fonte: 'sem dados' };
    const volMedio = Calc.volumeMedioMensal(s, uId, e.id, ano) || e.volumeMensal || 0;
    const rep = Calc.reprimidaMedia(s, uId, e.id, ano);
    const pot = Calc.potencialAutomacaoEntrega(s, e);
    const status = rep > 0 ? { txt: 'Com fila', cor: '#e2564f' } : { txt: 'Estável', cor: '#12a86a' };
    return `<div class="card ent-card">
      <div class="card-topo">
        <span class="badge mini badge-azul">${E(METODO_MINI[u.metodo] || 'Entrega')}</span>
        <span class="ent-status" style="color:${status.cor}" title="${rep > 0 ? 'Há demanda não atendida relatada nos lançamentos' : 'Sem fila relatada'}">
          <span class="ponto" style="background:${status.cor}"></span>${status.txt}</span>
      </div>
      <h4>${E(e.titulo)}</h4>
      <p class="ent-desc" title="${E(e.descricao)}">${E(e.descricao)}</p>
      <div class="ent-cargos">${ICO('cargos')}${e.cargos.map(c => E(nomeCargo(c.cargoId))).join(' · ') || '—'}</div>
      <div class="ent-vol"><strong>${fmtN(volMedio)}</strong><span>un/mês · vol. médio ${tipInfo('Média mensal dos volumes lançados na Produção/Histórico no ano de referência; sem lançamentos, vale o volume cadastrado.')}</span></div>
      <div class="ent-barra" title="Tempo alocado: mediana dos percentuais da Produção, normalizada para 100% na unidade${Math.abs(p.valor - p.normalizado) > 0.05 ? ' (bruto ' + fmtN(p.valor, 1) + '%)' : ''}">
        <span class="trilha"><span class="fill" style="width:${Math.min(100, p.normalizado).toFixed(1)}%"></span></span>
        <span class="txt">${fmtN(p.normalizado, 1)}% tempo</span>
      </div>
      ${rep > 0 || pot > 0 ? `<div class="ent-pills">
        ${rep > 0 ? `<span class="badge mini badge-fila" title="Demanda não atendida média relatada nos lançamentos">fila ${fmtN(rep)}/mês</span>` : ''}
        ${pot > 0 ? `<span class="badge mini badge-auto" title="Potencial de otimização derivado das categorias de atividade (rampa até ${Calc.horizonteAutomacao(e)} anos)">Otimização −${fmtN(pot, 0)}% · ${Calc.horizonteAutomacao(e)}a</span>` : ''}
      </div>` : ''}
      <div class="ent-foot">
        <button class="ent-editar" data-editar="${e.id}">${ICO('editar', 'ico mini-ico')} Editar</button>
        <button class="ent-editar" data-transferir="${e.id}" title="Vincular esta entrega a outra unidade ou enviá-la ao acervo">${ICO('seta', 'ico mini-ico')} Vincular</button>
        <button class="btn-x" data-excluir="${e.id}" title="Excluir entrega">×</button>
      </div>
    </div>`;
  }).join('');

  const noAcervo = s.entregas.filter(e => !e.unidadeId).length;
  alvo.innerHTML = `
  ${bannerPercentuais(uId)}
  <div class="acoes">
    <button class="btn" id="btn-nova-entrega">+ Cadastrar entrega</button>
    <button class="btn btn-sec" id="btn-acervo">Acervo de entregas${noAcervo ? ` (${noAcervo})` : ''}</button>
  </div>
  <div id="form-entrega"></div>
  <div class="grid-cards">${cards || '<p class="vazio">Nenhuma entrega cadastrada. Cadastre a primeira entrega da unidade.</p>'}</div>`;

  document.getElementById('btn-nova-entrega').addEventListener('click', () => formEntrega(uId, null));
  document.getElementById('btn-acervo').addEventListener('click', () => navega('#/acervo'));
  alvo.querySelectorAll('[data-editar]').forEach(b =>
    b.addEventListener('click', () => formEntrega(uId, b.dataset.editar)));
  alvo.querySelectorAll('[data-transferir]').forEach(b =>
    b.addEventListener('click', () => formVinculoEntrega(b.dataset.transferir, () => telaUnidade(uId, 'entregas'))));
  alvo.querySelectorAll('[data-excluir]').forEach(b => b.addEventListener('click', () => {
    const e = s.entregas.find(x => x.id === b.dataset.excluir);
    if (!confirm(`Excluir a entrega "${e.titulo}"? Os lançamentos de produção e histórico vinculados também serão removidos.`)) return;
    s.entregas.splice(s.entregas.indexOf(e), 1);
    s.producao.forEach(p => { p.itens = p.itens.filter(i => i.entregaId !== e.id); });
    s.historico = s.historico.filter(h => h.entregaId !== e.id);
    Store.salvar(); telaUnidade(uId, 'entregas');
  }));
}

function formEntrega(uId, entregaId) {
  const s = st();
  const e = entregaId ? s.entregas.find(x => x.id === entregaId) : {
    titulo: '', descricao: '', cargos: [], volumeMensal: 0, demandaReprimida: 0,
    mesRef: `${s.anoReferencia}-01`, percentualManual: null
  };
  const alvo = document.getElementById('form-entrega');
  const linhasCargo = (e.cargos.length ? e.cargos : [{ cargoId: s.cargos[0].id, pessoas: 1 }]);

  alvo.innerHTML = `<div class="card card-larga form-card">
    <h3>${entregaId ? 'Editar entrega' : 'Nova entrega'}</h3>
    <div class="form-grid">
      <label class="span2">Título <input type="text" id="fe-titulo" class="input" value="${E(e.titulo)}" placeholder="Ex.: Folhas de pagamento processadas"></label>
      <label class="span2">Descrição <textarea id="fe-desc" class="input" rows="2">${E(e.descricao)}</textarea></label>
      <label>Volume da entrega ${tipInfo('Escolha se o volume é informado por mês ou por ano. O sistema converte o valor anual para a base mensal (÷12) nos cálculos.')}
        <span style="display:flex;gap:8px">
          <input type="number" id="fe-volume" class="input" min="0" style="flex:1"
            value="${e.periodicidade === 'anual' ? (e.volumeInformado != null ? e.volumeInformado : Math.round((e.volumeMensal || 0) * 12)) : (e.volumeMensal || 0)}">
          <select id="fe-periodicidade" class="input" style="width:110px">
            <option value="mensal" ${e.periodicidade !== 'anual' ? 'selected' : ''}>por mês</option>
            <option value="anual" ${e.periodicidade === 'anual' ? 'selected' : ''}>por ano</option>
          </select>
        </span></label>
      <label>Demanda não atendida ${tipInfo('Volume que a unidade não consegue absorver (fila/passivo). Considerada no cálculo de Esforço por Entrega.')}
        <input type="number" id="fe-reprimida" class="input" min="0" value="${e.demandaReprimida || 0}"></label>
      <label>Mês de referência <input type="month" id="fe-mes" class="input" value="${e.mesRef}"></label>
      <label>% de tempo alocado (inicial) ${tipInfo('Usado apenas enquanto não houver lançamentos de Produção. Depois, vale a mediana dos percentuais informados pelos servidores, normalizada para 100%.')}
        <input type="number" id="fe-pct" class="input" min="0" max="100" step="0.1" value="${e.percentualManual == null ? '' : e.percentualManual}" placeholder="mediana da produção"></label>
      <label>Horizonte da otimização (anos) ${tipInfo('Prazo em que o potencial de otimização das categorias selecionadas abaixo se realiza (rampa linear no DFT projetado).')}
        <select id="fe-auto-anos" class="input">${[1, 3, 5, 10].map(h =>
          `<option value="${h}" ${e.automacao && e.automacao.horizonteAnos === h ? 'selected' : (!e.automacao && h === 5 ? 'selected' : '')}>${h} ano${h > 1 ? 's' : ''}</option>`).join('')}</select></label>
    </div>
    <h4>Categorias de atividade ${tipInfo('Selecione as categorias que compõem esta entrega. Os pesos se dividem igualmente e podem ser ajustados (ex.: 70% análise de documentos — o restante se redistribui entre as demais). O potencial de otimização de cada categoria, definido na página de Oportunidades de otimização, gera a redução de demanda do DFT projetado.')}</h4>
    <div id="fe-cats">${(s.categoriasIA || []).map(cat => {
      const sel = (e.categoriasAtividade || []).find(x => x.categoriaId === cat.id);
      return `<div class="linha-form cat-linha">
        <label class="check" style="min-width:280px"><input type="checkbox" class="fe-cat-chk" data-cat="${cat.id}" ${sel ? 'checked' : ''}> ${E(cat.nome)}</label>
        <input type="number" class="input num-in curta fe-cat-peso" data-cat="${cat.id}" min="0" max="100"
          value="${sel ? sel.peso : ''}" ${sel ? '' : 'disabled'}> <span class="muted mini">% do esforço · otimização: produtividade ${fmtN(cat.potProdutividade != null ? cat.potProdutividade : (cat.potencial || 0), 0)}% · demanda ${fmtN(cat.potDemanda || 0, 0)}%</span>
      </div>`;
    }).join('')}</div>
    <p class="nota-calculo" id="fe-cats-soma"></p>
    <h4>Cargos que atuam na entrega</h4>
    <div id="fe-cargos">${linhasCargo.map((c, i) => `
      <div class="linha-form" data-fc="${i}">
        <select class="input fc-cargo">${s.cargos.map(x =>
          `<option value="${x.id}" ${x.id === c.cargoId ? 'selected' : ''}>${E(x.nome)}</option>`).join('')}</select>
        <input type="number" class="input num-in fc-pessoas" min="1" value="${c.pessoas}" title="Quantidade de pessoas">
        <button class="btn-x fc-remove" title="Remover cargo">×</button>
      </div>`).join('')}</div>
    <button class="btn-mini" id="fe-add-cargo">+ cargo</button>
    <div class="acoes">
      <button class="btn" id="fe-salvar">${entregaId ? 'Salvar alterações' : 'Cadastrar entrega'}</button>
      <button class="btn btn-sec" id="fe-cancelar">Cancelar</button>
    </div>
  </div>`;

  // categorias de atividade: divisão equitativa ao marcar; editar um peso redistribui o restante
  const boxCats = document.getElementById('fe-cats');
  const catsMarcadas = () => [...boxCats.querySelectorAll('.fe-cat-chk:checked')].map(c => c.dataset.cat);
  const pesoInput = id => boxCats.querySelector(`.fe-cat-peso[data-cat="${id}"]`);
  const atualizaSomaCats = () => {
    const ids = catsMarcadas();
    const soma = Calc.sum(ids.map(id => Number(pesoInput(id).value) || 0));
    const el = document.getElementById('fe-cats-soma');
    el.innerHTML = ids.length
      ? `Soma dos pesos: <strong class="${Math.abs(soma - 100) < 0.5 ? 'ok-txt' : 'erro-txt'}">${fmtN(soma, 0)}%</strong> (deve fechar 100%)`
      : 'Nenhuma categoria selecionada — a entrega ficará sem estimativa de otimização.';
  };
  const divideIgual = () => {
    const ids = catsMarcadas();
    ids.forEach((id, i) => {
      const base = Math.floor(100 / ids.length);
      pesoInput(id).value = i === 0 ? 100 - base * (ids.length - 1) : base;
    });
    atualizaSomaCats();
  };
  boxCats.querySelectorAll('.fe-cat-chk').forEach(chk => chk.addEventListener('change', () => {
    const inp = pesoInput(chk.dataset.cat);
    inp.disabled = !chk.checked;
    if (!chk.checked) inp.value = '';
    divideIgual();
  }));
  boxCats.querySelectorAll('.fe-cat-peso').forEach(inp => inp.addEventListener('change', () => {
    const ids = catsMarcadas();
    const meu = Math.max(0, Math.min(100, Number(inp.value) || 0));
    inp.value = meu;
    const outros = ids.filter(id => id !== inp.dataset.cat);
    if (outros.length) { // o restante se redistribui igualmente entre as demais selecionadas
      const resto = 100 - meu;
      outros.forEach((id, i) => {
        const base = Math.floor(resto / outros.length);
        pesoInput(id).value = i === 0 ? resto - base * (outros.length - 1) : base;
      });
    }
    atualizaSomaCats();
  }));
  atualizaSomaCats();

  const boxCargos = document.getElementById('fe-cargos');
  const ligaRemover = () => boxCargos.querySelectorAll('.fc-remove').forEach(b =>
    b.onclick = () => { if (boxCargos.children.length > 1) b.closest('[data-fc]').remove(); });
  ligaRemover();
  document.getElementById('fe-add-cargo').addEventListener('click', () => {
    const div = document.createElement('div');
    div.className = 'linha-form'; div.dataset.fc = boxCargos.children.length;
    div.innerHTML = `<select class="input fc-cargo">${s.cargos.map(x =>
      `<option value="${x.id}">${E(x.nome)}</option>`).join('')}</select>
      <input type="number" class="input num-in fc-pessoas" min="1" value="1">
      <button class="btn-x fc-remove">×</button>`;
    boxCargos.appendChild(div); ligaRemover();
  });
  document.getElementById('fe-cancelar').addEventListener('click', () => { alvo.innerHTML = ''; });
  document.getElementById('fe-salvar').addEventListener('click', () => {
    const titulo = document.getElementById('fe-titulo').value.trim();
    if (!titulo) { alert('Informe o título da entrega.'); return; }
    const cargos = [...boxCargos.querySelectorAll('[data-fc]')].map(div => ({
      cargoId: div.querySelector('.fc-cargo').value,
      pessoas: Number(div.querySelector('.fc-pessoas').value) || 1
    }));
    const idsC = cargos.map(c => c.cargoId);
    if (new Set(idsC).size !== idsC.length) { alert('Há cargos repetidos na entrega.'); return; }
    const pctRaw = document.getElementById('fe-pct').value;
    // categorias selecionadas: normaliza os pesos para fecharem exatamente 100
    const idsCat = catsMarcadas();
    let categoriasAtividade = null;
    if (idsCat.length) {
      let pesos = idsCat.map(id => Math.max(0, Number(pesoInput(id).value) || 0));
      const somaP = Calc.sum(pesos) || 1;
      pesos = pesos.map(p2 => Math.round(p2 / somaP * 100));
      pesos[0] += 100 - Calc.sum(pesos);
      categoriasAtividade = idsCat.map((id, i) => ({ categoriaId: id, peso: pesos[i] }));
    }
    const dados = {
      titulo, descricao: document.getElementById('fe-desc').value.trim(),
      volumeMensal: (() => {
        const v = Number(document.getElementById('fe-volume').value) || 0;
        return document.getElementById('fe-periodicidade').value === 'anual' ? v / 12 : v;
      })(),
      periodicidade: document.getElementById('fe-periodicidade').value,
      volumeInformado: Number(document.getElementById('fe-volume').value) || 0,
      demandaReprimida: Number(document.getElementById('fe-reprimida').value) || 0,
      mesRef: document.getElementById('fe-mes').value || `${s.anoReferencia}-01`,
      percentualManual: pctRaw === '' ? null : Number(pctRaw), cargos,
      categoriasAtividade,
      automacao: { horizonteAnos: Number(document.getElementById('fe-auto-anos').value) || 5 }
    };
    if (entregaId) Object.assign(s.entregas.find(x => x.id === entregaId), dados);
    else s.entregas.push(Object.assign({ id: Store.novoId('e', s.entregas), unidadeId: uId }, dados));
    Store.salvar(); telaUnidade(uId, 'entregas');
  });
}

/* ============================================================
   Vínculo da entrega com a unidade
   A entrega é um ATIVO DE INFORMAÇÃO do Estado, não da unidade: se a unidade
   deixa de existir (ou é reorganizada), a entrega e o seu histórico continuam
   no acervo e podem ser vinculados a uma nova unidade.
   ============================================================ */
function vinculaEntrega(entregaId, destinoId, levarHistorico) {
  const s = st();
  const e = s.entregas.find(x => x.id === entregaId);
  if (!e) return;
  const origem = e.unidadeId;
  const uOrig = origem ? Calc.unidade(s, origem) : null;
  e.vinculos = e.vinculos || [];
  e.vinculos.push({
    de: origem, deSigla: uOrig ? uOrig.sigla : null, deOrgao: uOrig ? uOrig.orgao : null,
    para: destinoId || null, data: new Date().toISOString().slice(0, 10),
    historico: !!levarHistorico, motivo: destinoId ? 'vínculo alterado' : 'enviada ao acervo'
  });
  e.unidadeId = destinoId || null;

  if (destinoId && levarHistorico) {
    // histórico agregado: basta repontar a unidade do registro
    s.historico.forEach(h => { if (h.entregaId === entregaId) h.unidadeId = destinoId; });
    // produção individual: os itens da entrega saem do registro da unidade antiga
    // e passam para um registro do mesmo servidor/mês na unidade de destino
    const novos = [];
    s.producao.slice().forEach(p => {
      if (p.unidadeId === destinoId) return;
      const itens = p.itens.filter(i => i.entregaId === entregaId);
      if (!itens.length) return;
      p.itens = p.itens.filter(i => i.entregaId !== entregaId);
      let alvo = s.producao.concat(novos).find(x =>
        x.unidadeId === destinoId && x.servidorId === p.servidorId && x.mes === p.mes);
      if (!alvo) {
        alvo = {
          id: Store.novoId('p', s.producao.concat(novos)), unidadeId: destinoId,
          servidorId: p.servidorId, cargoId: p.cargoId, mes: p.mes, itens: []
        };
        novos.push(alvo);
      }
      alvo.itens.push(...itens);
    });
    s.producao.push(...novos);
    s.producao = s.producao.filter(p => p.itens.length);
  }
  Store.salvar();
}

function formVinculoEntrega(entregaId, aoConcluir) {
  const s = st();
  const e = s.entregas.find(x => x.id === entregaId);
  if (!e) return;
  const alvo = document.getElementById('form-entrega') || document.getElementById('form-vinculo');
  if (!alvo) return;
  const atual = e.unidadeId ? Calc.unidade(s, e.unidadeId) : null;
  const lanc = s.producao.reduce((a, p) => a + p.itens.filter(i => i.entregaId === e.id).length, 0) +
    s.historico.filter(h => h.entregaId === e.id).length;
  const orgaos = s.orgaos;
  const orgaoIni = atual ? atual.orgao : orgaos[0].id;

  alvo.innerHTML = `<div class="card card-larga form-card">
    <h3 class="card-titulo">Vincular entrega a uma unidade</h3>
    <p class="card-sub"><strong>${E(e.titulo)}</strong> · hoje ${atual ? `em ${E(atual.orgao)} / ${E(atual.sigla)}` : 'no <strong>acervo</strong> (sem unidade)'}
      · ${fmtN(lanc)} lançamento(s) de produção/histórico registrados.</p>
    <div class="form-grid">
      <label>Órgão de destino
        <select id="ve-orgao" class="input">${orgaos.map(o =>
          `<option value="${E(o.id)}" ${o.id === orgaoIni ? 'selected' : ''}>${E(o.nome)}</option>`).join('')}</select></label>
      <label>Unidade de destino
        <select id="ve-unidade" class="input"></select></label>
      <label class="span2 check"><input type="checkbox" id="ve-hist" checked>
        Levar o histórico de produção junto ${tipInfo('Marcado: os lançamentos de produção e o histórico retroativo desta entrega passam a contar para a unidade de destino (é o caso de reorganização administrativa, quando a equipe vai junto). Desmarcado: o histórico permanece onde foi produzido e a entrega recomeça a série na nova unidade.')}</label>
    </div>
    <p class="nota-calculo">A entrega nunca é apagada ao mudar de unidade — o vínculo anterior fica registrado no acervo.</p>
    <div class="acoes">
      <button class="btn" id="ve-salvar">Vincular</button>
      ${e.unidadeId ? '<button class="btn btn-sec" id="ve-acervo">Enviar ao acervo (sem unidade)</button>' : ''}
      <button class="btn btn-sec" id="ve-cancelar">Cancelar</button>
    </div>
    ${(e.vinculos || []).length ? `<div class="tabela-wrap" style="margin-top:12px"><table class="tabela">
      <thead><tr><th>Data</th><th>De</th><th>Para</th><th>Motivo</th></tr></thead>
      <tbody>${e.vinculos.slice().reverse().map(v => {
        const uD = v.para ? Calc.unidade(s, v.para) : null;
        return `<tr><td class="mono">${E(v.data)}</td>
          <td>${v.deSigla ? E(v.deOrgao + ' / ' + v.deSigla) : '—'}</td>
          <td>${uD ? E(uD.orgao + ' / ' + uD.sigla) : 'Acervo'}</td>
          <td class="muted mini">${E(v.motivo || '')}${v.historico ? ' · com histórico' : ''}</td></tr>`;
      }).join('')}</tbody></table></div>` : ''}
  </div>`;

  const selO = document.getElementById('ve-orgao');
  const selU = document.getElementById('ve-unidade');
  const preenche = () => {
    const us = s.unidades.filter(u => u.orgao === selO.value && u.id !== e.unidadeId);
    selU.innerHTML = us.map(u => `<option value="${u.id}">${E(u.sigla)} — ${E(u.nome)}</option>`).join('')
      || '<option value="">— sem outra unidade neste órgão —</option>';
    selU.dispatchEvent(new Event('change', { bubbles: true }));
  };
  selO.addEventListener('change', preenche);
  preenche();
  document.getElementById('ve-cancelar').addEventListener('click', () => { alvo.innerHTML = ''; });
  document.getElementById('ve-salvar').addEventListener('click', () => {
    if (!selU.value) { alert('Selecione a unidade de destino.'); return; }
    vinculaEntrega(entregaId, selU.value, document.getElementById('ve-hist').checked);
    aoConcluir();
  });
  const btnAc = document.getElementById('ve-acervo');
  if (btnAc) btnAc.addEventListener('click', () => {
    if (!confirm('Enviar a entrega ao acervo? Ela sai da unidade, mas os dados são preservados e podem ser vinculados a outra unidade depois.')) return;
    vinculaEntrega(entregaId, null, false);
    aoConcluir();
  });
}

/* ---------- Acervo: entregas sem unidade ---------- */
function telaAcervoEntregas() {
  const s = st();
  const p = perfilAtual();
  subnavOrgaos(s, null);
  const soltas = s.entregas.filter(e => !e.unidadeId);
  const podeEditar = p.id === 'seap' || p.id === 'rh';

  const linhas = soltas.map(e => {
    const ult = (e.vinculos || []).slice().reverse().find(v => v.deSigla);
    const lanc = s.producao.reduce((a, x) => a + x.itens.filter(i => i.entregaId === e.id).length, 0) +
      s.historico.filter(h => h.entregaId === e.id).length;
    return `<tr>
      <td><strong>${E(e.titulo)}</strong><br><span class="muted mini">${E(e.descricao || '')}</span></td>
      <td>${ult ? E(ult.deOrgao + ' / ' + ult.deSigla) : '—'}</td>
      <td class="mono">${ult ? E(ult.data) : '—'}</td>
      <td class="num mono">${fmtN(lanc)}</td>
      <td>${e.cargos.map(c => E(nomeCargo(c.cargoId))).join(' · ') || '—'}</td>
      <td>${podeEditar ? `<button class="btn-mini" data-vincular="${e.id}">Vincular a uma unidade</button>
        <button class="btn-x" data-excluir-acervo="${e.id}" title="Excluir definitivamente">×</button>` : '—'}</td>
    </tr>`;
  }).join('');

  app().innerHTML = `
  ${cabecalhoPagina('Acervo de entregas',
    'Entregas que não estão vinculadas a nenhuma unidade — porque a unidade foi extinta, reorganizada ou porque a entrega ainda vai ser atribuída. ' +
    tipInfo('A entrega e o seu histórico pertencem ao Estado, não à unidade. Ao vincular a entrega a uma nova unidade você escolhe se o histórico de produção vai junto.'),
    '#/orgaos', 'Órgãos')}
  <div id="form-vinculo"></div>
  <div class="card card-larga">
    ${soltas.length ? `<div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>Entrega</th><th>Última unidade</th><th>Desde</th><th class="num">Lançamentos</th><th>Cargos</th><th></th></tr></thead>
      <tbody>${linhas}</tbody></table></div>`
      : `<p class="vazio">Nenhuma entrega no acervo. Quando uma unidade é excluída, as entregas dela vêm para cá em vez de serem apagadas.</p>`}
  </div>`;

  app().querySelectorAll('[data-vincular]').forEach(b =>
    b.addEventListener('click', () => formVinculoEntrega(b.dataset.vincular, telaAcervoEntregas)));
  app().querySelectorAll('[data-excluir-acervo]').forEach(b => b.addEventListener('click', () => {
    const e = s.entregas.find(x => x.id === b.dataset.excluirAcervo);
    if (!confirm(`Excluir definitivamente a entrega "${e.titulo}" e todos os seus lançamentos? Esta ação não pode ser desfeita.`)) return;
    s.entregas.splice(s.entregas.indexOf(e), 1);
    s.producao.forEach(pr => { pr.itens = pr.itens.filter(i => i.entregaId !== e.id); });
    s.producao = s.producao.filter(pr => pr.itens.length);
    s.historico = s.historico.filter(h => h.entregaId !== e.id);
    Store.salvar(); telaAcervoEntregas();
  }));
}

/* ---------- aba Produção ---------- */
function abaProducao(alvo, uId) {
  const s = st();
  const perfil = perfilAtual();
  const travado = perfil.id === 'servidor' ? perfil.servidorId : null; // servidor só lança a própria produção
  const servs = s.servidores.filter(x => x.unidadeId === uId);
  const servSel = travado || (abaProducao._serv && servs.some(x => x.id === abaProducao._serv)
    ? abaProducao._serv : (servs[0] || {}).id);
  abaProducao._serv = servSel;
  const periodo = abaProducao._periodo === 'anual' ? 'anual' : 'mensal';
  abaProducao._periodo = periodo;
  const mesSel = abaProducao._mes || DFT_MES_FIM;
  abaProducao._mes = mesSel;
  const ano = s.anoReferencia;
  const mesesAno = Array.from({ length: 12 }, (_, i) => `${ano}-${String(i + 1).padStart(2, '0')}`);
  const serv = servs.find(x => x.id === servSel);
  const reg = serv && periodo === 'mensal' ? s.producao.find(p => p.servidorId === serv.id && p.mes === mesSel) : null;
  const regsAno = serv && periodo === 'anual' ? mesesAno.map(m => s.producao.find(p => p.servidorId === serv.id && p.mes === m)) : [];
  const existeAnual = regsAno.some(Boolean);
  const itemAnual = entregaId => {
    let volume = 0, percentual = null, reprimida = null;
    regsAno.forEach(r => {
      const it = r && r.itens.find(i => i.entregaId === entregaId);
      if (!it) return;
      volume += it.volume || 0;
      if (percentual == null && it.percentual) percentual = it.percentual;
      if (reprimida == null && it.reprimida != null) reprimida = it.reprimida;
    });
    return { volume, percentual, reprimida };
  };
  const entsDoCargo = serv ? Calc.entregasUnidade(s, uId)
    .filter(e => e.cargos.some(c => c.cargoId === serv.cargoId)) : [];

  alvo.innerHTML = `
  <p class="intro">Cada servidor informa, para cada entrega à qual está vinculado, o <strong>percentual de tempo dedicado</strong>,
  o <strong>volume produzido</strong> e o período de referência — além de ausências, treinamentos e projetos externos, que alimentam o ITP.</p>
  <div class="filtros">
    <label>Servidor <select id="pr-serv" class="input" ${travado ? 'disabled' : ''}>
      ${servs.filter(x => !travado || x.id === travado).map(x =>
        `<option value="${x.id}" ${x.id === servSel ? 'selected' : ''}>${E(x.nome)} — ${E(nomeCargo(x.cargoId))}</option>`).join('')}
    </select></label>
    ${travado ? '' : '<button class="btn btn-sec" id="pr-novo-serv">+ Servidor</button>'}
    <label>Periodicidade ${tipInfo('Lançamento mensal (um mês por vez) ou anual — o volume anual informado é dividido por 12 e gravado em cada mês do ano de referência; o % de tempo e a demanda não atendida são replicados como informados nos 12 meses.')}
      <select id="pr-periodicidade" class="input">
        <option value="mensal" ${periodo !== 'anual' ? 'selected' : ''}>Mensal</option>
        <option value="anual" ${periodo === 'anual' ? 'selected' : ''}>Anual</option>
      </select></label>
    ${periodo === 'anual'
      ? `<span class="muted mini">Ano de referência: <strong>${ano}</strong> ${tipInfo('Para lançar em outro ano, altere o campo "Ano de referência" no topo da página.')}</span>`
      : `<label>Mês de referência <input type="month" id="pr-mes" class="input" value="${mesSel}"></label>`}
  </div>
  ${!serv ? '<p class="vazio">Cadastre um servidor para lançar produção.</p>' : `
  <div class="card card-larga">
    <h3>Lançamento de ${E(serv.nome)} — ${periodo === 'anual' ? `ano ${ano}` : E(Calc.fmtMes(mesSel))}</h3>
    ${entsDoCargo.length ? `
    <table class="tabela">
      <thead><tr><th>Entrega</th><th class="num">% do tempo</th>
        <th class="num">${periodo === 'anual' ? 'Volume anual' : 'Volume produzido'}
          ${periodo === 'anual' ? tipInfo(`Total do ano — dividido por 12 e lançado igualmente em cada mês de ${ano}.`) : ''}</th>
        <th class="num">Demanda não atendida ${tipInfo('Volume que ficou na fila / não foi atendido no período (quando existir). A média dos relatos alimenta o cálculo de Esforço por Entrega e a demanda projetada.')}</th></tr></thead>
      <tbody>${entsDoCargo.map(e => {
        const item = periodo === 'anual' ? itemAnual(e.id) : (reg && reg.itens.find(i => i.entregaId === e.id));
        return `<tr>
          <td>${E(e.titulo)}</td>
          <td class="num"><input type="number" class="input num-in pr-pct" data-ent="${e.id}" min="0" max="100" step="0.1" value="${item && item.percentual != null ? item.percentual : ''}"></td>
          <td class="num"><input type="number" class="input num-in pr-vol" data-ent="${e.id}" min="0" value="${item && item.volume ? item.volume : ''}"></td>
          <td class="num"><input type="number" class="input num-in pr-rep" data-ent="${e.id}" min="0" placeholder="—" value="${item && item.reprimida != null ? item.reprimida : ''}"></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <p class="soma-pct">Soma dos percentuais: <strong id="pr-soma">0%</strong>
      <button class="btn-mini" id="pr-normalizar">Normalizar para 100%</button>
      ${tipInfo('A soma dos percentuais de tempo do servidor entre as entregas deve fechar exatamente 100% para salvar.')}</p>
    <p class="nota-calculo">Ausências, treinamentos e projetos especiais não são mais informados aqui:
      o RH setorial os registra por unidade/cargo nas abas <a href="#/itp/absenteismo">Absenteísmo</a> e
      <a href="#/itp/treinamentos">Treinamentos & projetos</a> do ITP.</p>
    <div class="acoes">
      <button class="btn" id="pr-salvar">${periodo === 'anual' ? 'Salvar lançamento anual' : 'Salvar lançamento'}</button>
      ${(periodo === 'anual' ? existeAnual : reg) ? `<button class="btn btn-sec" id="pr-excluir">${periodo === 'anual' ? 'Excluir lançamentos do ano' : 'Excluir lançamento'}</button>` : ''}
    </div>` : '<p class="vazio">Nenhuma entrega vinculada ao cargo deste servidor. Vincule o cargo na aba Entregas.</p>'}
  </div>
  <div class="card card-larga">
    <h3>Lançamentos recentes de ${E(serv ? serv.nome : '')}</h3>
    <table class="tabela">
      <thead><tr><th>Mês</th><th class="num">Entregas lançadas</th><th class="num">Soma %</th><th class="num">Volume total</th></tr></thead>
      <tbody>${s.producao.filter(p => p.servidorId === servSel).sort((a, b) => b.mes < a.mes ? -1 : 1).slice(0, 12).map(p =>
        `<tr><td>${E(Calc.fmtMes(p.mes))}</td>
          <td class="num">${p.itens.length}</td>
          <td class="num">${fmtN(p.itens.reduce((a, i) => a + i.percentual, 0), 1)}%</td>
          <td class="num">${fmtN(p.itens.reduce((a, i) => a + i.volume, 0))}</td></tr>`).join('') ||
        '<tr><td colspan="5" class="vazio">Sem lançamentos.</td></tr>'}</tbody>
    </table>
  </div>`}`;

  document.getElementById('pr-serv') && document.getElementById('pr-serv').addEventListener('change', e => {
    abaProducao._serv = e.target.value; telaUnidade(uId, 'producao');
  });
  document.getElementById('pr-mes') && document.getElementById('pr-mes').addEventListener('change', e => {
    abaProducao._mes = e.target.value; telaUnidade(uId, 'producao');
  });
  document.getElementById('pr-periodicidade').addEventListener('change', e => {
    abaProducao._periodo = e.target.value; telaUnidade(uId, 'producao');
  });
  const btnNovoServ = document.getElementById('pr-novo-serv');
  if (btnNovoServ) btnNovoServ.addEventListener('click', () => {
    const nome = prompt('Nome do servidor:');
    if (!nome) return;
    const opcoes = s.cargos.map((c, i) => `${i + 1} — ${c.nome}`).join('\n');
    const idx = Number(prompt('Cargo do servidor:\n' + opcoes)) - 1;
    if (!(idx >= 0 && idx < s.cargos.length)) return;
    const id = Store.novoId('s', s.servidores);
    s.servidores.push({ id, unidadeId: uId, nome: nome.trim(), cargoId: s.cargos[idx].id });
    abaProducao._serv = id;
    Store.salvar(); telaUnidade(uId, 'producao');
  });

  const somaEl = document.getElementById('pr-soma');
  const atualizaSoma = () => {
    if (!somaEl) return 0;
    const soma = [...alvo.querySelectorAll('.pr-pct')].reduce((a, i) => a + (Number(i.value) || 0), 0);
    somaEl.textContent = fmtN(soma, 1) + '%';
    somaEl.className = Math.abs(soma - 100) < 0.5 ? 'ok-txt' : 'erro-txt';
    return soma;
  };
  alvo.querySelectorAll('.pr-pct').forEach(i => i.addEventListener('input', atualizaSoma));
  atualizaSoma();
  const btnNorm = document.getElementById('pr-normalizar');
  if (btnNorm) btnNorm.addEventListener('click', () => {
    const inputs = [...alvo.querySelectorAll('.pr-pct')].filter(i => Number(i.value) > 0);
    const soma = inputs.reduce((a, i) => a + Number(i.value), 0);
    if (!soma) return;
    inputs.forEach(i => { i.value = (Number(i.value) / soma * 100).toFixed(1); });
    const dif = 100 - inputs.reduce((a, i) => a + Number(i.value), 0);
    if (inputs.length) inputs[0].value = (Number(inputs[0].value) + dif).toFixed(1);
    atualizaSoma();
  });

  const btnSalvar = document.getElementById('pr-salvar');
  if (btnSalvar) btnSalvar.addEventListener('click', () => {
    const itensForm = entsDoCargo.map(e => {
      const repRaw = alvo.querySelector(`.pr-rep[data-ent="${e.id}"]`).value;
      return {
        entregaId: e.id,
        percentual: Number(alvo.querySelector(`.pr-pct[data-ent="${e.id}"]`).value) || 0,
        volume: Number(alvo.querySelector(`.pr-vol[data-ent="${e.id}"]`).value) || 0,
        reprimida: repRaw === '' ? null : Math.max(0, Number(repRaw) || 0)
      };
    }).filter(i => i.percentual > 0 || i.volume > 0 || i.reprimida != null);
    if (!itensForm.length) { alert('Informe ao menos uma entrega com percentual ou volume.'); return; }
    const soma = itensForm.reduce((a, i) => a + i.percentual, 0);
    if (Math.abs(soma - 100) >= 0.5) {
      alert(`A soma dos percentuais é ${fmtN(soma, 1)}%. Ela deve fechar exatamente 100% — use o botão "Normalizar para 100%".`);
      return;
    }
    if (periodo === 'anual') {
      const itensMes = itensForm.map(i => ({
        entregaId: i.entregaId, percentual: i.percentual,
        volume: Math.round((i.volume / 12) * 100) / 100,
        reprimida: i.reprimida
      }));
      mesesAno.forEach(mes => {
        const existente = s.producao.find(p => p.servidorId === serv.id && p.mes === mes);
        if (existente) existente.itens = itensMes;
        else s.producao.push({ id: Store.novoId('p', s.producao), unidadeId: uId, servidorId: serv.id, cargoId: serv.cargoId, mes, itens: itensMes });
      });
    } else if (reg) {
      reg.itens = itensForm;
    } else {
      s.producao.push({ id: Store.novoId('p', s.producao), unidadeId: uId, servidorId: serv.id, cargoId: serv.cargoId, mes: mesSel, itens: itensForm });
    }
    Store.salvar(); telaUnidade(uId, 'producao');
  });
  const btnExc = document.getElementById('pr-excluir');
  if (btnExc) btnExc.addEventListener('click', () => {
    if (periodo === 'anual') {
      if (!confirm(`Excluir todos os lançamentos de ${ano} deste servidor?`)) return;
      s.producao = s.producao.filter(p => !(p.servidorId === serv.id && mesesAno.includes(p.mes)));
    } else {
      if (!confirm('Excluir este lançamento?')) return;
      s.producao.splice(s.producao.indexOf(reg), 1);
    }
    Store.salvar(); telaUnidade(uId, 'producao');
  });
}

      <select id="hi-cargo" class="input">${s.cargos.map(c => `<option value="${c.id}">${E(c.nome)}</option>`).join('')}</select>

      <label class="check"><input type="checkbox" id="hi-ano-todo"> replicar p/ o ano todo ${tipInfo('Lança o mesmo volume e % de tempo nos 12 meses do ano selecionado — útil quando o registro antigo é anual.')}</label>
      <input type="number" id="hi-vol" class="input num-in" placeholder="Volume" min="0">
      <input type="number" id="hi-pct" class="input num-in" placeholder="% tempo" min="0" max="100" step="0.1">
      <button class="btn" id="hi-add">Adicionar</button>
    </div>
    ${ents.length ? '' : '<p class="vazio">Cadastre entregas antes de lançar histórico.</p>'}
  </div>
  <div class="card card-larga">
    <h3>Registros (${linhas.length}${linhas.length === 200 ? '+' : ''})</h3>
    <table class="tabela">
      <thead><tr><th>Mês</th><th>Entrega</th><th>Cargo</th><th class="num">Volume</th><th class="num">% tempo</th><th></th></tr></thead>
      <tbody>${linhas.map(h => `<tr>
        <td>${E(Calc.fmtMes(h.mes))}</td>
        <td>${E((ents.find(e => e.id === h.entregaId) || {}).titulo || '—')}</td>
        <td>${E(nomeCargo(h.cargoId))}</td>
        <td class="num">${fmtN(h.volume)}</td>
        <td class="num">${fmtN(h.percentual, 1)}%</td>
        <td><button class="btn-x" data-hdel="${h.id}" title="Excluir">×</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="vazio">Nenhum registro retroativo.</td></tr>'}</tbody>
    </table>
  </div>`;

  document.getElementById('hi-add').addEventListener('click', () => {

    const meses = anoTodo
