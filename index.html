/* ============================================================
   DFT Paraná — design "Aurora"
   Fundo com washes suaves, topbar navy→teal, cards de vidro,
   Plus Jakarta Sans + JetBrains Mono, gradiente azul→verde.
   ============================================================ */

:root {
  --ink: #0f294d;
  --ink-forte: #0f3d80;
  --azul: #1360d8;
  --azul-escuro: #0e4fae;
  --verde: #0e9e6e;
  --verde-ok: #12a86a;
  --verde-txt: #0b7a48;
  --vermelho: #e2564f;
  --vermelho-txt: #c8443d;
  --muted: #5a6b7d;
  --faint: #8493a0;
  --mono-lbl: #8296ac;
  --trilha: #e7edf5;
  --grad: linear-gradient(135deg, #1360d8, #0e9e6e);
  --grad-topo: linear-gradient(100deg, #0c2647, #123f6d 55%, #0d5a54);
  --grad-hero: linear-gradient(120deg, #0f2a4e 0%, #123f89 52%, #0d6f5f 100%);
  --vidro: rgba(255, 255, 255, .72);
  --vidro-borda: rgba(255, 255, 255, .9);
  --sombra-vidro: 0 1px 2px rgba(16, 40, 77, .03), 0 14px 40px rgba(21, 73, 150, .10);
  --ok: #0b6b45;
  --erro: #c8443d;
  --mono: 'JetBrains Mono', Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Plus Jakarta Sans', "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  background:
    radial-gradient(900px 520px at 100% -8%, #d6ffe9 0%, rgba(214, 255, 233, 0) 52%),
    radial-gradient(940px 560px at -6% 2%, #dbe8ff 0%, rgba(219, 232, 255, 0) 55%),
    linear-gradient(160deg, #eef3fb, #f3f7fc);
  background-attachment: fixed;
}
a { color: var(--azul); text-decoration: none; }
a:hover { color: var(--azul-escuro); }
::selection { background: #cfe0ff; }
svg.ico { width: 18px; height: 18px; flex: none; }
svg.mini-ico { width: 14px; height: 14px; }
.mono { font-family: var(--mono); }

/* ---------- topbar (navegação geral) ---------- */
.topbar {
  background: var(--grad-topo);
  position: sticky; top: 0; z-index: 60;
  box-shadow: 0 6px 24px rgba(6, 32, 63, .28);
}
.tb-inner {
  max-width: 1360px; margin: 0 auto; padding: 13px 26px;
  display: flex; align-items: center; gap: 22px;
}
.tb-marca { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.tb-logo-img { height: 44px; display: block; }
.tb-cubo {
  width: 36px; height: 36px; border-radius: 10px; background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font: 800 13px var(--mono); flex: none;
}
.tb-marca-titulo { font-weight: 800; font-size: 14.5px; color: #fff; letter-spacing: -.01em; line-height: 1.1; }
.tb-marca-sub { font: 500 10px var(--mono); color: rgba(255, 255, 255, .62); letter-spacing: .05em; }
.tb-nav { display: flex; gap: 3px; flex: 1; margin-left: 12px; flex-wrap: wrap; }
.tb-item {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border: none; cursor: pointer; border-radius: 9px;
  font: inherit; font-size: 13.5px; font-weight: 600;
  color: rgba(255, 255, 255, .72); background: transparent; transition: background .12s, color .12s;
}
.tb-item svg.ico { width: 17px; height: 17px; }
.tb-item:hover { background: rgba(255, 255, 255, .09); color: #fff; }
.tb-item.ativo { background: rgba(255, 255, 255, .15); color: #fff; font-weight: 700; }
.tb-dir { display: flex; align-items: center; gap: 14px; }
.tb-sino {
  position: relative; background: none; border: none; cursor: pointer;
  color: rgba(255, 255, 255, .82); padding: 6px; border-radius: 9px;
}
.tb-sino:hover { background: rgba(255, 255, 255, .1); }
.tb-badge {
  position: absolute; top: 2px; right: 2px;
  background: #2ec573; color: #04203f; font: 700 10px var(--mono);
  min-width: 15px; height: 15px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
}
.tb-perfil {
  display: flex; align-items: center; gap: 9px;
  border-left: 1px solid rgba(255, 255, 255, .2); padding-left: 14px;
}
.tb-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  background: var(--grad); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
}
.tb-perfil { position: relative; }
.tb-perfil-btn {
  display: flex; align-items: center; gap: 9px;
  background: none; border: none; cursor: pointer; font: inherit;
  padding: 4px 6px; border-radius: 11px; transition: background .12s;
}
.tb-perfil-btn:hover { background: rgba(255, 255, 255, .1); }
.tb-perfil-caixa { display: flex; flex-direction: column; justify-content: center; line-height: 1.15; text-align: left; }
.tb-perfil-nome { font-size: 12.5px; font-weight: 700; color: #fff; }
.tb-papel { font: 500 10px var(--mono); color: rgba(255, 255, 255, .62); display: block; margin-top: 1px; }
.pf-chev { color: rgba(255, 255, 255, .7); width: 15px !important; height: 15px !important; }
/* menu de perfis no padrão Aurora (arredondado, vidro) */
.pf-menu {
  position: absolute; top: calc(100% + 10px); right: 0; z-index: 90;
  min-width: 262px; background: rgba(255, 255, 255, .97);
  border: 1px solid var(--vidro-borda); border-radius: 18px;
  box-shadow: 0 10px 24px rgba(16, 40, 77, .12), 0 28px 70px rgba(21, 73, 150, .22);
  backdrop-filter: blur(12px); padding: 7px;
}
.pf-titulo {
  font: 700 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--mono-lbl); padding: 8px 12px 7px;
}
.pf-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: none; cursor: pointer; text-align: left; font: inherit;
  padding: 9px 11px; border-radius: 12px; transition: background .12s;
}
.pf-item:hover { background: rgba(19, 96, 216, .07); }
.pf-item.ativo { background: rgba(14, 158, 110, .12); }
.pf-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  background: var(--grad); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px;
}
.pf-textos { display: flex; flex-direction: column; line-height: 1.2; flex: 1; }
.pf-nome { font-size: 13px; font-weight: 700; color: var(--ink); }
.pf-papel { font: 500 10px var(--mono); color: var(--faint); }
.pf-check { color: var(--verde-txt); font-weight: 800; }

/* ---------- corpo: subnav lateral + conteúdo ---------- */
.corpo { display: flex; max-width: 1360px; margin: 0 auto; min-height: calc(100vh - 62px); }
.subnav {
  width: 224px; flex: none;
  padding: 20px 14px;
  border-right: 1px solid rgba(15, 42, 90, .07);
  display: flex; flex-direction: column; gap: 3px;
  position: sticky; top: 62px; height: calc(100vh - 62px); overflow-y: auto;
}
.sn-titulo {
  font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--mono-lbl); padding: 2px 10px 11px;
}
.sn-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.sn-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border: none; cursor: pointer; text-align: left;
  border-radius: 11px; font: inherit; font-size: 13.5px; font-weight: 600;
  color: var(--muted); background: transparent; transition: background .12s, color .12s;
}
.sn-item:hover { background: rgba(19, 96, 216, .07); color: var(--azul); }
.sn-item.ativo { background: rgba(14, 158, 110, .14); color: var(--verde-txt); font-weight: 700; }
.sn-item.desabilitado { color: #a9b6c2; cursor: default; }
.sn-item.desabilitado:hover { background: none; color: #a9b6c2; }
.sn-item span:first-of-type { flex: 1; }
.sn-badge { font: 700 11px var(--mono); color: #9aa8b4; }
.sn-item.ativo .sn-badge { color: var(--verde-txt); }
.em-breve {
  font: 700 8px var(--mono); letter-spacing: .06em;
  background: rgba(15, 42, 90, .06); color: var(--mono-lbl); padding: 2px 6px; border-radius: 999px;
}
.sn-ajuda {
  margin-top: auto; border: 1px solid rgba(15, 42, 90, .08); border-radius: 13px;
  padding: 13px; display: flex; gap: 10px; align-items: center; background: rgba(255, 255, 255, .5);
  color: var(--muted); font-size: 12px; line-height: 1.4;
}
.sn-ajuda svg.ico { color: var(--azul); width: 19px; height: 19px; }
.sn-ajuda strong { display: block; color: var(--ink); font-size: 12.5px; }

.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.conteudo { flex: 1; width: 100%; padding: 26px 30px 44px; }

/* ---------- cabeçalho de página ---------- */
.pg-cab { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.pg-eyebrow { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--azul); }
.pg-cab h1 { margin-top: 5px; font-size: 25px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; line-height: 1.15; }
.pg-sub { font-size: 13px; color: var(--muted); margin-top: 3px; max-width: 92ch; }
.btn-voltar {
  width: 34px; height: 34px; border-radius: 50%; flex: none; margin-top: 4px;
  background: rgba(255, 255, 255, .7); border: 1px solid rgba(15, 42, 90, .1);
  color: var(--azul); font-size: 19px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-voltar:hover { background: #fff; }

/* ---------- rodapé ---------- */
.rodape { border-top: 1px solid rgba(15, 42, 90, .08); font-size: 12px; color: var(--muted); background: rgba(255, 255, 255, .45); }
.rodape-inner { padding: 11px 30px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rodape svg.ico { width: 14px; height: 14px; vertical-align: -2px; }
.btn-link { background: none; border: none; color: var(--azul); cursor: pointer; font: inherit; font-size: 12px; text-decoration: underline; }

.intro { color: var(--muted); margin: 4px 0 18px; max-width: 80ch; font-size: 13.5px; }
.muted { color: var(--muted); }
.mini { font-size: 12px; }
.vazio { color: var(--faint); padding: 18px 6px; font-style: italic; }

/* ---------- cartões de vidro ---------- */
.card, .card-larga {
  background: var(--vidro); border: 1px solid var(--vidro-borda);
  border-radius: 20px; box-shadow: var(--sombra-vidro);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 18px 20px;
}
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
button.card { cursor: pointer; text-align: left; font: inherit; color: inherit; transition: transform .12s, box-shadow .12s; }
button.card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(16, 40, 77, .06), 0 22px 54px rgba(21, 73, 150, .16); }
.card-larga { grid-column: 1 / -1; margin-bottom: 18px; }
.card-larga > h3, .card-titulo {
  font-size: 14.5px; font-weight: 700; color: var(--ink); margin-bottom: 4px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.card-sub, .grupo-resumo { font-size: 11.5px; color: var(--faint); font-weight: 500; }
.card-larga > h3 { margin-bottom: 12px; }
.cargo-benef { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 12px; }
.cargo-benef .num-in { width: 96px; }
.card-larga h4 { color: var(--ink); font-size: 13px; margin: 16px 0 8px; font-weight: 700; }
.construcao { text-align: center; padding: 44px 24px; }
.construcao p { margin-top: 8px; color: var(--muted); font-size: 13.5px; }
.tabela-wrap { overflow-x: auto; }

/* órgão card Aurora */
.card-orgao .orgao-cubo {
  width: 42px; height: 42px; border-radius: 12px; background: var(--grad); color: #fff;
  display: flex; align-items: center; justify-content: center; font: 800 12px var(--mono);
}
.card-orgao h3 { font-size: 16px; font-weight: 800; color: var(--ink); letter-spacing: -.01em; margin-top: 10px; }
.card-orgao .orgao-stats { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin: 8px 0; }
.card-orgao .orgao-stats strong { color: var(--ink-forte); font-size: 15px; }
.card-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* ---------- pílulas / badges (mono) ---------- */
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font: 600 11px var(--mono); line-height: 1.6;
}
.badge.mini { font-size: 10.5px; padding: 3px 9px; }
.badge-pares { background: #e3eefe; color: #0d52c2; }
.badge-esforco { background: rgba(14, 158, 110, .12); color: var(--verde-txt); }
.badge-normativo { background: #faf0d9; color: #8a6410; }
.badge-consenso { background: #e6eaf3; color: #204070; }
.badge-auto { background: #eee9fb; color: #4a3aa7; }
.badge-fila { background: #fdf3dd; color: #8a6410; }
.badge-azul { background: rgba(19, 96, 216, .10); color: var(--azul); }
.tag-funcao {
  font: 600 11px var(--mono); color: var(--muted);
  border: 1px solid rgba(15, 42, 90, .14); padding: 2px 9px; border-radius: 999px; background: rgba(255, 255, 255, .6);
}

/* ---------- KPIs ---------- */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 14px; margin-bottom: 22px; }
.kpi {
  background: var(--vidro); border: 1px solid var(--vidro-borda);
  border-radius: 20px; box-shadow: var(--sombra-vidro); backdrop-filter: blur(10px);
  padding: 16px 17px; display: flex; flex-direction: column; gap: 12px;
}
.kpi-ico {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  background: rgba(19, 96, 216, .10); color: var(--azul);
  display: flex; align-items: center; justify-content: center;
}
.kpi-ico svg.ico { width: 20px; height: 20px; }
.kpi-topo { display: flex; align-items: center; justify-content: space-between; }
.kpi-tag { font: 700 11px var(--mono); }
.kpi-valor { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: var(--ink-forte); line-height: 1; display: block; }
.kpi-de { font-size: 16px; color: #9aa8b4; font-weight: 600; }
.kpi-rotulo { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 6px; display: block; }
.kpi-sub { font: 500 10px var(--mono); color: #9aa8b4; display: block; margin-top: 2px; }
.kpi.kpi-alerta { background: rgba(226, 86, 79, .10); border-color: rgba(226, 86, 79, .26); }
.kpi.kpi-alerta .kpi-ico { background: rgba(226, 86, 79, .16); color: var(--vermelho-txt); }
.kpi.kpi-alerta .kpi-valor { color: var(--vermelho-txt); }
.kpi.kpi-verde { background: rgba(14, 158, 110, .10); border-color: rgba(14, 158, 110, .26); }
.kpi.kpi-verde .kpi-ico { background: rgba(14, 158, 110, .16); color: var(--verde-txt); }
.kpi.kpi-verde .kpi-valor { color: var(--verde-txt); }

.grid-2col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 20px; }
@media (max-width: 1100px) { .grid-2col { grid-template-columns: 1fr; } }

/* ---------- linhas de progresso (ranking) ---------- */
.prog-wrap { display: flex; flex-direction: column; gap: 13px; position: relative; }
.prog-linha { display: grid; grid-template-columns: var(--prog-rotulo-w, 92px) 1fr var(--prog-valor-w, 52px); align-items: center; gap: 10px; }
.prog-rotulo { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog-rotulo.destaque { color: var(--ink-forte); font-weight: 800; }
.prog-trilha { height: 9px; border-radius: 999px; background: var(--trilha); overflow: hidden; display: block; }
.prog-fill { height: 100%; border-radius: 999px; display: block; }
.prog-valor { font: 600 12px var(--mono); text-align: right; color: var(--muted); }
.prog-valor.destaque { color: var(--ink-forte); font-weight: 700; }
.prog-ref { position: absolute; top: -4px; bottom: 0; width: 0; border-left: 1px dashed #9db4d8; }
.prog-legenda { font-size: 11px; color: var(--faint); margin-top: 12px; display: flex; align-items: center; gap: 6px; }
.prog-ref-chip { width: 14px; border-top: 1px dashed #9db4d8; display: inline-block; }

/* ---------- heatmaps (criticidade e sazonalidade) ---------- */
.heat-wrap { overflow-x: auto; }
.heat-tabela { border-collapse: separate; border-spacing: 4px; width: 100%; font-size: 12.5px; }
.heat-tabela th { font: 700 10px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--mono-lbl); padding: 4px 6px; text-align: left; }
.heat-tabela td.heat { text-align: center; font: 600 12px var(--mono); color: var(--ink); border-radius: 8px; padding: 8px 6px; min-width: 40px; }
.heat-tabela td.heat.vazia { background: rgba(15, 42, 90, .04); color: #a9b6c2; font-weight: 400; }
.heat-legenda { font-size: 11.5px; color: var(--faint); margin-top: 10px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.heat-chip { display: inline-block; min-width: 22px; text-align: center; border-radius: 5px; font: 700 11px var(--mono); color: var(--ink); padding: 1px 2px; }

/* ---------- formulários ---------- */
.filtros { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; margin-bottom: 16px; }
.filtros label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; }
.input {
  font: inherit; font-size: 13.5px; padding: 8px 13px;
  border: 1px solid rgba(15, 42, 90, .14); border-radius: 11px;
  background: rgba(255, 255, 255, .85); color: var(--ink); min-width: 0;
  transition: border-color .12s, box-shadow .12s;
}
select.input {
  font-weight: 600;
  appearance: none; -webkit-appearance: none;
  padding-right: 34px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235a6b7d' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center; background-size: 14px;
}
.input:hover { border-color: rgba(19, 96, 216, .4); }
.input:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(19, 96, 216, .15); }
.input[disabled] { background: rgba(15, 42, 90, .05); color: var(--faint); cursor: not-allowed; }
.busca { min-width: 250px; }
.num-in { width: 96px; text-align: right; font-family: var(--mono); font-size: 12.5px; }
.num-in.curta { width: 76px; }
.num-in.grande { width: 112px; font-size: 20px; font-weight: 700; color: var(--ink-forte); }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 18px; margin-bottom: 8px; }
.form-grid.tres { grid-template-columns: repeat(3, 1fr); }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.form-grid .span2 { grid-column: span 2; }
.linha-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.acoes { display: flex; gap: 10px; margin: 14px 0 4px; flex-wrap: wrap; }
.form-card { border-left: 4px solid var(--azul); }

.btn {
  font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  background: var(--grad); color: #fff; border: none;
  padding: 9px 18px; border-radius: 11px;
  box-shadow: 0 8px 20px rgba(19, 96, 216, .28);
  transition: transform .1s, box-shadow .12s, filter .12s;
}
.btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-sec {
  background: rgba(255, 255, 255, .7); color: var(--azul);
  border: 1px solid rgba(19, 96, 216, .18); box-shadow: none;
}
.btn-sec:hover { background: #fff; filter: none; }
.btn-perigo { background: rgba(226, 86, 79, .12); color: var(--erro); border: 1px solid rgba(226, 86, 79, .25); box-shadow: none; }
.btn-perigo:hover { background: rgba(226, 86, 79, .2); filter: none; }
.btn-mini {
  font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  background: rgba(19, 96, 216, .1); color: var(--azul); border: none;
  padding: 4px 12px; border-radius: 8px; transition: background .12s;
}
.btn-mini:hover { background: rgba(19, 96, 216, .18); }
.btn-x {
  font: inherit; width: 26px; height: 26px; border-radius: 8px; border: none;
  background: transparent; color: #9aa8b4; cursor: pointer; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-x:hover { background: rgba(226, 86, 79, .12); color: var(--erro); }
.btn-editar { color: #9aa8b4; }
.btn-editar:hover { background: rgba(19, 96, 216, .1); color: var(--azul); }
.btn-toggle {
  font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  background: rgba(255, 255, 255, .7); color: var(--muted);
  border: 1px solid rgba(15, 42, 90, .14); padding: 8px 15px; border-radius: 999px;
  transition: all .12s;
}
.btn-toggle:hover { border-color: var(--azul); color: var(--azul); }
.btn-toggle.ativo { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(19, 96, 216, .28); }
.vista-sel { align-items: center; }

/* ---------- tabelas ---------- */
.tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabela th {
  text-align: left; font: 700 10.5px var(--mono); text-transform: uppercase; letter-spacing: .05em;
  color: var(--mono-lbl); padding: 8px 8px; border-bottom: 1px solid rgba(15, 42, 90, .1);
}
.tabela td { padding: 8px; border-bottom: 1px solid rgba(15, 42, 90, .06); vertical-align: middle; }
.tabela .num, .tabela th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabela tr:hover td { background: rgba(19, 96, 216, .04); }

/* ---------- unidade ---------- */
.uni-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: -8px 0 18px; }
.sel-ano, .cod-pares { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-left: auto; }
.cod-pares { margin-left: 0; }
.cod-pares .input { width: 88px; }

/* card de entrega Aurora */
.ent-card { display: flex; flex-direction: column; }
.ent-card h4 { margin: 12px 0 6px; font-size: 15.5px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; line-height: 1.25; }
.ent-desc {
  margin: 0 0 12px; font-size: 12.5px; color: var(--faint); line-height: 1.45;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.ent-cargos { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 14px; }
.ent-cargos svg.ico { width: 15px; height: 15px; color: #9aa8b4; }
.ent-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.ent-status .ponto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.ent-vol { display: flex; align-items: flex-end; gap: 9px; }
.ent-vol strong { font-size: 30px; font-weight: 800; letter-spacing: -.02em; color: var(--ink-forte); line-height: .9; }
.ent-vol span { font-size: 11.5px; font-weight: 600; color: var(--faint); padding-bottom: 3px; }
.ent-barra { display: flex; align-items: center; gap: 9px; margin: 13px 0 12px; }
.ent-barra .trilha { flex: 1; height: 6px; border-radius: 999px; background: var(--trilha); overflow: hidden; }
.ent-barra .fill { height: 100%; border-radius: 999px; background: var(--grad); display: block; }
.ent-barra .txt { font: 600 11.5px var(--mono); color: var(--muted); }
.ent-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 13px; }
.ent-foot {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid rgba(15, 42, 90, .08); padding-top: 11px; margin-top: auto;
}
.ent-foot .ent-editar {
  display: inline-flex; align-items: center; gap: 5px;
  font: inherit; font-size: 12.5px; font-weight: 700; color: var(--azul);
  background: none; border: none; cursor: pointer;
}

.banner { padding: 11px 15px; border-radius: 13px; margin-bottom: 18px; font-size: 13.5px; border: 1px solid; line-height: 1.55; }
.banner svg.ico { vertical-align: -3px; margin-right: 6px; }
.banner.ok { background: rgba(14, 158, 110, .10); border-color: rgba(14, 158, 110, .28); color: var(--ok); }
.banner.aviso { background: #fdf3dd; border-color: #e8c986; color: #6b4e0e; }
.banner.erro { background: rgba(226, 86, 79, .1); border-color: rgba(226, 86, 79, .3); color: var(--erro); }
.soma-pct { margin: 10px 0; font-size: 13.5px; display: flex; align-items: center; gap: 10px; }
.ok-txt { color: var(--ok); }
.erro-txt { color: var(--erro); }

/* ---------- hero de resultados (painel navy→teal) ---------- */
.hero-dim {
  background: var(--grad-hero); border-radius: 22px; padding: 22px 24px;
  margin: 4px 0 20px; box-shadow: 0 18px 44px rgba(13, 42, 90, .28);
  position: relative; overflow: hidden; color: #fff;
}
.hero-eyebrow { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .7); }
.hero-dim h2 { margin: 7px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.hero-base { font-size: 12.5px; color: rgba(255, 255, 255, .78); margin-top: 4px; }
.hero-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hero-saldo {
  display: inline-flex; align-items: center; gap: 8px;
  border-radius: 12px; padding: 9px 15px; border: 1px solid;
}
.hero-saldo strong { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.hero-saldo span { font-size: 12px; color: rgba(255, 255, 255, .85); font-weight: 600; text-align: left; line-height: 1.2; }
.hero-saldo.deficit { background: rgba(226, 86, 79, .2); border-color: rgba(255, 180, 175, .5); }
.hero-saldo.deficit strong { color: #ffd9d5; }
.hero-saldo.superavit { background: rgba(46, 197, 115, .18); border-color: rgba(46, 197, 115, .4); }
.hero-saldo.superavit strong { color: #c6ffdf; }
.hero-saldo.equilibrio { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); }
.hero-saldo.equilibrio strong { color: #fff; }
.hero-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
.hero-tile { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .16); border-radius: 14px; padding: 13px 15px; }
.hero-tile.realce { background: rgba(46, 197, 115, .16); border-color: rgba(46, 197, 115, .3); }
.hero-tile .v { font-size: 23px; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
.hero-tile.realce .v { color: #c6ffdf; }
.hero-tile .l { font-size: 11.5px; color: rgba(255, 255, 255, .75); margin-top: 6px; font-weight: 600; }
.hero-tile .s { font: 500 10px var(--mono); color: rgba(255, 255, 255, .55); margin-top: 2px; }
.hero-dim .filtros label { color: rgba(255, 255, 255, .8); }
.hero-recortes { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 16px; }
.hero-recortes .rotulo { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .6); margin-right: 4px; }
.btn-recorte {
  font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  background: rgba(255, 255, 255, .12); color: rgba(255, 255, 255, .85);
  border: 1px solid rgba(255, 255, 255, .18); padding: 6px 13px; border-radius: 999px; transition: all .12s;
}
.btn-recorte:hover { background: rgba(255, 255, 255, .2); }
.btn-recorte.ativo { background: #fff; color: var(--ink-forte); border-color: #fff; }
.hero-dim select.input { background: rgba(255, 255, 255, .92); }

/* simulador what-if */
.sim-box {
  border: 1px dashed rgba(15, 42, 90, .2); border-radius: 16px;
  padding: 14px 16px; margin-top: 16px; background: rgba(255, 255, 255, .55);
}
.sim-box .sim-titulo { font-size: 13px; font-weight: 800; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.sim-controles { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; margin-top: 10px; }
.sim-controles label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.sim-controles input[type=range] { accent-color: var(--azul); width: 150px; }
.sim-resultado { font-size: 13.5px; margin-top: 8px; }

/* ---------- stats genéricos ---------- */
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat {
  background: rgba(255, 255, 255, .6); border: 1px solid rgba(15, 42, 90, .07);
  border-radius: 14px; padding: 13px 15px; display: flex; flex-direction: column; gap: 2px;
}
.stat-label { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.stat-valor { font-size: 24px; font-weight: 800; color: var(--ink-forte); letter-spacing: -.01em; }
.stat-valor .input { vertical-align: baseline; }
.stat-sub { font: 500 10.5px var(--mono); color: #9aa8b4; }
.stat-saldo .stat-valor { font-size: 17px; }

.saldo { font-weight: 800; white-space: nowrap; }
.saldo.deficit { color: var(--erro); }
.saldo.superavit { color: var(--verde-ok); }
.saldo.equilibrio { color: #204070; }
.destaque-ref { margin: 6px 0 12px; font-size: 14px; }
.destaque-ref strong { color: var(--ink-forte); }
.recomendacao {
  background: rgba(14, 158, 110, .08); border: 1px solid rgba(14, 158, 110, .22); border-radius: 13px;
  padding: 10px 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 12px;
}
.pares-check { gap: 8px 14px; align-items: center; }
.check { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600 !important; flex-direction: row !important; }
.check input { accent-color: var(--azul); }
.nota-calculo { font-size: 11.5px; color: var(--faint); margin-top: 8px; }
.nota-ok, .nota-alerta {
  font-size: 12.5px; font-weight: 600; margin-top: 10px; padding: 8px 12px;
  border-radius: 10px; display: inline-block;
}
.nota-ok { background: rgba(14, 158, 110, .1); color: var(--verde-txt); }
.nota-alerta { background: rgba(226, 86, 79, .1); color: var(--vermelho-txt); }

/* ---------- esforço necessário × capacidade disponível (HTML, não SVG) ---------- */
.cap-wrap { display: flex; flex-direction: column; gap: 14px; }
.cap-linha { display: grid; grid-template-columns: 178px 1fr 84px; align-items: center; gap: 14px; }
.cap-rotulo {
  font-size: 12.5px; font-weight: 700; color: var(--muted); line-height: 1.3;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.cap-trilha {
  position: relative; height: 26px; border-radius: 8px; background: var(--trilha);
  overflow: hidden; display: flex;
}
.cap-seg { height: 100%; display: block; }
.cap-seg + .cap-seg { margin-left: 2px; }
.cap-marca { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed #3d4f5f; }
.cap-valor { font: 700 13px var(--mono); text-align: right; white-space: nowrap; }
@media (max-width: 640px) {
  .cap-linha { grid-template-columns: 1fr; gap: 6px; }
  .cap-valor { text-align: left; }
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip-cargo { font: 600 11px var(--mono); background: rgba(19, 96, 216, .08); color: var(--azul); padding: 3px 9px; border-radius: 999px; }

/* ---------- hierarquia do órgão (organograma por faixas) ---------- */
.hq { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 8px 0 4px; }
.hq-faixa { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; width: 100%; }
.hq-conector { width: 1px; height: 22px; background: rgba(15, 42, 90, .18); }
.hq-no {
  display: inline-flex; align-items: center; gap: 9px;
  border: none; cursor: pointer; font: inherit;
  padding: 9px 14px; border-radius: 12px; color: #fff;
  box-shadow: 0 6px 16px rgba(13, 42, 90, .18);
  transition: transform .1s, box-shadow .12s;
}
.hq-no:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(13, 42, 90, .26); }
.hq-no.n1 { background: linear-gradient(120deg, #0f2a4e, #123f89); }
.hq-no.n2 { background: linear-gradient(135deg, #1360d8, #2079f0); }
.hq-no.n3 { background: linear-gradient(135deg, #0e9e6e, #12a86a); }
.hq-no.hq-fixo { cursor: default; }
.hq-no.hq-fixo:hover { transform: none; }
.hq-sigla { font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
.hq-qtd {
  font: 600 10.5px var(--mono); background: rgba(255, 255, 255, .2);
  padding: 2px 8px; border-radius: 999px;
}
.hq-leg { display: inline-block; width: 16px; height: 10px; border-radius: 4px; margin-left: 10px; }
.hq-leg.n1 { background: #123f89; margin-left: 0; }
.hq-leg.n2 { background: #1360d8; }
.hq-leg.n3 { background: #0e9e6e; }

/* ---------- botão (?) de explicação ---------- */
.tip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 50%;
  background: #9db4d8; color: #fff; font: 700 10.5px var(--mono);
  cursor: help; vertical-align: middle; border: none; flex: none;
}
.tip:hover, .tip:focus { background: var(--azul); outline: none; }

/* ---------- gráficos ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .tick { font: 500 9.5px var(--mono); fill: #9aa8b4; }
.chart .tick.sub { font-size: 9px; fill: #a9b6c2; }
.chart .val { font: 600 10.5px var(--mono); fill: #3d4f5f; }
.chart .bar-mark:hover { opacity: .85; }
.chart-tooltip {
  position: fixed; z-index: 100; background: #0f294d; color: #fff;
  font-size: 12px; line-height: 1.6; padding: 8px 12px; border-radius: 10px;
  pointer-events: none; box-shadow: 0 10px 28px rgba(15, 41, 77, .4); max-width: 300px;
}
.chip { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 4px 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.chart-table { margin-top: 10px; font-size: 12.5px; }
.chart-table summary { cursor: pointer; color: var(--azul); font-size: 12.5px; padding: 4px 0; font-weight: 700; }
.chart-table table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.chart-table th { text-align: left; font: 700 10px var(--mono); text-transform: uppercase; color: var(--mono-lbl); padding: 5px 8px; border-bottom: 1px solid rgba(15, 42, 90, .1); }
.chart-table td { padding: 4px 8px; border-bottom: 1px solid rgba(15, 42, 90, .05); }
.chart-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
details.card-detalhe {
  background: rgba(255, 255, 255, .6); border: 1px solid var(--vidro-borda);
  border-radius: 16px; padding: 4px 18px; margin-top: 16px;
}

/* ---------- responsivo ---------- */
@media (max-width: 900px) {
  .subnav { width: 62px; padding: 14px 7px; }
  .sn-titulo, .sn-ajuda, .sn-badge, .em-breve, .sn-item span { display: none; }
  .sn-item { justify-content: center; padding: 12px 0; }
  .conteudo { padding: 16px 14px 32px; }
  .tb-inner { padding: 9px 12px; gap: 12px; }
  .tb-item span, .tb-marca-titulo, .tb-marca-sub { display: none; }
  .tb-perfil select { max-width: 110px; }
}
@media (max-width: 640px) {
  .form-grid, .form-grid.tres { grid-template-columns: 1fr; }
  .form-grid .span2 { grid-column: span 1; }
  .sel-ano { margin-left: 0; }
}

/* ---------- dropdown padronizado (substitui o select nativo) ---------- */
.dd-wrap { position: relative; display: inline-flex; flex-direction: column; min-width: 0; }
.dd-wrap select { display: none !important; }
.dd-btn {
  display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
  cursor: pointer; text-align: left; font-weight: 600; min-width: 110px;
}
.dd-btn:disabled { cursor: not-allowed; }
.dd-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-chev { width: 13px; height: 13px; flex: none; color: #8296ac; }
.dd-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 95;
  min-width: 100%; max-width: 340px; max-height: 290px; overflow-y: auto;
  background: rgba(255, 255, 255, .98); border: 1px solid var(--vidro-borda);
  border-radius: 14px; padding: 5px;
  box-shadow: 0 10px 24px rgba(16, 40, 77, .12), 0 24px 60px rgba(21, 73, 150, .2);
  backdrop-filter: blur(12px);
}
.dd-item {
  display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--muted); background: none; border: none; cursor: pointer;
  padding: 8px 11px; border-radius: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dd-item:hover { background: rgba(19, 96, 216, .08); color: var(--azul); }
.dd-item.ativo { background: rgba(14, 158, 110, .13); color: var(--verde-txt); }
.dd-item:disabled { color: #b3bfca; cursor: default; }
.hero-dim .dd-btn { background: rgba(255, 255, 255, .92); }

/* ---------- bolhas: pessoas por unidade ---------- */
.bolhas { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 8px 0; }
.bolha {
  border-radius: 50%; border: none; cursor: pointer; color: #fff; font: inherit;
  background: linear-gradient(135deg, #1360d8, #0e9e6e);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(13, 42, 90, .22); transition: transform .1s;
  line-height: 1.1; padding: 4px;
}
.bolha:hover { transform: scale(1.07); }
.bolha span { font-weight: 800; letter-spacing: -.01em; }
.bolha .bolha-n { font: 600 .78em var(--mono); opacity: .85; }

/* ---------- modal do organograma oficial ---------- */
.modal-organograma {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(8, 24, 46, .72); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal-org-caixa {
  background: #fff; border-radius: 18px; overflow: hidden;
  max-width: min(1080px, 94vw); max-height: 92vh;
  display: flex; flex-direction: column;
  box-shadow: 0 30px 90px rgba(4, 18, 38, .5);
}
.modal-org-topo {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--grad-topo); color: #fff; padding: 11px 18px;
  font-size: 14px;
}
.modal-org-caixa img { display: block; width: 100%; overflow-y: auto; object-fit: contain; max-height: calc(92vh - 50px); }

/* ---------- organograma interativo (formas clicáveis) ---------- */
.org { display: flex; flex-direction: column; align-items: center; padding: 10px 0 6px; }
.org-conector { width: 2px; height: 20px; background: rgba(15, 42, 90, .16); }
.org-topo { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.org-grupos {
  display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
  align-items: flex-start; width: 100%;
  border-top: 2px solid rgba(15, 42, 90, .16); padding-top: 16px; margin-top: 2px;
}
.org-grupo { display: flex; flex-direction: column; width: 196px; position: relative; }
.org-grupo::before {
  content: ''; position: absolute; top: -16px; left: 50%; width: 2px; height: 16px;
  background: rgba(15, 42, 90, .16);
}
.org-no {
  border: none; cursor: pointer; font: inherit; color: #fff; text-align: left;
  border-radius: 11px; padding: 8px 11px;
  display: flex; flex-direction: column; gap: 1px; position: relative;
  box-shadow: 0 5px 14px rgba(13, 42, 90, .18);
  transition: transform .1s, box-shadow .12s;
}
.org-no:hover { transform: translateY(-2px); box-shadow: 0 9px 20px rgba(13, 42, 90, .28); }
.org-no.org-fixo { cursor: default; align-items: center; text-align: center; padding: 10px 18px; }
.org-no.org-fixo:hover { transform: none; }
.org-no.n1 { background: linear-gradient(120deg, #0f2a4e, #123f89); }
.org-no.n2 { background: linear-gradient(135deg, #1360d8, #2079f0); }
.org-no.n3 { background: linear-gradient(135deg, #0e9e6e, #12a86a); }
.org-sigla { font-weight: 800; font-size: 13px; letter-spacing: -.01em; }
.org-nome {
  font-size: 10.5px; opacity: .85; line-height: 1.25;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.org-qtd {
  position: absolute; top: 7px; right: 9px;
  font: 600 10px var(--mono); background: rgba(255, 255, 255, .22);
  padding: 1px 7px; border-radius: 999px;
}
.org-filhos {
  margin: 8px 0 0 16px; padding-left: 13px;
  border-left: 2px solid rgba(15, 42, 90, .15);
  display: flex; flex-direction: column; gap: 7px;
}
.org-filhos .org-no::before {
  content: ''; position: absolute; left: -15px; top: 50%; width: 13px; height: 2px;
  background: rgba(15, 42, 90, .15);
}

/* ============================================================
   Plano de Adequação
   ============================================================ */
.pl-escopo { padding: 14px 18px; margin-bottom: 16px; }
.pl-escopo .filtros { margin: 0; }
.pl-escopo-tag {
  display: inline-flex; align-items: center; gap: 6px; margin-left: auto;
  background: rgba(19, 96, 216, .08); color: var(--ink-forte);
  border-radius: 999px; padding: 6px 13px; font: 700 12px/1 inherit;
}
.pl-escopo-tag .ico { width: 15px; height: 15px; }

.pl-alavancas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 14px; }
.pl-alav {
  background: rgba(255, 255, 255, .55); border: 1px solid rgba(15, 42, 90, .08);
  border-radius: 14px; padding: 14px 16px 16px;
}
.pl-alav-cab { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--ink); }
.pl-alav-cab > span:nth-child(2) { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.pl-alav-cab .mini { font-size: 11px; font-weight: 500; line-height: 1.35; }
.pl-alav-num {
  width: 21px; height: 21px; flex: 0 0 21px; border-radius: 7px; background: var(--grad); color: #fff;
  display: flex; align-items: center; justify-content: center; font: 800 11px var(--mono);
}
.pl-alav-val { font: 800 19px var(--mono); color: var(--ink-forte); letter-spacing: -.02em; }
.pl-acoes-alav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin-top: 8px;
  background: transparent; cursor: pointer;
}
.slider:disabled { opacity: .45; cursor: not-allowed; }
.slider:focus { outline: none; }
.slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(19, 96, 216, .22); }
.slider:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px rgba(19, 96, 216, .22); }
.slider::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--trilha); }
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 20px; height: 20px; margin-top: -7px;
  border-radius: 50%; background: #fff; border: 5px solid var(--azul);
  box-shadow: 0 2px 6px rgba(19, 96, 216, .35); cursor: grab;
}
.slider:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.08); }
.slider::-moz-range-track { height: 6px; border-radius: 999px; background: var(--trilha); }
.slider::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%; background: #fff;
  border: 5px solid var(--azul); box-shadow: 0 2px 6px rgba(19, 96, 216, .35); cursor: grab;
}

.pl-medidas { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin-top: 12px; }
.pl-medida {
  border: 1px solid rgba(15, 42, 90, .1); border-radius: 14px; padding: 14px 16px;
  background: rgba(255, 255, 255, .5); display: flex; flex-direction: column; gap: 9px;
}
.pl-medida.ativa { border-color: rgba(19, 96, 216, .45); background: rgba(19, 96, 216, .045); }
.pl-med-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pl-med-cab .check { font-size: 13px; color: var(--ink); }
.pl-med-univ { font: 600 10.5px var(--mono); color: var(--faint); white-space: nowrap; }
.pl-med-campos { display: flex; flex-wrap: wrap; gap: 12px; }
.pl-med-campos label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--muted); }
.pl-med-nums { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: auto; padding-top: 8px; border-top: 1px dashed rgba(15, 42, 90, .12); }
.pl-med-nums > span { display: flex; flex-direction: column; gap: 1px; }
.pl-med-nums strong { font: 800 14px var(--mono); color: var(--ink-forte); }
.pl-med-rot { font-size: 10.5px; font-weight: 700; color: var(--faint); }
.pl-ano-tit { font-size: 14.5px; font-weight: 800; color: var(--ink); margin: 18px 0 8px; }
.pl-ano-tit:first-child { margin-top: 4px; }

/* situação e destaques em tabelas */
.tabela td.neg { color: var(--vermelho-txt); }
.tabela td.pos { color: var(--verde-txt); }
.tabela tr.fraca td { opacity: .5; }
.tabela tr.linha-total td { border-top: 2px solid rgba(15, 42, 90, .18); font-weight: 800; background: rgba(19, 96, 216, .04); }
.tag-def, .tag-sup, .tag-ok {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font: 700 10.5px var(--mono);
}
.tag-def { background: rgba(226, 86, 79, .13); color: var(--vermelho-txt); }
.tag-sup { background: rgba(237, 161, 0, .16); color: #8a6410; }
.tag-ok { background: rgba(18, 168, 106, .14); color: var(--verde-txt); }


/* ---------- alinhamento: rótulo + (?) na mesma linha ---------- */
.lb-txt { display: inline-flex; align-items: center; gap: 5px; line-height: 1.3; }

/* dropdown aberto: o card sobe acima dos vizinhos (que têm backdrop-filter) */
/* fica acima dos cards vizinhos (z-index auto), abaixo da topbar (60), do tooltip (100) e do modal (200) */
.dd-topo { position: relative; z-index: 30; }


/* ---------- Mapeamento de entregas por IA ---------- */
.ia-passo { display: flex; align-items: baseline; gap: 9px; margin: 0 0 4px; }
.ia-passo b { font-size: 13px; color: var(--ink); font-weight: 800; }
.ia-passo span { font-size: 11.5px; color: var(--faint); }
.ia-num {
  width: 20px; height: 20px; border-radius: 7px; flex: none;
  background: var(--grad); color: #fff; font: 700 11px var(--mono);
  display: inline-flex; align-items: center; justify-content: center;
  align-self: center;
}
.ia-drop {
  border: 1.5px dashed rgba(19, 96, 216, .32); border-radius: 14px;
  background: rgba(19, 96, 216, .035);
  padding: 16px; text-align: center; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.ia-drop:hover, .ia-drop.sobre { border-color: var(--azul); background: rgba(19, 96, 216, .08); }
.ia-drop p { font-size: 13px; font-weight: 700; color: var(--ink); }
.ia-drop small { font-size: 11.5px; color: var(--faint); display: block; margin-top: 2px; }
.ia-arqs { list-style: none; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; }
.ia-arq {
  display: flex; align-items: center; gap: 9px;
  background: rgba(255, 255, 255, .8); border: 1px solid var(--trilha);
  border-radius: 11px; padding: 7px 11px; font-size: 12.5px;
}
.ia-arq-nome { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ia-arq-tam { font: 500 10.5px var(--mono); color: var(--faint); }
.ia-cols { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
.ia-cols label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
/* ---------- estimativa de impacto da IA (tela de otimização) ---------- */
.tip-btn {
  border: none; cursor: pointer; font: inherit; vertical-align: middle;
  margin-left: 5px;
}
.otim-marca {
  font: 700 9.5px var(--mono); letter-spacing: .06em; margin-left: 5px;
  padding: 2px 5px; border-radius: 4px; vertical-align: middle;
  background: rgba(74, 58, 167, .12); color: #4a3aa7;
}
.otim-proposta { margin-top: 16px; border-top: 1px solid var(--trilha); padding-top: 14px; }
.otim-proposta h4 { margin: 0 0 8px; font-size: 13px; font-weight: 800; color: var(--ink); }
.otim-rac { font-size: 12px; color: var(--muted); max-width: 460px; }
.otim-delta { font: 700 11px var(--mono); margin-left: 4px; }
.otim-delta.sobe { color: var(--vermelho-txt); }
.otim-delta.desce { color: var(--verde-txt); }

.otim-detalhe { padding: 18px 22px 24px; overflow-y: auto; max-height: calc(92vh - 50px); }
.otim-detalhe h4 {
  margin: 18px 0 6px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); font-weight: 800;
}
.otim-detalhe > p { font-size: 13.5px; color: var(--ink); margin: 0; }
.otim-num { display: flex; gap: 26px; flex-wrap: wrap; }
.otim-num div { display: flex; align-items: baseline; gap: 7px; }
.otim-num span { font-size: 11.5px; color: var(--muted); }
.otim-num b { font: 700 22px var(--mono); color: var(--ink); }
.conf {
  font: 700 9.5px var(--mono); text-transform: uppercase; letter-spacing: .05em;
  padding: 2px 6px; border-radius: 4px;
}
.conf-alta { background: rgba(14, 158, 110, .14); color: var(--verde-txt); }
.conf-media { background: #fdf3dd; color: #8a6410; }
.conf-baixa { background: rgba(226, 86, 79, .13); color: var(--vermelho-txt); }

.otim-refs { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 14px; }
.otim-refs li { font-size: 13px; color: var(--ink); }
.otim-detalhe .nota-calculo { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--trilha); }
.otim-refs i { color: var(--muted); }
.otim-ef, .otim-lim { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.otim-lim { color: var(--faint); }
.otim-tag {
  display: inline-block; font: 700 9.5px var(--mono); letter-spacing: .05em;
  padding: 2px 6px; border-radius: 4px; margin-left: 4px; white-space: nowrap;
}
.tag-alta { background: rgba(14, 158, 110, .14); color: var(--verde-txt); }
.tag-média, .tag-media { background: rgba(19, 96, 216, .12); color: var(--azul); }
.tag-lacuna { background: rgba(226, 86, 79, .13); color: var(--vermelho-txt); }

.norm {
  border: 1px solid var(--trilha); border-radius: 7px;
  padding: 12px 14px; margin-top: 12px; background: rgba(19, 96, 216, .04);
  border-left: 3px solid var(--azul);
}
.norm.ok { background: rgba(14, 158, 110, .07); border-left-color: var(--verde-txt); }
.norm.falta { background: #fdf3dd; border-left-color: #b8860b; }
.norm-topo { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.norm-topo b { font-size: 13px; color: var(--ink); }
.norm-selo {
  font-size: 10px; letter-spacing: .05em; text-transform: uppercase; font-weight: 700;
  padding: 2px 7px; border-radius: 4px; background: rgba(19, 96, 216, .12); color: var(--azul);
}
.norm.ok .norm-selo { background: rgba(14, 158, 110, .16); color: var(--verde-txt); }
.norm.falta .norm-selo { background: rgba(184, 134, 11, .16); color: #8a6410; }
.norm p { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.norm-ressalva { color: var(--faint) !important; font-size: 11.5px !important; }
.norm code { font-size: 11px; }

.imp-resumo { list-style: none; display: flex; flex-direction: column; gap: 7px; margin: 10px 0 0; }
.imp-resumo li { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink); }
.imp-resumo .badge { min-width: 42px; justify-content: center; }
.ia-chave { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.ia-chave-ok {
  font-size: 12.5px; color: var(--ink); background: rgba(19, 96, 216, .08);
  border: 1px solid rgba(19, 96, 216, .25); border-radius: 6px; padding: 8px 10px;
}
.ia-chave-ok code { font-size: 12px; }
.ia-chave label { flex: 1; min-width: 260px; }
.ia-status { font-size: 12.5px; color: var(--muted); margin-top: 10px; display: flex; align-items: center; gap: 8px; }
.ia-girando {
  width: 14px; height: 14px; flex: none; border-radius: 50%;
  border: 2px solid rgba(19, 96, 216, .25); border-top-color: var(--azul);
  animation: ia-gira .7s linear infinite;
}
@keyframes ia-gira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ia-girando { animation-duration: 2.4s; } }
.prop-card { border-left: 3px solid var(--azul); }
.prop-card.desmarcada { opacity: .5; border-left-color: var(--trilha); }
.prop-topo { display: flex; align-items: flex-start; gap: 10px; }
.prop-topo input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px; flex: none; accent-color: var(--azul); }
.prop-card h4 { font-size: 13.5px; font-weight: 800; color: var(--ink); margin: 0; flex: 1; line-height: 1.35; }
.prop-card .prop-desc { font-size: 12.5px; color: var(--muted); margin: 7px 0 0; }
.prop-just {
  font-size: 12px; color: var(--muted); margin-top: 9px;
  border-left: 2px solid var(--trilha); padding-left: 10px; line-height: 1.5;
}
.prop-just b { color: var(--ink); font-weight: 700; }
.prop-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.badge-conf-alta { background: rgba(14, 158, 110, .13); color: var(--verde-txt); }
.badge-conf-media { background: #fdf3dd; color: #6b4e0e; }
.badge-conf-baixa { background: rgba(226, 86, 79, .12); color: var(--vermelho-txt); }
.prop-edit { display: grid; grid-template-columns: 1fr 110px 130px; gap: 8px; margin-top: 11px; }
.prop-edit input, .prop-edit select { font-size: 12.5px; }
.prop-card.importada { border-left-color: var(--verde-ok); opacity: .78; }
.prop-ok { color: var(--verde-ok); flex: none; margin-top: 2px; }
.ia-descartados summary {
  cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--muted);
  padding: 4px 0; list-style: none;
}
.ia-descartados summary::-webkit-details-marker { display: none; }
.ia-descartados summary::before { content: '▸ '; color: var(--faint); }
.ia-descartados[open] summary::before { content: '▾ '; }
.ia-descartados ul { list-style: none; margin: 8px 0 0; display: flex; flex-direction: column; gap: 5px; }
.ia-descartados li { font-size: 12px; color: var(--muted); padding-left: 12px; border-left: 2px solid var(--trilha); }
.ia-descartados li b { color: var(--ink); font-weight: 700; }
@media (max-width: 640px) {
  .prop-edit { grid-template-columns: 1fr; }
  .ia-chave label { min-width: 100%; }
}

/* ============================================================
   DFT — Dados iniciais (seed)
   Unidades vêm de data-unidades.js (gerado da planilha dft.xlsx).
   O quadro de pessoal é individual (servidor a servidor), gerado
   com RNG determinístico para a demonstração ser reproduzível.
   ============================================================ */

// RNG determinístico (mulberry32)
function dftRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const DFT_MES_INICIO = '2024-01';
const DFT_MES_FIM = '2026-06';
const DFT_REGIMES = ['Estatutário', 'Comissionado', 'Temporário', 'Estágio'];
const DFT_MODALIDADES = ['presencial', 'hibrido', 'teletrabalho'];

function dftMesesEntre(ini, fim) {
  const out = [];
  let [y, m] = ini.split('-').map(Number);
  const [fy, fm] = fim.split('-').map(Number);
  while (y < fy || (y === fy && m <= fm)) {
    out.push(`${y}-${String(m).padStart(2, '0')}`);
    m++; if (m > 12) { m = 1; y++; }
  }
  return out;
}

function dftBuildSeed() {
  const rng = dftRng(20260714);
  const meses = dftMesesEntre(DFT_MES_INICIO, DFT_MES_FIM);
  const faixa = (a, b) => a + Math.floor(rng() * (b - a + 1));

  // ---------- Unidades (da planilha) ----------
  // codigoUnidade e municipio existem para espelhar o relatório Meta4 "15 - Relação de
  // Servidores do Órgão", que traz Código da Unidade de Trabalho (formato W######),
  // Descrição da Unidade e UF-Cidade.
  const MUNICIPIOS_PR = ['Curitiba', 'Curitiba', 'Curitiba', 'Curitiba', 'Curitiba', 'Curitiba',
    'Londrina', 'Maringá', 'Ponta Grossa', 'Cascavel', 'São José dos Pinhais', 'Foz do Iguaçu',
    'Guarapuava', 'Paranaguá', 'Colombo'];
  const unidades = DFT_UNIDADES_RAW.map((r, i) => ({
    id: 'u' + i,
    orgao: r[0], sigla: r[1], nome: r[2], funcao: r[3],
    metodo: DFT_METODOS[r[4]],
    codigo: r[5],                                    // código da unidade no Anexo I
    replicabilidade: r[6] == null ? '' : DFT_REPLICABILIDADE[r[6]],
    codigoPares: r[1],
    codigoUnidade: 'W' + String(210000 + i * 7 + 13).padStart(6, '0'),
    municipio: MUNICIPIOS_PR[i % MUNICIPIOS_PR.length],
    uf: 'PR'
  }));
  const metaOrgao = Object.fromEntries(DFT_ORGAOS_RAW.map(o => [o[0], o]));
  const orgaos = [...new Set(unidades.map(u => u.orgao))].map(o => {
    const m = metaOrgao[o] || [];
    return { id: o, nome: o, tipo: m[1] || '', eixo: m[2] || '', situacao: m[3] || '' };
  });
  const U = (orgao, sigla) => unidades.find(u => u.orgao === orgao && u.sigla === sigla);

  // ---------- Cargos (catálogo) ----------
  // beneficios = auxílios mensais (alimentação, transporte etc.) POR CARGO — não é um valor comum a todos.
  // Estágio (c4) recebe benefício reduzido (bolsa + metade dos auxílios).
  // salarioInicial = vencimento da PRIMEIRA referência da carreira (classe/nível de ingresso).
  // É ele — e não a média do quadro — que custeia a vaga nova de concurso: quem ingressa
  // entra no pé da tabela. A média do quadro embute progressões de quem já está na casa.
  const cargos = [
    { id: 'c1', nome: 'Agente Profissional', beneficios: 1300, salarioInicial: 8800 },

    { id: 'c6', nome: 'Analista de TI', beneficios: 1300, salarioInicial: 9500 }
  ];
  const REMUNERACAO = { c1: [8800, 12500], c2: [5400, 7800], c3: [4300, 6200], c4: [1700, 2100], c5: [3800, 5400], c6: [9500, 14000] };

  // ---------- Servidores (quadro individual) ----------
  const NOMES = ['Ana', 'Bruno', 'Carla', 'Diego', 'Elisa', 'Fábio', 'Gabriela', 'Heitor', 'Isabela', 'João',
    'Karen', 'Luís', 'Marcos', 'Nádia', 'Otávio', 'Paula', 'Rafael', 'Sofia', 'Tiago', 'Vera',
    'André', 'Beatriz', 'César', 'Débora', 'Eduardo', 'Fernanda', 'Gustavo', 'Helena', 'Igor', 'Júlia',

  const SOBRENOMES = ['Souza', 'Lima', 'Mendes', 'Alves', 'Rocha', 'Costa', 'Nunes', 'Prado', 'Faria', 'Pereira',
    'Dias', 'Ramos', 'Vieira', 'Castro', 'Neves', 'Xavier', 'Silva', 'Oliveira', 'Santos', 'Ferreira',
    'Ribeiro', 'Carvalho', 'Gomes', 'Martins', 'Araújo', 'Barbosa', 'Cardoso', 'Teixeira', 'Moraes', 'Campos'];

  // ---------- Campos espelhados dos relatórios Meta4 ----------
  // O quadro de pessoal do DFT é alimentado pelos relatórios "15 - Relação de Servidores
  // do Órgão" e "16 - Relação de Servidores do Órgão Cargos Comis" (XLS/CSV). Os campos
  // abaixo existem porque estão nesses relatórios — e a tela de Cargos só mostra o que
  // eles entregam.
  //  idRh / ordinal / linhaFuncional → colunas ID, ORD e LF (identificação funcional)
  //  quadro                          → QPPE, QPM, QPPC, ADV, QPSS, CC, EST
  //  classe / referencia             → posição na carreira (Série de Classe / Classe / Referência)
  //  simbolo / funcao                → cargo em comissão e função gratificada (FG/DAS)
  //  brutoSemRev / brutoComRev / liquido → Total Bruto s/Rev, c/Rev e Total Líquido
  const QUADRO_POR_REGIME = { 'Estatutário': 'QPPE', 'Comissionado': 'CC', 'Temporário': 'CRES', 'Estágio': 'EST' };
  const CLASSES = ['I', 'II', 'III'];
  const SIMBOLOS_CC = ['DAS-1', 'DAS-2', 'DAS-3', 'FG-1', 'FG-3', 'FG-5'];
  const FUNCOES_GRAT = ['FG-5', 'FG-7', 'FG-8', 'FG-10'];

  let sSeq = 0;
  const servidores = [];
  function novoServidor(u, cargoId, nomeFixo) {
    const estagio = cargoId === 'c4';
    // a aposentadoria é ESTIMADA automaticamente pelo sistema (entrada + 35 anos)
    const anoIni = estagio ? faixa(2024, 2026) : 1990 + Math.floor(rng() * 35);
    const [rMin, rMax] = REMUNERACAO[cargoId] || [4000, 8000];
    const r = rng();
    const regime = estagio ? 'Estágio' : (r < 0.9 ? 'Estatutário' : r < 0.96 ? 'Comissionado' : 'Temporário');
    const m = rng();
    const modalidade = m < 0.6 ? 'presencial' : m < 0.85 ? 'hibrido' : 'teletrabalho';
    const remuneracao = Math.round((rMin + rng() * (rMax - rMin)) / 50) * 50;
    const seq = ++sSeq;
    // idade coerente com a admissão: entra entre 22 e 32 anos
    const anoNasc = anoIni - faixa(22, 32);
    const temFuncao = !estagio && regime !== 'Comissionado' && rng() < 0.18;

  const producao = [];

  function lancaProducao(unidade, servs, ents, sharesPorCargo, volMesTotal, reprimidaBase) {
    meses.forEach((mes, mi) => {
      const idxMes = Number(mes.slice(5)) - 1;
      const sazonal = (idxMes === 11 || idxMes === 0) ? 0.85 : 1 + 0.04 * Math.sin(idxMes / 11 * Math.PI * 2);
      ents.forEach((ent, ei) => {
        const volEnt = volMesTotal[ei] * (1 + 0.004 * mi) * sazonal;
        const doCargo = {};
        servs.forEach(s => { (doCargo[s.cargoId] = doCargo[s.cargoId] || []).push(s); });
        let primeiroDoEnt = true;
        servs.forEach(s => {
          const share = (sharesPorCargo[s.cargoId] || [])[ei] || 0;
          if (share <= 0) return;
          const n = doCargo[s.cargoId].length;
          const vol = Math.max(0, Math.round(volEnt * share / 100 / n * (0.9 + rng() * 0.2)));
          let reg = producao.find(p => p.servidorId === s.id && p.mes === mes);
          if (!reg) {
            reg = {
              id: 'p' + (++pSeq), unidadeId: unidade.id, servidorId: s.id, cargoId: s.cargoId, mes,
              itens: []
            };
            producao.push(reg);
          }
          const pct = Math.round(share * (0.92 + rng() * 0.16));
          // o primeiro servidor da entrega no mês reporta a fila (demanda não atendida)
          const rep = primeiroDoEnt && reprimidaBase && reprimidaBase[ei]
            ? Math.max(0, Math.round(reprimidaBase[ei] * (0.8 + rng() * 0.4))) : null;
          primeiroDoEnt = false;
          reg.itens.push({ entregaId: ent.id, percentual: pct, volume: vol, reprimida: rep });
        });
      });
      servs.forEach(s => {
        const reg = producao.find(p => p.servidorId === s.id && p.mes === mes);
        if (!reg || !reg.itens.length) return;
        const soma = reg.itens.reduce((a, i) => a + i.percentual, 0);
        reg.itens.forEach(i => { i.percentual = Math.round(i.percentual / soma * 1000) / 10; });
        const dif = Math.round((100 - reg.itens.reduce((a, i) => a + i.percentual, 0)) * 10) / 10;
        reg.itens[0].percentual = Math.round((reg.itens[0].percentual + dif) * 10) / 10;
      });
    });
  }

  // Registro do RH SETORIAL por unidade/cargo/mês: dias TOTAIS somando os servidores do cargo.
  // Base do ITP calculado (meio e finalístico) quando não se opta pelo fixo MGI.
  const afastamentos = [];

  // Natureza da ausência — separação que a gestão precisa enxergar:
  //  · AMPARADA    → licenças, afastamentos e concessões previstos em lei/estatuto.
  //                  Direito do servidor; a chefia não decide sobre ela.
  //  · GERENCIÁVEL → faltas e atrasos sem amparo legal (ausência injustificada).
  //                  É a parcela sobre a qual a gestão pode efetivamente atuar.
  // No sistema real a classificação vem do CÓDIGO DA OCORRÊNCIA do relatório Meta4
  // "19 - Relatório de Ocorrência de Frequência" (ocorrência, período, dias, status).
  const ausencias = total => {
    const injust = Math.round(total * (0.08 + rng() * 0.22)); // 8% a 30% sem amparo
    return {
      ausenciaDias: total,
      ausenciaAmparadaDias: total - injust,
      ausenciaInjustificadaDias: injust
    };
  };
  [nrhsSEAP, nasSEAP, decon, deap, egp, deto].forEach(u => {
    const cargosU = [...new Set(servidores.filter(x => x.unidadeId === u.id).map(x => x.cargoId))];
    cargosU.forEach(cId => {
      const qtd = servidores.filter(x => x.unidadeId === u.id && x.cargoId === cId).length;
      meses.forEach(mes => {
        afastamentos.push({
          id: 'af' + (++afSeq), unidadeId: u.id, cargoId: cId, mes,
          ...ausencias(Math.round(qtd * (0.8 + rng() * 1.6))),
          treinamentoDias: Math.round(qtd * (rng() * 0.8)),
          projetosDias: rng() < 0.25 ? Math.round(qtd * rng()) : 0
        });
      });
    });
  });

  // ---------- Histórico retroativo (agregado por cargo) das unidades pares ----------
  const historico = [];
  let hSeq = 0;
  function geraHistoricoPares(pares, entregasPares, volBases, shares, cargosHist) {
    pares.forEach((u, ui) => {
      const nivel = 0.75 + ui * 0.09;
      entregasPares[ui].forEach((ent, ei) => {
        meses.forEach((mes, mi) => {
          const idxMes = Number(mes.slice(5)) - 1;
          const sazonal = (idxMes === 11 || idxMes === 0) ? 0.85 : 1 + 0.04 * Math.sin(idxMes / 11 * Math.PI * 2);
          cargosHist.forEach(cid => {
            const share = (shares[cid] || [])[ei];
            if (!share) return;
            historico.push({
              id: 'h' + (++hSeq), unidadeId: u.id, entregaId: ent.id, cargoId: cid, mes,
              volume: Math.max(0, Math.round(volBases[ei] * nivel * share / 100 * (1 + 0.003 * mi) * sazonal * (0.92 + rng() * 0.16))),
              percentual: share
            });
          });
        });
      });
    });
  }
  geraHistoricoPares(paresNRHS, entregasParesNRHS, [950, 120, 480],
    { c1: [62, 38, 0], c2: [38, 22, 40] }, ['c1', 'c2']);
  geraHistoricoPares(paresNAS, entregasParesNAS, [45, 620, 260],

  // ---------- Unidades com entregas REAIS pesquisadas (fontes oficiais SEAP/AEN) ----------
  // DE (Divisão de Estágio) — Esforço por Entrega. Central de Estágio: ~3.300 estagiários
  // ativos em 75 órgãos; 320–375 vagas publicadas por mês (portal abre do dia 1º ao 20).
  // DPE (Departamento do Patrimônio) — Direcionador Histórico. GPI + contrato de
  // regularização em massa de 300 imóveis (mai/2025) acelera a série histórica.
  const dpe = U('SEAP', 'DPE');
  const divEstagio = U('SEAP', 'DE');
  // troca o quadro genérico (gerado no loop acima) por equipe nomeada, sem tocar no RNG anterior
  for (let i = servidores.length - 1; i >= 0; i--) {
    if (servidores[i].unidadeId === dpe.id || servidores[i].unidadeId === divEstagio.id) servidores.splice(i, 1);
  }
  const eqEstagio = [
    novoServidor(divEstagio, 'c1', 'Helena Barbosa'),
    novoServidor(divEstagio, 'c2', 'Pedro Cardoso'),
    novoServidor(divEstagio, 'c2', 'Júlia Moraes'),
    novoServidor(divEstagio, 'c5', 'Sérgio Campos')
  ];
  eqEstagio[0].dataInicio = '1993-06'; // chefe da divisão: aposentadoria estimada em 2028
  novoServidor(dpe, 'c1', 'Beatriz Teixeira'); novoServidor(dpe, 'c1', 'Leonardo Araújo');
  novoServidor(dpe, 'c2', 'Olívia Martins'); novoServidor(dpe, 'c2', 'Nelson Gomes');
  novoServidor(dpe, 'c3', 'Vitor Ribeiro');

  const entregasEstagio = [
    addEnt(divEstagio, 'Vagas de estágio publicadas', 'Cadastro, validação e publicação mensal das vagas dos órgãos na Central de Estágio.', [{ cargoId: 'c2', pessoas: 2 }, { cargoId: 'c5', pessoas: 1 }], 350, 80, { horizonteAnos: 3 }),
    addEnt(divEstagio, 'Termos de compromisso formalizados', 'Conferência de documentação e formalização de TCEs de novos estagiários.', [{ cargoId: 'c1', pessoas: 1 }, { cargoId: 'c2', pessoas: 2 }], 150, 60, { horizonteAnos: 3 }),
    addEnt(divEstagio, 'Aditivos de renovação processados', 'Prorrogações e alterações de estágio (bolsa, horário, supervisor).', [{ cargoId: 'c1', pessoas: 1 }, { cargoId: 'c2', pessoas: 1 }], 120, 0, { horizonteAnos: 3 }),
    addEnt(divEstagio, 'Desligamentos processados', 'Rescisões de TCE com emissão de termo e baixa na Central.', [{ cargoId: 'c2', pessoas: 2 }, { cargoId: 'c5', pessoas: 1 }], 130, 0, null),
    addEnt(divEstagio, 'Bolsas de estágio conferidas', 'Conferência mensal de frequência e bolsa-auxílio dos ~3,3 mil estagiários ativos.', [{ cargoId: 'c1', pessoas: 1 }, { cargoId: 'c5', pessoas: 1 }], 3300, 0, { horizonteAnos: 3 })
  ];
  const catEstagio = [[['cat4', 60], ['cat2', 40]], [['cat4', 60], ['cat1', 40]], [['cat4', 100]], [['cat4', 70], ['cat1', 30]], [['cat5', 70], ['cat4', 30]]];
  entregasEstagio.forEach((e, i) => setCat(e, catEstagio[i]));
  // volMesTotal compensa a soma dos shares (<100%) p/ o volume lançado bater com o real
  lancaProducao(divEstagio, eqEstagio, entregasEstagio,
    { c1: [20, 30, 15, 5, 30], c2: [25, 30, 20, 25, 0], c5: [30, 0, 20, 20, 30] },
    [465, 250, 218, 260, 5170], [80, 60, 0, 0, 0]);

  const entregasDPE = [
    addEnt(dpe, 'Imóveis regularizados', 'Regularização cartorial de imóveis do Estado (matrícula, averbação, registro).', [{ cargoId: 'c1', pessoas: 2 }, { cargoId: 'c3', pessoas: 1 }], 22, 0, null),
    addEnt(dpe, 'Laudos de avaliação emitidos', 'Avaliação de bens imóveis do patrimônio estadual (laudo com vistoria).', [{ cargoId: 'c1', pessoas: 2 }, { cargoId: 'c3', pessoas: 1 }], 34, 0, { horizonteAnos: 5 }),
    addEnt(dpe, 'Cadastros atualizados no GPI', 'Atualização cadastral de imóveis no Sistema de Gestão de Patrimônio Imobiliário.', [{ cargoId: 'c2', pessoas: 2 }, { cargoId: 'c3', pessoas: 1 }], 160, 0, { horizonteAnos: 3 }),
    addEnt(dpe, 'Termos de cessão de uso formalizados', 'Instrução e formalização de cessões e destinações de uso de imóveis a órgãos e municípios.', [{ cargoId: 'c1', pessoas: 2 }, { cargoId: 'c2', pessoas: 1 }], 9, 0, null),
    addEnt(dpe, 'Processos de alienação instruídos', 'Instrução de alienações e leilões de bens do Estado.', [{ cargoId: 'c1', pessoas: 1 }, { cargoId: 'c2', pessoas: 1 }], 6, 0, null)
  ];
  const catDPE = [[['cat1', 50], ['cat7', 50]], [['cat1', 40], ['cat7', 40], ['cat2', 20]], [['cat6', 70], ['cat4', 30]], [['cat2', 60], ['cat1', 40]], [['cat2', 50], ['cat1', 50]]];
  entregasDPE.forEach((e, i) => setCat(e, catDPE[i]));

  // série histórica do DPE (jan/2024–jun/2026): nível pré/pós contrato de regularização
  // em massa (mai/2025 = mês 16 da série); volume distribuído entre cargos pelo share
  const sharesDPE = { c1: [25, 40, 0, 20, 15], c2: [20, 10, 45, 15, 10], c3: [40, 20, 40, 0, 0] };
  const baseDPE = (ei, mi) => {
    const pos = mi >= 16;
    if (ei === 0) return pos ? 8 + 14 * ((mi - 15) / 14) : 8 * (1 + 0.01 * mi);
    if (ei === 1) return 24 * (1 + 0.015 * mi);
    if (ei === 2) return pos ? 150 * (1 + 0.005 * (mi - 16)) : 70 * (1 + 0.01 * mi);
    if (ei === 3) return 7 * (1 + 0.01 * mi);
    return 5 * (1 + 0.007 * mi);
  };
  entregasDPE.forEach((ent, ei) => {
    const somaShares = ['c1', 'c2', 'c3'].reduce((a, cid) => a + sharesDPE[cid][ei], 0);
    meses.forEach((mes, mi) => {
      const idxMes = Number(mes.slice(5)) - 1;
      const sazonal = (idxMes === 11 || idxMes === 0) ? 0.85 : 1 + 0.04 * Math.sin(idxMes / 11 * Math.PI * 2);
      ['c1', 'c2', 'c3'].forEach(cid => {
        const share = sharesDPE[cid][ei];
        if (!share) return;
        historico.push({
          id: 'h' + (++hSeq), unidadeId: dpe.id, entregaId: ent.id, cargoId: cid, mes,
          volume: Math.max(0, Math.round(baseDPE(ei, mi) * share / somaShares * sazonal * (0.92 + rng() * 0.16))),
          percentual: share
        });
      });
    });
  });

  // afastamentos do RH setorial p/ as duas unidades novas (base do ITP calculado)
  [dpe, divEstagio].forEach(u => {
    const cargosU = [...new Set(servidores.filter(x => x.unidadeId === u.id).map(x => x.cargoId))];
    cargosU.forEach(cId => {
      const qtd = servidores.filter(x => x.unidadeId === u.id && x.cargoId === cId).length;
      meses.forEach(mes => {
        afastamentos.push({
          id: 'af' + (++afSeq), unidadeId: u.id, cargoId: cId, mes,
          ...ausencias(Math.round(qtd * (0.8 + rng() * 1.6))),
          treinamentoDias: Math.round(qtd * (rng() * 0.8)),
          projetosDias: rng() < 0.25 ? Math.round(qtd * rng()) : 0
        });
      });
    });
  });

  // ---------- Cessões, temporários e absenteísmo em escala estadual ----------
  // Base dos rankings do Painel Visual — Estado do Paraná e das alavancas do Plano de Adequação.
  // REGRA DE OURO deste bloco: não pode alterar o dimensionamento já calibrado das
  // unidades que têm produção/histórico. Por isso:
  //  · cedidos das unidades dimensionadas são servidores NOVOS (cedido não entra no
  //    quadro ativo nem no custo — só volta a contar se o Plano "retornar" a cessão);
  //  · marcar alguém como "recebido" ou trocar o regime não muda quadro ativo nem custo;
  //  · os afastamentos novos vão só para unidades SEM produção/histórico (mexer no
  //    absenteísmo delas mudaria o ITP e, com ele, a comparação entre pares).
  const idsComDados = new Set([...producao.map(p => p.unidadeId), ...historico.map(h => h.unidadeId)]);
  const siglasOrgaos = orgaos.map(o => o.id);
  // propensões por órgão (dão variação real aos rankings; no sistema real vêm do cadastro)
  const FATOR_CESSAO = { SEAP: 1.5, SEED: 0.9, SEJU: 1.3, SEPL: 0.7, SESA: 1.7, SETU: 0.5, CGE: 1.0, AMEP: 0.6, FUNDEPAR: 1.2, IPARDES: 0.4, CEP: 0.8 };
  const FATOR_ABSENT = { SEAP: 1.0, SEED: 1.35, SEJU: 0.8, SEPL: 0.7, SESA: 1.8, SETU: 0.9, CGE: 0.6, AMEP: 1.45, FUNDEPAR: 1.15, IPARDES: 0.5, CEP: 1.05 };
  const FATOR_TEMP = { SEAP: 0.8, SEED: 1.9, SEJU: 0.7, SEPL: 0.5, SESA: 2.2, SETU: 0.6, CGE: 0.4, AMEP: 1.1, FUNDEPAR: 1.6, IPARDES: 0.3, CEP: 0.9 };
  // absenteísmo por cargo: execução/apoio faltam mais que carreiras de análise
  const FATOR_ABS_CARGO = { c1: 0.75, c2: 1.0, c3: 1.45, c4: 0.6, c5: 1.3, c6: 0.55 };
  const outroOrgao = origem => {
    const outros = siglasOrgaos.filter(o => o !== origem);
    return outros[Math.floor(rng() * outros.length)];
  };
  const nomeadosDemo = new Set(Object.values(equipe).map(s => s.id).concat(eqEstagio.map(s => s.id)));

  unidades.forEach(u => {
    const fc = FATOR_CESSAO[u.orgao] || 1;
    const ft = FATOR_TEMP[u.orgao] || 1;
    const doQuadro = servidores.filter(s => s.unidadeId === u.id && !s.cessao);
    const cargosU = [...new Set(doQuadro.map(s => s.cargoId))];
    if (!cargosU.length) return;

    // cedidos A OUTROS órgãos (saem do quadro ativo)
    const nCedidos = rng() < 0.55 * fc ? 1 + Math.floor(rng() * 2 * fc) : 0;
    for (let i = 0; i < nCedidos; i++) {
      const cId = cargosU[Math.floor(rng() * cargosU.length)];
      if (idsComDados.has(u.id)) {
        // unidade dimensionada: cria um servidor NOVO já cedido (não altera o quadro ativo)
        novoServidor(u, cId).cessao = { situacao: 'cedido', orgao: outroOrgao(u.orgao) };
      } else {
        const cand = servidores.filter(s => s.unidadeId === u.id && s.cargoId === cId && !s.cessao && !nomeadosDemo.has(s.id));
        // preserva ao menos 1 ativo do cargo — cargo inteiro cedido zeraria a lotação
        if (cand.length > 1) cand[Math.floor(rng() * cand.length)].cessao = { situacao: 'cedido', orgao: outroOrgao(u.orgao) };
      }
    }
    // recebidos de OUTROS órgãos (cedidos em exercício aqui — já contam no quadro ativo)
    const nReceb = rng() < 0.42 * fc ? 1 + Math.floor(rng() * 2 * fc) : 0;
    for (let i = 0; i < nReceb; i++) {
      const cand = servidores.filter(s => s.unidadeId === u.id && !s.cessao && !nomeadosDemo.has(s.id) && s.regime === 'Estatutário');
      if (cand.length) cand[Math.floor(rng() * cand.length)].cessao = { situacao: 'recebido', orgao: outroOrgao(u.orgao) };
    }
    // contratos temporários (troca de regime não altera quadro ativo nem custo do cargo)
    const nTemp = rng() < 0.3 * ft ? 1 + Math.floor(rng() * 2 * ft) : 0;
    for (let i = 0; i < nTemp; i++) {
      const cand = servidores.filter(s => s.unidadeId === u.id && !s.cessao && !nomeadosDemo.has(s.id) &&
        s.regime === 'Estatutário' && s.cargoId !== 'c4');
      if (cand.length > 1) cand[Math.floor(rng() * cand.length)].regime = 'Temporário';
    }
  });

  // afastamentos do trimestre de referência p/ as unidades ainda sem lançamento do RH
  const mesesAbs = ['2026-04', '2026-05', '2026-06'];
  unidades.forEach(u => {
    if (idsComDados.has(u.id)) return; // não mexer no ITP de quem entra nos comparativos
    const fa = FATOR_ABSENT[u.orgao] || 1;
    const cargosU = [...new Set(servidores.filter(x => x.unidadeId === u.id && !x.cessao).map(x => x.cargoId))];
    cargosU.forEach(cId => {
      const qtd = servidores.filter(x => x.unidadeId === u.id && x.cargoId === cId && !x.cessao).length;
      if (!qtd) return;
      const fcg = FATOR_ABS_CARGO[cId] || 1;
      mesesAbs.forEach(mes => {
        afastamentos.push({
          id: 'af' + (++afSeq), unidadeId: u.id, cargoId: cId, mes,
          ...ausencias(Math.round(qtd * (0.6 + rng() * 1.5) * fa * fcg)),
          treinamentoDias: Math.round(qtd * rng() * 0.7),
          projetosDias: rng() < 0.2 ? Math.round(qtd * rng() * 0.6) : 0
        });
      });
    });
  });

  // ---------- Matriz de impacto de IA/automação por cargo ----------
  // potencial (0-100%): exposição da carreira à automação; alimentada na tela Cargos.
  const cargoIA = {
    c1: { potProdutividade: 35, potDemanda: 5, evidencia: 'Análises e pareceres: apoio de IA generativa, decisão permanece humana.' },
    c2: { potProdutividade: 55, potDemanda: 20, evidencia: 'Rotinas transacionais (folha, atos, protocolos) altamente automatizáveis.' },
    c3: { potProdutividade: 45, potDemanda: 15, evidencia: 'Execução operacional: digitalização e esteiras reduzem volume manual.' },
    c4: { potProdutividade: 60, potDemanda: 15, evidencia: 'Tarefas de apoio repetitivas; repensar o papel do estágio.' },
    c5: { potProdutividade: 50, potDemanda: 15, evidencia: 'Apoio administrativo: triagem e tramitação automatizáveis.' },
    c6: { potProdutividade: 25, potDemanda: 0, evidencia: 'TI ganha produtividade com IA, mas a demanda por sistemas cresce.' }
  };

  // método de ITP POR CARGO (não por área): 'fixo' (MGI) ou 'calculado' (afastamentos do RH)
  const itpCargo = { c1: 'calculado', c2: 'calculado', c3: 'calculado', c4: 'fixo', c5: 'calculado', c6: 'fixo' };

  // fila de solicitações à SEAP (benchmarks de referência, códigos de pares etc.)
  const solicitacoes = [{
    id: 'sol1', tipo: 'benchmark', status: 'pendente', data: '2026-07-10',
    unidadeId: U('SEAP', 'DPM').id, cargoId: 'c1', autor: 'Gestor de RH Setorial — SEAP',
    payload: { valor: 0.9 },
    justificativa: 'Unidade sem par comparável no Estado; benchmark do CFM para perícias médicas (0,9 perícia/h efetiva).'
  }];

  return {
    versao: 14,
    anoReferencia: 2026,
    itpFixoMeio: 81.5, // % — referência MGI (área meio)
    perfilId: 'seap',
    orgaos, unidades, cargos, entregas, servidores, producao, historico, cargoIA, categoriasIA,
    afastamentos, itpCargo, solicitacoes,
    // parâmetros do custo médio automático + custo por vaga de concurso.
    // encargosPct SEM o 13º (o 13º entra na projeção anual como 13ª folha).
    // baseIncidenciaPct = % da remuneração sobre a qual os encargos incidem (parte tem impostos retidos, sem incidência patronal).
    // beneficiosMensais aqui é só fallback — o benefício real é POR CARGO (cargos[].beneficios).
    // abonoPermanenciaPct = % da remuneração pago a quem já pode aposentar e permanece
    // (equivale à contribuição previdenciária do servidor — parâmetro editável pela SEAP).
    custoParams: { encargosPct: 24.78, baseIncidenciaPct: 100, beneficiosMensais: 1100, custoVaga: 42000, abonoPermanenciaPct: 14 },
    // ---------- Reajuste da folha e limites da LRF (LC 101/2000) ----------
    // reajustePct: reajuste geral concedido em CADA ano (%). O fator acumulado corrige
    //   TODA projeção de custo do sistema (folha projetada, concurso, alocação, medidas).
    //   O ano de referência é a base (fator 1,00) — não se reajusta o que já está pago.
    // rclBase / crescimentoRclPct: Receita Corrente Líquida do ano-base e sua projeção.
    // limitePct: teto de despesa com pessoal do Poder Executivo estadual (art. 20, II, "c").
    //   O prudencial é 95% do limite (art. 22) e o alerta, 90% (art. 59, §1º, II).
    lrf: {
      reajustePct: { 2027: 5, 2028: 4.5, 2029: 4, 2030: 4, 2031: 4 },
      rclBase: 62000000000, crescimentoRclPct: 5,
      limitePct: 49, prudencialPct: 95, alertaPct: 90
    },
    benchmarks: {},
    itpConfig: {},
    resultadoConfig: {},
    // Plano de Adequação: alavancas (parte 1), medidas com custo (parte 2),
    // remanejamento (parte 3) e o plano plurianual de concurso.
    planoAdequacao: {
      escopo: { nivel: 'estado', orgao: null, unidadeId: null, cargoId: '' },
      alavancas: { absenteismoPct: 0, produtividadePct: 0, retornoCedidos: 0 },
      medidas: {
        cedidosPorEfetivos: { ativo: false, qtd: null },
        temporariosPorEfetivos: { ativo: false, qtd: null },
        permanenciaAposentados: { ativo: false, qtd: null, anos: 5 }
      },
      remanejamento: { ativo: true, maxPessoas: null, mesmoOrgao: true },
      // Provimento ANUAL (padrão): um certame por exercício, dimensionado pelo déficit
      // projetado do ano da posse. 'ciclo' mantém o modelo CNU (um edital, levas).
      concurso: {
        periodicidade: 'anual',
