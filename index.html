        modo: 'teto', horizonte: 5, tetoCiclo: 100000000, tetoAnual: 25000000, pctAdequacao: 90,
        anoEdital: 2027, defasagemNomeacao: 1, duracaoNomeacoes: 3,
        considerarAposentadorias: true, aplicarAlavancas: true, incluirCertame: true
      }
    }
  };
}


/* ===== store.js ===== */
/* ============================================================
   DFT — Estado da aplicação (persistência em localStorage)
   ============================================================ */

const Store = (() => {
  const CHAVE = 'dft-parana-v1';
  const VERSAO = 14;   // 14: unidades do Anexo I (28/08/2026) + metadados de órgão
  let state = null;
  // contador de revisão: quem faz cache de cálculo pesado (Plano.linhasBase)
  // compara com ele para saber se o estado mudou desde a última vez.
  let rev = 0;

  function carregar() {
    try {
      const raw = localStorage.getItem(CHAVE);
      if (raw) {
        const st = JSON.parse(raw);
        if (st && st.versao === VERSAO) { state = st; return state; }
      }
    } catch (e) { /* estado corrompido → recomeça do seed */ }
    state = dftBuildSeed();
    salvar();
    return state;
  }

  function salvar() {
    rev++;
    try { localStorage.setItem(CHAVE, JSON.stringify(state)); }
    catch (e) { console.warn('Não foi possível salvar o estado', e); }
  }

  function resetar() {
    localStorage.removeItem(CHAVE);
    state = dftBuildSeed();
    salvar();
    return state;
  }

  function novoId(prefixo, lista) {
    let n = lista.length + 1;
    while (lista.some(x => x.id === prefixo + n)) n++;
    return prefixo + n;
  }

  return {
    get state() { return state || carregar(); },
    get rev() { return rev; },
    carregar, salvar, resetar, novoId
  };
})();


/* ===== calc.js ===== */
/* ============================================================
   DFT — Motor de cálculo
   Convenção: todos os cálculos internos em HORAS.
   1 servidor fornece (jornada semanal × 4,33) horas/mês,
   das quais só a fração ITP é produtiva.
   ============================================================ */

const Calc = (() => {
  const SEMANAS_MES = 4.33;

  // ---------- estatística ----------
  const sum = a => a.reduce((x, y) => x + y, 0);
  const mean = a => (a.length ? sum(a) / a.length : 0);
  const median = a => {
    if (!a.length) return 0;
    const s = [...a].sort((x, y) => x - y);
    const m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  const max = a => (a.length ? Math.max(...a) : 0);
  const std = a => {
    if (a.length < 2) return 0;
    const m = mean(a);
    return Math.sqrt(sum(a.map(x => (x - m) ** 2)) / (a.length - 1));
  };

  // ---------- meses ----------
  const MESES_PT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const fmtMes = mes => { const [y, m] = mes.split('-'); return `${MESES_PT[+m - 1]}/${y.slice(2)}`; };
  const addMeses = (mes, n) => {
    let [y, m] = mes.split('-').map(Number);
    m += n;
    while (m > 12) { m -= 12; y++; }
    while (m < 1) { m += 12; y--; }
    return `${y}-${String(m).padStart(2, '0')}`;
  };
  const mesesDoAno = ano => Array.from({ length: 12 }, (_, i) => `${ano}-${String(i + 1).padStart(2, '0')}`);

  // ---------- quadro de pessoal (derivado do cadastro individual de servidores) ----------
  // servidoresCargo lista TODOS (inclusive cedidos a outros órgãos);
  // o quadro ATIVO (conta p/ dimensionamento e custo) exclui os cedidos.
  const servidoresCargo = (st, uId, cId) =>
    st.servidores.filter(s => s.unidadeId === uId && s.cargoId === cId);
  const cedido = s => !!(s.cessao && s.cessao.situacao === 'cedido');
  // recebido = servidor de OUTRO órgão em exercício na unidade (cedido em exercício)
  const recebido = s => !!(s.cessao && s.cessao.situacao === 'recebido');
  const servidoresAtivos = (st, uId, cId) =>
    servidoresCargo(st, uId, cId).filter(s => !cedido(s));
  // cedidos DA unidade (saíram) e recebidos NA unidade (entraram), por cargo ou todos
  const cedidosCargo = (st, uId, cId) =>
    st.servidores.filter(s => s.unidadeId === uId && (!cId || s.cargoId === cId) && cedido(s));
  const recebidosCargo = (st, uId, cId) =>
    st.servidores.filter(s => s.unidadeId === uId && (!cId || s.cargoId === cId) && recebido(s));
  const temporariosCargo = (st, uId, cId) =>
    st.servidores.filter(s => s.unidadeId === uId && (!cId || s.cargoId === cId) &&
      s.regime === 'Temporário' && !cedido(s));

  // Aposentadoria estimada AUTOMÁTICA a partir da data de início:
  // regra simplificada de 35 anos de contribuição (proxy do protótipo — o sistema
  // real usará idade + tempo de contribuição + regras de transição do RPPS).
  function aposEstimada(st, servidor) {
    if (!servidor || !servidor.dataInicio) return null;
    if (servidor.regime === 'Estágio' || servidor.cargoId === 'c4') return null;
    const anoIni = Number(String(servidor.dataInicio).slice(0, 4));
    if (!anoIni) return null;
    return Math.max(anoIni + 35, st.anoReferencia + 1);
  }
  const tempoServicoAnos = (st, servidor) =>
    servidor && servidor.dataInicio ? Math.max(0, st.anoReferencia - Number(String(servidor.dataInicio).slice(0, 4))) : 0;

  // Benefícios mensais POR CARGO (auxílios). Fallback: custoParams.beneficiosMensais.
  function beneficioCargo(st, cargoId) {
    const c = (st.cargos || []).find(x => x.id === cargoId);
    if (c && c.beneficios != null) return c.beneficios;
    return (st.custoParams && st.custoParams.beneficiosMensais) || 0;
  }

  // Custo médio MENSAL (1 folha) AUTOMÁTICO do servidor:
  // remuneração + encargos + benefícios do cargo.
  // Encargos (padrão 24,78%) = férias+⅓ (2,78%) + previdência patronal (~22%). SEM o 13º —
  //   o 13º entra na projeção ANUAL como 13ª folha (12 meses + 13º), não no custo mensal.
  // Base de incidência: os encargos incidem só sobre baseIncidenciaPct% da remuneração
  //   (parte da remuneração tem impostos retidos e não sofre incidência patronal).
  // Estágio: bolsa + benefícios do cargo (já reduzidos), sem encargos.
  function custoServidor(st, servidor) {
    if (!servidor) return 0;
    const p = st.custoParams || { encargosPct: 24.78, baseIncidenciaPct: 100 };
    const benef = beneficioCargo(st, servidor.cargoId);
    const rem = servidor.remuneracao || 0;
    if (servidor.regime === 'Estágio') return rem + benef;
    const base = p.baseIncidenciaPct != null ? p.baseIncidenciaPct : 100;
    const encargos = rem * (base / 100) * ((p.encargosPct || 0) / 100);
    return rem + encargos + benef;
  }

  // ---------- Reajuste da folha (LRF) ----------
  // Um único fator, calculado aqui, corrige TODA projeção de custo do sistema.
  // Ano de referência = base (fator 1,00): não se reajusta o que já está pago.
  const LRF_PADRAO = {
    rclBase: 62000000000, crescimentoRclPct: 5,
    limitePct: 49, prudencialPct: 95, alertaPct: 90
  };
  // Completa o que faltar SEM trocar o objeto: as telas guardam a referência e
  // escrevem nela; recriar o objeto a cada chamada faria a edição se perder.
  function paramsLrf(st) {
    if (!st.lrf || typeof st.lrf !== 'object') st.lrf = {};
    const l = st.lrf;
    if (!l.reajustePct || typeof l.reajustePct !== 'object') l.reajustePct = {};
    Object.keys(LRF_PADRAO).forEach(k => { if (l[k] == null) l[k] = LRF_PADRAO[k]; });
    return l;
  }
  const reajusteAno = (st, ano) => Number(paramsLrf(st).reajustePct[ano]) || 0;

  // fator acumulado do ano de referência até `ano` (composto, ano a ano)
  function fatorReajuste(st, ano) {
    const base = st.anoReferencia;
    if (!ano || ano <= base) return 1;
    let f = 1;
    for (let a = base + 1; a <= ano; a++) f *= 1 + reajusteAno(st, a) / 100;
    return f;
  }
  // Receita Corrente Líquida projetada (base × crescimento composto)
  function rclAno(st, ano) {
    const p = paramsLrf(st);
    const n = Math.max(0, (ano || st.anoReferencia) - st.anoReferencia);
    return (p.rclBase || 0) * Math.pow(1 + (p.crescimentoRclPct || 0) / 100, n);
  }
  // Limites de despesa com pessoal: máximo, prudencial (95%) e alerta (90%)
  function limitesLrf(st, ano) {
    const p = paramsLrf(st);
    const rcl = rclAno(st, ano);
    const maximo = rcl * (p.limitePct || 0) / 100;
    return {
      rcl, maximo,
      prudencial: maximo * (p.prudencialPct || 95) / 100,
      alerta: maximo * (p.alertaPct || 90) / 100
    };
  }
  // Situação da folha anual diante dos limites do ano
  function situacaoLrf(st, folhaAnual, ano) {
    const l = limitesLrf(st, ano);
    const pct = l.rcl > 0 ? folhaAnual / l.rcl * 100 : 0;
    const nivel = folhaAnual > l.maximo ? 'acima'
      : folhaAnual > l.prudencial ? 'prudencial'
        : folhaAnual > l.alerta ? 'alerta' : 'ok';
    return { ...l, pct, nivel };
  }

  // ---------- Custo de INGRESSO (vaga nova) ----------
  // Quem entra por concurso entra na primeira referência da carreira: o custo da vaga
  // usa o salário INICIAL do cargo, não a média do quadro (que embute progressões).
  const salarioInicialCargo = (st, cargoId) => {
    const c = (st.cargos || []).find(x => x.id === cargoId);
    if (c && c.salarioInicial != null) return c.salarioInicial;
    // fallback: menor remuneração observada no cargo
    const pool = st.servidores.filter(s => s.cargoId === cargoId && (s.remuneracao || 0) > 0);
    return pool.length ? Math.min(...pool.map(s => s.remuneracao)) : 0;
  };
  function custoIngresso(st, cargoId, ano) {
    const p = st.custoParams || {};
    const rem = salarioInicialCargo(st, cargoId);
    const benef = beneficioCargo(st, cargoId);
    const estagio = cargoId === 'c4';
    const base = p.baseIncidenciaPct != null ? p.baseIncidenciaPct : 100;
    const encargos = estagio ? 0 : rem * (base / 100) * ((p.encargosPct || 0) / 100);
    return (rem + encargos + benef) * fatorReajuste(st, ano);
  }

  // ---------- Custo do absenteísmo (folha paga sem entrega correspondente) ----------
  // taxa de ausência do cargo × folha do quadro daquele cargo, unidade a unidade.
  function custoAbsenteismo(st, unidadeIds, cargoId, ano, natureza) {
    let mensal = 0, pessoas = 0, horas = 0, legais = 0, folha = 0;
    (unidadeIds || st.unidades.map(u => u.id)).forEach(uId => {
      const cargos = cargoId ? [cargoId]
        : [...new Set(st.servidores.filter(s => s.unidadeId === uId).map(s => s.cargoId))];
      cargos.forEach(cId => {
        const a = absenteismoCargo(st, uId, cId, ano, natureza);
        if (!a) return;
        const ss = servidoresAtivos(st, uId, cId);
        if (!ss.length) return;
        const custo = sum(ss.map(x => custoServidor(st, x)));
        mensal += custo * a.taxa;
        folha += custo;
        pessoas += ss.length;
        horas += a.horas * ss.length;
        legais += horasMensais(st, uId, cId) * ss.length;
      });
    });
    if (!pessoas) return null;
    return {
      mensal, anual: mensal * 13, folhaMensal: folha, pessoas,
      horas, horasTotais: horas, dias: null,
      taxa: legais > 0 ? horas / legais : 0,
      // equivalente em pessoas: quantas jornadas cheias somam as ausências
      fte: legais > 0 ? horas / (legais / pessoas) : 0
    };
  }

  // aposentadorias previstas (acumuladas) do cargo até o horizonte
  function aposentadoriasPrevistas(st, uId, cId, anos) {
    const limite = st.anoReferencia + anos;
    return servidoresAtivos(st, uId, cId).filter(s => {
      const a = aposEstimada(st, s);
      return a && a <= limite;
    }).length;
  }

  function lotacaoCargo(st, uId, cId) {
    const ss = servidoresAtivos(st, uId, cId);
    if (!ss.length) return null;
    return {
      cargoId: cId, quantidade: ss.length,
      jornadaSemanal: median(ss.map(s => s.jornadaSemanal || 40)),
      custoMensal: sum(ss.map(s => custoServidor(st, s))),
      apos: {
        a1: aposentadoriasPrevistas(st, uId, cId, 1),
        a3: aposentadoriasPrevistas(st, uId, cId, 3),
        a5: aposentadoriasPrevistas(st, uId, cId, 5)
      }
    };
  }
  // cargos com quadro ATIVO na unidade (um cargo cujos servidores estão todos cedidos
  // não tem lotação e é descartado — senão os consumidores recebem null e quebram)
  const lotacaoUnidade = (st, uId) => {
    const ids = [...new Set(st.servidores.filter(s => s.unidadeId === uId).map(s => s.cargoId))];
    return ids.map(cId => lotacaoCargo(st, uId, cId)).filter(Boolean);
  };
  const jornada = (st, uId, cId) => {
    const ss = servidoresAtivos(st, uId, cId);
    return ss.length ? median(ss.map(s => s.jornadaSemanal || 40)) : 40;
  };
  const horasMensais = (st, uId, cId) => jornada(st, uId, cId) * SEMANAS_MES;
  const qtdAtual = (st, uId, cId) => servidoresAtivos(st, uId, cId).length;

  // ---------- unidades / pares ----------
  const unidade = (st, uId) => st.unidades.find(u => u.id === uId);
  const codigoPares = (st, uId) => {
    const cfg = (st.resultadoConfig[uId] || {});
    return cfg.codigoPares || unidade(st, uId).codigoPares;
  };
  const unidadesPares = (st, uId) => {
    const cod = codigoPares(st, uId);
    return st.unidades.filter(u => u.id !== uId && codigoPares(st, u.id) === cod);
  };
  const normTitulo = t => (t || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const entregasUnidade = (st, uId) => st.entregas.filter(e => e.unidadeId === uId);
  const entregaEquivalente = (st, uId, entrega) =>
    entregasUnidade(st, uId).find(e => normTitulo(e.titulo) === normTitulo(entrega.titulo));

  // ---------- produção agregada (produção + histórico retroativo) ----------
  // Volume da unidade = soma dos lançamentos dos servidores (a entrega é única,
  // servidores lançam SOBRE ela — sem duplicação) + histórico agregado por cargo.
  function volumeMes(st, uId, entregaId, mes, cargoId) {
    let v = 0;
    st.producao.forEach(p => {
      if (p.unidadeId !== uId || p.mes !== mes) return;
      if (cargoId && p.cargoId !== cargoId) return;
      p.itens.forEach(i => { if (i.entregaId === entregaId) v += i.volume; });
    });
    st.historico.forEach(h => {
      if (h.unidadeId !== uId || h.mes !== mes || h.entregaId !== entregaId) return;
      if (cargoId && h.cargoId !== cargoId) return;
      v += h.volume;
    });
    return v;
  }

  function serieVolume(st, uId, { entregaId = null, cargoId = null } = {}) {
    const mapa = new Map();
    const add = (mes, v) => mapa.set(mes, (mapa.get(mes) || 0) + v);
    st.producao.forEach(p => {
      if (p.unidadeId !== uId) return;
      if (cargoId && p.cargoId !== cargoId) return;
      p.itens.forEach(i => { if (!entregaId || i.entregaId === entregaId) add(p.mes, i.volume); });
    });
    st.historico.forEach(h => {
      if (h.unidadeId !== uId) return;
      if (cargoId && h.cargoId !== cargoId) return;
      if (entregaId && h.entregaId !== entregaId) return;
      add(h.mes, h.volume);
    });
    return [...mapa.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([mes, v]) => ({ mes, v }));
  }

  const volumeMedioMensal = (st, uId, entregaId, ano, cargoId) => {
    const vals = mesesDoAno(ano).map(m => volumeMes(st, uId, entregaId, m, cargoId)).filter(v => v > 0);
    return mean(vals);
  };

  // Demanda não atendida média mensal: informada nos lançamentos de Produção
  // (média dos relatos de cada mês); sem lançamentos, vale o cadastro da entrega.
  function reprimidaMedia(st, uId, entregaId, ano) {
    const porMes = new Map();
    st.producao.forEach(p => {
      if (p.unidadeId !== uId) return;
      if (ano && !p.mes.startsWith(String(ano))) return;
      p.itens.forEach(i => {
        if (i.entregaId !== entregaId || i.reprimida == null) return;
        const r = porMes.get(p.mes) || [];
        r.push(i.reprimida); porMes.set(p.mes, r);
      });
    });
    if (porMes.size) return mean([...porMes.values()].map(v => mean(v)));
    const e = st.entregas.find(x => x.id === entregaId);
    return (e && e.demandaReprimida) || 0;
  }

  // ---------- percentuais de tempo (mediana dos usuários, normalizada p/ 100%) ----------
  function percentualBruto(st, uId, entregaId, ano) {
    const doAno = [];
    st.producao.forEach(p => {
      if (p.unidadeId !== uId || !p.mes.startsWith(String(ano))) return;
      p.itens.forEach(i => { if (i.entregaId === entregaId) doAno.push(i.percentual); });
    });
    if (doAno.length) return { valor: median(doAno), fonte: 'produção (mediana)' };
    const hist = st.historico.filter(h => h.unidadeId === uId && h.entregaId === entregaId).map(h => h.percentual);
    if (hist.length) return { valor: median(hist), fonte: 'histórico (mediana)' };
    const e = st.entregas.find(x => x.id === entregaId);
    if (e && e.percentualManual != null) return { valor: e.percentualManual, fonte: 'manual' };
    return { valor: 0, fonte: 'sem dados' };
  }

  function percentuais(st, uId, ano) {
    const ents = entregasUnidade(st, uId);
    const porEntrega = {};
    ents.forEach(e => { porEntrega[e.id] = percentualBruto(st, uId, e.id, ano); });
    const soma = sum(Object.values(porEntrega).map(p => p.valor));
    Object.values(porEntrega).forEach(p => { p.normalizado = soma > 0 ? p.valor / soma * 100 : 0; });
    return { porEntrega, soma, ok: Math.abs(soma - 100) < 0.05 };
  }

  // ---------- ITP ----------
  // ITP = (horário disponível − horário não produtivo) / horário disponível.
  // Alimentado pela Produção (ausências, treinamentos, projetos externos)
  // ou fixo para área meio (81,5% — referência MGI).
  function itpCalculado(st, uId, cargoId, ano) {
    // base: afastamentos lançados pelo RH setorial (dias TOTAIS do cargo no mês)
    const regs = (st.afastamentos || []).filter(a => a.unidadeId === uId && a.cargoId === cargoId &&
      (!ano || a.mes.startsWith(String(ano))));
    const disp = horasMensais(st, uId, cargoId);
    if (!regs.length) return { disponivel: disp, naoDisponivel: null, itp: null, n: 0 };
    const qtd = Math.max(1, qtdAtual(st, uId, cargoId));
    const diaria = jornada(st, uId, cargoId) / 5;
    const porMes = regs.map(a =>
      (diasAusenciaReg(a) + (a.treinamentoDias || 0) + (a.projetosDias || 0)) * diaria / qtd);
    const nd = median(porMes);
    return { disponivel: disp, naoDisponivel: nd, itp: Math.max(0, (disp - nd) / disp), n: regs.length };
  }


  // ---------- Absenteísmo ----------
  // Absenteísmo = SÓ as ausências (o ITP também desconta treinamentos e projetos externos).
  // taxa = horas de ausência por servidor ÷ horário legal mensal do cargo.
  //
  // NATUREZA DA AUSÊNCIA — o registro guarda as duas parcelas separadas:
  //  · 'amparada'    → ausência legalmente amparada (licenças, afastamentos e concessões
  //                    previstos em lei/estatuto). Direito do servidor: não é gerenciável.
  //  · 'gerenciavel' → falta ou atraso sem amparo legal (ausência injustificada). É a
  //                    parcela sobre a qual a gestão pode atuar.
  // Sem natureza informada, devolve o TOTAL. Registros antigos, que só têm ausenciaDias,
  // são lidos como integralmente amparados — é a leitura conservadora.
  function diasAusenciaReg(a, natureza) {
    if (!a) return 0;
    const temSplit = a.ausenciaAmparadaDias != null || a.ausenciaInjustificadaDias != null;
    const amp = temSplit ? (a.ausenciaAmparadaDias || 0) : (a.ausenciaDias || 0);
    const ger = temSplit ? (a.ausenciaInjustificadaDias || 0) : 0;
    if (natureza === 'amparada') return amp;
    if (natureza === 'gerenciavel') return ger;
    return amp + ger;
  }

  function absenteismoCargo(st, uId, cargoId, ano, natureza) {
    const regs = (st.afastamentos || []).filter(a => a.unidadeId === uId && a.cargoId === cargoId &&
      (!ano || a.mes.startsWith(String(ano))));
    if (!regs.length) return null;
    const qtd = Math.max(1, qtdAtual(st, uId, cargoId));
    const diaria = jornada(st, uId, cargoId) / 5;
    const hm = horasMensais(st, uId, cargoId);
    const diasMes = regs.map(a => diasAusenciaReg(a, natureza) / qtd);
    const dias = median(diasMes);
    const horas = dias * diaria;
    return { dias, horas, taxa: hm > 0 ? Math.min(1, horas / hm) : 0, meses: regs.length, servidores: qtd };
  }

  // Absenteísmo agregado de um conjunto de unidades (ponderado pelo quadro ativo)
  function absenteismoAgregado(st, unidadeIds, cargoId, ano, natureza) {
    let pessoas = 0, horas = 0, legais = 0, dias = 0;
    (unidadeIds || st.unidades.map(u => u.id)).forEach(uId => {
      const cargos = cargoId ? [cargoId] : [...new Set(st.servidores.filter(s => s.unidadeId === uId).map(s => s.cargoId))];
      cargos.forEach(cId => {
        const a = absenteismoCargo(st, uId, cId, ano, natureza);
        if (!a) return;
        const q = qtdAtual(st, uId, cId);
        if (!q) return;
        pessoas += q; horas += a.horas * q; dias += a.dias * q; legais += horasMensais(st, uId, cId) * q;
      });
    });
    if (!pessoas) return null;
    return { pessoas, dias: dias / pessoas, horas: horas / pessoas, taxa: legais > 0 ? horas / legais : 0 };
  }

  // Custo médio mensal de um servidor EFETIVO do cargo (base p/ vagas novas de concurso).
  // Prioriza os estatutários do escopo; sem eles, usa qualquer servidor do cargo no Estado.
  function custoMedioCargo(st, cargoId, unidadeIds) {
    const dentro = s => !unidadeIds || unidadeIds.has(s.unidadeId);
    const pool = st.servidores.filter(s => s.cargoId === cargoId && !cedido(s));
    const efetivos = pool.filter(s => s.regime === 'Estatutário' && dentro(s));
    const alvo = efetivos.length ? efetivos
      : pool.filter(dentro).length ? pool.filter(dentro)
        : pool.filter(s => s.regime === 'Estatutário').length ? pool.filter(s => s.regime === 'Estatutário') : pool;
    if (!alvo.length) return 0;
    return mean(alvo.map(s => custoServidor(st, s)));
  }

  function metodoItp(st, uId, cargoId) {
    const cfg = st.itpConfig[uId] || {};
    if (cfg.porCargo && cfg.porCargo[cargoId]) return cfg.porCargo[cargoId];
    return (st.itpCargo && st.itpCargo[cargoId]) || 'fixo';
  }


  function itpEfetivo(st, uId, cargoId, ano) {
    const met = metodoItp(st, uId, cargoId);
    if (met === 'calculado') {
      const c = itpCalculado(st, uId, cargoId, ano);
      if (c.itp != null) return { itp: c.itp, metodo: 'calculado', det: c };
    }
    return { itp: st.itpFixoMeio / 100, metodo: 'fixo', det: null };
  }

  // ITP finalística / meio: mediana dos ITPs calculados de todas as unidades
  function itpGlobais(st, ano) {
    const porFuncao = { Meio: [], Fim: [], 'Inovação': [] };
    st.unidades.forEach(u => {
      st.cargos.forEach(c => {
        const r = itpCalculado(st, u.id, c.id, ano);
        if (r.itp != null) (porFuncao[u.funcao] = porFuncao[u.funcao] || []).push(r.itp);
      });
    });
    return {
      meio: porFuncao.Meio.length ? median(porFuncao.Meio) : null,
      fim: porFuncao.Fim.length ? median(porFuncao.Fim) : null
    };
  }

  // ---------- horas efetivas e produtividade ----------
  // Horas efetivas mensais dedicadas a uma entrega por um cargo:
  // 1º produção individual; 2º histórico agregado; 3º cadastro da entrega.
  function horasEfetivas(st, uId, entregaId, cargoId, ano) {
    const itp = itpEfetivo(st, uId, cargoId, ano).itp;
    const hm = horasMensais(st, uId, cargoId);
    const porMes = new Map();
    st.producao.forEach(p => {
      if (p.unidadeId !== uId || p.cargoId !== cargoId) return;
      if (ano && !p.mes.startsWith(String(ano))) return;
      p.itens.forEach(i => {
        if (i.entregaId !== entregaId) return;
        porMes.set(p.mes, (porMes.get(p.mes) || 0) + i.percentual / 100 * hm * itp);
      });
    });
    if (porMes.size) return mean([...porMes.values()]);
    const hist = st.historico.filter(h => h.unidadeId === uId && h.entregaId === entregaId && h.cargoId === cargoId);
    if (hist.length) {
      const pct = median(hist.map(h => h.percentual));
      return qtdAtual(st, uId, cargoId) * hm * pct / 100 * itp;
    }
    const e = st.entregas.find(x => x.id === entregaId);
    const ce = e && e.cargos.find(c => c.cargoId === cargoId);
    if (ce) {
      const pct = percentualBruto(st, uId, entregaId, ano).valor;
      return ce.pessoas * hm * pct / 100 * itp;
    }
    return 0;
  }

  // Produtividade = volume médio mensal ÷ horas efetivas mensais [unid/hora efetiva]
  function produtividade(st, uId, entregaId, cargoId, ano) {
    const he = horasEfetivas(st, uId, entregaId, cargoId, ano);
    if (!he) return null;
    const serie = serieVolume(st, uId, { entregaId, cargoId });
    const doAno = serie.filter(p => !ano || p.mes.startsWith(String(ano)));
    const vm = mean((doAno.length ? doAno : serie).map(p => p.v));
    if (!vm) return null;
    return vm / he;
  }

  // Série mensal de produtividade (p/ direcionador histórico)
  function serieProdutividade(st, uId, cargoId) {
    const ents = entregasUnidade(st, uId).filter(e =>
      e.cargos.some(c => c.cargoId === cargoId) ||
      st.historico.some(h => h.unidadeId === uId && h.entregaId === e.id && h.cargoId === cargoId));
    const itp = itpEfetivo(st, uId, cargoId, null).itp;
    const hm = horasMensais(st, uId, cargoId);
    const meses = new Set();
    st.producao.forEach(p => { if (p.unidadeId === uId && p.cargoId === cargoId) meses.add(p.mes); });
    st.historico.forEach(h => { if (h.unidadeId === uId && h.cargoId === cargoId) meses.add(h.mes); });
    return [...meses].sort().map(mes => {
      let vol = 0, horas = 0;
      st.producao.forEach(p => {
        if (p.unidadeId !== uId || p.cargoId !== cargoId || p.mes !== mes) return;
        p.itens.forEach(i => { vol += i.volume; horas += i.percentual / 100 * hm * itp; });
      });
      st.historico.forEach(h => {
        if (h.unidadeId !== uId || h.cargoId !== cargoId || h.mes !== mes) return;
        vol += h.volume;
        horas += qtdAtual(st, uId, cargoId) * hm * h.percentual / 100 * itp / Math.max(1, ents.length ? 1 : 1);
      });
      return { mes, v: horas > 0 ? vol / horas : 0 };
    }).filter(p => p.v > 0);
  }

  // Produtividade de referência entre pares (média | mediana | máximo)
  function prodReferenciaPares(st, uId, entregaId, cargoId, criterio, ano) {
    const e = st.entregas.find(x => x.id === entregaId);
    const vals = [];
    const detalhe = [];
    const own = produtividade(st, uId, entregaId, cargoId, ano);
    if (own != null) { vals.push(own); detalhe.push({ unidadeId: uId, prod: own }); }
    unidadesPares(st, uId).forEach(u => {
      const eq = entregaEquivalente(st, u.id, e);
      if (!eq) return;
      const p = produtividade(st, u.id, eq.id, cargoId, ano);
      if (p != null) { vals.push(p); detalhe.push({ unidadeId: u.id, prod: p }); }
    });
    if (!vals.length) return { valor: null, detalhe };
    const f = { media: mean, mediana: median, maximo: max }[criterio] || median;
    return { valor: f(vals), detalhe };
  }

  // ---------- Esforço por Entrega ----------
  // esforço = tempo × volume (considera demanda não atendida), por cargo
  function esforco(st, uId, ano) {
    const pcts = percentuais(st, uId, ano);
    const linhas = entregasUnidade(st, uId).map(e => {
      const pct = pcts.porEntrega[e.id] ? pcts.porEntrega[e.id].normalizado : 0;
      const vol = volumeMedioMensal(st, uId, e.id, ano) || e.volumeMensal || 0;
      const reprimida = reprimidaMedia(st, uId, e.id, ano);
      const porCargo = e.cargos.map(c => {
        const volC = volumeMedioMensal(st, uId, e.id, ano, c.cargoId);
        return { cargoId: c.cargoId, pessoas: c.pessoas, volume: volC };
      });
      const somaVolC = sum(porCargo.map(c => c.volume)) || 1;
      porCargo.forEach(c => {
        const share = porCargo.length === 1 ? 1 : (c.volume ? c.volume / somaVolC : 1 / porCargo.length);
        c.reprimida = reprimida * share;
        c.esforco = pct / 100 * (c.volume + c.reprimida);
      });
      return { entrega: e, pct, volume: vol, reprimida, esforcoTotal: pct / 100 * (vol + reprimida), porCargo };
    });
    const total = sum(linhas.map(l => l.esforcoTotal)) || 1;
    linhas.forEach(l => { l.share = l.esforcoTotal / total * 100; });
    return { linhas, total };
  }

  // ---------- Projeções ----------
  function regressao(serie) {
    const n = serie.length;
    const xs = serie.map((_, i) => i), ys = serie.map(p => p.v);
    const mx = mean(xs), my = mean(ys);
    let num = 0, den = 0;
    xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
    const b = den ? num / den : 0, a = my - b * mx;
    const prev = xs.map(x => a + b * x);
    const ssRes = sum(ys.map((y, i) => (y - prev[i]) ** 2));
    const ssTot = sum(ys.map(y => (y - my) ** 2));
    return { a, b, r2: ssTot ? 1 - ssRes / ssTot : 0, sigma: Math.sqrt(ssRes / Math.max(1, n - 2)) };
  }

  function projetar(serie, metodo, hMeses, extra) {
    if (serie.length < 3) return null;
    const ys = serie.map(p => p.v);
    const ultimo = serie[serie.length - 1].mes;
    let fBase, sigma;
    if (metodo === 'manual') {
      // projeção informada pelo gestor: taxa de crescimento anual (%)
      const taxa = ((extra && extra.taxaAnual) || 0) / 100;
      const nivel = mean(ys.slice(-12));
      fBase = h => Math.max(0, nivel * Math.pow(1 + taxa, h / 12));
      sigma = std(ys.slice(-12)) * 0.6;
    } else if (metodo === 'regressaoLinear') {
      const r = regressao(serie);
      fBase = h => Math.max(0, r.a + r.b * (serie.length - 1 + h));
      sigma = r.sigma;
    } else if (metodo === 'suavizacao') {
      // Holt (suavização exponencial dupla)
      const alfa = 0.4, beta = 0.1;
      let nivel = ys[0], tend = ys.length > 1 ? ys[1] - ys[0] : 0;
      const erros = [];
      for (let i = 1; i < ys.length; i++) {
        const prev = nivel + tend;
        erros.push(ys[i] - prev);
        const nn = alfa * ys[i] + (1 - alfa) * (nivel + tend);
        tend = beta * (nn - nivel) + (1 - beta) * tend;
        nivel = nn;
      }
      fBase = h => Math.max(0, nivel + tend * h);
      sigma = std(erros);
    } else { // mediaMovel
      const janela = ys.slice(-Math.min(12, ys.length));
      const m = mean(janela);
      fBase = () => m;
      sigma = std(janela);
    }
    const z = 1.28; // ~80% de confiança
    const pontos = [];
    for (let h = 1; h <= hMeses; h++) {
      const base = fBase(h);
      pontos.push({
        mes: addMeses(ultimo, h), base,
        otimista: base + z * sigma * Math.sqrt(h / 12 + 0.2),
        pessimista: Math.max(0, base - z * sigma * Math.sqrt(h / 12 + 0.2))
      });
    }
    return { pontos, sigma, ultimoHistorico: ultimo };
  }

  // Recomendação com base na qualidade, volume, regularidade e consistência do histórico
  function recomendarMetodo(serie) {
    const n = serie.length;
    if (n < 12) return { metodo: 'mediaMovel', motivo: `Histórico curto (${n} meses < 12): a média móvel é mais robusta com poucos dados.` };
    const r = regressao(serie);
    const cv = mean(serie.map(p => p.v)) ? std(serie.map(p => p.v)) / mean(serie.map(p => p.v)) : 0;
    if (r.r2 >= 0.5) return { metodo: 'regressaoLinear', motivo: `Tendência consistente no histórico (R² = ${r.r2.toFixed(2)}): a regressão linear captura o crescimento.`, r2: r.r2 };
    if (cv <= 0.15) return { metodo: 'mediaMovel', motivo: `Série estável e regular (coef. de variação ${(cv * 100).toFixed(0)}%): a média móvel representa bem o nível.`, cv };
    return { metodo: 'suavizacao', motivo: `Série irregular sem tendência clara (R² = ${r.r2.toFixed(2)}, CV ${(cv * 100).toFixed(0)}%): a suavização exponencial amortece o ruído.`, r2: r.r2, cv };
  }

  // ---------- Fatores futuros: automação/IA e aposentadorias ----------
  // Potencial de automação da ENTREGA:
  // 1º) derivado das categorias de atividade (peso% × potencial da categoria, com evidência
  //     registrada na página de IA); 2º) valor manual {reducaoPct}; senão 0.
  // Potenciais da ENTREGA (derivados das categorias de atividade ou do valor manual):
  //  prod = % de redução do TEMPO por entrega · dem = % de redução do NÚMERO de entregas
  function potenciaisEntrega(st, entrega) {
    if (entrega && entrega.categoriasAtividade && entrega.categoriasAtividade.length) {
      let prod = 0, dem = 0;
      entrega.categoriasAtividade.forEach(c => {
        const cat = (st.categoriasIA || []).find(x => x.id === c.categoriaId);
        if (!cat) return;
        prod += c.peso / 100 * (cat.potProdutividade != null ? cat.potProdutividade : (cat.potencial || 0));
        dem += c.peso / 100 * (cat.potDemanda || 0);
      });
      return { prod, dem };
    }
    const a = (entrega && entrega.automacao) || {};
    return { prod: a.produtividadePct != null ? a.produtividadePct : (a.reducaoPct || 0), dem: a.demandaPct || 0 };
  }
  // efeito combinado no horizonte cheio (p/ exibição): 1 − (1−prod)(1−dem)
  function potencialAutomacaoEntrega(st, entrega) {
    const p = potenciaisEntrega(st, entrega);
    return Math.round((1 - (1 - p.prod / 100) * (1 - p.dem / 100)) * 100);
  }
  const horizonteAutomacao = entrega =>
    (entrega && entrega.automacao && entrega.automacao.horizonteAnos) || 5;

  // Fator aplicado à demanda projetada (rampa linear até o horizonte)
  function fatorAutomacao(st, entrega, anosHorizonte, tipo) {
    const p = potenciaisEntrega(st, entrega);
    const rampa = Math.min(1, anosHorizonte / horizonteAutomacao(entrega));
    const f = pct => Math.max(0, 1 - (pct / 100) * rampa);
    if (tipo === 'demanda') return f(p.dem);
    if (tipo === 'produtividade') return f(p.prod);
    return f(p.dem) * f(p.prod);
  }

  /* ---------- Matriz de otimização por CATEGORIA DE ATIVIDADE ----------
     Cada categoria vira um ponto. Para cada entrega que usa a categoria e cada cargo
     que atua nela, parte-se das HORAS EFETIVAS que o cargo gasta na entrega por mês
     (Σ dos servidores do cargo, já descontado o ITP). A fatia da categoria é o seu
     peso no cadastro da entrega:

       horas da categoria  = horas efetivas do cargo na entrega × peso da categoria
       eixo X (tempo)      = horas da categoria × potencial de PRODUTIVIDADE
                             (a mesma entrega passa a consumir menos tempo)
       eixo Y (demanda)    = horas da categoria × potencial de DEMANDA
                             (a entrega deixa de ser demandada)
       bolha (R$)          = horas liberadas no efeito combinado ÷ capacidade efetiva
                             de 1 servidor × custo médio daquele cargo → R$/mês → ×13 = R$/ano

     Ou seja: o eixo X já embute quantidade de servidores do cargo, tempo que o cargo
     dedica à entrega e quantos processos (entregas) a categoria atravessa. */
  function matrizCategorias(st, unidadeIds, ano) {
    const ids = unidadeIds ? [...unidadeIds] : st.unidades.map(u => u.id);
    const setIds = new Set(ids);
    const acc = new Map(); // categoriaId → agregados
    const pega = catId => {
      if (!acc.has(catId)) acc.set(catId, {
        categoriaId: catId, horasTotais: 0, horasProd: 0, horasDem: 0,
        horasCombinadas: 0, fte: 0, custoMensal: 0,
        entregas: new Set(), unidades: new Set(), cargos: new Set()
      });
      return acc.get(catId);
    };

    st.entregas.forEach(e => {
      if (!e.unidadeId || !setIds.has(e.unidadeId)) return;
      const cats = e.categoriasAtividade || [];
      if (!cats.length) return;
      const uId = e.unidadeId;
      // cargos que atuam na entrega: os do cadastro + os que lançaram produção/histórico
      const cargosEnt = [...new Set([
        ...(e.cargos || []).map(c => c.cargoId),
        ...st.producao.filter(p => p.unidadeId === uId && p.itens.some(i => i.entregaId === e.id)).map(p => p.cargoId),
        ...st.historico.filter(h => h.unidadeId === uId && h.entregaId === e.id).map(h => h.cargoId)
      ])].filter(Boolean);

      cargosEnt.forEach(cId => {
        const horas = horasEfetivas(st, uId, e.id, cId, ano);
        if (!horas) return;
        const capacidade = horasMensais(st, uId, cId) * itpEfetivo(st, uId, cId, ano).itp; // h efetivas / servidor
        const lot = lotacaoCargo(st, uId, cId);
        const custoUnit = lot && lot.quantidade ? lot.custoMensal / lot.quantidade : custoMedioCargo(st, cId, setIds);

        cats.forEach(link => {
          const cat = (st.categoriasIA || []).find(x => x.id === link.categoriaId);
          if (!cat) return;
          const pProd = (cat.potProdutividade != null ? cat.potProdutividade : (cat.potencial || 0)) / 100;
          const pDem = (cat.potDemanda || 0) / 100;
          const hCat = horas * (link.peso || 0) / 100;
          if (hCat <= 0) return;
          const hProd = hCat * pProd;
          const hDem = hCat * pDem;
          const hComb = hCat * (1 - (1 - pProd) * (1 - pDem)); // não somam duas vezes
          const r = pega(cat.id);
          r.horasTotais += hCat;
          r.horasProd += hProd;
          r.horasDem += hDem;
          r.horasCombinadas += hComb;
          if (capacidade > 0) {
            const fte = hComb / capacidade;
            r.fte += fte;
            r.custoMensal += fte * custoUnit;
          }
          r.entregas.add(e.id);
          r.unidades.add(uId);
          r.cargos.add(cId);
        });
      });
    });

    return [...acc.values()].map(r => {
      const cat = (st.categoriasIA || []).find(x => x.id === r.categoriaId);
      return {
        ...r,
        nome: cat ? cat.nome : r.categoriaId,
        potProdutividade: cat ? (cat.potProdutividade != null ? cat.potProdutividade : (cat.potencial || 0)) : 0,
        potDemanda: cat ? (cat.potDemanda || 0) : 0,
        evidencia: cat ? (cat.evidencia || '') : '',
        entregas: r.entregas.size, unidades: r.unidades.size, cargos: r.cargos.size,
        custoAnual: r.custoMensal * 13
      };
    }).sort((a, b) => b.custoAnual - a.custoAnual);
  }


  // ---------- Dimensionamento (déficit/superávit) ----------
  // Modos:
  //  'pares'     → produtividade de referência entre unidades pares (critério média/mediana/máx)
  //  'historico' → produtividade de referência da própria série histórica (critério)
  //  'esforco'   → esforço = tempo por entrega × volume entregue (com demanda não atendida),
  //                necessários = Σ esforço em horas ÷ disponibilidade do cargo (horas × ITP)
  // déficit/superávit = atuais − necessários
  // Projetado (1 a 5 anos): demanda futura × fator de automação/IA; quadro − aposentadorias previstas.
  function dimensionar(st, uId, cargoId, opts) {
    const { criterio = 'mediana', ano,
      metodoProjecao = 'auto', cenario = 'base' } = opts;
    const modo = opts.modo || (opts.usarPares ? 'pares' : opts.incluirReprimida ? 'esforco' : 'historico');
    const incluirReprimida = opts.incluirReprimida != null ? opts.incluirReprimida : modo === 'esforco';
    const ents = entregasUnidade(st, uId).filter(e =>
      e.cargos.some(c => c.cargoId === cargoId) ||
      st.producao.some(p => p.unidadeId === uId && p.cargoId === cargoId && p.itens.some(i => i.entregaId === e.id)) ||
      st.historico.some(h => h.unidadeId === uId && h.cargoId === cargoId && h.entregaId === e.id));
    const hm = horasMensais(st, uId, cargoId);
    const itp = itpEfetivo(st, uId, cargoId, ano);
    const linhas = [];
    let horasNecessarias = 0, demandaTotal = 0, prodRefs = [];

    ents.forEach(e => {
      let vol = volumeMedioMensal(st, uId, e.id, ano, cargoId);
      if (!vol) vol = volumeMedioMensal(st, uId, e.id, ano) || e.volumeMensal || 0;
      let demanda = vol;
      const reprimidaEnt = incluirReprimida ? reprimidaMedia(st, uId, e.id, ano) : 0;
      if (reprimidaEnt) {
        const volTotal = volumeMedioMensal(st, uId, e.id, ano) || e.volumeMensal || 1;
        demanda += reprimidaEnt * (vol / volTotal || 1); // reprimida rateada pela participação do cargo
      }
      let prodRef;
      const bench = (st.benchmarks || {})[uId + ':' + cargoId];
      if (criterio === 'benchmark' && bench && bench.valor) {
        prodRef = bench.valor; // referência externa definida/autorizada pela SEAP
      } else if (modo !== 'pares' && criterio === 'cargos') {
        // comparação entre CARGOS que atuam nas mesmas entregas da unidade
        const prods = (e.cargos || []).map(c => produtividade(st, uId, e.id, c.cargoId, ano)).filter(v => v != null);
        prodRef = prods.length ? median(prods) : produtividade(st, uId, e.id, cargoId, ano);
      } else if (modo === 'pares') {
        prodRef = prodReferenciaPares(st, uId, e.id, cargoId, criterio, ano).valor;
      } else if (modo === 'esforco') {
        // tempo por entrega da própria unidade (horas por unidade entregue), sem critério de referência
        prodRef = produtividade(st, uId, e.id, cargoId, ano);
      } else {
        const s = serieProdutividadeEntrega(st, uId, e.id, cargoId);
        if (!s.length) prodRef = produtividade(st, uId, e.id, cargoId, ano);
        else {
          const f = { media: mean, mediana: median, maximo: max }[criterio] || median;
          prodRef = f(s.map(p => p.v));
        }
      }
      if (!prodRef || !demanda) { linhas.push({ entrega: e, demanda, prodRef: prodRef || null, tempoUnit: null, horas: 0 }); return; }
      const horas = demanda / prodRef; // esforço em horas = tempo por entrega × volume
      horasNecessarias += horas;
      demandaTotal += demanda;
      prodRefs.push(prodRef);
      linhas.push({ entrega: e, demanda, prodRef, tempoUnit: 1 / prodRef, horas });
    });

    const necessarios = horasNecessarias / (hm * itp.itp);
    const atuais = qtdAtual(st, uId, cargoId);
    const saldo = atuais - necessarios;

    // projeção da demanda do cargo
    const serie = serieVolume(st, uId, { cargoId });
    const rec = serie.length >= 3 ? recomendarMetodo(serie) : null;
    const metodoUsado = metodoProjecao === 'auto' ? (rec ? rec.metodo : 'mediaMovel') : metodoProjecao;
    const extraProj = { taxaAnual: opts.taxaManual };
    // fator de automação do cargo = média das reduções das entregas, ponderada pelas horas
    const comHoras = linhas.filter(l => l.horas > 0);
    const totalHoras = sum(comHoras.map(l => l.horas));
    const fatorAutoCargo = (anos, tipo) => !totalHoras ? 1 :
      sum(comHoras.map(l => l.horas * fatorAutomacao(st, l.entrega, anos, tipo))) / totalHoras;

    // projeção completa até 5 anos; recortes ano a ano (média dos 12 meses de cada ano)
    const projCompleta = serie.length >= 3 ? projetar(serie, metodoUsado, 60, extraProj) : null;
    const nivelAtual = serie.length ? mean(serie.slice(-12).map(p => p.v)) : 0;
    const projetado = {};
    [1, 2, 3, 4, 5].forEach(anos => {
      if (!projCompleta) { projetado[anos] = null; return; }
      const doAno = projCompleta.pontos.slice((anos - 1) * 12, anos * 12).map(p => p[cenario]);
      const demandaProj = mean(doAno);
      const fator = demandaTotal > 0 && nivelAtual > 0 ? demandaProj / nivelAtual : 1;
      const fDem = fatorAutoCargo(anos, 'demanda');        // menos entregas demandadas
      const fProd = fatorAutoCargo(anos, 'produtividade');  // menos tempo por entrega
      const horasProj = horasNecessarias * fator * fDem * fProd;
      const necProj = horasProj / (hm * itp.itp);
      const apos = aposentadoriasPrevistas(st, uId, cargoId, anos);
      const atuaisProj = Math.max(0, atuais - apos);
      projetado[anos] = {
        ano: st.anoReferencia + anos,
        demanda: demandaProj * fDem, necessarios: necProj,
        atuais: atuaisProj, aposentadorias: apos,
        fatorAutomacao: fDem * fProd, fatorDemanda: fDem, fatorProdutividade: fProd,
        saldo: atuaisProj - necProj
      };
    });

    return {
      modo, linhas, demandaMensal: demandaTotal, prodRefMedia: prodRefs.length ? mean(prodRefs) : null,
      tempoUnitMedio: prodRefs.length ? mean(prodRefs.map(p => 1 / p)) : null,
      horasNecessarias, atuais, necessarios, saldo, itp, horasMensais: hm,
      custoMensal: (lotacaoCargo(st, uId, cargoId) || {}).custoMensal || 0,
      projetado, metodoProjecao: metodoUsado, recomendacao: rec,
      anual: { demanda: demandaTotal * 12, necessarios, saldo }
    };
  }

  // Série de produtividade mensal de UMA entrega p/ um cargo (base do critério média/mediana/máx)
  function serieProdutividadeEntrega(st, uId, entregaId, cargoId) {
    const itp = itpEfetivo(st, uId, cargoId, null).itp;
    const hm = horasMensais(st, uId, cargoId);
    const porMes = new Map();
    st.producao.forEach(p => {
      if (p.unidadeId !== uId || p.cargoId !== cargoId) return;
      p.itens.forEach(i => {
        if (i.entregaId !== entregaId) return;
        const r = porMes.get(p.mes) || { vol: 0, horas: 0 };
        r.vol += i.volume; r.horas += i.percentual / 100 * hm * itp;
        porMes.set(p.mes, r);
      });
    });
    st.historico.forEach(h => {
      if (h.unidadeId !== uId || h.cargoId !== cargoId || h.entregaId !== entregaId) return;
      const r = porMes.get(h.mes) || { vol: 0, horas: 0 };
      r.vol += h.volume; r.horas += qtdAtual(st, uId, cargoId) * hm * h.percentual / 100 * itp;
      porMes.set(h.mes, r);
    });
    return [...porMes.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1)
      .filter(([, r]) => r.horas > 0 && r.vol > 0)
      .map(([mes, r]) => ({ mes, v: r.vol / r.horas }));
  }

  // Dimensionamento agregado da UNIDADE (soma dos cargos)
  function dimensionarUnidade(st, uId, opts) {
    const linhas = [];
    lotacaoUnidade(st, uId).forEach(l => {
      try {
        const d = dimensionar(st, uId, l.cargoId, opts);
        if (d.necessarios > 0 || d.atuais > 0) linhas.push({ cargoId: l.cargoId, d });
      } catch (e) { /* cargo sem dados */ }
    });
    const tot = chave => sum(linhas.map(x => x.d[chave] || 0));
    const projetado = {};
    [1, 2, 3, 4, 5].forEach(h => {
      const ps = linhas.map(x => x.d.projetado[h]).filter(Boolean);
      if (!ps.length) { projetado[h] = null; return; }
      projetado[h] = {
        ano: st.anoReferencia + h,
        demanda: sum(ps.map(x => x.demanda || 0)),
        necessarios: sum(ps.map(x => x.necessarios || 0)),
        atuais: sum(ps.map(x => x.atuais || 0)),
        aposentadorias: sum(ps.map(x => x.aposentadorias || 0)),
        fatorAutomacao: ps.length ? mean(ps.map(x => x.fatorAutomacao || 1)) : 1,
        saldo: sum(ps.map(x => x.saldo || 0))
      };
    });
    return {
      linhas,
      demandaMensal: tot('demandaMensal'),
      horasNecessarias: tot('horasNecessarias'),
      atuais: tot('atuais'), necessarios: tot('necessarios'), saldo: tot('saldo'),
      custoMensal: tot('custoMensal'),
      anual: { demanda: tot('demandaMensal') * 12, necessarios: tot('necessarios'), saldo: tot('saldo') },
      projetado
    };
  }

  // Aposentadorias previstas ANO A ANO (não acumulado) no escopo de unidades
  function aposPorAno(st, unidadeIds) {
    const anos = [1, 2, 3, 4, 5].map(h => st.anoReferencia + h);
    const cont = {};
    anos.forEach(a => { cont[a] = 0; });
    st.servidores.forEach(s => {
      if (unidadeIds && !unidadeIds.has(s.unidadeId)) return;
      if (cedido(s)) return;
      const a = aposEstimada(st, s);
      if (a != null && cont[a] != null) cont[a]++;
    });
    return anos.map(a => ({ ano: a, qtd: cont[a] }));
  }

  return {
    SEMANAS_MES, sum, mean, median, max, std,
    fmtMes, addMeses, mesesDoAno,
    lotacaoUnidade, lotacaoCargo, jornada, horasMensais, qtdAtual, servidoresCargo, servidoresAtivos,
    cedido, recebido, cedidosCargo, recebidosCargo, temporariosCargo,
    absenteismoCargo, absenteismoAgregado, custoAbsenteismo, custoMedioCargo, diasAusenciaReg,
    paramsLrf, reajusteAno, fatorReajuste, rclAno, limitesLrf, situacaoLrf,
    salarioInicialCargo, custoIngresso, matrizCategorias,
    unidade, codigoPares, unidadesPares, entregasUnidade, entregaEquivalente,
    volumeMes, serieVolume, volumeMedioMensal, reprimidaMedia,
    percentuais, percentualBruto,
    itpCalculado, metodoItp, itpEfetivo, itpGlobais,
    horasEfetivas, produtividade, serieProdutividade, serieProdutividadeEntrega,
    prodReferenciaPares, esforco,
    projetar, recomendarMetodo, regressao, dimensionar, dimensionarUnidade, aposPorAno,
    fatorAutomacao, potenciaisEntrega, potencialAutomacaoEntrega, horizonteAutomacao,
    aposentadoriasPrevistas, aposEstimada, tempoServicoAnos, custoServidor, beneficioCargo
  };
})();


/* ===== charts.js ===== */
/* ============================================================
   DFT — Gráficos SVG (sem bibliotecas externas)
   Especificações: barras ≤24px c/ topo arredondado 4px e gap de 2px;
   linhas 2px c/ marcador final ≥8px e anel de 2px na cor da superfície;
   grade hairline sólida; legenda p/ ≥2 séries; tooltip; visão em tabela.
   ============================================================ */

const Charts = (() => {
  // Paleta categórica validada (ordem fixa, nunca ciclada) — Aurora: azul #1360d8, verde #0e9e6e
  const PALETA = ['#1360d8', '#1baf7a', '#eda100', '#0e9e6e', '#4a3aa7', '#e34948', '#e87ba4', '#eb6834'];
  const SUPERFICIE = '#ffffff';
  const GRADE = '#e7edf5';
  const TEXTO = '#3d4f5f';
  const TEXTO_FRACO = '#6b7b88';
  let gradSeq = 0;

  const fmtBR = (v, dec = 0) =>
    Number(v).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const fmtCompacto = v => {
    if (Math.abs(v) >= 1e6) return fmtBR(v / 1e6, 1) + ' mi';
    if (Math.abs(v) >= 1e4) return fmtBR(v / 1e3, 1) + ' mil';
    return fmtBR(v, Math.abs(v) < 10 && v !== Math.round(v) ? 1 : 0);
  };

  function ticks(maxV) {
    if (maxV <= 0) return [0, 1];
    const bruto = maxV / 3; // poucos ticks: visual minimalista
    const pot = Math.pow(10, Math.floor(Math.log10(bruto)));
    const passo = [1, 2, 5, 10].map(m => m * pot).find(p => maxV / p <= 4) || 10 * pot;
    const out = [0];
    // o último tick precisa cobrir o valor máximo, senão a marca estoura o topo
    while (out[out.length - 1] < maxV) out.push(out[out.length - 1] + passo);
    return out;
  }

  const svgEl = (tag, attrs) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };

  // ---------- tooltip compartilhado ----------
  let tip = null;
  function tooltip() {
    if (!tip) {
      tip = document.createElement('div');
      tip.className = 'chart-tooltip';
      tip.style.display = 'none';
      document.body.appendChild(tip);
    }
    return tip;
  }
  function mostraTip(html, ev) {
    const t = tooltip();
    t.innerHTML = html;
    t.style.display = 'block';
    const r = t.getBoundingClientRect();
    let x = ev.clientX + 14, y = ev.clientY - r.height - 10;
    if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - 14;
    if (y < 8) y = ev.clientY + 16;
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }
  function escondeTip() { if (tip) tip.style.display = 'none'; }

  // ---------- visão em tabela (canal de apoio obrigatório) ----------
  function visaoTabela(container, cabecalho, linhas) {
    const det = document.createElement('details');
    det.className = 'chart-table';
    det.innerHTML = '<summary>Ver dados em tabela</summary>';
    const tbl = document.createElement('table');
    tbl.innerHTML = '<thead><tr>' + cabecalho.map(h => `<th>${h}</th>`).join('') + '</tr></thead>' +
      '<tbody>' + linhas.map(l => '<tr>' + l.map((c, i) =>
        `<td class="${i > 0 ? 'num' : ''}">${c}</td>`).join('') + '</tr>').join('') + '</tbody>';
    det.appendChild(tbl);
    container.appendChild(det);
  }

  // ---------- gráfico de barras (colunas) ----------
  // categorias: [{label, valor, corIdx?}]  — 1 série nominal = mesma cor (slot 1)
  function bar(container, { categorias, fmt = fmtCompacto, unidadeY = '', altura = 300 }) {
    container.innerHTML = '';
    const W = 720, H = altura, mL = 52, mR = 16, mT = 18, mB = 42;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' });
    const maxV = Math.max(...categorias.map(c => c.valor), 0);
    const ts = ticks(maxV);
    const yMax = ts[ts.length - 1] || 1;
    const y = v => mT + (H - mT - mB) * (1 - v / yMax);
    const plotW = W - mL - mR;
    const banda = plotW / categorias.length;
    const larg = Math.min(24, banda * 0.55);

    ts.forEach(t => {
      svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(t), y2: y(t), stroke: GRADE, 'stroke-width': 1 }));
      const lb = svgEl('text', { x: mL - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' });
      lb.textContent = fmtCompacto(t);
      svg.appendChild(lb);
    });

    categorias.forEach((c, i) => {
      const cor = PALETA[(c.corIdx != null ? c.corIdx : 0) % PALETA.length];
      const x = mL + banda * i + (banda - larg) / 2;
      const y0 = y(0), y1 = y(c.valor);
      const h = Math.max(0, y0 - y1);
      const r = Math.min(4, h);
      // topo arredondado 4px, base reta
      const path = `M ${x} ${y0} L ${x} ${y1 + r} Q ${x} ${y1} ${x + r} ${y1} L ${x + larg - r} ${y1} Q ${x + larg} ${y1} ${x + larg} ${y1 + r} L ${x + larg} ${y0} Z`;
      const barra = svgEl('path', { d: path, fill: cor, class: 'bar-mark' });
      svg.appendChild(barra);
      // valor no topo da coluna
      const vl = svgEl('text', { x: x + larg / 2, y: y1 - 6, 'text-anchor': 'middle', class: 'val' });
      vl.textContent = fmt(c.valor);
      svg.appendChild(vl);
      // rótulo da categoria (limite proporcional à largura da banda)
      const maxChar = Math.max(12, Math.floor(banda / 7));
      const cl = svgEl('text', { x: x + larg / 2, y: H - mB + 16, 'text-anchor': 'middle', class: 'tick' });
      cl.textContent = c.label.length > maxChar ? c.label.slice(0, maxChar - 1) + '…' : c.label;
      svg.appendChild(cl);
      if (c.sub) {
        const sl = svgEl('text', { x: x + larg / 2, y: H - mB + 30, 'text-anchor': 'middle', class: 'tick sub' });
        sl.textContent = c.sub;
        svg.appendChild(sl);
      }
      // alvo de hover maior que a marca
      const hit = svgEl('rect', { x: mL + banda * i, y: mT, width: banda, height: H - mT - mB, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => mostraTip(
        `<strong>${c.label}</strong>${c.sub ? ' · ' + c.sub : ''}<br>${fmt(c.valor)} ${unidadeY}`, ev));
      hit.addEventListener('mouseleave', escondeTip);
      svg.appendChild(hit);
    });

    svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(0), y2: y(0), stroke: '#c9d3db', 'stroke-width': 1 }));
    container.appendChild(svg);
    visaoTabela(container, ['Categoria', unidadeY || 'Valor'],
      categorias.map(c => [c.label + (c.sub ? ' (' + c.sub + ')' : ''), fmt(c.valor)]));
  }

  // ---------- gráfico waterfall (cascata) ----------
  // passos: [{label, valor, tipo, partes?}] — tipo 'inicio' | 'delta' | 'fim'.
  // 'inicio'/'fim' são barras cheias a partir do zero; 'delta' flutua sobre o acumulado
  // (valor negativo = reduz a necessidade, positivo = aumenta). Um 'delta' com `partes`
  // (ex.: a etapa 1, que soma absenteísmo + produtividade) é desenhado empilhado.
  function waterfall(container, { passos, fmt = fmtCompacto, unidadeY = '', altura = 320 }) {
    container.innerHTML = '';
    const nomesLeg = [...new Set(passos.flatMap(p => (p.partes || []).map(x => x.nome)))];
    const W = 720, H = altura + (nomesLeg.length ? 18 : 0), mL = 52, mR = 16, mT = 26,
      mB = 58 + (nomesLeg.length ? 18 : 0);
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' });

    // acumulado de cada passo (base e topo da barra)
    let acc = 0;
    const barras = passos.map(p => {
      let de, para;
      if (p.tipo === 'delta') { de = acc; para = acc + p.valor; acc = para; }
      else { de = 0; para = p.tipo === 'fim' ? acc : p.valor; if (p.tipo === 'inicio') acc = p.valor; }
      return { ...p, de, para, alturaVal: Math.abs(para - de) };
    });
    const maxV = Math.max(...barras.map(b => Math.max(b.de, b.para)), 0);
    const ts = ticks(maxV);
    const yMax = ts[ts.length - 1] || 1;
    const y = v => mT + (H - mT - mB) * (1 - v / yMax);
    const plotW = W - mL - mR;
    const banda = plotW / barras.length;
    const larg = Math.min(46, banda * 0.6);

    ts.forEach(t => {
      svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(t), y2: y(t), stroke: GRADE, 'stroke-width': 1 }));
      const lb = svgEl('text', { x: mL - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' });
      lb.textContent = fmtCompacto(t);
      svg.appendChild(lb);
    });

    const COR = { inicio: '#1360d8', fim: '#4a3aa7', reduz: '#1baf7a', aumenta: '#e34948' };
    const CORES_PARTE = ['#1baf7a', '#0e9e6e', '#eda100', '#4a3aa7'];
    const corParte = nome => CORES_PARTE[nomesLeg.indexOf(nome) % CORES_PARTE.length];
    barras.forEach((b, i) => {
      const cor = b.cor || (b.tipo === 'inicio' ? COR.inicio : b.tipo === 'fim' ? COR.fim
        : b.valor <= 0 ? COR.reduz : COR.aumenta);
      const x = mL + banda * i + (banda - larg) / 2;
      const yTopo = y(Math.max(b.de, b.para));
      const alt = Math.max(1.5, Math.abs(y(b.de) - y(b.para)));
      const partes = (b.partes || []).filter(p => Math.abs(p.valor) > 1e-9);
      if (b.tipo === 'delta' && partes.length > 1) {
        // barra da etapa aberta nas suas dimensões (ex.: absenteísmo + produtividade)
        let acc2 = Math.max(b.de, b.para);
        partes.forEach(p => {
          const h2 = Math.abs(y(acc2) - y(acc2 - Math.abs(p.valor)));
          svg.appendChild(svgEl('rect', {
            x, y: y(acc2), width: larg, height: Math.max(1, h2), rx: 2,
            fill: corParte(p.nome), class: 'bar-mark'
          }));
          acc2 -= Math.abs(p.valor);
        });
      } else {
        svg.appendChild(svgEl('rect', { x, y: yTopo, width: larg, height: alt, rx: 3, fill: cor, class: 'bar-mark' }));
      }
      // conector até a próxima barra
      if (i < barras.length - 1) {
        const yc = y(b.para);
        svg.appendChild(svgEl('line', {
          x1: x, x2: mL + banda * (i + 1) + (banda + larg) / 2 - larg, y1: yc, y2: yc,
          stroke: '#b8c6d2', 'stroke-width': 1, 'stroke-dasharray': '3 3'
        }));
      }
      const vl = svgEl('text', { x: x + larg / 2, y: yTopo - 7, 'text-anchor': 'middle', class: 'val' });
      vl.textContent = (b.tipo === 'delta' && b.valor < 0 ? '−' : b.tipo === 'delta' && b.valor > 0 ? '+' : '') +
        fmt(Math.abs(b.tipo === 'delta' ? b.valor : b.para));
      svg.appendChild(vl);
      // rótulo em até duas linhas
      const maxChar = Math.max(10, Math.floor(banda / 6.2));
      const palavras = String(b.label).split(' ');
      const linhas = [''];
      palavras.forEach(p => {
        if ((linhas[linhas.length - 1] + ' ' + p).trim().length > maxChar && linhas.length < 2) linhas.push(p);
        else linhas[linhas.length - 1] = (linhas[linhas.length - 1] + ' ' + p).trim();
      });
      linhas.forEach((ln, k) => {
        const cl = svgEl('text', { x: x + larg / 2, y: H - mB + 18 + k * 13, 'text-anchor': 'middle', class: 'tick' });
        cl.textContent = ln.length > maxChar + 2 ? ln.slice(0, maxChar + 1) + '…' : ln;
        svg.appendChild(cl);
      });
      const hit = svgEl('rect', { x: mL + banda * i, y: mT, width: banda, height: H - mT - mB, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => mostraTip(
        `<strong>${b.label}</strong><br>${b.tipo === 'delta' ? (b.valor < 0 ? 'reduz ' : 'aumenta ') + fmt(Math.abs(b.valor)) : fmt(b.para)} ${unidadeY}` +
        (partes.length > 1 ? '<br>' + partes.map(p => `${p.nome}: ${fmt(Math.abs(p.valor))}`).join('<br>') : '') +
        (b.tipo === 'delta' ? `<br>acumulado: ${fmt(b.para)}` : '') + (b.nota ? `<br><span class="mini">${b.nota}</span>` : ''), ev));
      hit.addEventListener('mouseleave', escondeTip);
      svg.appendChild(hit);
    });

    // legenda das dimensões abertas dentro de uma etapa
    if (nomesLeg.length) {
      let lx = mL;
      nomesLeg.forEach(n => {
        svg.appendChild(svgEl('rect', { x: lx, y: H - 16, width: 9, height: 9, rx: 2, fill: corParte(n) }));
        const t = svgEl('text', { x: lx + 13, y: H - 8, class: 'tick' });
        t.textContent = n;
        svg.appendChild(t);
        lx += 24 + String(n).length * 6.1;
      });
    }

    svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(0), y2: y(0), stroke: '#c9d3db', 'stroke-width': 1 }));
    container.appendChild(svg);
    visaoTabela(container, ['Etapa', unidadeY || 'Valor', 'Acumulado'],
      barras.flatMap(b => {
        const linha = [b.label, (b.tipo === 'delta' && b.valor < 0 ? '−' : b.tipo === 'delta' && b.valor > 0 ? '+' : '') +
          fmt(Math.abs(b.tipo === 'delta' ? b.valor : b.para)), fmt(b.para)];
        const sub = (b.partes || []).filter(p => Math.abs(p.valor) > 1e-9)
          .map(p => ['   · ' + p.nome, '−' + fmt(Math.abs(p.valor)), '']);
        return sub.length > 1 ? [linha, ...sub] : [linha];
      }));
  }

  // ---------- colunas empilhadas ----------
  // categorias: [{label, partes: [{nome, valor}]}] — a ordem das séries define a cor
  function barStack(container, { categorias, series, fmt = fmtCompacto, unidadeY = '', altura = 300 }) {
    container.innerHTML = '';
    const W = 720, mL = 56, mR = 16, mT = 18;
    // a legenda quebra em várias linhas quando os nomes são longos (senão vazava do gráfico)
    const nomesLeg = series || [...new Set(categorias.flatMap(c => c.partes.map(p => p.nome)))];
    const largItem = n => 22 + String(n).length * 6.1;
    const linhasLeg = [[]];
    let usado = 0;
    nomesLeg.forEach(n => {
      const l = largItem(n);
      if (usado + l > W - mL - mR && linhasLeg[linhasLeg.length - 1].length) { linhasLeg.push([]); usado = 0; }
      linhasLeg[linhasLeg.length - 1].push(n); usado += l;
    });
    const mB = 40 + linhasLeg.length * 16;
    const H = altura + (linhasLeg.length - 1) * 16;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' });
    const totais = categorias.map(c => c.partes.reduce((a, p) => a + (p.valor || 0), 0));
    const ts = ticks(Math.max(...totais, 0));
    const yMax = ts[ts.length - 1] || 1;
    const y = v => mT + (H - mT - mB) * (1 - v / yMax);
    const plotW = W - mL - mR;
    const banda = plotW / Math.max(1, categorias.length);
    const larg = Math.min(38, banda * 0.55);
    const nomes = nomesLeg;
    const corDe = nome => PALETA[nomes.indexOf(nome) % PALETA.length];

    ts.forEach(t => {
      svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(t), y2: y(t), stroke: GRADE, 'stroke-width': 1 }));
      const lb = svgEl('text', { x: mL - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' });
      lb.textContent = fmtCompacto(t);
      svg.appendChild(lb);
    });

    categorias.forEach((c, i) => {
      const x = mL + banda * i + (banda - larg) / 2;
      let acc = 0;
      c.partes.filter(p => p.valor > 0).forEach(p => {
        const y0 = y(acc), y1 = y(acc + p.valor);
        svg.appendChild(svgEl('rect', { x, y: y1, width: larg, height: Math.max(1, y0 - y1), fill: corDe(p.nome), class: 'bar-mark' }));
        acc += p.valor;
      });
      const vl = svgEl('text', { x: x + larg / 2, y: y(acc) - 6, 'text-anchor': 'middle', class: 'val' });
      vl.textContent = fmt(acc);
      svg.appendChild(vl);
      const maxChar = Math.max(8, Math.floor(banda / 6.5));
      const cl = svgEl('text', { x: x + larg / 2, y: H - mB + 18, 'text-anchor': 'middle', class: 'tick' });
      cl.textContent = c.label.length > maxChar ? c.label.slice(0, maxChar - 1) + '…' : c.label;
      svg.appendChild(cl);
      const hit = svgEl('rect', { x: mL + banda * i, y: mT, width: banda, height: H - mT - mB, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => mostraTip(`<strong>${c.label}</strong><br>` +
        c.partes.filter(p => p.valor > 0).map(p => `${p.nome}: ${fmt(p.valor)}`).join('<br>') +
        `<br><strong>total: ${fmt(acc)}</strong> ${unidadeY}`, ev));
      hit.addEventListener('mouseleave', escondeTip);
      svg.appendChild(hit);
    });

    // legenda (uma ou mais linhas, alinhadas à esquerda do plot)
    const leg = svgEl('g', {});
    const yBase = H - 8 - (linhasLeg.length - 1) * 16;
    linhasLeg.forEach((linha, li) => {
      let lx = mL;
      const ly = yBase + li * 16;
      linha.forEach(n => {
        leg.appendChild(svgEl('rect', { x: lx, y: ly - 8, width: 9, height: 9, rx: 2, fill: corDe(n) }));
        const t = svgEl('text', { x: lx + 13, y: ly, class: 'tick' });
        t.textContent = n;
        leg.appendChild(t);
        lx += largItem(n);
      });
    });
    svg.appendChild(leg);
    svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(0), y2: y(0), stroke: '#c9d3db', 'stroke-width': 1 }));
    container.appendChild(svg);
    visaoTabela(container, ['Categoria', ...nomes, 'Total'],
      categorias.map((c, i) => [c.label, ...nomes.map(n => {
        const p = c.partes.find(x => x.nome === n);
        return fmt(p ? p.valor : 0);
      }), fmt(totais[i])]));
  }

  // ---------- gráfico de linhas ----------
  // series: [{nome, pontos: [{x, y}], corIdx, tracejada?}]; eixo X = rótulos ordenados
  function line(container, { series, fmt = fmtCompacto, unidadeY = '', divisorX = null, altura = 300, fmtX = x => x }) {
    container.innerHTML = '';
    const xs = [...new Set(series.flatMap(s => s.pontos.map(p => p.x)))].sort();
    if (!xs.length) { container.innerHTML = '<p class="vazio">Sem dados para exibir.</p>'; return; }
    const W = 720, H = altura, mL = 52, mR = 20, mT = 16, mB = 30;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' });
    const maxV = Math.max(...series.flatMap(s => s.pontos.map(p => p.y)), 0);
    const ts = ticks(maxV);
    const yMax = ts[ts.length - 1] || 1;
    const y = v => mT + (H - mT - mB) * (1 - v / yMax);
    const x = i => mL + (W - mL - mR) * (xs.length === 1 ? 0.5 : i / (xs.length - 1));

    ts.forEach(t => {
      svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(t), y2: y(t), stroke: GRADE, 'stroke-width': 1 }));
      const lb = svgEl('text', { x: mL - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' });
      lb.textContent = fmtCompacto(t);
      svg.appendChild(lb);
    });
    const passoX = Math.max(1, Math.ceil(xs.length / 8));
    xs.forEach((xv, i) => {
      const ultimo = i === xs.length - 1;
      if (!ultimo && (i % passoX !== 0 || xs.length - 1 - i < passoX * 0.6)) return; // evita colisão com o último rótulo
      const lb = svgEl('text', { x: x(i), y: H - mB + 18, 'text-anchor': 'middle', class: 'tick' });
      lb.textContent = fmtX(xv);
      svg.appendChild(lb);
    });

    // divisor histórico → projeção
    if (divisorX != null) {
      const di = xs.indexOf(divisorX);
      if (di >= 0) {
        svg.appendChild(svgEl('line', { x1: x(di), x2: x(di), y1: mT, y2: H - mB, stroke: '#b6c2cc', 'stroke-width': 1 }));
        const lb = svgEl('text', { x: x(di) + 5, y: mT + 10, class: 'tick sub' });
        lb.textContent = 'projeção →';
        svg.appendChild(lb);
      }
    }

    series.forEach((s, si) => {
      const cor = s.cor || PALETA[(s.corIdx != null ? s.corIdx : si) % PALETA.length];
      const pts = s.pontos.filter(p => p.y != null).map(p => ({ i: xs.indexOf(p.x), y: p.y }))
        .filter(p => p.i >= 0).sort((a, b) => a.i - b.i);
      if (!pts.length) return;
      const d = pts.map((p, i) => `${i ? 'L' : 'M'} ${x(p.i).toFixed(1)} ${y(p.y).toFixed(1)}`).join(' ');
      // preenchimento em área (degradê suave) sob a série, estilo Aurora
      if (s.area) {
        const gid = 'grad-area-' + (++gradSeq);
        const defs = svgEl('defs', {});
        defs.innerHTML = `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${cor}" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="${cor}" stop-opacity="0"/></linearGradient>`;
        svg.appendChild(defs);
        const dArea = d + ` L ${x(pts[pts.length - 1].i).toFixed(1)} ${(H - mB).toFixed(1)} L ${x(pts[0].i).toFixed(1)} ${(H - mB).toFixed(1)} Z`;
        svg.appendChild(svgEl('path', { d: dArea, fill: `url(#${gid})` }));
      }
      svg.appendChild(svgEl('path', {
        d, fill: 'none', stroke: cor, 'stroke-width': s.tracejada ? 2.2 : 2.6,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        'stroke-dasharray': s.tracejada ? '5 4' : 'none'
      }));
      // pontos marcados da projeção (bolinha branca com contorno)
      if (s.tracejada) pts.forEach(p =>
        svg.appendChild(svgEl('circle', { cx: x(p.i), cy: y(p.y), r: 2.7, fill: SUPERFICIE, stroke: cor, 'stroke-width': 1.8 })));
      // marcador no fim da série, com anel de 2px na cor da superfície
      const fim = pts[pts.length - 1];
      svg.appendChild(svgEl('circle', { cx: x(fim.i), cy: y(fim.y), r: 6, fill: SUPERFICIE }));
      svg.appendChild(svgEl('circle', { cx: x(fim.i), cy: y(fim.y), r: 4, fill: cor }));
      // rótulos de dados seletivos: fim da série e, na série única, também máximo e mínimo
      const rotula = (p, anchorTopo) => {
        const naBorda = x(p.i) > W - 80;
        const lb = svgEl('text', {
          x: naBorda ? x(p.i) - 10 : x(p.i) + 9,
          y: y(p.y) + (anchorTopo ? -8 : 4),
          class: 'val', 'text-anchor': naBorda ? 'end' : 'start'
        });
        lb.textContent = fmt(p.y);
        svg.appendChild(lb);
      };
      if (series.length <= 4 && fim.i === xs.length - 1) rotula(fim, x(fim.i) > W - 80);
      if (series.length === 1 && pts.length > 4) {
        const pMax = pts.reduce((a, b) => (b.y > a.y ? b : a));
        const pMin = pts.reduce((a, b) => (b.y < a.y ? b : a));
        [pMax, pMin].forEach(p => {
          if (Math.abs(p.i - fim.i) < 3) return; // evita colisão com o rótulo do último ponto
          svg.appendChild(svgEl('circle', { cx: x(p.i), cy: y(p.y), r: 5, fill: SUPERFICIE }));
          svg.appendChild(svgEl('circle', { cx: x(p.i), cy: y(p.y), r: 3, fill: cor }));
          rotula(p, p === pMax);
        });
      }
    });

    // camada de hover: crosshair + tooltip no x mais próximo
    const cross = svgEl('line', { x1: 0, x2: 0, y1: mT, y2: H - mB, stroke: '#9fb0bd', 'stroke-width': 1, visibility: 'hidden' });
    svg.appendChild(cross);
    const hit = svgEl('rect', { x: mL, y: mT, width: W - mL - mR, height: H - mT - mB, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * (W / rect.width);
      const i = Math.max(0, Math.min(xs.length - 1, Math.round((px - mL) / ((W - mL - mR) / Math.max(1, xs.length - 1)))));
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i));
      cross.setAttribute('visibility', 'visible');
      const linhas = series.map((s, si) => {
        const p = s.pontos.find(q => q.x === xs[i]);
        if (!p || p.y == null) return '';
        const cor = s.cor || PALETA[(s.corIdx != null ? s.corIdx : si) % PALETA.length];
        return `<span class="chip" style="background:${cor}"></span>${s.nome}: <strong>${fmt(p.y)}</strong>`;
      }).filter(Boolean).join('<br>');
      if (linhas) mostraTip(`<strong>${fmtX(xs[i])}</strong><br>${linhas}`, ev);
    });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('visibility', 'hidden'); escondeTip(); });
    svg.appendChild(hit);

    container.appendChild(svg);

    // legenda (sempre presente p/ ≥ 2 séries)
    if (series.length >= 2) {
      const leg = document.createElement('div');
      leg.className = 'chart-legend';
      series.forEach((s, si) => {
        const cor = s.cor || PALETA[(s.corIdx != null ? s.corIdx : si) % PALETA.length];
        const item = document.createElement('span');
        item.innerHTML = `<span class="chip" style="background:${cor}"></span>${s.nome}`;
        leg.appendChild(item);
      });
      container.appendChild(leg);
    }

    visaoTabela(container, ['Período', ...series.map(s => s.nome)],
      xs.map(xv => [fmtX(xv), ...series.map(s => {
        const p = s.pontos.find(q => q.x === xv);
        return p && p.y != null ? fmt(p.y) : '—';
      })]));
  }

  // ---------- barras horizontais (com linha de referência) ----------
  // categorias: [{label, sub?, valor, cor?}]; referencia: {valor, rotulo}
  function barH(container, { categorias, referencia = null, fmt = fmtCompacto, unidadeY = '', maxEscala = null }) {
    container.innerHTML = '';
    // rótulo longo estourava a margem fixa e invadia o card vizinho:
    // corta em 26 caracteres e dimensiona a margem esquerda pelo maior rótulo
    const MAX_CH = 26;
    categorias = categorias.map(c => ({
      ...c, labelCheio: c.label,
      label: String(c.label).length > MAX_CH ? String(c.label).slice(0, MAX_CH - 1) + '…' : String(c.label)
    }));
    const maiorRotulo = Math.max(6, ...categorias.map(c => c.label.length));
    const W = 720, linhaH = 40, mL = Math.min(228, Math.max(92, Math.round(maiorRotulo * 6.4) + 12)),
      mR = 64, mT = referencia ? 22 : 10, mB = 8;
    const H = mT + mB + categorias.length * linhaH;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' });
    // escala nunca zerada: com todos os valores em 0 a divisão viraria NaN
    const maxV = Math.max(maxEscala || 0, ...categorias.map(c => c.valor), referencia ? referencia.valor * 1.15 : 0) || 1;
    const x = v => mL + (W - mL - mR) * (v / maxV);

    categorias.forEach((c, i) => {
      const cy = mT + linhaH * i + linhaH / 2;
      const cor = c.cor || PALETA[0];
      const larg = Math.max(0, x(c.valor) - mL);
      const alt = 16, r = Math.min(4, larg);
      // barra com ponta arredondada (dados), base reta
      const path = `M ${mL} ${cy - alt / 2} L ${mL + larg - r} ${cy - alt / 2} Q ${mL + larg} ${cy - alt / 2} ${mL + larg} ${cy - alt / 2 + r} L ${mL + larg} ${cy + alt / 2 - r} Q ${mL + larg} ${cy + alt / 2} ${mL + larg - r} ${cy + alt / 2} L ${mL} ${cy + alt / 2} Z`;
      svg.appendChild(svgEl('path', { d: path, fill: cor, class: 'bar-mark' }));
      const rl = svgEl('text', { x: mL - 8, y: cy + 4, 'text-anchor': 'end', class: 'val' });
      rl.textContent = c.label;
      svg.appendChild(rl);
      const vl = svgEl('text', { x: mL + larg + 8, y: cy + 4, class: 'val' });
      vl.textContent = fmt(c.valor);
      svg.appendChild(vl);
      const hit = svgEl('rect', { x: 0, y: cy - linhaH / 2, width: W, height: linhaH, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => mostraTip(
        `<strong>${c.labelCheio || c.label}</strong>${c.sub ? ' · ' + c.sub : ''}<br>${fmt(c.valor)} ${unidadeY}`, ev));
      hit.addEventListener('mouseleave', escondeTip);
      svg.appendChild(hit);
    });

    if (referencia) {
      const rx = x(referencia.valor);
      svg.appendChild(svgEl('line', { x1: rx, x2: rx, y1: mT - 4, y2: H - mB, stroke: '#9fb0bd', 'stroke-width': 1 }));
      const lb = svgEl('text', { x: rx, y: mT - 8, 'text-anchor': 'middle', class: 'tick sub' });
      lb.textContent = referencia.rotulo;
      svg.appendChild(lb);
    }
    container.appendChild(svg);
    visaoTabela(container, ['Categoria', unidadeY || 'Valor'],
      categorias.map(c => [(c.labelCheio || c.label) + (c.sub ? ' (' + c.sub + ')' : ''), fmt(c.valor)]));
  }

  // ---------- bolhas em quadrantes (matriz X × Y, bolha = 3ª medida) ----------
  // pontos: [{x, y, tam, label, cor, grupo, sub?}]
  // Escalas: por padrão 0–100% (compatível com a matriz de carreiras); passando
  // maxX/maxY o eixo assume qualquer unidade (horas, R$…). Os quadrantes sempre
  // dividem no meio da escala — alto/baixo é relativo ao maior ponto do gráfico.
  function bubble(container, {
    pontos, xLabel, yLabel, grupos = [], fmt = v => fmtBR(v, 0) + '%',
    maxX = 100, maxY = 100, fmtX = null, fmtY = null, fmtTam = null,
    rotuloX = 'Potencial de otimização', rotuloY = 'Volume do quadro', rotuloTam = 'servidores',
    colunas = null, linhaTabela = null, altura = 420
  }) {
    container.innerHTML = '';
    const fX = fmtX || fmt, fY = fmtY || fmt, fT = fmtTam || (v => fmtBR(v, 0));
    const W = 720, H = altura, mL = 64, mR = 26, mT = 18, mB = 46;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' });
    const escX = maxX > 0 ? maxX : 1, escY = maxY > 0 ? maxY : 1;
    const x = v => mL + (W - mL - mR) * (v / escX);
    const y = v => mT + (H - mT - mB) * (1 - v / escY);
    const marcas = (max, pct) => pct ? [0, 25, 50, 75, 100] : ticks(max);

    marcas(escY, maxY === 100).forEach(t => {
      if (t > escY) return;
      svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(t), y2: y(t), stroke: GRADE, 'stroke-width': 1 }));
      const ly = svgEl('text', { x: mL - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' });
      ly.textContent = fY(t);
      svg.appendChild(ly);
    });
    marcas(escX, maxX === 100).forEach(t => {
      if (t > escX) return;
      const lx = svgEl('text', { x: x(t), y: H - mB + 18, 'text-anchor': 'middle', class: 'tick' });
      lx.textContent = fX(t);
      svg.appendChild(lx);
    });
    // divisões dos quadrantes (meio da escala)
    svg.appendChild(svgEl('line', { x1: x(escX / 2), x2: x(escX / 2), y1: mT, y2: H - mB, stroke: '#c3cfda', 'stroke-width': 1 }));
    svg.appendChild(svgEl('line', { x1: mL, x2: W - mR, y1: y(escY / 2), y2: y(escY / 2), stroke: '#c3cfda', 'stroke-width': 1 }));

    const maxTam = Math.max(...pontos.map(p => p.tam), 1);
    const rotulos = []; // caixas já ocupadas, p/ desviar rótulos que colidem
    pontos.forEach(p => {
      const r = 7 + 15 * Math.sqrt(Math.max(0, p.tam) / maxTam);
      svg.appendChild(svgEl('circle', { cx: x(p.x), cy: y(p.y), r: r + 2, fill: SUPERFICIE }));
      const b = svgEl('circle', { cx: x(p.x), cy: y(p.y), r, fill: p.cor, 'fill-opacity': .82 });
      b.addEventListener('mousemove', ev => mostraTip(
        `<strong>${p.label}</strong><br>${rotuloX}: <strong>${fX(p.x)}</strong><br>` +
        `${rotuloY}: <strong>${fY(p.y)}</strong><br>${rotuloTam}: <strong>${fT(p.tam)}</strong>` +
        (p.sub ? `<br>${p.sub}` : '') + (p.grupo ? `<br>${p.grupo}` : ''), ev));
      b.addEventListener('mouseleave', escondeTip);
      svg.appendChild(b);
      const naBorda = x(p.x) > W - 150;
      const lx = naBorda ? x(p.x) - r - 5 : x(p.x) + r + 5;
      const largura = p.label.length * 6.4;
      let ly = y(p.y) + 4;
      // desvia verticalmente enquanto colidir com um rótulo já posicionado
      const colide = () => rotulos.some(q =>
        Math.abs(q.y - ly) < 14 && (naBorda ? lx - largura : lx) < q.x2 && (naBorda ? lx : lx + largura) > q.x1);
      for (let tent = 0; colide() && tent < 6; tent++) ly += 15;
      rotulos.push({ x1: naBorda ? lx - largura : lx, x2: naBorda ? lx : lx + largura, y: ly });
      const lb = svgEl('text', { x: lx, y: ly, class: 'val', 'text-anchor': naBorda ? 'end' : 'start' });
      lb.textContent = p.label;
      svg.appendChild(lb);
    });

    const xl = svgEl('text', { x: (mL + W - mR) / 2, y: H - 8, 'text-anchor': 'middle', class: 'tick' });
    xl.textContent = xLabel;
    svg.appendChild(xl);
    const yl = svgEl('text', { x: 14, y: (mT + H - mB) / 2, 'text-anchor': 'middle', class: 'tick', transform: `rotate(-90 14 ${(mT + H - mB) / 2})` });
    yl.textContent = yLabel;
    svg.appendChild(yl);
    container.appendChild(svg);

    if (grupos.length) {
      const leg = document.createElement('div');
      leg.className = 'chart-legend';
      grupos.forEach(g => {
        const item = document.createElement('span');
        item.innerHTML = `<span class="chip" style="background:${g.cor}"></span>${g.nome}`;
        leg.appendChild(item);
      });
      container.appendChild(leg);
    }
    visaoTabela(container,
      colunas || ['Cargo', 'Potencial otimização', 'Volume do quadro', 'Servidores', 'Recomendação'],
      pontos.map(p => linhaTabela ? linhaTabela(p) : [p.label, fX(p.x), fY(p.y), fT(p.tam), p.grupo || '—']));
  }

  // ---------- linhas de progresso (ranking horizontal, estilo Aurora) ----------
  // itens: [{label, valor, rotulo?, cor?, destaque?}] · referencia: {valor, rotulo}
  function progresso(container, { itens, escala = null, referencia = null, fmt = v => fmtBR(v, 0), unidade = '' }) {
