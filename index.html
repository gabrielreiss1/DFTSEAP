/* ============================================================
   Reajuste da folha e limites da LRF (LC 101/2000)
   Uma única tela define, ano a ano, o reajuste geral concedido. O fator
   acumulado sai daqui e corrige TODA projeção de custo do sistema:
   projeções financeiras, plano de concurso, alocação e medidas.
   ============================================================ */
const LRF_ROTULO = {
  ok: { txt: 'Dentro do limite', cor: '#12a86a' },
  alerta: { txt: 'Alerta (90%)', cor: '#eda100' },
  prudencial: { txt: 'Limite prudencial (95%)', cor: '#e8892f' },
  acima: { txt: 'Acima do limite', cor: '#e2564f' }
};

function telaCargosReajuste() {
  const s = st();
  const p = perfilAtual();
  subnavCargos('reajuste');
  const podeEditar = p.id === 'seap' || p.id === 'rh';
  const lrf = Calc.paramsLrf(s);
  const anoBase = s.anoReferencia;
  const anos = [0, 1, 2, 3, 4, 5].map(h => anoBase + h);

  // folha do escopo do perfil, no ano-base (13 folhas)
  const us = escopoUnidades(s, p);
  const idsEscopo = new Set(us.map(u => u.id));
  const ativos = s.servidores.filter(x => idsEscopo.has(x.unidadeId) && !Calc.cedido(x));
  const folhaMesBase = Calc.sum(ativos.map(x => Calc.custoServidor(s, x)));
  const folhaAnoBase = folhaMesBase * 13;
  const escopoEstado = !p.orgao; // só o perfil estadual compara com a RCL do Estado

  // quadro projetado: as aposentadorias estimadas saem da folha
  const custoAposAte = h => Calc.sum(ativos.filter(x => {
    const a = Calc.aposEstimada(s, x);
    return a && a <= anoBase + h;
  }).map(x => Calc.custoServidor(s, x)));

  const linhas = anos.map((ano, h) => {
    const fator = Calc.fatorReajuste(s, ano);
    const folhaSemApos = (folhaMesBase - custoAposAte(h)) * 13 * fator;
    const folhaMantida = folhaAnoBase * fator;
    const sit = Calc.situacaoLrf(s, folhaMantida, ano);
    return { ano, h, fator, folhaSemApos, folhaMantida, sit, reajuste: Calc.reajusteAno(s, ano) };
  });

  app().innerHTML = `
  ${cabecalhoPagina('Reajuste da folha · LRF',
    'Reajuste geral concedido ano a ano e o enquadramento da folha nos limites da Lei de Responsabilidade Fiscal. ' +
    tipInfo('O percentual definido aqui é COMPOSTO ano a ano e corrige todas as projeções de custo do sistema: projeções financeiras, folha do plano de concurso, alocação das vagas e medidas do Plano de Adequação. O ano de referência é a base (fator 1,00) — não se reajusta o que já está pago. Limites da LC 101/2000 para o Poder Executivo estadual: 49% da Receita Corrente Líquida (art. 20, II, "c"), limite prudencial em 95% desse valor (art. 22, parágrafo único) e alerta do Tribunal de Contas em 90% (art. 59, §1º, II).'),
    null, 'Cargos')}

  ${podeEditar ? '' : '<div class="banner aviso">Somente os gestores SEAP e de RH Setorial alteram os percentuais desta tela. Os valores abaixo são de leitura.</div>'}

  <div class="kpi-grid">
    <div class="kpi"><span class="kpi-ico">${ICO('dinheiro')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(folhaAnoBase)}</span>
      <span class="kpi-rotulo">Folha anual em ${anoBase} ${tipInfo('Quadro ativo do escopo × 13 folhas. É a base sobre a qual o reajuste incide.')}</span>
      <span class="kpi-sub">${fmtN(ativos.length)} servidores · 13 folhas</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('grafico')}</span>
      <span><span class="kpi-valor">${fmtN((Calc.fatorReajuste(s, anoBase + 5) - 1) * 100, 1)}%</span>
      <span class="kpi-rotulo">Reajuste acumulado até ${anoBase + 5} ${tipInfo('Efeito composto dos percentuais anuais definidos na tabela.')}</span>
      <span class="kpi-sub">composto ano a ano</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('dinheiro')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(linhas[linhas.length - 1].folhaMantida - folhaAnoBase)}</span>
      <span class="kpi-rotulo">Custo do reajuste em ${anoBase + 5} ${tipInfo('Quanto o mesmo quadro passa a custar a mais por ano, só pelo reajuste acumulado.')}</span>
      <span class="kpi-sub">quadro mantido · R$/ano</span></span></div>
    ${escopoEstado ? `<div class="kpi ${linhas[linhas.length - 1].sit.nivel === 'ok' ? '' : 'kpi-alerta'}">
      <span class="kpi-ico">${ICO('docok')}</span>
      <span><span class="kpi-valor">${fmtN(linhas[linhas.length - 1].sit.pct, 2)}%</span>
      <span class="kpi-rotulo">Folha ÷ RCL em ${anoBase + 5} ${tipInfo('Comprometimento da Receita Corrente Líquida com pessoal ao fim do horizonte, mantido o quadro atual.')}</span>
      <span class="kpi-sub" style="color:${LRF_ROTULO[linhas[linhas.length - 1].sit.nivel].cor};font-weight:700">
        ${LRF_ROTULO[linhas[linhas.length - 1].sit.nivel].txt}</span></span></div>`
      : `<div class="kpi"><span class="kpi-ico">${ICO('predio')}</span>
      <span><span class="kpi-valor" style="font-size:19px">${E(p.orgao)}</span>
      <span class="kpi-rotulo">Escopo do perfil ${tipInfo('Os limites da LRF são apurados por PODER, não por órgão. Com um perfil setorial a tela mostra o efeito do reajuste na folha do escopo; o enquadramento na RCL aparece no perfil estadual.')}</span>
      <span class="kpi-sub">${fmtN(us.length)} unidades</span></span></div>`}
  </div>

  <div class="card card-larga">
    <h3>Reajuste ano a ano ${tipInfo('Informe o percentual concedido em cada ano. O fator é composto e vale para todo o sistema.')}</h3>

        <th class="num">Reajuste do ano (%)</th>

        <th class="num">Folha anual — com aposentadorias ${tipInfo('Mesma folha descontando os servidores com aposentadoria estimada até o ano, sem reposição.')}</th>
        ${escopoEstado ? `<th class="num">RCL projetada</th><th class="num">% da RCL</th><th>Situação LRF</th>` : ''}
      </tr></thead>
      <tbody>${linhas.map(l => `<tr${l.h === 0 ? ' class="fraca"' : ''}>
        <td class="mono"><strong>${l.ano}</strong>${l.h === 0 ? ' <span class="muted mini">base</span>' : ''}</td>
        <td class="num">${l.h === 0 ? '<span class="muted mono">—</span>'
      : `<input type="number" class="input num-in curta" min="0" max="50" step="0.1"
              data-reajuste="${l.ano}" value="${l.reajuste}" ${podeEditar ? '' : 'disabled'}>`}</td>
        <td class="num mono">${fmtN(l.fator, 4)}</td>
        <td class="num mono" style="font-weight:600">${fmtBRLcomp(l.folhaMantida)}</td>
        <td class="num mono">${fmtBRLcomp(l.folhaSemApos)}</td>
        ${escopoEstado ? `<td class="num mono">${fmtBRLcomp(l.sit.rcl)}</td>
        <td class="num mono">${fmtN(l.sit.pct, 2)}%</td>
        <td><span class="badge mini" style="background:${LRF_ROTULO[l.sit.nivel].cor}22;color:${LRF_ROTULO[l.sit.nivel].cor}">
          ● ${LRF_ROTULO[l.sit.nivel].txt}</span></td>` : ''}
      </tr>`).join('')}</tbody>
    </table></div>
    <p class="nota-calculo">O percentual de cada ano é composto sobre o anterior: um reajuste de 5% seguido de 4%
    resulta em fator 1,0920, não 1,09. Alterar qualquer célula recalcula na hora as projeções financeiras,
    o plano de concurso, a alocação das vagas e o custo das medidas.</p>
  </div>

  ${escopoEstado ? `<div class="card card-larga">
    <h3>Folha × limites da LRF ${tipInfo('A folha projetada (quadro mantido, com reajuste) contra os três patamares da LC 101/2000 para o Poder Executivo estadual. Os limites acompanham a RCL projetada.')}</h3>
    <p class="card-sub">R$/ano · limite ${fmtN(lrf.limitePct)}% da RCL · prudencial ${fmtN(lrf.prudencialPct)}% do limite · alerta ${fmtN(lrf.alertaPct)}%</p>
    <div id="gr-lrf"></div>
    ${folhaAnoBase < linhas[0].sit.maximo * 0.2 ? `<div class="banner aviso" style="margin-top:12px">
      O quadro carregado é uma <strong>amostra</strong> do Estado (${fmtN(ativos.length)} servidores), enquanto a RCL
      informada é a do Poder Executivo inteiro — por isso a linha da folha aparece muito abaixo dos limites. O
      percentual só fica comparável ao Relatório de Gestão Fiscal depois da importação integral da folha; até lá,
      ajuste a RCL ao escopo carregado para ler a tendência.</div>` : ''}
  </div>` : ''}

  <div class="grid-2col">
    <div class="card">
      <h3 class="card-titulo">Parâmetros da LRF ${podeEditar ? '' : tipInfo('Somente leitura neste perfil.')}</h3>
      <div class="form-grid" style="margin-top:12px">
        <label>RCL do ano-base (R$) ${tipInfo('Receita Corrente Líquida apurada no ano de referência. Base de cálculo dos limites de despesa com pessoal.')}
          <input type="number" id="lrf-rcl" class="input num-in" min="0" step="1000000"
            value="${lrf.rclBase}" ${podeEditar ? '' : 'disabled'}></label>
        <label>Crescimento anual da RCL (%) ${tipInfo('Projeção de crescimento da receita, composta ano a ano.')}
          <input type="number" id="lrf-cresc" class="input num-in curta" min="-20" max="30" step="0.1"
            value="${lrf.crescimentoRclPct}" ${podeEditar ? '' : 'disabled'}></label>
        <label>Limite de pessoal (% da RCL) ${tipInfo('Poder Executivo estadual: 49% (art. 20, II, "c" da LC 101/2000).')}
          <input type="number" id="lrf-limite" class="input num-in curta" min="0" max="100" step="0.1"
            value="${lrf.limitePct}" ${podeEditar ? '' : 'disabled'}></label>
        <label>Prudencial (% do limite) ${tipInfo('95% do limite: veda reajuste, criação de cargo e contratação (art. 22, parágrafo único).')}
          <input type="number" id="lrf-prud" class="input num-in curta" min="50" max="100" step="0.5"
            value="${lrf.prudencialPct}" ${podeEditar ? '' : 'disabled'}></label>

    <div class="card">

            data-sal-inicial="${c.id}" value="${Calc.salarioInicialCargo(s, c.id)}" ${podeEditar ? '' : 'disabled'}></td>
          <td class="num mono" style="font-weight:600">${fmtBRL(Calc.custoIngresso(s, c.id))}</td>
          <td class="num mono">${fmtBRL(Calc.custoMedioCargo(s, c.id, idsEscopo))}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <p class="nota-calculo">O custo de ingresso alimenta o módulo de concurso, a alocação das vagas e as medidas
      de substituição de cedidos e temporários por efetivos.</p>
    </div>
  </div>`;

  if (escopoEstado) {
    Charts.line(document.getElementById('gr-lrf'), {
      series: [
        { nome: 'Folha projetada', cor: '#1360d8', pontos: linhas.map(l => ({ x: String(l.ano), y: l.folhaMantida })) },
        { nome: `Limite ${fmtN(lrf.limitePct)}% da RCL`, cor: '#e2564f', pontos: linhas.map(l => ({ x: String(l.ano), y: l.sit.maximo })) },
        { nome: 'Prudencial', cor: '#e8892f', tracejada: true, pontos: linhas.map(l => ({ x: String(l.ano), y: l.sit.prudencial })) },
        { nome: 'Alerta', cor: '#eda100', tracejada: true, pontos: linhas.map(l => ({ x: String(l.ano), y: l.sit.alerta })) }
      ],
      fmt: v => fmtBRLcomp(v), fmtX: x => x, altura: 300
    });
  }

  if (!podeEditar) return;
  const salvaEAtualiza = () => { Store.salvar(); telaCargosReajuste(); };
  app().querySelectorAll('[data-reajuste]').forEach(inp => inp.addEventListener('change', () => {
    const ano = Number(inp.dataset.reajuste);
    lrf.reajustePct[ano] = Math.max(0, Math.min(50, Number(inp.value) || 0));
    salvaEAtualiza();
  }));
  app().querySelectorAll('[data-sal-inicial]').forEach(inp => inp.addEventListener('change', () => {
    const c = s.cargos.find(x => x.id === inp.dataset.salInicial);
    if (c) c.salarioInicial = Math.max(0, Number(inp.value) || 0);
    salvaEAtualiza();
  }));
  const liga = (id, campo, min, max) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => {
      lrf[campo] = Math.max(min, Math.min(max, Number(el.value) || 0));
      salvaEAtualiza();
    });
  };
  liga('lrf-rcl', 'rclBase', 0, 1e15);
  liga('lrf-cresc', 'crescimentoRclPct', -20, 30);
  liga('lrf-limite', 'limitePct', 0, 100);
  liga('lrf-prud', 'prudencialPct', 50, 100);
  liga('lrf-alerta', 'alertaPct', 50, 100);
}

/* ============================================================
   Projeções financeiras — TUDO ano a ano
   Toda a tela trabalha em R$/ANO (13 folhas) e no horizonte de 5 anos,
   já corrigido pelo reajuste definido na aba Reajuste da folha · LRF.
   ============================================================ */
function telaCargosFinancas() {
  const s = st();
  const p = perfilAtual();
  subnavCargos('financas');
  const us = escopoUnidades(s, p);
  const idsEscopo = new Set(us.map(u => u.id));
  const ativos = s.servidores.filter(x => idsEscopo.has(x.unidadeId) && !Calc.cedido(x));
  const custoMes = Calc.sum(ativos.map(x => Calc.custoServidor(s, x)));
  const anoBase = s.anoReferencia;
  const anos = [0, 1, 2, 3, 4, 5].map(h => anoBase + h);
  const cp = s.custoParams || {};

  // ---------- déficits e otimização, ano a ano ----------
  const dims = dadosDashboard(s, idsEscopo);
  const deficits = dims.filter(x => x.d.saldo < -0.5);
  // custo de suprir o déficit: cada vaga nova custa o SALÁRIO INICIAL da carreira
  const custoDeficitBase = Calc.sum(deficits.map(x => -x.d.saldo * Calc.custoIngresso(s, x.cargoId)));
  // déficit projetado do horizonte h (o dimensionamento já projeta demanda, aposentadorias e otimização)
  const deficitProjetado = h => {
    if (h === 0) return Calc.sum(deficits.map(x => -x.d.saldo));
    return Calc.sum(dims.map(x => {
      const pj = x.d.projetado && x.d.projetado[h];
      return pj ? Math.max(0, -pj.saldo) : Math.max(0, -x.d.saldo);
    }));
  };
  const custoDeficitAno = h => {
    if (h === 0) return custoDeficitBase;
    return Calc.sum(dims.map(x => {
      const pj = x.d.projetado && x.d.projetado[h];
      const falta = pj ? Math.max(0, -pj.saldo) : Math.max(0, -x.d.saldo);
      return falta * Calc.custoIngresso(s, x.cargoId);
    }));
  };
  // economia da otimização: cresce com a rampa das categorias de atividade
  const economiaAutoAno = h => h === 0 ? 0 : Calc.sum(dims.map(x => {
    const pj = x.d.projetado && x.d.projetado[h];
    return pj ? x.d.custoMensal * (1 - (pj.fatorAutomacao || 1)) : 0;
  }));

  // ---------- aposentadorias ano a ano ----------
  const aposDoAno = ano => ativos.filter(x => Calc.aposEstimada(s, x) === ano);
  const custoAposAte = h => Calc.sum(ativos.filter(x => {
    const a = Calc.aposEstimada(s, x);
    return a && a <= anoBase + h;
  }).map(x => Calc.custoServidor(s, x)));

  // ---------- a tabela-mestre: uma linha por ano ----------
  const linhas = anos.map((ano, h) => {
    const f = Calc.fatorReajuste(s, ano);
    const folhaMantida = custoMes * 13 * f;
    const folhaSemReposicao = (custoMes - custoAposAte(h)) * 13 * f;
    const apos = aposDoAno(ano);
    return {
      ano, h, fator: f,
      folhaMantida, folhaSemReposicao,
      aposQtd: h === 0 ? 0 : apos.length,
      aposCusto: h === 0 ? 0 : Calc.sum(apos.map(x => Calc.custoServidor(s, x))) * 13 * f,
      aposAcumCusto: folhaMantida - folhaSemReposicao,
      deficit: deficitProjetado(h),
      custoDeficit: custoDeficitAno(h) * 13 * f,
      economia: economiaAutoAno(h) * 13 * f
    };
  });
  const ultimo = linhas[linhas.length - 1];
  const totalDeficit5 = Calc.sum(linhas.slice(1).map(l => l.custoDeficit));
  const totalEconomia5 = Calc.sum(linhas.slice(1).map(l => l.economia));

  app().innerHTML = `
  ${cabecalhoPagina('Projeções financeiras',
    `Folha, aposentadorias, custo de suprimento dos déficits e economia da otimização — ano a ano, de ${anoBase} a ${anoBase + 5}. ` +
    tipInfo('TODOS os valores desta tela são ANUAIS (13 folhas: 12 meses + 13º) e já incorporam o reajuste acumulado definido na aba Reajuste da folha · LRF. Custo por servidor = remuneração + encargos (sobre a base de incidência) + benefícios do cargo. As vagas novas são custeadas pelo salário INICIAL da carreira, porque é onde o aprovado ingressa.'),
    null, 'Cargos')}

  <div class="kpi-grid">
    <div class="kpi"><span class="kpi-ico">${ICO('dinheiro')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(linhas[0].folhaMantida)}</span>
      <span class="kpi-rotulo">Folha anual em ${anoBase} ${tipInfo('Quadro ativo do escopo × 13 folhas, em reais do ano de referência.')}</span>
      <span class="kpi-sub">${fmtN(ativos.length)} servidores ativos · 13 folhas</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('grafico')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(ultimo.folhaMantida)}</span>
      <span class="kpi-rotulo">Folha anual em ${ultimo.ano} ${tipInfo('Mesmo quadro, corrigido pelo reajuste acumulado. A diferença para hoje é o custo da política salarial, antes de qualquer contratação.')}</span>
      <span class="kpi-sub">reajuste acumulado +${fmtN((ultimo.fator - 1) * 100, 1)}%</span></span></div>
    <div class="kpi kpi-alerta"><span class="kpi-ico">${ICO('pessoas')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(totalDeficit5)}</span>
      <span class="kpi-rotulo">Suprir déficits — ${anoBase + 1} a ${anoBase + 5} ${tipInfo('Soma dos cinco anos do custo de manter os déficits supridos, cada vaga pelo salário inicial da carreira e com o reajuste do ano. Não inclui o custo dos certames.')}</span>
      <span class="kpi-sub">${fmtN(deficits.length)} cargo(s) deficitário(s) hoje · acumulado de 5 anos</span></span></div>
    <div class="kpi kpi-verde"><span class="kpi-ico">${ICO('robo')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(totalEconomia5)}</span>
      <span class="kpi-rotulo">Economia da otimização — 5 anos ${tipInfo('Soma anual da redução combinada (produtividade + demanda) prevista pelas categorias de atividade, com rampa até o horizonte de cada entrega.')}</span>
      <span class="kpi-sub">${fmtBRLcomp(ultimo.economia)}/ano em ${ultimo.ano}</span></span></div>
  </div>

  <div class="card card-larga">
    <h3>Projeção da folha ano a ano ${tipInfo('Quadro mantido: repõe toda saída, é a folha que o Estado paga se nada mudar. Sem reposição: as aposentadorias estimadas saem e não voltam. A distância entre as duas é exatamente a decisão orçamentária de suprimento.')}</h3>
    <p class="card-sub">R$/ano · 13 folhas · reajuste acumulado incluído</p>
    <div id="gr-fin-proj"></div>
  </div>

  <div class="card card-larga">
    <h3>Quadro financeiro consolidado ${tipInfo('Uma linha por medida, uma coluna por ano. Tudo em R$/ano, com o reajuste do ano já aplicado.')}</h3>
    <div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>R$/ano</th>${linhas.map(l =>
      `<th class="num">${l.ano}${l.h === 0 ? ' <span class="muted mini">base</span>' : ''}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Reajuste acumulado ${tipInfo('Fator composto vindo da aba Reajuste da folha · LRF.')}</td>
          ${linhas.map(l => `<td class="num mono">${l.h === 0 ? '—' : '+' + fmtN((l.fator - 1) * 100, 1) + '%'}</td>`).join('')}</tr>
        <tr><td><strong>Folha — quadro mantido</strong></td>
          ${linhas.map(l => `<td class="num mono" style="font-weight:600">${fmtBRLcomp(l.folhaMantida)}</td>`).join('')}</tr>
        <tr><td>Aposentadorias previstas no ano</td>
          ${linhas.map(l => `<td class="num mono">${l.h === 0 ? '—' : fmtN(l.aposQtd)}</td>`).join('')}</tr>
        <tr><td>Folha que sai com as aposentadorias ${tipInfo('Custo anual acumulado dos servidores que já se aposentaram até o ano — o que deixa de ser pago se a vaga não for reposta.')}</td>
          ${linhas.map(l => `<td class="num mono">${l.h === 0 ? '—' : '−' + fmtBRLcomp(l.aposAcumCusto)}</td>`).join('')}</tr>
        <tr><td>Folha — sem reposição</td>
          ${linhas.map(l => `<td class="num mono">${fmtBRLcomp(l.folhaSemReposicao)}</td>`).join('')}</tr>
        <tr><td>Déficit projetado (servidores)</td>
          ${linhas.map(l => `<td class="num mono">${fmtN(l.deficit, 1)}</td>`).join('')}</tr>
        <tr><td>Custo de suprir os déficits ${tipInfo('Déficit projetado × custo de ingresso do cargo (salário inicial + encargos + benefícios), 13 folhas.')}</td>
          ${linhas.map(l => `<td class="num mono">${fmtBRLcomp(l.custoDeficit)}</td>`).join('')}</tr>
        <tr><td>Economia da otimização</td>
          ${linhas.map(l => `<td class="num mono" style="color:#0b7a48">${l.h === 0 ? '—' : '−' + fmtBRLcomp(l.economia)}</td>`).join('')}</tr>
        <tr style="border-top:2px solid #c3cfda"><td><strong>Necessidade orçamentária líquida</strong>
          ${tipInfo('Folha do quadro mantido + custo de suprir os déficits − economia da otimização. É o valor a reservar em cada exercício.')}</td>
          ${linhas.map(l => `<td class="num mono" style="font-weight:700">${fmtBRLcomp(l.folhaMantida + l.custoDeficit - l.economia)}</td>`).join('')}</tr>
      </tbody>
    </table></div>
    <p class="nota-calculo">O déficit projetado vem do dimensionamento de cada unidade, que já desconta as aposentadorias
    estimadas e aplica a redução de demanda prevista pelas categorias de atividade. O custo dos certames é acompanhado
    no <a href="#/plano/concurso">módulo concurso</a>.</p>
  </div>

  <div class="card card-larga">
    <h3>Simulador de concurso — impacto ano a ano ${tipInfo('Custo de prover N vagas de um cargo: despesa única do certame no ano do edital + folha recorrente a partir da posse. A folha usa o SALÁRIO INICIAL da carreira (é onde o aprovado ingressa) e é reajustada ano a ano pelo fator da aba Reajuste da folha · LRF.')}</h3>
    <div class="filtros" style="margin-top:10px">
      <label>Cargo <select id="fin-cargo" class="input">${s.cargos.map(c =>
      `<option value="${c.id}">${E(c.nome)}</option>`).join('')}</select></label>
      <label>Forma de provimento ${tipInfo('Concurso (Estatutário): tem custo de certame por vaga. Nomeação (Comissionado): provimento direto, sem custo de concurso — apenas o impacto na folha.')}
        <select id="fin-forma" class="input">
          <option value="concurso">Concurso — Estatutário</option>
          <option value="comissionado">Nomeação — Comissionado</option>
        </select></label>
      <label>Vagas <input type="number" id="fin-vagas" class="input num-in curta" min="1" max="500" value="10"></label>
      <label>Ano da posse ${tipInfo('Ano em que os aprovados entram em exercício e a folha passa a ser paga.')}
        <select id="fin-ano" class="input">${anos.slice(1).map((a, i) =>
        `<option value="${a}" ${i === 1 ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
      <label>Custo por vaga (R$) ${tipInfo('Edital, banca, logística e capacitação inicial por vaga provida. Editável pela SEAP.')}
        <input type="number" id="fin-vaga-custo" class="input num-in" min="0" step="1000"
          value="${cp.custoVaga != null ? cp.custoVaga : 42000}" ${p.id === 'seap' ? '' : 'disabled'}></label>
    </div>
    <div class="grid-stats" id="fin-sim-out"></div>
    <div id="fin-sim-tab"></div>
  </div>`;

  Charts.line(document.getElementById('gr-fin-proj'), {
    series: [
      { nome: 'Quadro mantido (repõe as saídas)', cor: '#1360d8', pontos: linhas.map(l => ({ x: String(l.ano), y: l.folhaMantida })) },
      { nome: 'Sem reposição (aposentadorias saem)', cor: '#e34948', tracejada: true, pontos: linhas.map(l => ({ x: String(l.ano), y: l.folhaSemReposicao })) },
      { nome: 'Mantido + suprir déficits', cor: '#eda100', tracejada: true, pontos: linhas.map(l => ({ x: String(l.ano), y: l.folhaMantida + l.custoDeficit })) }
    ],
    fmt: v => fmtBRLcomp(v), fmtX: x => x, altura: 300
  });

  const atualizaSim = () => {
    const cId = document.getElementById('fin-cargo').value;
    const forma = document.getElementById('fin-forma').value;
    const vagas = Number(document.getElementById('fin-vagas').value) || 0;
    const anoPosse = Number(document.getElementById('fin-ano').value) || (anoBase + 1);
    const custoVaga = forma === 'comissionado' ? 0 : (Number(document.getElementById('fin-vaga-custo').value) || 0);
    const anoEdital = Math.max(anoBase, anoPosse - 2);
    // vaga nova entra na primeira referência da carreira
    const custoIngressoBase = Calc.custoIngresso(s, cId);
    const doCargo = ativos.filter(x => x.cargoId === cId);
    const custoMedioCargo = doCargo.length ? Calc.sum(doCargo.map(x => Calc.custoServidor(s, x))) / doCargo.length : 0;

    const linhasSim = anos.map(ano => {
      const f = Calc.fatorReajuste(s, ano);
      const folha = ano >= anoPosse ? vagas * custoIngressoBase * f * 13 : 0;
      const certame = forma === 'comissionado' ? 0 : (ano === anoEdital ? vagas * custoVaga : 0);
      return { ano, folha, certame, total: folha + certame, fator: f };
    });
    const acum = Calc.sum(linhasSim.map(l => l.total));
    const folhaCheia = linhasSim[linhasSim.length - 1].folha;

    document.getElementById('fin-sim-out').innerHTML = `
      <div class="stat"><span class="stat-label">${forma === 'comissionado' ? 'Custo do provimento' : 'Custo do certame'}</span>
        <span class="stat-valor" style="font-size:19px">${fmtBRLcomp(vagas * custoVaga)}</span>
        <span class="stat-sub">${forma === 'comissionado' ? 'nomeação direta · sem certame'
        : `despesa única em ${anoEdital} · ${fmtN(vagas)} vagas`}</span></div>
      <div class="stat"><span class="stat-label">Folha anual a partir de ${anoPosse}</span>
        <span class="stat-valor" style="font-size:19px">${fmtBRLcomp(vagas * custoIngressoBase * Calc.fatorReajuste(s, anoPosse) * 13)}</span>
        <span class="stat-sub">salário inicial ${fmtBRL(Calc.salarioInicialCargo(s, cId))} · ingresso ${fmtBRL(custoIngressoBase)}/mês</span></div>
      <div class="stat"><span class="stat-label">Folha anual em ${anoBase + 5}</span>
        <span class="stat-valor" style="font-size:19px">${fmtBRLcomp(folhaCheia)}</span>
        <span class="stat-sub">com reajuste acumulado</span></div>
      <div class="stat"><span class="stat-label">Impacto acumulado até ${anoBase + 5}</span>
        <span class="stat-valor" style="font-size:19px">${fmtBRLcomp(acum)}</span>
        <span class="stat-sub">certame + todas as folhas do período</span></div>`;

    document.getElementById('fin-sim-tab').innerHTML = `<div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>R$/ano</th>${linhasSim.map(l => `<th class="num">${l.ano}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Certame (despesa única)</td>${linhasSim.map(l =>
      `<td class="num mono">${l.certame ? fmtBRLcomp(l.certame) : '—'}</td>`).join('')}</tr>
        <tr><td>Folha das ${fmtN(vagas)} vaga(s)</td>${linhasSim.map(l =>
        `<td class="num mono">${l.folha ? fmtBRLcomp(l.folha) : '—'}</td>`).join('')}</tr>
        <tr style="border-top:2px solid #c3cfda"><td><strong>Impacto no ano</strong></td>${linhasSim.map(l =>
          `<td class="num mono" style="font-weight:700">${l.total ? fmtBRLcomp(l.total) : '—'}</td>`).join('')}</tr>
      </tbody>
    </table></div>
    <p class="nota-calculo">A folha usa o <strong>salário inicial</strong> da carreira
    (${fmtBRL(Calc.salarioInicialCargo(s, cId))}/mês)${custoMedioCargo ? `, e não o custo médio do quadro atual do cargo
    (${fmtBRL(custoMedioCargo)}/mês, que embute progressões de quem já está na casa)` : ''}.
    O salário inicial é parametrizado na aba <a href="#/cargos/reajuste">Reajuste da folha · LRF</a>.</p>`;
  };
  ['fin-cargo', 'fin-forma', 'fin-vagas', 'fin-ano', 'fin-vaga-custo'].forEach(id =>
    document.getElementById(id).addEventListener('input', atualizaSim));
  ['fin-forma', 'fin-cargo', 'fin-ano'].forEach(id =>
    document.getElementById(id).addEventListener('change', atualizaSim));
  document.getElementById('fin-vaga-custo').addEventListener('change', e => {
    if (p.id === 'seap') { s.custoParams = s.custoParams || {}; s.custoParams.custoVaga = Number(e.target.value) || 0; Store.salvar(); }
  });
  atualizaSim();
}

/* ============================================================
   Dropdowns padronizados (substituem o popup nativo dos selects)
   ============================================================ */
function aplicaDropdowns(raiz) {
  (raiz || document).querySelectorAll('select.input:not([data-dd])').forEach(sel => {
    if (sel.multiple) return;
    sel.dataset.dd = '1';
    const wrap = document.createElement('span');
    wrap.className = 'dd-wrap';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dd-btn input';
    if (sel.disabled) btn.disabled = true;
    if (sel.style.maxWidth) btn.style.maxWidth = sel.style.maxWidth;
    if (sel.style.width) btn.style.width = sel.style.width;
    const menu = document.createElement('div');
    menu.className = 'dd-menu';
    menu.hidden = true;
    const rotulo = () => {
      const o = sel.options[sel.selectedIndex];
      btn.innerHTML = `<span class="dd-txt">${E(o ? o.text : '')}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="dd-chev"><path d="m6 9 6 6 6-6"/></svg>`;
    };
    // os cards têm backdrop-filter (= contexto de empilhamento próprio), então o menu
    // ficava POR BAIXO do card seguinte: ao abrir, o card que contém o dropdown sobe.
    const aoAbrir = () => {
      document.querySelectorAll('.dd-topo').forEach(c => c.classList.remove('dd-topo'));
      const caixa = wrap.closest('.card, .hero-dim, .form-card') || wrap.closest('.filtros, .uni-sub');
      if (caixa) caixa.classList.add('dd-topo');
    };
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      document.querySelectorAll('.dd-menu').forEach(m => { if (m !== menu) m.hidden = true; });
      menu.innerHTML = [...sel.options].map((o, i) =>
        `<button type="button" class="dd-item ${i === sel.selectedIndex ? 'ativo' : ''}" data-i="${i}" ${o.disabled ? 'disabled' : ''}>${E(o.text)}</button>`).join('');
      menu.hidden = !menu.hidden;
      if (menu.hidden) document.querySelectorAll('.dd-topo').forEach(c => c.classList.remove('dd-topo'));
      else aoAbrir();
    });
    menu.addEventListener('click', ev => {
      ev.stopPropagation();
      const it = ev.target.closest('.dd-item');
      if (!it) return;
      sel.selectedIndex = +it.dataset.i;
      menu.hidden = true;
      document.querySelectorAll('.dd-topo').forEach(c => c.classList.remove('dd-topo'));
      rotulo();
      sel.dispatchEvent(new Event('change', { bubbles: true }));
    });
    sel.addEventListener('change', rotulo);
    rotulo();
    wrap.appendChild(btn);
    wrap.appendChild(menu);
  });
}
document.addEventListener('click', () => {
  document.querySelectorAll('.dd-menu').forEach(m => { m.hidden = true; });
  document.querySelectorAll('.dd-topo').forEach(c => c.classList.remove('dd-topo'));
});

/* ---------- alinhamento dos rótulos com (?) ----------
   Os campos são <label>Rótulo (?) <controle></label> e o label empilha em coluna:
   sem agrupar, o (?) descia sozinho para uma linha própria. Aqui o texto do rótulo
   e o (?) passam a viver no mesmo <span>, que é a primeira linha do campo. */
function alinhaRotulos(raiz) {
  (raiz || document).querySelectorAll('label:not([data-rot])').forEach(lb => {
    lb.dataset.rot = '1';
    if (lb.classList.contains('check')) return; // caixa de seleção já é uma linha só
    const tip = [...lb.children].find(c => c.classList && c.classList.contains('tip'));
    if (!tip) return;
    const antes = [];
    for (const n of lb.childNodes) { antes.push(n); if (n === tip) break; }
    const span = document.createElement('span');
    span.className = 'lb-txt';
    lb.insertBefore(span, lb.firstChild);
    antes.forEach(n => span.appendChild(n));
  });
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  Store.carregar(); montarShell(); render();
  aplicaDropdowns(document); alinhaRotulos(document);
  new MutationObserver(() => { aplicaDropdowns(document); alinhaRotulos(document); })
    .observe(document.getElementById('app'), { childList: true, subtree: true });
});
