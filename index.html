  const el = document.getElementById('subnav');
  if (!itens || !itens.length) { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = `
    ${titulo ? `<div class="sn-titulo">${titulo}</div>` : ''}
    <nav class="sn-nav">${itens.map(i => `
      <button class="sn-item ${i.ativo ? 'ativo' : ''} ${i.desabilitado ? 'desabilitado' : ''}"
        data-hash="${i.desabilitado ? '' : E(i.hash || '')}" ${i.desabilitado ? 'title="Disponível na próxima versão"' : ''}>
        ${i.ico ? ICO(i.ico) : ''}<span>${E(i.rotulo)}</span>
        ${i.badge != null ? `<span class="sn-badge">${E(i.badge)}</span>` : ''}
        ${i.desabilitado ? '<span class="em-breve">EM BREVE</span>' : ''}
      </button>`).join('')}
    </nav>
    ${rodapeHtml || `<div class="sn-ajuda">${ICO('ajuda')}<span><strong>Precisa de ajuda?</strong>Fale com o suporte</span></div>`}`;
  el.querySelectorAll('[data-hash]').forEach(b => {
    if (b.dataset.hash) b.addEventListener('click', () => navega(b.dataset.hash));
  });
  const r = rota()[0] || 'inicio';
  document.getElementById('topbar').querySelectorAll('[data-nav]').forEach(b =>
    b.classList.toggle('ativo', b.dataset.nav === r ||
      (r === 'unidade' && b.dataset.nav === 'orgaos') ||
      (r === 'acervo' && b.dataset.nav === 'orgaos') ||
      ((r === 'painel' || r === 'autorizacoes' || !r || r === 'menu') && b.dataset.nav === 'inicio')));
}

function cabecalhoPagina(titulo, subtitulo, voltar, eyebrow) {
  return `<div class="pg-cab">
    ${voltar ? `<a href="${voltar}" class="btn-voltar" title="Voltar">‹</a>` : ''}
    <div>
      ${eyebrow ? `<div class="pg-eyebrow">${eyebrow}</div>` : ''}
      <h1>${titulo}</h1>
      ${subtitulo ? `<p class="pg-sub">${subtitulo}</p>` : ''}
    </div>
  </div>`;
}

/* ---------- tooltips (?) via JS — nunca cortados pela borda ---------- */
(function ligaTips() {
  const mostra = (el, ev) => {
    const r = el.getBoundingClientRect();
    Charts.mostraTip(E(el.dataset.tip), ev || { clientX: r.left + r.width / 2, clientY: r.top });
  };
  document.addEventListener('mouseover', ev => {
    const t = ev.target.closest && ev.target.closest('.tip');
    if (t && t.dataset.tip) mostra(t, ev);
  });
  document.addEventListener('mouseout', ev => {
    if (ev.target.closest && ev.target.closest('.tip')) Charts.escondeTip();
  });
  document.addEventListener('focusin', ev => {
    const t = ev.target.closest && ev.target.closest('.tip');
    if (t && t.dataset.tip) mostra(t, null);
  });
  document.addEventListener('focusout', ev => {
    if (ev.target.closest && ev.target.closest('.tip')) Charts.escondeTip();
  });
})();

/* ---------- roteador (com regras por perfil) ---------- */
function rota() {
  const h = location.hash.replace(/^#\/?/, '');
  return h.split('/').filter(Boolean);
}
function navega(hash) { location.hash = hash; }

function render() {
  const r = rota();
  const p = perfilAtual();
  window.scrollTo(0, 0);

  if (p.id === 'servidor') {
    const ok = !r.length || r[0] === 'inicio' || r[0] === 'menu' ||
      (r[0] === 'unidade' && r[1] === p.unidadeId && (r[2] || 'producao') === 'producao');
    if (!ok) { navega(`#/unidade/${p.unidadeId}/producao`); return; }
  }
  if (p.id === 'unidade' && r[0] === 'unidade' && r[1] !== p.unidadeId) { navega('#/unidade/' + p.unidadeId); return; }
  if (p.id === 'unidade' && r[0] === 'orgaos') { navega('#/unidade/' + p.unidadeId); return; }
  if (p.id === 'rh') {
    if (r[0] === 'orgaos' && !r[1]) { navega('#/orgaos/' + encodeURIComponent(p.orgao)); return; }
    if (r[0] === 'orgaos' && r[1] && decodeURIComponent(r[1]) !== p.orgao) { navega('#/orgaos/' + encodeURIComponent(p.orgao)); return; }
    if (r[0] === 'unidade' && r[1]) {
      const u = Calc.unidade(st(), r[1]);
      if (u && u.orgao !== p.orgao) { navega('#/orgaos/' + encodeURIComponent(p.orgao)); return; }
    }
  }

  if (r[0] === 'autorizacoes') {
    if (p.id !== 'seap') { navega('#/inicio'); return; }
    return telaAutorizacoes();
  }
  if (!r.length || r[0] === 'inicio' || r[0] === 'menu') return telaInicio();
  if (r[0] === 'plano') return telaPlano(r[1] || 'simulador');
  if (r[0] === 'painel') return telaPainel();
  if (r[0] === 'acervo') return telaAcervoEntregas();
  if (r[0] === 'orgaos' && r[1]) return telaOrgao(decodeURIComponent(r[1]), r[2]);
  if (r[0] === 'orgaos') return telaOrgaos();
  if (r[0] === 'cargos') return telaCargos(r[1] || 'quadro');
  if (r[0] === 'itp') return telaItp(r[1] || 'parametros');
  if (r[0] === 'unidade' && r[1]) return telaUnidade(r[1], r[2] || 'entregas');
  telaInicio();
}

/* ============================================================
   Início — dashboard executivo
   ============================================================ */
function unidadesComDados(s) {
  const ids = new Set();
  s.producao.forEach(x => ids.add(x.unidadeId));
  s.historico.forEach(x => ids.add(x.unidadeId));
  return ids;
}
function escopoUnidades(s, p) {
  let us = s.unidades;
  if (p.orgao) us = us.filter(u => u.orgao === p.orgao);
  if (p.unidadeId) us = us.filter(u => u.id === p.unidadeId);
  return us;
}
// dimensionamento de todas as unidades com dados, recortado pelo escopo do perfil.
// O cálculo em si (pesado) fica em Plano.linhasBase, que mantém cache por revisão do estado.
function dadosDashboard(s, idsEscopo) {
  return Plano.linhasBase(s).filter(x => idsEscopo.has(x.unidadeId));
}

function telaInicio() {
  const s = st();
  const p = perfilAtual();
  if (p.id === 'servidor') return telaInicioServidor(s, p);

  const pendentes = (s.solicitacoes || []).filter(x => x.status === 'pendente').length;
  setSubnav('Visão geral', [
    { id: 'geral', rotulo: 'Dashboard executivo', ico: 'grafico', ativo: true, hash: '#/inicio' },
    { id: 'painel', rotulo: 'Painel Visual — Estado do Paraná', ico: 'predio', hash: '#/painel' },
    { id: 'otimizacao', rotulo: 'Oportunidades de otimização', ico: 'robo', hash: '#/cargos/otimizacao' },
    ...(p.id === 'seap' ? [{ id: 'aut', rotulo: 'Autorizações', ico: 'docok', hash: '#/autorizacoes', badge: pendentes || null }] : []),
    { id: 'rel', rotulo: 'Relatórios', ico: 'relatorios', desabilitado: true }
  ]);

  const us = escopoUnidades(s, p);
  const idsEscopo = new Set(us.map(u => u.id));
  const servEscopo = s.servidores.filter(x => idsEscopo.has(x.unidadeId));
  const totalServidores = servEscopo.length;
  const custoMensal = Calc.sum(servEscopo.map(x => Calc.custoServidor(s, x)));
  const apos5 = servEscopo.filter(x => {
    const a = Calc.aposEstimada(s, x);
    return a && a <= s.anoReferencia + 5;
  }).length;

  const dims = dadosDashboard(s, idsEscopo);
  const unidadesDim = new Set(dims.map(x => x.unidade.id));
  const somaAtuais = Calc.sum(dims.map(x => x.d.atuais));
  const somaNec = Calc.sum(dims.map(x => x.d.necessarios));
  const adequacao = somaNec > 0 ? somaAtuais / somaNec * 100 : null;
  const adequacaoTag = adequacao == null ? '' : adequacao < 95
    ? '<span class="kpi-tag" style="color:#c8443d">▼ déficit</span>'
    : adequacao > 115 ? '<span class="kpi-tag" style="color:#8a6410">▲ superávit</span>'
      : '<span class="kpi-tag" style="color:#0b7a48">◆ adequado</span>';

  // adequação por órgão (visão Estado) ou por UNIDADE (perfis RH setorial / gestor de unidade)
  const porUnidadeVista = !!p.orgao;
  const chaveGrupo = x => porUnidadeVista ? x.unidade.sigla : x.unidade.orgao;
  const porOrgao = new Map();
  dims.forEach(x => {
    const k = chaveGrupo(x);
    const r = porOrgao.get(k) || { atuais: 0, nec: 0 };
    r.atuais += x.d.atuais; r.nec += x.d.necessarios;
    porOrgao.set(k, r);
  });
  const adequacoes = [...porOrgao.entries()]
    .map(([o, r]) => ({ orgao: o, valor: r.nec > 0 ? r.atuais / r.nec * 100 : null }))
    .filter(x => x.valor != null)
    .sort((a, b) => b.valor - a.valor);
  const corAdequacao = v => v < 80 ? '#e2564f' : v > 115 ? '#eda100' : '#12a86a';

  // aposentadorias ano a ano (com filtro opcional por cargo) + quadro por cargo (escopo)
  const aposCargoSel = telaInicio._aposCargo || '';
  const aposAnosBase = [1, 2, 3, 4, 5].map(h => s.anoReferencia + h);
  const aposCont = {};
  aposAnosBase.forEach(a => { aposCont[a] = 0; });
  servEscopo.forEach(x => {
    if (Calc.cedido(x)) return;
    if (aposCargoSel && x.cargoId !== aposCargoSel) return;
    const a = Calc.aposEstimada(s, x);
    if (a != null && aposCont[a] != null) aposCont[a]++;
  });
  const aposAnos = aposAnosBase.map(a => ({ ano: a, qtd: aposCont[a] }));
  const ativosEscopo = servEscopo.filter(x => !Calc.cedido(x));
  const quadroVista = telaInicio._quadroVista || 'cargo';
  const porCargoEstado = quadroVista === 'regime'
    ? DFT_REGIMES.map(r => {
      const ss = ativosEscopo.filter(x => x.regime === r);
      return { cargo: { nome: r }, qtd: ss.length, custo: Calc.sum(ss.map(x => Calc.custoServidor(s, x))) };
    }).filter(x => x.qtd > 0).sort((a, b) => b.qtd - a.qtd)
    : s.cargos.map(c => {
      const ss = ativosEscopo.filter(x => x.cargoId === c.id);
      return { cargo: c, qtd: ss.length, custo: Calc.sum(ss.map(x => Calc.custoServidor(s, x))) };
    }).filter(x => x.qtd > 0).sort((a, b) => b.qtd - a.qtd);

  // criticidade órgão × cargo
  const cargosComDados = [...new Set(dims.map(x => x.cargoId))];
  const nivelCrit = (nec, atuais) => {
    if (!atuais) return 5;
    const r = nec / atuais;
    return r <= 0.9 ? 1 : r <= 1.0 ? 2 : r <= 1.1 ? 3 : r <= 1.25 ? 4 : 5;
  };
  const COR_CRIT = { 1: '#dff3e7', 2: '#eef6df', 3: '#fdf3dd', 4: '#fbe3cf', 5: '#f6cfcc' };
  const linhasCrit = [...porOrgao.keys()].map(o => {
    const cels = cargosComDados.map(cId => {
      const doCargo = dims.filter(x => chaveGrupo(x) === o && x.cargoId === cId);
      if (!doCargo.length) return '<td class="heat vazia">—</td>';
      const nec = Calc.sum(doCargo.map(x => x.d.necessarios));
      const atu = Calc.sum(doCargo.map(x => x.d.atuais));
      const n = nivelCrit(nec, atu);
      return `<td class="heat" style="background:${COR_CRIT[n]}" title="${E(o)} · ${E(nomeCargo(cId))}: necessários ${fmtN(nec, 1)} / atuais ${fmtN(atu)}">${n}</td>`;
    }).join('');
    return `<tr><th>${E(o)}</th>${cels}</tr>`;
  }).join('');

  app().innerHTML = `
  ${cabecalhoPagina(`Força de trabalho · ${E(p.orgao || 'Estado do Paraná')}`,
    `Ano de referência ${s.anoReferencia} · consolidado de ${fmtN(us.length)} unidades · perfil <strong>${E(p.nome)}</strong>`,
    null, 'Dashboard executivo')}

  <div class="kpi-grid">
    <div class="kpi"><span class="kpi-ico">${ICO('pessoas')}</span>
      <span><span class="kpi-valor">${fmtN(totalServidores)}</span>
      <span class="kpi-rotulo">Servidores ativos</span>
      <span class="kpi-sub">em ${fmtN(us.length)} unidades</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('predio')}</span>
      <span><span class="kpi-valor">${fmtN(unidadesDim.size)}<span class="kpi-de"> / ${fmtN(us.length)}</span></span>
      <span class="kpi-rotulo">Unidades dimensionadas</span>
      <span class="kpi-sub">com dados de produção</span></span></div>
    <div class="kpi ${adequacao != null && adequacao < 95 ? 'kpi-alerta' : ''}">
      <span class="kpi-topo"><span class="kpi-ico">${ICO('grafico')}</span>${adequacaoTag}</span>
      <span><span class="kpi-valor">${adequacao != null ? fmtN(adequacao, 1) + '%' : '—'}</span>
      <span class="kpi-rotulo">Adequação média ${tipInfo('Quadro atual ÷ quadro necessário nas unidades dimensionadas, pelo método de cada uma. 100% = adequado; <80% subdimensionado; >115% superdimensionado.')}</span>
      <span class="kpi-sub">atuais ÷ necessários</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('calend')}</span>
      <span><span class="kpi-valor">${fmtN(apos5)}</span>
      <span class="kpi-rotulo">Aposentadorias até ${s.anoReferencia + 5} ${tipInfo('Estimadas automaticamente: data de entrada + 35 anos de contribuição (regra simplificada do protótipo). Reduzem o quadro nos resultados projetados.')}</span>
      <span class="kpi-sub">estimativa automática</span></span></div>
    <div class="kpi"><span class="kpi-ico">${ICO('dinheiro')}</span>
      <span><span class="kpi-valor" style="font-size:22px">${fmtBRLcomp(custoMensal)}</span>
      <span class="kpi-rotulo">Custo mensal do quadro</span>
      <span class="kpi-sub">remuneração + encargos e benefícios</span></span></div>
  </div>

  <div class="grid-2col">
    <div class="card">
      <h3 class="card-titulo">${porUnidadeVista ? 'Unidades por adequação' : 'Órgãos por adequação'} ${tipInfo('Quadro atual ÷ quadro necessário, considerando as unidades com dados e o método de cada uma. Sub (<80%) ← 100% adequado → super (>115%).')}</h3>
      <p class="card-sub">atuais ÷ necessários · meta 100%</p>
      <div id="gr-adequacao" style="margin-top:14px">${adequacoes.length ? '' : '<p class="vazio">Sem unidades dimensionadas.</p>'}</div>
    </div>
    <div class="card">
      <h3 class="card-titulo">Quadro — ${porUnidadeVista ? E(p.orgao) : 'Estado'}
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn-toggle ${quadroVista === 'cargo' ? 'ativo' : ''}" data-quadro-vista="cargo" style="padding:5px 12px;font-size:11.5px">Por cargo</button>
          <button class="btn-toggle ${quadroVista === 'regime' ? 'ativo' : ''}" data-quadro-vista="regime" style="padding:5px 12px;font-size:11.5px">Por regime</button>
        </span>
        ${tipInfo('Servidores ativos (exclui cedidos a outros órgãos) por cargo ou por regime — Estatutário, Comissionado, Temporário e Estágio.')}</h3>
      <p class="card-sub">servidores ativos · custo mensal</p>
      <div id="gr-cargos-estado" style="margin-top:12px;--prog-rotulo-w:118px;--prog-valor-w:128px"></div>
    </div>
  </div>

  <div class="card card-larga">
    <h3>Aposentadorias ano a ano ${tipInfo('Servidores do escopo com aposentadoria estimada (entrada + 35 anos) em cada ano. Filtre por cargo para planejar concursos específicos.')}
      <span style="margin-left:auto"><select id="sel-apos-cargo" class="input" style="min-width:190px">
        <option value="" ${!aposCargoSel ? 'selected' : ''}>Todos os cargos</option>
        ${s.cargos.map(c => `<option value="${c.id}" ${c.id === aposCargoSel ? 'selected' : ''}>${E(c.nome)}</option>`).join('')}
      </select></span></h3>
    <div id="gr-apos-anos"></div>
  </div>

  <div class="card card-larga">
    <h3>Criticidade do quadro — ${porUnidadeVista ? 'unidade' : 'órgão'} × cargo ${tipInfo('1 = saudável · 5 = crítico, pela pressão de demanda (necessários ÷ atuais) nas unidades com dados. Passe o mouse na célula para ver os números.')}</h3>
    ${linhasCrit ? `<div class="heat-wrap"><table class="heat-tabela">
      <thead><tr><th></th>${cargosComDados.map(c => `<th>${E(nomeCargo(c))}</th>`).join('')}</tr></thead>
      <tbody>${linhasCrit}</tbody></table></div>
      <p class="heat-legenda">1 saudável ${[1, 2, 3, 4, 5].map(n => `<span class="heat-chip" style="background:${COR_CRIT[n]}">${n}</span>`).join('')} 5 crítico</p>`
    : '<p class="vazio">Sem dados no escopo.</p>'}
  </div>`;

  app().querySelectorAll('[data-quadro-vista]').forEach(b => b.addEventListener('click', () => {
    telaInicio._quadroVista = b.dataset.quadroVista; telaInicio();
  }));
  document.getElementById('sel-apos-cargo').addEventListener('change', e => {
    telaInicio._aposCargo = e.target.value; telaInicio();
  });
  Charts.bar(document.getElementById('gr-apos-anos'), {
    categorias: aposAnos.map(a => ({ label: String(a.ano), valor: a.qtd, corIdx: 0 })),
    fmt: v => fmtN(v), unidadeY: 'aposentadorias previstas', altura: 220
  });
  Charts.progresso(document.getElementById('gr-cargos-estado'), {
    itens: porCargoEstado.map(x => ({
      label: x.cargo.nome, valor: x.qtd,
      rotulo: `${fmtN(x.qtd)} · ${fmtBRLcomp(x.custo)}`, destaque: false
    })),
    fmt: v => fmtN(v), unidade: 'servidores'
  });
  if (adequacoes.length) {
    Charts.progresso(document.getElementById('gr-adequacao'), {
      itens: adequacoes.map(a => ({ label: a.orgao, valor: a.valor, rotulo: fmtN(a.valor, 0) + '%', cor: corAdequacao(a.valor) })),
      escala: Math.max(130, ...adequacoes.map(a => a.valor)) * 1.05,
      referencia: { valor: 100, rotulo: 'referência = 100% (adequado)' },
      unidade: 'adequação'
    });
  }
}

  }]));

        <span style="color:#1360d8">${ICO('seta')}</span></div>
      <h3>${E(o.nome)}</h3>
      <div class="orgao-stats">
        <span><strong>${us.length}</strong> unidades</span>
        <span><strong>${fmtN(servidores)}</strong> servidores</span>
      </div>
      <div class="badges">
        ${/pendente/i.test(o.situacao || '') ? '<span class="badge mini badge-fila" title="O órgão ainda não devolveu o instrumento de taxonomia — as unidades vêm da relação prévia e podem mudar">relação prévia</span>' : ''}
        ${metodos.map(m => `<span class="badge mini badge-azul">${E(METODO_MINI[m])}</span>`).join('')}</div>
    </button>`;
  }).join('');
  app().innerHTML = `
  ${cabecalhoPagina('Órgãos do Estado',
    'Selecione um órgão para ver as unidades vinculadas e o método de dimensionamento de cada uma.', null, 'Órgãos')}
  ${p.id === 'seap' ? `<div class="acoes">
    <button class="btn btn-sec" id="btn-novo-orgao">+ Novo órgão</button>
    <button class="btn btn-sec" id="btn-importar">Importar planilha de unidades</button>
  </div>` : ''}
  <div id="painel-import"></div>
  <div class="grid-cards">${cards}</div>`;
  app().querySelectorAll('[data-orgao]').forEach(b =>
    b.addEventListener('click', () => navega('#/orgaos/' + encodeURIComponent(b.dataset.orgao))));
  const btnImp = document.getElementById('btn-importar');
  if (btnImp) btnImp.addEventListener('click', () => {
    if (document.getElementById('imp-drop')) { impLimpa(); painelImportacao(); document.getElementById('painel-import').innerHTML = ''; return; }
    painelImportacao();
    document.getElementById('painel-import').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  const novo = document.getElementById('btn-novo-orgao');
  if (novo) novo.addEventListener('click', () => {
    const nome = prompt('Sigla do novo órgão (ex.: SEFA):');
    if (!nome) return;
    const id = nome.trim().toUpperCase();
    if (s.orgaos.some(o => o.id === id)) { alert('Órgão já cadastrado.'); return; }
    s.orgaos.push({ id, nome: id });
    Store.salvar(); telaOrgaos();
  });
}

// nível hierárquico heurístico da unidade (o cadastro real terá o vínculo pai-filho)
function nivelHierarquico(u) {
  if (u.sigla === 'GS' || /gabinete/i.test(u.nome)) return 1;
  if (/^(departamento|diretor|superintend|coordenador|assessoria|escola|ouvidoria|controladoria|procuradoria|corregedoria|instituto|presid)/i.test(u.nome.trim())) return 2;
  return 3;
}

// Hierarquia por faixas: 1 = Secretário/gabinete, 2 = departamentos/diretorias, 3 = divisões/núcleos
function desenhaHierarquia(s, orgaoId, us) {
  const conta = uId => s.servidores.filter(x => x.unidadeId === uId && !Calc.cedido(x)).length;
  const porNivel = { 1: [], 2: [], 3: [] };
  us.forEach(u => porNivel[nivelHierarquico(u)].push(u));
  const chip = (u, n) => `<button class="hq-no n${n}" data-hq-uid="${u.id}" title="${E(u.nome)} · ${conta(u.id)} servidores · clique para abrir">
      <span class="hq-sigla">${E(u.sigla)}</span>
      <span class="hq-qtd">${conta(u.id)}</span>
    </button>`;
  return `
  <h3>Estrutura de ${E(orgaoId)} <span class="grupo-resumo">· clique em uma unidade para abri-la</span></h3>
  <div class="hq">
    <div class="hq-faixa f1">
      <div class="hq-no n1 hq-fixo" title="Titular do órgão (fixo na estrutura)">
        <span class="hq-sigla">Secretário(a) de Estado</span><span class="hq-qtd">${E(orgaoId)}</span>
      </div>
      ${porNivel[1].map(u => chip(u, 1)).join('')}
    </div>
    <div class="hq-conector"></div>
    <div class="hq-faixa">${porNivel[2].map(u => chip(u, 2)).join('') || '<span class="vazio">sem unidades nesta faixa</span>'}</div>
    <div class="hq-conector"></div>
    <div class="hq-faixa">${porNivel[3].map(u => chip(u, 3)).join('') || '<span class="vazio">sem unidades nesta faixa</span>'}</div>
  </div>
  <p class="heat-legenda">
    <span class="hq-leg n1"></span> Faixa 1 · Secretário e gabinete
    <span class="hq-leg n2"></span> Faixa 2 · Departamentos, diretorias e assessorias
    <span class="hq-leg n3"></span> Faixa 3 · Divisões, núcleos e demais unidades
  </p>`;
}

function formUnidade(orgaoId, unidadeId) {
  const s = st();
  const u = unidadeId ? s.unidades.find(x => x.id === unidadeId)
    : { sigla: '', nome: '', funcao: 'Meio', metodo: DFT_METODOS[0], codigoPares: '' };
  const alvo = document.getElementById('form-unidade');
  alvo.innerHTML = `<div class="card card-larga form-card">
    <h3 class="card-titulo">${unidadeId ? 'Editar unidade' : 'Nova unidade'} — definição de método (Gestor SEAP)</h3>
    <div class="form-grid">
      <label>Sigla <input type="text" id="fu-sigla" class="input" value="${E(u.sigla)}"></label>
      <label>Nome <input type="text" id="fu-nome" class="input" value="${E(u.nome)}"></label>
      <label>Função <select id="fu-funcao" class="input">
        ${['Meio', 'Fim', 'Inovação'].map(f => `<option ${f === u.funcao ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
      <label>Método de dimensionamento ${tipInfo('Define as opções de cálculo da tela de Resultados da unidade.')}
        <select id="fu-metodo" class="input">
        ${DFT_METODOS.map(m => `<option value="${E(m)}" ${m === u.metodo ? 'selected' : ''}>${E(METODO_CURTO[m])}</option>`).join('')}</select></label>
      <label>Código de pares ${tipInfo('Unidades com o mesmo código são comparadas entre si na Comparação entre Pares. Padrão: a própria sigla.')}
        <input type="text" id="fu-pares" class="input" value="${E(u.codigoPares || u.sigla)}"></label>
    </div>
    <div class="acoes">
      <button class="btn" id="fu-salvar">${unidadeId ? 'Salvar alterações' : 'Criar unidade'}</button>
      <button class="btn btn-sec" id="fu-cancelar">Cancelar</button>
      ${unidadeId ? '<button class="btn btn-perigo" id="fu-excluir">Excluir unidade</button>' : ''}
    </div>
  </div>`;
  document.getElementById('fu-cancelar').addEventListener('click', () => { alvo.innerHTML = ''; });
  document.getElementById('fu-salvar').addEventListener('click', () => {
    const sigla = document.getElementById('fu-sigla').value.trim();
    const nome = document.getElementById('fu-nome').value.trim();
    if (!sigla || !nome) { alert('Informe sigla e nome.'); return; }
    const dados = {
      sigla, nome,
      funcao: document.getElementById('fu-funcao').value,
      metodo: document.getElementById('fu-metodo').value,
      codigoPares: document.getElementById('fu-pares').value.trim() || sigla
    };
    if (unidadeId) Object.assign(s.unidades.find(x => x.id === unidadeId), dados);
    else s.unidades.push(Object.assign({ id: 'u' + Date.now(), orgao: orgaoId }, dados));
    Store.salvar(); telaOrgao(orgaoId);
  });
  const btnExc = document.getElementById('fu-excluir');
  if (btnExc) btnExc.addEventListener('click', () => {
    // A unidade pode deixar de existir, mas as ENTREGAS não podem sumir com ela:
    // por padrão elas vão para o acervo, de onde podem ser vinculadas a outra unidade.
    const ents = s.entregas.filter(x => x.unidadeId === unidadeId);
    if (!confirm(`Excluir a unidade ${u.sigla}? Servidores e lançamentos vinculados serão removidos.` +
      (ents.length ? `\n\nAs ${ents.length} entrega(s) da unidade serão PRESERVADAS no acervo de entregas — de lá você pode vinculá-las a outra unidade.` : ''))) return;
    removeUnidadeDoEstado(s, u, 'unidade extinta');
    Store.salvar(); telaOrgao(orgaoId);
  });
}

// Tira a unidade do estado preservando as entregas: elas vão para o acervo, com
// o vínculo anterior registrado, e os lançamentos continuam gravados — ficam
// inertes até a entrega ser vinculada a outra unidade. Servidores e produção
// próprios da unidade saem junto. Usada pela exclusão manual e pela importação.
function removeUnidadeDoEstado(s, u, motivo) {
  const uid = u.id;
  const ents = s.entregas.filter(x => x.unidadeId === uid);
  const hoje = new Date().toISOString().slice(0, 10);
  ents.forEach(e => {
    e.vinculos = e.vinculos || [];
    e.vinculos.push({ de: uid, deSigla: u.sigla, deOrgao: u.orgao, para: null, data: hoje, motivo });
    e.unidadeId = null;
  });
  const idsEnt = new Set(ents.map(e => e.id));
  s.unidades = s.unidades.filter(x => x.id !== uid);
  s.servidores = s.servidores.filter(x => x.unidadeId !== uid);
  s.producao.forEach(p => { if (p.unidadeId === uid) p.itens = p.itens.filter(i => idsEnt.has(i.entregaId)); });
  s.producao = s.producao.filter(x => x.unidadeId !== uid || x.itens.length);
  s.historico = s.historico.filter(x => x.unidadeId !== uid || idsEnt.has(x.entregaId));
  return ents.length;
}

/* ============================================================
   DFT — Importação de unidades por planilha
   Lê o Anexo I (ou qualquer planilha com as mesmas colunas) e gera os órgãos e
   as unidades a partir dele. Duas decisões explicam o resto do módulo:

   · o cabeçalho é PROCURADO nas primeiras linhas, porque o Anexo I traz título
     e notas antes dele, e as colunas são reconhecidas pelo NOME, não pela
     posição — a planilha pode vir com colunas a mais, a menos ou fora de ordem;
   · nada é gravado antes da prévia. A tela mostra o que vai ser criado,
     atualizado e o que ficou de fora, e só então a importação é aplicada.
   ============================================================ */

const IMP = {
  arquivo: '', aba: '', linhas: null, cab: -1, mapa: null,
  previa: null, erro: '', ocupado: false, remover: false
};

const impNorm = t => String(t == null ? '' : t)
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();

// O Anexo I separa "Razão por Direcionador" de "Medição de Esforço por
// Atividade". O motor de cálculo do DFT trata as duas sob um método só, então
// ambas caem em DFT_METODOS[1] — é o mesmo cálculo por trás.
const IMP_ALIAS_METODO = {
  'comparacao entre pares': 0,
  'pares': 0,
  'razao por direcionador': 1,
  'medicao de esforco por atividade': 1,
  'direcionador historico ou esforco por entrega': 1,
  'esforco por entrega': 1,
  'direcionador historico': 1,
  'direcionador referencial/normativo': 2,
  'referencial/normativo': 2,
  'capacidade e consenso tecnico': 3
};

// nome da coluna → campo. Cada campo é reivindicado pela coluna mais à esquerda
// que casar, o que evita, por exemplo, que "Origem da indicação do método"
// tome o lugar de "Método de dimensionamento indicado".
const IMP_COLUNAS = [
  ['orgao', /^(orgao|sigla do orgao|entidade)$/],
  ['codigo', /^codigo/],
  ['sigla', /^sigla/],
  ['nome', /(nome.*unidade|unidade dimensionavel|^nome$|^unidade$|^descricao)/],
  ['funcao', /^(natureza|funcao|meio ?\/ ?fim)/],
  ['metodo', /metodo/],
  ['tipo', /^tipo/],
  ['eixo', /^eixo/],
  ['replicabilidade', /replicab/]
];

const IMP_PALAVRA_VAZIA = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'a', 'o', 'em', 'para', 'por', 'ao', 'no', 'na']);

// Quando a planilha não traz sigla, ela sai das iniciais do nome — o mesmo
// critério usado ao montar o Anexo I no seed.
function impSiglaDoNome(nome, usadas) {
  const partes = nome.split(/[\s/-]+/).filter(p => p && !IMP_PALAVRA_VAZIA.has(impNorm(p)));
  const base = (partes.map(p => p[0]).join('').toUpperCase().slice(0, 6)) || 'UD';
  let sig = base, n = 2;
  while (usadas.has(sig)) sig = base + (n++);
  return sig;
}

/* ---------- leitura ---------- */

// Devolve [{nome, linhas}] — todas as abas, para que a detecção de cabeçalho
// possa escolher a que realmente tem a relação de unidades.
async function impLerArquivo(file) {
  const nome = file.name.toLowerCase();
  if (/\.(csv|tsv|txt)$/.test(nome)) {
    return [{ nome: file.name, linhas: iaParseCSV(await iaLerTexto(file)) }];
  }
  const XLSX = await iaCarregaSheetJS();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  return wb.SheetNames.map(n => ({
    nome: n,
    linhas: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false, defval: '' })
      .filter(l => l.some(c => String(c).trim()))
  }));
}

// Mapa {campo: índice} de uma linha candidata a cabeçalho, ou null.
function impMapaColunas(linha) {
  const mapa = {};
  linha.forEach((celula, i) => {
    const t = impNorm(celula);
    if (!t) return;
    const par = IMP_COLUNAS.find(([campo, re]) => mapa[campo] == null && re.test(t));
    if (par) mapa[par[0]] = i;
  });
  return (mapa.orgao != null && mapa.nome != null) ? mapa : null;
}

// Procura, entre as abas, a primeira linha das 20 iniciais que sirva de cabeçalho.
function impAchaCabecalho(abas) {
  for (const aba of abas) {
    for (let i = 0; i < Math.min(20, aba.linhas.length); i++) {
      const mapa = impMapaColunas(aba.linhas[i]);
      if (mapa) return { aba: aba.nome, linhas: aba.linhas, cab: i, mapa };
    }
  }
  return null;
}

/* ---------- prévia ---------- */

// Linhas de totalização não são unidades.
const IMP_NAO_ORGAO = /^(total|subtotal|participacao|orgao|nota)/;

function impMontaPrevia(s) {
  const { linhas, cab, mapa } = IMP;
  const val = (l, campo) => mapa[campo] == null ? ''
    : String(l[mapa[campo]] == null ? '' : l[mapa[campo]]).trim();

  const registros = [], ignoradas = [];
  const semMetodo = [], siglasDerivadas = [];
  const usadasPorOrgao = {};

  const corpo = linhas.slice(cab + 1);
  corpo.forEach(l => {
    const o = val(l, 'orgao').toUpperCase(), sg = val(l, 'sigla');
    if (o && sg) (usadasPorOrgao[o] = usadasPorOrgao[o] || new Set()).add(sg);
  });

  corpo.forEach(l => {
    const orgao = val(l, 'orgao').toUpperCase();
    const nome = val(l, 'nome');
    if (!orgao || !nome || IMP_NAO_ORGAO.test(impNorm(orgao))) return;

    usadasPorOrgao[orgao] = usadasPorOrgao[orgao] || new Set();
    let sigla = val(l, 'sigla');
    if (!sigla) {
      sigla = impSiglaDoNome(nome, usadasPorOrgao[orgao]);
      siglasDerivadas.push(`${orgao}/${sigla}`);
    }
    usadasPorOrgao[orgao].add(sigla);

    const bruto = val(l, 'metodo');
    const idx = IMP_ALIAS_METODO[impNorm(bruto)];
    if (bruto && idx == null) semMetodo.push(bruto);

    const funcao = /^f/i.test(impNorm(val(l, 'funcao'))) ? 'Fim' : 'Meio';
    registros.push({
      orgao, sigla, nome, funcao,
      metodo: idx == null ? null : DFT_METODOS[idx],
      codigo: val(l, 'codigo'),
      replicabilidade: val(l, 'replicabilidade'),
      tipo: val(l, 'tipo'), eixo: val(l, 'eixo')
    });
  });

  if (!registros.length) throw new Error('Nenhuma linha de unidade foi reconhecida na planilha.');

  /* --- casamento com o que já existe ---
     Primeiro pelo código, quando ele é único dos dois lados dentro do órgão;
     depois por órgão + sigla + nome. Assim uma unidade renomeada na planilha é
     reconhecida pelo código em vez de virar uma unidade nova. */
  const conta = (lista, chave) => lista.reduce((m, x) => {
    const k = chave(x); if (k) m[k] = (m[k] || 0) + 1; return m;
  }, {});
  const codPlan = conta(registros, r => r.codigo && r.orgao + '|' + r.codigo);
  const codEstado = conta(s.unidades, u => u.codigo && u.orgao + '|' + u.codigo);
  const porNome = {};
  s.unidades.forEach(u => { porNome[impNorm(u.orgao) + '|' + impNorm(u.sigla) + '|' + impNorm(u.nome)] = u; });
  const porCodigo = {};
  s.unidades.forEach(u => { if (u.codigo) porCodigo[u.orgao + '|' + u.codigo] = u; });

  const casada = r => {
    const k = r.codigo && r.orgao + '|' + r.codigo;
    if (k && codPlan[k] === 1 && codEstado[k] === 1) return porCodigo[k];
    return porNome[impNorm(r.orgao) + '|' + impNorm(r.sigla) + '|' + impNorm(r.nome)];
  };

  const novas = [], atualizadas = [], iguais = [];
  const vistas = new Set();
  registros.forEach(r => {
    const u = casada(r);
    if (!u) { novas.push(r); return; }
    vistas.add(u.id);
    const mudou = u.sigla !== r.sigla || u.nome !== r.nome || u.funcao !== r.funcao ||
      (r.metodo && u.metodo !== r.metodo) ||
      (r.codigo && u.codigo !== r.codigo) ||
      (r.replicabilidade && u.replicabilidade !== r.replicabilidade);
    (mudou ? atualizadas : iguais).push({ u, r });
  });

  // Só contam como ausentes as unidades dos órgãos que a planilha cobre: uma
  // planilha de um órgão só não pode sugerir que os demais sumiram.
  const orgaosPlanilha = new Set(registros.map(r => r.orgao));
  const ausentes = s.unidades.filter(u => orgaosPlanilha.has(u.orgao) && !vistas.has(u.id));

  const metaOrgaos = {};
  registros.forEach(r => {
    const m = metaOrgaos[r.orgao] = metaOrgaos[r.orgao] || { id: r.orgao, tipo: '', eixo: '', unidades: 0 };
    m.unidades++;
    if (r.tipo && !m.tipo) m.tipo = r.tipo;
    if (r.eixo && !m.eixo) m.eixo = r.eixo;
  });
  const orgaos = Object.values(metaOrgaos).sort((a, b) => a.id.localeCompare(b.id));

  return {
    registros: registros.length, novas, atualizadas, iguais, ausentes, orgaos,
    orgaosNovos: orgaos.filter(o => !s.orgaos.some(x => x.id === o.id)),
    semMetodo: [...new Set(semMetodo)], siglasDerivadas, ignoradas
  };
}

/* ---------- aplicação ---------- */

function impAplicar(s) {
  const p = IMP.previa;

  p.orgaos.forEach(o => {
    const alvo = s.orgaos.find(x => x.id === o.id);
    if (!alvo) s.orgaos.push({ id: o.id, nome: o.id, tipo: o.tipo, eixo: o.eixo, situacao: '' });
    else { if (o.tipo) alvo.tipo = o.tipo; if (o.eixo) alvo.eixo = o.eixo; }
  });

  p.novas.forEach(r => s.unidades.push({
    id: Store.novoId('u', s.unidades),
    orgao: r.orgao, sigla: r.sigla, nome: r.nome, funcao: r.funcao,
    metodo: r.metodo || DFT_METODOS[0],
    codigo: r.codigo, replicabilidade: r.replicabilidade,
    codigoPares: r.sigla, uf: 'PR'
  }));

  p.atualizadas.forEach(({ u, r }) => {
    // o código de pares acompanha a sigla enquanto for o padrão (a própria
    // sigla); se foi ajustado à mão para agrupar pares, fica como está
    if (u.codigoPares === u.sigla) u.codigoPares = r.sigla;
    u.sigla = r.sigla; u.nome = r.nome; u.funcao = r.funcao;
    if (r.metodo) u.metodo = r.metodo;
    if (r.codigo) u.codigo = r.codigo;
    if (r.replicabilidade) u.replicabilidade = r.replicabilidade;
  });

  const removidas = IMP.remover ? p.ausentes.length : 0;
  if (IMP.remover) p.ausentes.forEach(u => removeUnidadeDoEstado(s, u, 'não consta da planilha importada'));
  Store.salvar();
  return { criadas: p.novas.length, atualizadas: p.atualizadas.length, removidas, orgaos: p.orgaosNovos.length };
}

}

function painelImportacao() {
  const alvo = document.getElementById('painel-import');

  const resumoArquivo = IMP.arquivo ? `

      </li>
    </ul>` : '';

  const colunas = IMP.mapa ? `<p class="nota-calculo">Colunas reconhecidas:
    ${Object.keys(IMP.mapa).map(c => `<b>${E(c)}</b>`).join(', ')}.

  const linha = (rot, n, cor) => `<li><span class="badge mini ${cor}">${n}</span> ${rot}</li>`;
  const avisos = [];

  if (p && p.siglasDerivadas.length) avisos.push(`Sem sigla na planilha, derivada do nome:
    ${p.siglasDerivadas.slice(0, 8).map(E).join(', ')}${p.siglasDerivadas.length > 8 ? ` e mais ${p.siglasDerivadas.length - 8}` : ''}.`);

  const previa = p ? `
    <div class="card card-larga">
      <h3 class="card-titulo">Prévia — ${fmtN(p.registros)} linhas lidas</h3>
      <ul class="imp-resumo">
        ${linha('órgãos na planilha, sendo <b>' + p.orgaosNovos.length + '</b> a criar', p.orgaos.length, 'badge-azul')}

        ${linha('unidades a atualizar', p.atualizadas.length, 'badge-azul')}
        ${linha('unidades já iguais à planilha', p.iguais.length, 'badge-consenso')}
        ${linha('unidades dos mesmos órgãos que não constam da planilha', p.ausentes.length, p.ausentes.length ? 'badge-fila' : 'badge-consenso')}
      </ul>
      ${avisos.map(a => `<p class="nota-calculo">${a}</p>`).join('')}
      ${p.ausentes.length ? `
        <label class="check" style="margin-top:10px"><input type="checkbox" id="imp-remover" ${IMP.remover ? 'checked' : ''}>
          Remover as ${p.ausentes.length} unidades que não constam da planilha</label>
        <p class="nota-calculo">Sem marcar, elas ficam como estão — é o padrão, e o mais seguro quando a
          planilha cobre só parte da estrutura. Marcando, as entregas dessas unidades são preservadas no
          acervo, mas os servidores e os lançamentos de produção vinculados a elas são apagados.</p>` : ''}
      <div class="acoes">
        <button class="btn" id="imp-aplicar">Aplicar importação</button>
        <button class="btn btn-sec" id="imp-cancelar">Cancelar</button>
      </div>
    </div>` : '';

  alvo.innerHTML = `
  <div class="card card-larga">
    <h3 class="card-titulo">Importar unidades de uma planilha ${tipInfo('A planilha precisa ter uma coluna de órgão e uma de nome da unidade. Sigla, natureza, método, código, tipo, eixo e replicabilidade são reconhecidos quando existirem. O cabeçalho pode estar em qualquer uma das primeiras linhas.')}</h3>
    <p class="muted" style="font-size:13px">Formato do Anexo I — unidades dimensionáveis por órgão e método.
      Os órgãos são criados a partir da coluna de órgão; não é preciso cadastrá-los antes.</p>
    <div class="ia-drop" id="imp-drop">
      <p>Escolher a planilha</p>
      <small>xlsx, xls, csv ou tsv — as abas são varridas até achar o cabeçalho</small>
    </div>
    <input type="file" id="imp-file" accept=".xlsx,.xls,.csv,.tsv,.txt" hidden>
    ${resumoArquivo}
    ${colunas}
    ${IMP.ocupado ? '<div class="ia-status"><span class="ia-girando"></span> Lendo a planilha…</div>' : ''}
    ${IMP.erro ? `<div class="banner erro" style="margin:12px 0 0">${E(IMP.erro)}</div>` : ''}
  </div>
  ${previa}`;

  const inp = document.getElementById('imp-file');
  const drop = document.getElementById('imp-drop');
  drop.addEventListener('click', () => inp.click());
  ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('sobre');
  }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('sobre')));
  drop.addEventListener('drop', e => { e.preventDefault(); impCarrega(e.dataTransfer.files[0]); });
  inp.addEventListener('change', () => impCarrega(inp.files[0]));

  const tira = document.getElementById('imp-tira');
  if (tira) tira.addEventListener('click', () => { impLimpa(); painelImportacao(); });

  const rem = document.getElementById('imp-remover');
  if (rem) rem.addEventListener('change', () => { IMP.remover = rem.checked; });

  const cancelar = document.getElementById('imp-cancelar');
  if (cancelar) cancelar.addEventListener('click', () => { impLimpa(); painelImportacao(); });

  const aplicar = document.getElementById('imp-aplicar');
  if (aplicar) aplicar.addEventListener('click', () => {
    const r = IMP.previa;
    const aviso = IMP.remover && r.ausentes.length
      ? `\n\nSerão REMOVIDAS ${r.ausentes.length} unidades que não constam da planilha.` : '';
    if (!confirm(`Aplicar a importação?\n\n${r.novas.length} unidades novas, ${r.atualizadas.length} atualizadas`
      + `, ${r.orgaosNovos.length} órgãos criados.${aviso}`)) return;
    const res = impAplicar(st());
    impLimpa();
    alert(`Importação concluída.\n\n${res.criadas} unidades criadas, ${res.atualizadas} atualizadas`
      + `, ${res.removidas} removidas, ${res.orgaos} órgãos criados.`);
    telaOrgaos();
  });
}

async function impCarrega(file) {
  if (!file) return;
  Object.assign(IMP, { erro: '', previa: null, ocupado: true, arquivo: file.name });
  painelImportacao();
  try {
    const abas = await impLerArquivo(file);
    const achado = impAchaCabecalho(abas);
    if (!achado) {
      throw new Error('Não encontrei o cabeçalho. A planilha precisa de uma coluna de órgão e ' +
        'uma com o nome da unidade nas primeiras 20 linhas de alguma aba.');
    }
    Object.assign(IMP, achado);
    IMP.previa = impMontaPrevia(st());
  } catch (e) {
    IMP.erro = e.message;
    Object.assign(IMP, { linhas: null, mapa: null, previa: null });
  }
  IMP.ocupado = false;
  painelImportacao();
}

function otimPromptSistema() {
  return `Você apoia o Dimensionamento da Força de Trabalho (DFT) do Estado do Paraná.
Sua tarefa é estimar, para cada CATEGORIA DE ATIVIDADE, dois percentuais distintos.

AS DUAS DIMENSÕES — não as confunda, elas entram em contas diferentes:

1. PRODUTIVIDADE (potProdutividade): quanto do TEMPO de execução some porque a
   mesma entrega passa a ser feita mais rápido. A entrega continua existindo e
   continua sendo demandada na mesma quantidade. Reduz horas por entrega.

2. DEMANDA (potDemanda): quanto do NÚMERO de entregas deixa de ser demandado
   porque a necessidade desaparece — o cidadão se autoatende, o dado passa a ser
   consultado na fonte, a exigência é extinta. A entrega deixa de chegar.
   Não é "fazer mais rápido"; é "não precisar mais fazer".

REGRAS DE ESTIMATIVA
- Ancore cada número no corpus fornecido. Prefira o estudo cujo ESCOPO mais se
  parece com a categoria. Cite os ids usados.
- Corrija para baixo o efeito de estudo cuja tarefa é mais curta, mais fechada e
  mais verificável que o trabalho administrativo real. Copilot e redação isolada
  são teto, não média.
- Aplique a cautela de Acemoglu: exposição não é automação; parte do que é
  tecnicamente automatizável não se realiza por norma, controle ou revisão
  humana obrigatória. No setor público, ato administrativo costuma exigir
  responsável identificado — isso limita o ganho.
- DEMANDA: o corpus registra que NÃO há evidência experimental para esse eixo.
  Seja conservador. Só proponha demanda acima de 10% quando o mecanismo de
  desaparecimento for concreto e nomeável (ex.: autoatendimento que substitui
  atendimento presencial; consulta a base que dispensa pedido de certidão).
  Em atividade de decisão, fiscalização ou elaboração, demanda normalmente é 0.
- Percentuais inteiros de 0 a 100. Nada de faixa: um número por dimensão.
- Cada estimativa recebe confianca: "alta", "media" ou "baixa".

RESPONDA SÓ COM O JSON, sem cercas de código, neste formato:
{
  "categorias": [
    {
      "categoriaId": "cat1",
      "potProdutividade": 30,
      "potDemanda": 5,
      "confiancaProdutividade": "alta",
      "confiancaDemanda": "baixa",
      "racional": "2 a 4 frases explicando COMO chegou aos números: de qual estudo partiu, que ajuste aplicou e por quê.",
      "fontes": ["noy2023", "acemoglu2024"],
      "ressalva": "O principal fator que pode invalidar esta estimativa."
    }
  ],
  "notaGeral": "Uma observação sobre o conjunto, se houver."
}`;
}

Desenho: ${e.desenho} · Amostra: ${e.amostra}
Efeito medido: ${e.efeito}

Limite: ${e.limite}`).join('\n\n');

  const cats = s.categoriasIA.map(c => {
    const usos = s.entregas.filter(e => (e.categoriasAtividade || [])
      .some(x => x.categoriaId === c.id));
    const exemplos = usos.slice(0, 6).map(e => e.titulo);
    return `--- ${c.id}: ${c.nome}
Valores atuais no sistema: produtividade ${c.potProdutividade != null ? c.potProdutividade : 0}% · demanda ${c.potDemanda || 0}%
Entregas que usam esta categoria: ${usos.length}${exemplos.length ? '\nExemplos: ' + exemplos.join('; ') : ''}`;
  }).join('\n\n');

  return [
    { type: 'text', text: `--- CORPUS DE EVIDÊNCIA ---\n\n${corpus}` },
    { type: 'text', text: `--- CATEGORIAS A ESTIMAR ---\n\n${cats}` },
    { type: 'text', text: `Contexto: administração pública direta e autárquica do Estado do Paraná. ` +
        `As entregas são atos e serviços administrativos, sujeitos a norma, tramitação e responsável identificado. ` +
        `Estime agora as ${s.categoriasIA.length} categorias. Responda só o JSON.` }
  ];
}

async function otimChamar(s) {
  const chave = dftChaveIA();
  if (!chave) throw new Error('Informe a chave da API na aba Mapear entregas de qualquer unidade, ' +
    'ou deixe-a em chave-local.js.');

  const resp = await fetch(DFT_IA_URL, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': chave,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: DFT_OTIM_MODELO,
      max_tokens: 4000,
      system: otimPromptSistema(),
      messages: [{ role: 'user', content: otimBlocosConteudo(s) }]
    })
  });

  if (!resp.ok) {
    let detalhe = '';
    try { const j = await resp.json(); detalhe = (j.error && j.error.message) || ''; }
    catch (e) { /* corpo não era JSON */ }
    if (resp.status === 401) throw new Error('Chave da API recusada.');
    if (resp.status === 429) throw new Error('Limite de requisições por minuto atingido. Espere e tente de novo.');
    if (resp.status === 400 && /credit|balance/i.test(detalhe)) {
      throw new Error('A conta da API está sem créditos. Eles são comprados no console da Anthropic, ' +
        'em Plans & Billing — assinatura do Claude.ai não cobre uso de API.');
    }
    throw new Error(`A API respondeu ${resp.status}. ${detalhe}`);
  }

  const dados = await resp.json();
  const txt = (dados.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  const limpo = txt.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(limpo); }
  catch (e) {
    const i = limpo.indexOf('{'), f = limpo.lastIndexOf('}');
    if (i >= 0 && f > i) return JSON.parse(limpo.slice(i, f + 1));
    throw new Error('A resposta não veio em JSON válido. Tente novamente.');
  }
}

async function otimEstimar() {
  const s = st();
  OTIM.erro = ''; OTIM.ocupado = true; OTIM.proposta = null;
  telaCargosIA();
  try {
    const r = await otimChamar(s);
    const porId = {};
    (r.categorias || []).forEach(c => { porId[c.categoriaId] = c; });
    // só entra o que corresponde a uma categoria existente
    OTIM.proposta = {
      quando: new Date().toISOString(),
      modelo: DFT_OTIM_MODELO,
      notaGeral: r.notaGeral || '',
      itens: s.categoriasIA.filter(c => porId[c.id]).map(c => Object.assign(
        { categoriaId: c.id, nome: c.nome, antesProd: c.potProdutividade != null ? c.potProdutividade : 0, antesDem: c.potDemanda || 0 },
        porId[c.id]
      ))
    };
    if (!OTIM.proposta.itens.length) {
      OTIM.erro = 'A IA não devolveu estimativa para nenhuma categoria conhecida.';
      OTIM.proposta = null;
    }
  } catch (e) {
    OTIM.erro = /Failed to fetch|NetworkError|Load failed/i.test(e.message)
      ? 'O navegador não conseguiu chamar a API — a requisição não chegou a sair. ' +
        'Abrindo a página do disco (file://) isso acontece: sirva a pasta com o abrir.cmd ou o abrir.sh.'
      : e.message;
  }
  OTIM.ocupado = false;
  telaCargosIA();
}

// grava a estimativa na categoria, junto do racional e das fontes, para que o
// "?" continue explicando o número depois de salvo
function otimSalvar() {
  const s = st();
  OTIM.proposta.itens.forEach(it => {
    const c = s.categoriasIA.find(x => x.id === it.categoriaId);
    if (!c) return;
    c.potProdutividade = Math.max(0, Math.min(100, Number(it.potProdutividade) || 0));
    c.potDemanda = Math.max(0, Math.min(100, Number(it.potDemanda) || 0));
    c.evidencia = it.racional || c.evidencia || '';
    c.baseIA = {
      racional: it.racional || '', ressalva: it.ressalva || '',
      fontes: it.fontes || [],
      confiancaProdutividade: it.confiancaProdutividade || '',
      confiancaDemanda: it.confiancaDemanda || '',
      quando: OTIM.proposta.quando, modelo: OTIM.proposta.modelo
    };
  });
  Store.salvar();
  OTIM.proposta = null;
  telaCargosIA();
}

          <h4>Referências usadas</h4>
          ${usadas.length ? `<ol class="otim-refs">${usadas.map(f => `
            <li>

function iaCategorias(corpo, s, podeEditar) {

    usoPorCat[c.categoriaId] = (usoPorCat[c.categoriaId] || 0) + 1;
  }));

  /* ---------- escopo do gráfico: órgão / unidade dentro do que o perfil enxerga ---------- */
  const permitidas = escopoUnidades(s, p);
  const orgaosDisp = [...new Set(permitidas.map(u => u.orgao))].sort();
  const orgSel = iaCategorias._orgao && orgaosDisp.includes(iaCategorias._orgao) ? iaCategorias._orgao : '';
  const unidadesDisp = permitidas.filter(u => !orgSel || u.orgao === orgSel)
    .sort((a, b) => a.sigla < b.sigla ? -1 : 1);

    ? iaCategorias._unidade : '';

  // define os quadrantes, para que a cor do ponto bata com a linha desenhada.
  const maxEixo = Math.max(...pts.map(x => Math.max(x.horasProd, x.horasDem)), 1) * 1.1;
  const totalAnual = Calc.sum(pts.map(x => x.custoAnual));

      <label>Unidade <select id="ia-cat-unidade" class="input">

  const alvoGr = document.getElementById('gr-cats');
  if (!pts.length) {
    alvoGr.innerHTML = `<p class="vazio">Nenhuma entrega do escopo tem categorias de atividade cadastradas com
      produção lançada — sem isso não há horas para converter em potencial.</p>`;
  } else {
    Charts.bubble(alvoGr, {
      pontos: pts.map(m => {
        const rx = m.horasProd / maxEixo * 100, ry = m.horasDem / maxEixo * 100;
        const q = QUADRANTES_CAT.find(q => q.teste(rx, ry));
        return {
          x: m.horasProd, y: m.horasDem, tam: m.custoAnual,
          label: m.nome, cor: q.cor, grupo: q.nome,
          sub: `${fmtN(m.entregas)} entrega(s) · ${fmtN(m.cargos)} cargo(s) · ${fmtN(m.unidades)} unidade(s)`
            + `<br>Potenciais: produtividade ${fmtN(m.potProdutividade)}% · demanda ${fmtN(m.potDemanda)}%`
            + `<br>Equivale a ${fmtN(m.fte, 1)} servidor(es)`
        };
      }),
      maxX: maxEixo, maxY: maxEixo,
      fmtX: v => Charts.fmtBR(v, v < 10 ? 1 : 0) + ' h',
      fmtY: v => Charts.fmtBR(v, v < 10 ? 1 : 0) + ' h',
      fmtTam: v => fmtBRLcomp(v) + '/ano',
      rotuloX: 'Tempo liberado na execução', rotuloY: 'Tempo liberado pela queda de demanda',
      rotuloTam: 'Economia',
      xLabel: 'Horas/mês liberadas por PRODUTIVIDADE (a entrega consome menos tempo) →',
      yLabel: 'Horas/mês pela DEMANDA →',
      grupos: QUADRANTES_CAT.map(q => ({ nome: q.nome, cor: q.cor })),
      altura: 440,
      colunas: ['Categoria', 'Horas/mês (produtividade)', 'Horas/mês (demanda)', 'Economia R$/ano', 'Entregas', 'Quadrante'],
      linhaTabela: pt => {
        const m = pts.find(x => x.nome === pt.label) || {};
        return [pt.label, fmtN(pt.x, 1) + ' h', fmtN(pt.y, 1) + ' h', fmtBRLcomp(pt.tam), fmtN(m.entregas || 0), pt.grupo];
      }
    });
  }

  const selOrg = document.getElementById('ia-cat-orgao');
  if (selOrg) selOrg.addEventListener('change', e => {
    iaCategorias._orgao = e.target.value; iaCategorias._unidade = ''; telaCargosIA();
  });
  const selUni = document.getElementById('ia-cat-unidade');
  if (selUni) selUni.addEventListener('change', e => {
    iaCategorias._unidade = e.target.value; telaCargosIA();
  });

  corpo.querySelectorAll('[data-cat]').forEach(inp => inp.addEventListener('change', () => {
    const c = s.categoriasIA.find(x => x.id === inp.dataset.cat);
    c[inp.dataset.pot] = Math.max(0, Math.min(100, Number(inp.value) || 0));
    Store.salvar(); telaCargosIA();
  }));
  corpo.querySelectorAll('[data-cat-ev]').forEach(inp => inp.addEventListener('change', () => {
    const c = s.categoriasIA.find(x => x.id === inp.dataset.catEv);
    c.evidencia = inp.value;
    Store.salvar();
  }));
  otimLiga(corpo, podeEditar);
  corpo.querySelectorAll('[data-base]').forEach(b =>
    b.addEventListener('click', () => otimAbreDetalhe(b.dataset.base)));

  const btnNova = document.getElementById('btn-nova-cat');
  if (btnNova) btnNova.addEventListener('click', () => {
    const nome = prompt('Nome da nova categoria de atividade:');
    if (!nome) return;
    s.categoriasIA.push({ id: Store.novoId('cat', s.categoriasIA), nome: nome.trim(), potProdutividade: 0, potDemanda: 0, evidencia: '' });
    Store.salvar(); telaCargosIA();
  });
}

function iaCarreiras(corpo, s, podeEditar) {
  const contagem = {};
  s.servidores.forEach(x => { contagem[x.cargoId] = (contagem[x.cargoId] || 0) + 1; });
  const maxCont = Math.max(...Object.values(contagem), 1);
  const pontos = s.cargos.filter(c => contagem[c.id]).map(c => {
    const ia = s.cargoIA[c.id] || { potProdutividade: 0, potDemanda: 0, evidencia: '' };
    const pProd = ia.potProdutividade != null ? ia.potProdutividade : (ia.potencial || 0);
    const pDem = ia.potDemanda || 0;
    const x = Math.round((1 - (1 - pProd / 100) * (1 - pDem / 100)) * 100); // efeito combinado
    const y = contagem[c.id] / maxCont * 100;
    const q = QUADRANTES_IA.find(q => q.teste(x, y));
    return { cargo: c, ia, x, y, tam: contagem[c.id], cor: q.cor, grupo: q.nome };
  });

  corpo.innerHTML = `
  <div class="card card-larga">
    <h3>Matriz potencial × volume ${tipInfo('Cada bolha é uma carreira; o tamanho é proporcional ao número de servidores. Quadrantes: alto potencial + alto volume = ação imediata; alto potencial + baixo volume = planejar transição; baixo potencial + alto volume = oportunidade de ganho gradual; o restante, monitorar.')}</h3>
    <div id="gr-ia"></div>
  </div>
  <div class="card card-larga">
    <h3>Potencial de otimização por carreira ${podeEditar ? '' : tipInfo('Somente os gestores SEAP e de RH Setorial editam o potencial.')}</h3>
    <div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>Carreira</th><th class="num">Servidores</th>
        <th class="num">Produtividade (%) ${tipInfo('Redução esperada do tempo das tarefas típicas da carreira.')}</th>
        <th class="num">Demanda (%) ${tipInfo('Redução esperada do volume de trabalho demandado à carreira.')}</th>
        <th>Recomendação</th><th>Evidência da estimativa</th></tr></thead>
      <tbody>${pontos.map(pt => `<tr>
        <td style="font-weight:600">${E(pt.cargo.nome)}</td>
        <td class="num mono">${fmtN(pt.tam)}</td>
        <td class="num"><input type="number" min="0" max="100" class="input num-in curta" data-ia="${pt.cargo.id}" data-pot="potProdutividade"
          value="${pt.ia.potProdutividade != null ? pt.ia.potProdutividade : (pt.ia.potencial || 0)}" ${podeEditar ? '' : 'disabled'}></td>
        <td class="num"><input type="number" min="0" max="100" class="input num-in curta" data-ia="${pt.cargo.id}" data-pot="potDemanda"
          value="${pt.ia.potDemanda || 0}" ${podeEditar ? '' : 'disabled'}></td>
        <td><span class="badge mini" style="background:${pt.cor}22;color:${pt.cor}">● ${pt.grupo}</span></td>
        <td><input type="text" class="input" style="width:100%" data-ia-ev="${pt.cargo.id}"
          value="${E(pt.ia.evidencia || '')}" placeholder="Fonte ou piloto que sustenta a estimativa…" ${podeEditar ? '' : 'disabled'}></td>
      </tr>`).join('')}</tbody>
    </table></div>
    <p class="nota-calculo">A visão por carreira orienta requalificação e recolocação. A redução de demanda do DFT
    projetado vem das <em>categorias de atividade</em> de cada entrega.</p>
  </div>`;

  Charts.bubble(document.getElementById('gr-ia'), {
    pontos: pontos.map(pt => ({ x: pt.x, y: pt.y, tam: pt.tam, label: pt.cargo.nome, cor: pt.cor, grupo: pt.grupo })),
    xLabel: 'Potencial de otimização →',
    yLabel: 'Volume de servidores →',
    grupos: QUADRANTES_IA.map(q => ({ nome: q.nome, cor: q.cor }))
  });

  corpo.querySelectorAll('[data-ia]').forEach(inp => inp.addEventListener('change', () => {
    s.cargoIA[inp.dataset.ia] = s.cargoIA[inp.dataset.ia] || {};
    s.cargoIA[inp.dataset.ia][inp.dataset.pot] = Math.max(0, Math.min(100, Number(inp.value) || 0));
    Store.salvar(); telaCargosIA();
  }));
  corpo.querySelectorAll('[data-ia-ev]').forEach(inp => inp.addEventListener('change', () => {
    s.cargoIA[inp.dataset.iaEv] = s.cargoIA[inp.dataset.iaEv] || {};
    s.cargoIA[inp.dataset.iaEv].evidencia = inp.value;
    Store.salvar();
  }));
}

function subnavItp(ativo) {
  setSubnav('ITP', [
    { id: 'parametros', rotulo: 'Parâmetros por cargo', ico: 'itp', ativo: ativo === 'parametros', hash: '#/itp' },
    { id: 'absenteismo', rotulo: 'Absenteísmo', ico: 'calend', ativo: ativo === 'absenteismo', hash: '#/itp/absenteismo' },
    { id: 'treinamentos', rotulo: 'Treinamentos & projetos', ico: 'relatorios', ativo: ativo === 'treinamentos', hash: '#/itp/treinamentos' },
    { id: 'unidades', rotulo: 'Visualização por unidade', ico: 'predio', ativo: ativo === 'unidades', hash: '#/itp/unidades' }
  ]);
}

function telaItp(secao) {
  if (secao === 'unidades') return telaItpUnidades();
  if (secao === 'absenteismo') return telaItpAfastamentos('absenteismo');
  if (secao === 'treinamentos') return telaItpAfastamentos('treinamentos');
  telaItpParametros();
}

/* ---- Absenteísmo / Treinamentos & projetos (registro do RH setorial) ---- */
function telaItpAfastamentos(secao) {
  const s = st();
  const p = perfilAtual();
  subnavItp(secao);
  const podeEditar = p.id === 'seap' || p.id === 'rh';
  const ehAbs = secao === 'absenteismo';
  // O absenteísmo é lançado separado por NATUREZA: o que é direito do servidor não pode
  // ser cobrado como desempenho, e só o que é gerenciável vira meta.
  const campos = ehAbs
    ? [['ausenciaAmparadaDias', NATUREZA_AUSENCIA.amparada.nome],
       ['ausenciaInjustificadaDias', NATUREZA_AUSENCIA.gerenciavel.nome]]
    : [['treinamentoDias', 'Treinamentos'], ['projetosDias', 'Projetos especiais']];
  const campoSel = telaItpAfastamentos._campo && campos.some(c => c[0] === telaItpAfastamentos._campo)
    ? telaItpAfastamentos._campo : campos[0][0];
  telaItpAfastamentos._campo = campoSel;

  const orgaos = p.orgao ? s.orgaos.filter(o => o.id === p.orgao) : s.orgaos;
  const orgaoSel = telaItpAfastamentos._orgao && orgaos.some(o => o.id === telaItpAfastamentos._orgao)
    ? telaItpAfastamentos._orgao : orgaos[0].id;
  let unidadesO = s.unidades.filter(u => u.orgao === orgaoSel && Calc.lotacaoUnidade(s, u.id).length);
  if (p.unidadeId) unidadesO = unidadesO.filter(u => u.id === p.unidadeId);
  const uniSel = telaItpAfastamentos._uni && unidadesO.some(u => u.id === telaItpAfastamentos._uni)
    ? telaItpAfastamentos._uni : (unidadesO[0] || {}).id;
  telaItpAfastamentos._orgao = orgaoSel; telaItpAfastamentos._uni = uniSel;

  const ano = s.anoReferencia;
  const meses = Calc.mesesDoAno(ano);
  const cargosU = uniSel ? Calc.lotacaoUnidade(s, uniSel) : [];
  const reg = (cId, mes) => (s.afastamentos || []).find(a =>
    a.unidadeId === uniSel && a.cargoId === cId && a.mes === mes);

  // resumo por natureza da unidade selecionada (só faz sentido na aba de absenteísmo)
  const resumoNat = {};
  if (ehAbs && uniSel) {
    NATUREZAS.forEach(n => {
      const arg = n === 'total' ? null : n;
      resumoNat[n] = {
        abs: Calc.absenteismoAgregado(s, [uniSel], null, ano, arg),
        custo: Calc.custoAbsenteismo(s, new Set([uniSel]), null, ano, arg),
        dias: Calc.sum((s.afastamentos || [])
          .filter(a => a.unidadeId === uniSel && a.mes.startsWith(String(ano)))
          .map(a => Calc.diasAusenciaReg(a, arg)))
      };
    });
  }

  app().innerHTML = `
  ${cabecalhoPagina(ehAbs ? 'Absenteísmo' : 'Treinamentos & projetos especiais',
    (ehAbs ? 'Dias de ausência separados por natureza — amparado (direito) e gerenciável (falta sem amparo) — '
      : 'Dias em treinamentos e em projetos especiais ') +
    'por unidade, cargo e mês — dias TOTAIS somando os servidores do cargo. ' +
    tipInfo('Preenchido pelo RH SETORIAL (e pela SEAP). É a base do ITP calculado: horário disponível = horário legal × ITP, onde o ITP desconta a média de dias por servidor. Cargos configurados como “fixo” usam o valor MGI e ignoram estes registros.' +
      (ehAbs ? ' O ITP desconta as DUAS naturezas (a capacidade some do mesmo jeito); a separação existe para a gestão saber sobre qual parcela pode agir. No sistema real ela vem do código da ocorrência do relatório Meta4 "19 - Relatório de Ocorrência de Frequência".' : '')),
    null, 'ITP')}
  ${podeEditar ? '' : '<div class="banner info">Somente o <strong>Gestor de RH Setorial</strong> (e a SEAP) pode editar estes registros — visualização apenas.</div>'}
  <div class="filtros">
    <label>Órgão <select id="af-orgao" class="input" ${orgaos.length === 1 ? 'disabled' : ''}>${orgaos.map(o =>
      `<option ${o.id === orgaoSel ? 'selected' : ''}>${E(o.id)}</option>`).join('')}</select></label>
    <label>Unidade <select id="af-uni" class="input" ${unidadesO.length <= 1 ? 'disabled' : ''}>${unidadesO.map(u =>
      `<option value="${u.id}" ${u.id === uniSel ? 'selected' : ''}>${E(u.sigla)} — ${E(u.nome)}</option>`).join('')}</select></label>
    ${campos.length > 1 ? `<div class="vista-sel" style="display:flex;gap:7px;align-items:end">
      ${campos.map(([id, nome]) => `<button class="btn-toggle ${campoSel === id ? 'ativo' : ''}" data-af-campo="${id}">${nome}</button>`).join('')}
    </div>` : ''}
    <span class="muted mini" style="align-self:end">ano de referência: <strong>${ano}</strong></span>
  </div>
  ${!uniSel ? '<p class="vazio">Nenhuma unidade com quadro no escopo.</p>' : `
  ${ehAbs ? `<div class="card card-larga">
    <h3>Natureza da ausência nesta unidade — ${ano}
      ${tipInfo('AMPARADO: ' + NATUREZA_AUSENCIA.amparada.dica + ' GERENCIÁVEL: ' + NATUREZA_AUSENCIA.gerenciavel.dica)}</h3>
    <div class="grid-stats" style="margin-top:12px">
      ${NATUREZAS.map(n => {
    const r = resumoNat[n] || {};
    const meta = NATUREZA_AUSENCIA[n];
    const tot = (resumoNat.total || {}).dias || 0;
    return `<div class="stat">
        <span class="stat-label" style="color:${meta.cor}">${meta.nome}</span>
        <span class="stat-valor">${r.abs ? fmtN(r.abs.taxa * 100, 1) + '%' : '—'}</span>
        <span class="stat-sub">${fmtN(r.dias || 0)} dia(s) no ano${n !== 'total' && tot > 0 ? ' · ' + fmtN((r.dias || 0) / tot * 100, 0) + '% do total' : ''}
          ${r.custo ? '<br>' + fmtBRLcomp(r.custo.anual) + '/ano de folha' : ''}</span></div>`;
  }).join('')}
    </div>
    <p class="nota-calculo">As duas naturezas descontam capacidade da mesma forma e entram inteiras no ITP.
    A separação serve à gestão: <strong>meta de redução só cabe sobre o gerenciável</strong> — cobrar redução de
    licença é cobrar que o servidor abra mão de um direito.</p>
  </div>` : ''}
  <div class="card card-larga">
    <h3>${campos.find(c => c[0] === campoSel)[1]} — dias totais por mês
      ${ehAbs ? tipInfo(NATUREZA_AUSENCIA[campoSel === 'ausenciaAmparadaDias' ? 'amparada' : 'gerenciavel'].dica) : ''}</h3>
    <div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>Cargo</th>${meses.map(m => `<th class="num">${Calc.fmtMes(m).split('/')[0]}</th>`).join('')}
        <th class="num">ITP resultante ${tipInfo('ITP do cargo nesta unidade considerando TODOS os afastamentos registrados (ausências + treinamentos + projetos) no ano.')}</th></tr></thead>
      <tbody>${cargosU.map(l => {
        const itp = Calc.itpCalculado(s, uniSel, l.cargoId, ano);
        return `<tr>
          <td>${E(nomeCargo(l.cargoId))} <span class="muted mini">${l.quantidade} serv.</span></td>
          ${meses.map(m => {
            const r = reg(l.cargoId, m);
            return `<td class="num"><input type="number" min="0" class="input num-in" style="width:52px"
              data-af="${l.cargoId}|${m}" value="${r ? (r[campoSel] || 0) : ''}" placeholder="0" ${podeEditar ? '' : 'disabled'}></td>`;
          }).join('')}
          <td class="num mono" style="font-weight:700">${itp.itp != null ? fmtN(itp.itp * 100, 1) + '%' : '—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <p class="nota-calculo">Dias totais do cargo no mês (ex.: 3 servidores × 2 dias = 6). O sistema divide pela
    quantidade de servidores para obter a média individual usada no ITP.</p>
  </div>`}`;

  const selO = document.getElementById('af-orgao');
  if (selO && !selO.disabled) selO.addEventListener('change', e => {
    telaItpAfastamentos._orgao = e.target.value; telaItpAfastamentos._uni = null; telaItpAfastamentos(secao);
  });
  const selU = document.getElementById('af-uni');
  if (selU && !selU.disabled) selU.addEventListener('change', e => {
    telaItpAfastamentos._uni = e.target.value; telaItpAfastamentos(secao);
  });
  app().querySelectorAll('[data-af-campo]').forEach(b => b.addEventListener('click', () => {
    telaItpAfastamentos._campo = b.dataset.afCampo; telaItpAfastamentos(secao);
  }));
  app().querySelectorAll('[data-af]').forEach(inp => inp.addEventListener('change', () => {
    const [cId, mes] = inp.dataset.af.split('|');
    let r = reg(cId, mes);
    if (!r) {
      r = { id: Store.novoId('af', s.afastamentos), unidadeId: uniSel, cargoId: cId, mes,
        ausenciaDias: 0, ausenciaAmparadaDias: 0, ausenciaInjustificadaDias: 0,
        treinamentoDias: 0, projetosDias: 0 };
      (s.afastamentos = s.afastamentos || []).push(r);
    }
    // registro antigo (só com o total): migra o total para "amparada" antes de editar
    if (r.ausenciaAmparadaDias == null && r.ausenciaInjustificadaDias == null) {
      r.ausenciaAmparadaDias = r.ausenciaDias || 0;
      r.ausenciaInjustificadaDias = 0;
    }
    r[campoSel] = Math.max(0, Number(inp.value) || 0);
    // ausenciaDias continua sendo o TOTAL — é o que o ITP e os consumidores antigos leem
    r.ausenciaDias = (r.ausenciaAmparadaDias || 0) + (r.ausenciaInjustificadaDias || 0);
    Store.salvar(); telaItpAfastamentos(secao);
  }));
}

  const s = st();
  const p = perfilAtual();
  subnavItp('parametros');
  const globais = Calc.itpGlobais(s, s.anoReferencia);
  const podeEditarFixo = p.id === 'seap';

  app().innerHTML = `
  ${cabecalhoPagina('Índice de Tempo Produtivo',
    'Fração do horário legal que fica efetivamente disponível para as entregas. ' +
    tipInfo('Horário disponível = horário legal mensal × ITP. O ITP é calculado a partir dos afastamentos registrados pelo RH setorial (absenteísmo, treinamentos e projetos especiais) — ou definido de forma fixa com base na literatura (MGI).'),
    null, 'ITP')}
  <div class="grid-stats">
    <div class="stat">
      <span class="stat-label">ITP fixo — área meio ${tipInfo('Valor de referência da literatura (MGI). Aplicado às unidades/cargos configurados como “fixo”. Editável apenas pelo Gestor SEAP.')}</span>
      <span class="stat-valor">${podeEditarFixo
        ? `<input type="number" id="itp-fixo" class="input num-in grande" step="0.1" min="1" max="100" value="${s.itpFixoMeio}">%`
        : `${fmtN(s.itpFixoMeio, 1)}%`}</span>
      <span class="stat-sub">referência MGI</span>
    </div>
    <div class="stat">
      <span class="stat-label">ITP área finalística ${tipInfo('Mediana dos ITPs calculados pelos afastamentos (RH setorial) nas unidades finalísticas.')}</span>
      <span class="stat-valor">${globais.fim != null ? fmtN(globais.fim * 100, 1) + '%' : '—'}</span>
      <span class="stat-sub">mediana das unidades</span>
    </div>
    <div class="stat">
      <span class="stat-label">ITP área meio (calculado) ${tipInfo('Mediana dos ITPs calculados pelos afastamentos (RH setorial) nas unidades da área meio com registros.')}</span>
      <span class="stat-valor">${globais.meio != null ? fmtN(globais.meio * 100, 1) + '%' : '—'}</span>
      <span class="stat-sub">mediana das unidades</span>
    </div>
  </div>
  <div class="card card-larga">
    <h3>Método por cargo ${tipInfo('O método do ITP é definido POR CARGO para todo o Estado: “Fixo (MGI)” usa o percentual de referência da literatura; “Calculado” usa os afastamentos registrados pelo RH setorial (Absenteísmo e Treinamentos & projetos). Editável pelo Gestor SEAP.')}</h3>
    <table class="tabela">
      <thead><tr><th>Cargo</th><th>Método</th>
        <th class="num">Horário legal mensal ${tipInfo('Jornada semanal típica × 4,33 semanas.')}</th>
        <th class="num">ITP ${tipInfo('Fixo: valor MGI. Calculado: mediana dos ITPs do cargo nas unidades com afastamentos registrados.')}</th>
        <th class="num">Horário disponível ${tipInfo('Horário legal × ITP: horas que efetivamente ficam disponíveis para as entregas.')}</th></tr></thead>
      <tbody>${s.cargos.map(c => {
        const met = (s.itpCargo || {})[c.id] || 'fixo';
        // mediana do ITP calculado do cargo entre as unidades com registros
        const vals = [];
        s.unidades.forEach(u => {
          const r = Calc.itpCalculado(s, u.id, c.id, s.anoReferencia);
          if (r.itp != null) vals.push(r.itp);
        });
        const itpCalc = vals.length ? Calc.median(vals) : null;
        const itpUso = met === 'calculado' && itpCalc != null ? itpCalc : s.itpFixoMeio / 100;
        const legal = 40 * Calc.SEMANAS_MES;
        return `<tr>
          <td>${E(c.nome)}</td>
          <td><select class="input" data-itp-cargo-global="${c.id}" ${p.id === 'seap' ? '' : 'disabled'}>
            <option value="fixo" ${met === 'fixo' ? 'selected' : ''}>Fixo — ${fmtN(s.itpFixoMeio, 1)}% (MGI)</option>
            <option value="calculado" ${met === 'calculado' ? 'selected' : ''}>Calculado (afastamentos do RH)</option>
          </select></td>
          <td class="num mono">${fmtN(legal, 0)} h</td>
          <td class="num mono" style="font-weight:700">${fmtN(itpUso * 100, 1)}%${met === 'calculado' && itpCalc == null ? ' <span class="muted mini">(sem registros — usando fixo)</span>' : ''}</td>
          <td class="num mono">${fmtN(legal * itpUso, 0)} h</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <p class="nota-calculo">Registros de afastamentos: abas <a href="#/itp/absenteismo">Absenteísmo</a> e
    <a href="#/itp/treinamentos">Treinamentos & projetos</a> (preenchimento do RH setorial).</p>
  </div>`;

  const inp = document.getElementById('itp-fixo');
  if (inp) inp.addEventListener('change', e => {
    s.itpFixoMeio = Number(e.target.value) || 81.5;
    Store.salvar(); telaItpParametros();
  });
  app().querySelectorAll('[data-itp-cargo-global]').forEach(sel => sel.addEventListener('change', () => {
    s.itpCargo = s.itpCargo || {};
    s.itpCargo[sel.dataset.itpCargoGlobal] = sel.value;
    Store.salvar(); telaItpParametros();
  }));
}

function telaItpUnidades() {
  const s = st();
  const p = perfilAtual();
  subnavItp('unidades');
  const ano = s.anoReferencia;
  let unidadesItp = s.unidades.filter(u => Calc.lotacaoUnidade(s, u.id).length);
  if (p.orgao) unidadesItp = unidadesItp.filter(u => u.orgao === p.orgao);
  if (p.unidadeId) unidadesItp = unidadesItp.filter(u => u.id === p.unidadeId);
  const uniSel = telaItpUnidades._unidade && unidadesItp.some(u => u.id === telaItpUnidades._unidade)
    ? telaItpUnidades._unidade : unidadesItp[0].id;
  telaItpUnidades._unidade = uniSel;
  const u = Calc.unidade(s, uniSel);
  const cfg = s.itpConfig[uniSel] || {};
  const metodoUni = cfg.metodo || (u.funcao === 'Meio' ? 'fixo' : 'calculado');
  const lot = Calc.lotacaoUnidade(s, uniSel);

  const linhas = lot.map(l => {
    const ef = Calc.itpEfetivo(s, uniSel, l.cargoId, ano);
    const legal = Calc.horasMensais(s, uniSel, l.cargoId);
    const disponivel = legal * ef.itp;
    return `<tr>
      <td>${E(nomeCargo(l.cargoId))}</td>
      <td><select class="input" data-itp-cargo="${l.cargoId}">
        <option value="" ${!(cfg.porCargo || {})[l.cargoId] ? 'selected' : ''}>— da unidade (${metodoUni === 'fixo' ? 'fixo' : 'calculado'})</option>
        <option value="fixo" ${(cfg.porCargo || {})[l.cargoId] === 'fixo' ? 'selected' : ''}>Fixo (${fmtN(s.itpFixoMeio, 1)}%)</option>
        <option value="calculado" ${(cfg.porCargo || {})[l.cargoId] === 'calculado' ? 'selected' : ''}>Calculado pela produção</option>
      </select></td>
      <td class="num mono">${fmtN(legal, 0)} h</td>
      <td class="num"><strong class="mono">${fmtN(ef.itp * 100, 1)}%</strong> <span class="muted mini">${ef.metodo}</span></td>
      <td class="num mono" style="color:var(--verde-txt);font-weight:700">${fmtN(disponivel, 0)} h</td>
    </tr>`;
  }).join('');

  app().innerHTML = `
  ${cabecalhoPagina('Método por unidade',
    'Todos os cargos herdam o método da unidade; cada cargo pode ser ajustado individualmente. ' +
    tipInfo('Fixo: usa o percentual de referência da literatura (área meio). Calculado: usa as ausências, treinamentos e projetos externos lançados na Produção. Horário disponível = horário legal × ITP.'),
    null, 'ITP')}
  <div class="filtros">
    <label>Unidade <select id="itp-unidade" class="input" ${unidadesItp.length === 1 ? 'disabled' : ''}>
      ${unidadesItp.map(x => `<option value="${x.id}" ${x.id === uniSel ? 'selected' : ''}>${E(x.orgao)} / ${E(x.sigla)} — ${E(x.nome)}</option>`).join('')}
    </select></label>
    <label>Método da unidade <select id="itp-metodo" class="input">
      <option value="fixo" ${metodoUni === 'fixo' ? 'selected' : ''}>Fixo — ${fmtN(s.itpFixoMeio, 1)}% (área meio)</option>
      <option value="calculado" ${metodoUni === 'calculado' ? 'selected' : ''}>Calculado pela produção</option>
    </select></label>
  </div>
  <div class="card card-larga">
    <h3>Cargos da unidade</h3>
    <table class="tabela">
      <thead><tr><th>Cargo</th><th>Método</th>
        <th class="num">Horário legal mensal ${tipInfo('Jornada semanal × 4,33 semanas.')}</th>
        <th class="num">ITP</th>
        <th class="num">Horário disponível ${tipInfo('Horário legal × ITP: horas que efetivamente ficam disponíveis para as entregas no mês.')}</th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="5" class="vazio">Cadastre servidores para esta unidade na tela Cargos.</td></tr>'}</tbody>
    </table>
  </div>`;

  const selU = document.getElementById('itp-unidade');
  if (!selU.disabled) selU.addEventListener('change', e => {
    telaItpUnidades._unidade = e.target.value; telaItpUnidades();
  });
  document.getElementById('itp-metodo').addEventListener('change', e => {
    s.itpConfig[uniSel] = s.itpConfig[uniSel] || {};
    s.itpConfig[uniSel].metodo = e.target.value;
    Store.salvar(); telaItpUnidades();
  });
  app().querySelectorAll('[data-itp-cargo]').forEach(sel => sel.addEventListener('change', () => {
    s.itpConfig[uniSel] = s.itpConfig[uniSel] || {};
    s.itpConfig[uniSel].porCargo = s.itpConfig[uniSel].porCargo || {};
    if (sel.value) s.itpConfig[uniSel].porCargo[sel.dataset.itpCargo] = sel.value;
    else delete s.itpConfig[uniSel].porCargo[sel.dataset.itpCargo];
    Store.salvar(); telaItpUnidades();
  }));
}

function telaAutorizacoes() {
  const s = st();
  const pendentes = (s.solicitacoes || []).filter(x => x.status === 'pendente');
  const historico = (s.solicitacoes || []).filter(x => x.status !== 'pendente');
  setSubnav('Visão geral', [
    { id: 'geral', rotulo: 'Dashboard executivo', ico: 'grafico', hash: '#/inicio' },
    { id: 'aut', rotulo: 'Autorizações', ico: 'docok', ativo: true, hash: '#/autorizacoes', badge: pendentes.length || null }
  ]);
  const linha = x => {
    const u = Calc.unidade(s, x.unidadeId);
    return `<tr>
      <td><span class="badge mini badge-azul">${x.tipo === 'benchmark' ? 'Benchmark' : x.tipo === 'codigoPares' ? 'Código de pares' : E(x.tipo)}</span></td>
      <td>${u ? `${E(u.orgao)}/${E(u.sigla)}` : '—'}${x.cargoId ? ` · ${E(nomeCargo(x.cargoId))}` : ''}</td>
      <td class="num mono">${x.payload && x.payload.valor != null ? fmtN(x.payload.valor, 2) : (x.payload && x.payload.codigo) || '—'}</td>
      <td style="max-width:340px">${E(x.justificativa || '—')}</td>
      <td>${E(x.autor || '—')}<br><span class="muted mini mono">${E(x.data || '')}</span></td>
      <td>${x.status === 'pendente'
        ? `<div style="display:flex;gap:6px"><button class="btn btn-sec" data-aprovar="${x.id}">Aprovar</button>
           <button class="btn-perigo btn" data-recusar="${x.id}">Recusar</button></div>`
        : `<span class="badge mini ${x.status === 'aprovada' ? 'badge-esforco' : 'badge-fila'}">${x.status}</span>`}</td>
    </tr>`;
  };
  app().innerHTML = `
  ${cabecalhoPagina('Autorizações',
    'Solicitações dos gestores de RH setorial e de unidade que dependem de decisão da SEAP: benchmarks de referência, ' +
    'códigos de pares de unidades não comparáveis e outros parâmetros. ' +
    tipInfo('Ao aprovar, o parâmetro é aplicado imediatamente ao cálculo da unidade. A fundamentação apresentada fica registrada.'),
    '#/inicio', 'SEAP · Governança')}
  <div class="card card-larga">
    <h3>Pendentes <span class="grupo-resumo">${pendentes.length} solicitação(ões)</span></h3>
    <div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>Tipo</th><th>Unidade / cargo</th><th class="num">Valor</th><th>Justificativa</th><th>Solicitante</th><th>Ação</th></tr></thead>
      <tbody>${pendentes.map(linha).join('') || '<tr><td colspan="6" class="vazio">Nenhuma solicitação pendente.</td></tr>'}</tbody>
    </table></div>
  </div>
  ${historico.length ? `<div class="card card-larga">
    <h3>Histórico</h3>
    <div class="tabela-wrap"><table class="tabela">
      <thead><tr><th>Tipo</th><th>Unidade / cargo</th><th class="num">Valor</th><th>Justificativa</th><th>Solicitante</th><th>Situação</th></tr></thead>
      <tbody>${historico.map(linha).join('')}</tbody>
    </table></div>
  </div>` : ''}`;

  app().querySelectorAll('[data-aprovar]').forEach(b => b.addEventListener('click', () => {
    const x = s.solicitacoes.find(y => y.id === b.dataset.aprovar);
    if (x.tipo === 'benchmark' && x.payload && x.payload.valor) {
      s.benchmarks = s.benchmarks || {};
      s.benchmarks[x.unidadeId + ':' + (x.cargoId || '')] = {
        valor: x.payload.valor, fundamentacao: x.justificativa,
        autor: x.autor, aprovadoPor: 'Gestor SEAP', data: x.data
      };
    }
    if (x.tipo === 'codigoPares' && x.payload && x.payload.codigo) {
      cfgResultado(x.unidadeId).codigoPares = x.payload.codigo;
    }
    x.status = 'aprovada';
    Store.salvar(); telaAutorizacoes();
  }));
  app().querySelectorAll('[data-recusar]').forEach(b => b.addEventListener('click', () => {
    const x = s.solicitacoes.find(y => y.id === b.dataset.recusar);
    x.status = 'recusada';
    Store.salvar(); telaAutorizacoes();
  }));
}
